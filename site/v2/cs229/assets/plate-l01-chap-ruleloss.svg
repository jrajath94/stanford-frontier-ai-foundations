<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: why the rules lost</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The evasion treadmill, in numbers. Source: original toy on the spam job.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT learning: rule lists</text>
<text x="328" y="124">the race, counted</text>
<text x="648" y="124">WITH learning: retrain</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">1,000 rules, 30 min each</text>
<text x="180" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">500 engineer-hours to stand up</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">50 new rules per wave</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">25 engineer-hours per wave, forever</text>
<text x="180" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rule 612 vs rule 663: rot</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">humans: 10 rules/day</text>
<text x="480" y="218.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">spammers: 100 evasions/day</text>
<text x="480" y="252.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">attacker out-produces 10 to 1</text>
<text x="480" y="284.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">probes cost ~1,000 emails</text>
<text x="480" y="314.75" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#5C6B7A">1 - 0.999^1000 = 63% false positives</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">retrain on this week's mail</text>
<text x="780" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">no new code</text>
<text x="780" y="248.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">10,000 labels = 5 labeler-days</text>
<text x="780" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">pattern re-learned weekly</text>
<text x="780" y="311.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">adapts to fr33, f.r.e.e, next</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: rules still win under 100 rules in a still world.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Tax brackets, conversions, checklists: write them down.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: probing is cheap and rule-writing is slow, so learning inverts the cost.</text>
</svg>
