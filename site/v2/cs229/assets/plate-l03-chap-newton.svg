<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: Newton's method</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Curvature sets the step size automatically. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: slope only</text>
<text x="328" y="124">the parabola jump</text>
<text x="648" y="124">WITH: the per-step bill</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">GD: 500-2,000 iterations</text>
<text x="180" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">n = 10,000, d = 50</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">about 10^9 operations</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">alpha tuned by hand</text>
<text x="180" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">many cheap steps</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="17" font-weight="600" fill="#1B2838">theta := theta - J'/J''</text>
<text x="480" y="219.75" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="500" fill="#1B2838">theta^2 from 4: 4 - 8/2 = 0</text>
<text x="480" y="252.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">one step vs GD's 38</text>
<text x="480" y="284.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">no alpha to tune</text>
<text x="480" y="314.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">each step: weighted least squares</text>
<text x="480" y="345.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">IRLS: reweight by uncertainty</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">weights h(1-h): 0.25, 0.25, 0.09</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">confident ones barely vote</text>
<text x="780" y="246.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">6-10 steps, O(nd^2 + d^3) each</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">d = 20: 408,000 ops; d = 1B: 10^27</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">LBFGS: O(md) memory</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: few steps, each impossibly expensive, loses to many steps, each dirt cheap.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">SGD is the workhorse of machine learning.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: LBFGS keeps Newton's fast finish without the impossible matrix.</text>
</svg>
