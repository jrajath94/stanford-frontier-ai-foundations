<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the block, counted</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. 12d^2 sizes any decoder. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: post-norm</text>
<text x="328" y="124">the stored object: one block</text>
<text x="648" y="124">WITH the rule: 32 blocks</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">normalize after the add</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">stream rescaled per block</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">96 blocks: destabilize</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">deep stacks untrainable</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">depth capped</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">attention: 4d^2 = 67.1M</text>
<text x="480" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">MLP: 8d^2 = 134.2M</text>
<text x="480" y="244" text-anchor="middle" font-size="18" font-weight="600" fill="#1B2838">block: 201.3M</text>
<text x="480" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">pre-norm + residuals</text>
<text x="480" y="300" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">the stream never rescales</text>
<text x="480" y="326" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">SwiGLU gates the MLP</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">32 x 201.3M = 6.44B</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">+ embeddings 204.8M</text>
<text x="780" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">= ~6.6B: a 7B model</text>
<text x="780" y="270" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">the rule: 12d^2 per block</text>
<text x="780" y="296" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">RMSNorm, no centering</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: depth buys composition; pre-norm buys depth. The sizing rule is 12d^2 per block, nothing else.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">The block is a shared whiteboard: attention and MLP only add to the stream.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the residual stream is the model's working memory, and pre-norm is what lets it reach 96 blocks.</text>
</svg>
