<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the axes of variation</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Truncated SVD is the optimal rank-k summary.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the axes</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">200 redundant features</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">plotting impossible</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">distances expensive</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">exact eigendecomposition O(d^3)</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">millimeters dominate meters</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">eigenvectors of the covariance</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">eigenvalue = variance along the axis</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">diagonal toy: (2.5, 0)</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">one axis keeps 100 percent</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">SUV: PC1 = (1, 0.618), keeps 97.9 percent</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the axes</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">shipped as SVD</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">SVD(X): s_1 = 3.162 on the toy</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">never square the condition number</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">Eckart-Young: optimal rank-k</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">not a heuristic: the optimum</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: PCA is the best k-dimensional summary by squared reconstruction error.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: it is linear. A Swiss roll has no good straight summary, and variance is not meaning.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: PCA builds new features, it does not select originals: PC1 is a direction, not the length feature.</text>
</svg>
