<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: PPO clips the jump</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Trust old data a little, briefly. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: on-policy</text>
<text x="328" y="124">the stored object: the clipped ratio</text>
<text x="648" y="124">WITH the rule: the plumbing</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one step per fresh batch</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">data stale after update</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">single-use samples</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">r = 3: one trajectory triple</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">millions of trajectories</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">r = pi_new / pi_old</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">clip to [0.8, 1.2]</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">A&gt;0, r=1.5: clipped flat</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">A&gt;0, r=0.5: full push</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">A&lt;0, r=1.5: full correction</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">A&lt;0, r=0.5: clipped flat</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">eps 0.2, 4 epochs</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">LR 1e-5 to 3e-6</text>
<text x="780" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">GAE 0.95, adv norm on</text>
<text x="780" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">KL leash to the SFT ref</text>
<text x="780" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">10% objective, 90% plumbing</text>
<text x="780" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">ratio histogram is the dashboard</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: clipping throws away legitimate signal to buy stability. Watch the ratio histogram, not the loss.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Clip the direction the objective pulls, not the direction the ratio sits.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the clip is TRPO's trust region as a first-order hack, and the hack is what ships.</text>
</svg>
