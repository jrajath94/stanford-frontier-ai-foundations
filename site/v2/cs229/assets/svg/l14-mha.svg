<text x="620" y="230" font-size="13" fill="#1B2838" text-anchor="start" >x 32 heads</text>
<text x="40" y="312" font-size="14" fill="#1B2838" text-anchor="start" >Each head: own W_Q, W_K, W_V -> own mix pattern.</text>
<line x1="320" y1="322" x2="320" y2="348" stroke="#1B2838" stroke-width="2.5"/>
<line x1="320" y1="348" x2="324.48536498365524" y2="337.9560216565646" stroke="#1B2838" stroke-width="2.5"/>
<line x1="320" y1="348" x2="315.51463501634476" y2="337.9560216565646" stroke="#1B2838" stroke-width="2.5"/>
<rect x="180" y="352" width="280" height="52" rx="10" fill="#EAF3E4" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="320" y="374" font-size="15" fill="#2E7D4F" text-anchor="middle" font-weight="bold">concat -> W_O</text>
<text x="320" y="396" font-size="12" fill="#8A8FA0" text-anchor="middle" >back to width 4096</text>
<text x="40" y="446" font-size="14" fill="#1B2838" text-anchor="start" font-weight="bold">Cost audit:</text>
<text x="40" y="472" font-size="14" fill="#1B2838" text-anchor="start" >32 heads x N^2 x 128  =  N^2 x 4096.  Identical to one full-width head.</text>
<text x="40" y="498" font-size="14" fill="#2E7D4F" text-anchor="start" font-weight="bold">The split is free. Capacity is in 32 simultaneous mix patterns.</text>
<text x="40" y="524" font-size="13" fill="#8A8FA0" text-anchor="start" >Dial: d_h in 64-128. Too many heads starves each.</text>
</svg>
