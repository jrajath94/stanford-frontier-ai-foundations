<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="326" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Naive Bayes spam filter</text>
<rect x="40" y="70" width="640" height="110" rx="10" fill="#FFFFFF" stroke="#1B2838" stroke-width="2.5"/>
<text x="360" y="115" font-size="20" fill="#1B2838" text-anchor="middle" >P(spam | words) ∝ P(spam) · Πᵢ P(wordᵢ | spam)</text>
<text x="360" y="150" font-size="14" fill="#8A8FA0" text-anchor="middle" >Naive = features independent given the class. Rarely true, often works.</text>
<rect x="40" y="200" width="300" height="100" rx="10" fill="#FFF7E8" stroke="#C77F1A" stroke-width="2.5"/>
<text x="190" y="232" font-size="15" fill="#C77F1A" text-anchor="middle" font-weight="bold">Zero-count trap</text>
<text x="190" y="260" font-size="13" fill="#1B2838" text-anchor="middle" >unseen word → P=0 kills product</text>
<rect x="380" y="200" width="300" height="100" rx="10" fill="#EAF3E4" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="530" y="232" font-size="15" fill="#2E7D4F" text-anchor="middle" font-weight="bold">Laplace smoothing</text>
<text x="530" y="260" font-size="13" fill="#1B2838" text-anchor="middle" >add 1 to every count</text>
</svg>
