<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="426" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="360" y="44" font-size="26" font-weight="bold" fill="#1B2838" text-anchor="middle">Which paradigm fits the job</text>
<rect x="24" y="80" width="200" height="300" rx="14" fill="#FFFDF8" stroke="#1B2838" stroke-width="2"/>
<text x="124" y="120" font-size="17" font-weight="bold" fill="#1B2838" text-anchor="middle">Ask one question</text>
<text x="124" y="160" font-size="15" fill="#1B2838" text-anchor="middle">What does your</text>
<text x="124" y="184" font-size="15" fill="#1B2838" text-anchor="middle">experience look like?</text>
<rect x="248" y="200" width="224" height="60" rx="30" fill="#1B2838"/>
<text x="360" y="236" font-size="16" font-weight="bold" fill="#F7F4EE" text-anchor="middle">the experience decides</text>
<line x1="224" y1="230" x2="248" y2="230" stroke="#1B2838" stroke-width="2"/>
<line x1="472" y1="230" x2="496" y2="230" stroke="#1B2838" stroke-width="2"/>
<rect x="496" y="80" width="200" height="300" rx="14" fill="#FFFDF8" stroke="#1B2838" stroke-width="2"/>
<text x="596" y="120" font-size="17" font-weight="bold" fill="#1B2838" text-anchor="middle">Three answers</text>
<rect x="512" y="140" width="168" height="64" rx="8" fill="#E7F1F8"/>
<text x="596" y="164" font-size="13.5" fill="#1B2838" text-anchor="middle">Labeled pairs</text>
<text x="596" y="186" font-size="13.5" fill="#1B2838" text-anchor="middle">go supervised</text>
<rect x="512" y="216" width="168" height="64" rx="8" fill="#E7F4EF"/>
<text x="596" y="240" font-size="13.5" fill="#1B2838" text-anchor="middle">Raw data</text>
<text x="596" y="262" font-size="13.5" fill="#1B2838" text-anchor="middle">goes unsupervised</text>
<rect x="512" y="292" width="168" height="64" rx="8" fill="#F4E6D4"/>
<text x="596" y="316" font-size="13.5" fill="#1B2838" text-anchor="middle">Actions + rewards</text>
<text x="596" y="338" font-size="13.5" fill="#1B2838" text-anchor="middle">go reinforcement</text>
<text x="360" y="412" font-size="13" fill="#5C6B7A" text-anchor="middle">Match the setup to the experience you actually have. Source: original plate for Stanford Frontier AI.</text>
</svg>
