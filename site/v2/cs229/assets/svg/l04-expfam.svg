<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="366" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">The exponential family</text>
<rect x="40" y="60" width="640" height="130" rx="10" fill="#FFFFFF" stroke="#6C4BA6" stroke-width="3"/>
<text x="360" y="110" font-size="24" fill="#1B2838" text-anchor="middle" >p(y; η) = b(y) · exp( ηᵀT(y) − a(η) )</text>
<text x="130" y="152" font-size="13" fill="#8A8FA0" text-anchor="middle" >carrier</text>
<text x="285" y="152" font-size="13" fill="#8A8FA0" text-anchor="middle" >natural param × sufficient stat</text>
<text x="520" y="152" font-size="13" fill="#8A8FA0" text-anchor="middle" >log-partition</text>
<rect x="5" y="210" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#8A8FA0" stroke-width="2"/>
<text x="90" y="240" font-size="15" fill="#6C4BA6" text-anchor="middle" font-weight="bold">Gaussian</text>
<text x="90" y="268" font-size="12" fill="#1B2838" text-anchor="middle" >T(y)=y, a(η)=η²/2</text>
<rect x="215" y="210" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#8A8FA0" stroke-width="2"/>
<text x="300" y="240" font-size="15" fill="#6C4BA6" text-anchor="middle" font-weight="bold">Bernoulli</text>
<text x="300" y="268" font-size="12" fill="#1B2838" text-anchor="middle" >T(y)=y, a(η)=log(1+e^η)</text>
<rect x="425" y="210" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#8A8FA0" stroke-width="2"/>
<text x="510" y="240" font-size="15" fill="#6C4BA6" text-anchor="middle" font-weight="bold">Multinomial</text>
<text x="510" y="268" font-size="12" fill="#1B2838" text-anchor="middle" >T(y)=one-hot, a(η)=log Σe^ηᵏ</text>
<text x="360" y="340" font-size="15" fill="#1B2838" text-anchor="middle" >One form, many distributions. GLMs pick one and link η = θᵀx.</text>
</svg>
