<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="756" height="488" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Tokenization: text to vectors</text>
<rect x="40" y="90" width="140" height="150" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="3"/>
<text x="110.0" y="122" font-size="15" fill="#2B5EA7" text-anchor="middle" font-weight="bold">1. raw text</text>
<text x="110.0" y="160" font-size="13" fill="#1B2838" text-anchor="middle" >"the cat sat 2026"</text>
<text x="110.0" y="190" font-size="12" fill="#8A8FA0" text-anchor="middle" >characters in</text>
<line x1="183" y1="165" x2="202" y2="165" stroke="#1B2838" stroke-width="2.5"/>
<line x1="202" y1="165" x2="191.95602165656462" y2="160.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="202" y1="165" x2="191.95602165656462" y2="169.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="205" y="90" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#6C4BA6" stroke-width="3"/>
<text x="290.0" y="122" font-size="15" fill="#6C4BA6" text-anchor="middle" font-weight="bold">2. pieces</text>
<text x="290.0" y="160" font-size="13" fill="#1B2838" text-anchor="middle" >"l o w e s t" -> "low est"</text>
<text x="290.0" y="190" font-size="12" fill="#8A8FA0" text-anchor="middle" >BPE merges pairs</text>
<line x1="378" y1="165" x2="397" y2="165" stroke="#1B2838" stroke-width="2.5"/>
<line x1="397" y1="165" x2="386.9560216565646" y2="160.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="397" y1="165" x2="386.9560216565646" y2="169.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="400" y="90" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#C77F1A" stroke-width="3"/>
<text x="475.0" y="122" font-size="15" fill="#C77F1A" text-anchor="middle" font-weight="bold">3. token ids</text>
<text x="475.0" y="160" font-size="13" fill="#1B2838" text-anchor="middle" >1042  2088  15</text>
<text x="475.0" y="190" font-size="12" fill="#8A8FA0" text-anchor="middle" >toy ids</text>
<line x1="553" y1="165" x2="572" y2="165" stroke="#1B2838" stroke-width="2.5"/>
<line x1="572" y1="165" x2="561.9560216565646" y2="160.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="572" y1="165" x2="561.9560216565646" y2="169.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="575" y="90" width="145" height="150" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<text x="647.5" y="122" font-size="15" fill="#2E7D4F" text-anchor="middle" font-weight="bold">4. vectors</text>
<text x="647.5" y="160" font-size="13" fill="#1B2838" text-anchor="middle" >id -> row of E</text>
<text x="647.5" y="190" font-size="12" fill="#8A8FA0" text-anchor="middle" >128,256 x 4096</text>
<text x="40" y="290" font-size="14" fill="#1B2838" text-anchor="start" font-weight="bold">BPE toy: count pairs, merge the most frequent</text>
<text x="40" y="316" font-size="14" fill="#1B2838" text-anchor="start" >before:  l  o  w  e  s  t</text>
<line x1="260" y1="312" x2="310" y2="312" stroke="#6C4BA6" stroke-width="2.5"/>
<line x1="310" y1="312" x2="299.9560216565646" y2="307.51463501634476" stroke="#6C4BA6" stroke-width="2.5"/>
<line x1="310" y1="312" x2="299.9560216565646" y2="316.48536498365524" stroke="#6C4BA6" stroke-width="2.5"/>
<text x="285" y="302" font-size="12" fill="#6C4BA6" text-anchor="middle" >merge</text>
<text x="330" y="316" font-size="14" fill="#6C4BA6" text-anchor="start" font-weight="bold">after:   low   est</text>
<rect x="40" y="340" width="330" height="90" rx="10" fill="#EAF3E4" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="205" y="368" font-size="14" fill="#2E7D4F" text-anchor="middle" font-weight="bold">Byte-level BPE: 256 byte values</text>
<text x="205" y="392" font-size="13" fill="#1B2838" text-anchor="middle" >no unknown tokens, ever. Price: fertility.</text>
<text x="205" y="414" font-size="13" fill="#8A8FA0" text-anchor="middle" >rare CJK char -> 3 byte tokens</text>
<rect x="390" y="340" width="330" height="90" rx="10" fill="#E8EEF7" stroke="#2B5EA7" stroke-width="2.5"/>
<text x="555" y="368" font-size="14" fill="#2B5EA7" text-anchor="middle" font-weight="bold">Vocab sizes in the wild</text>
<text x="555" y="392" font-size="13" fill="#1B2838" text-anchor="middle" >32k Mistral 7B · 50k GPT-2</text>
<text x="555" y="414" font-size="13" fill="#1B2838" text-anchor="middle" >128k Llama 3 · 256k Gemma</text>
<text x="360" y="462" font-size="14" fill="#1B2838" text-anchor="middle" >Embedding matrix 128,256 x 4096 = 525M params, ~6.5% of Llama 3 8B.</text>
</svg>
