<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 636" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="632" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Retrieve then rerank</text>
<text x="40" y="52" font-size="16" fill="#1B2838" text-anchor="start" font-weight="bold">10M candidates narrow to 100, then 5</text>
<text x="40" y="78" font-size="14" fill="#8A8FA0" text-anchor="start"  font-style="italic">Query: "refund window"</text>
<rect x="60" y="100" width="600" height="110" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="3"/>
<text x="360" y="132" font-size="16" fill="#2B5EA7" text-anchor="middle" font-weight="bold">ANN retrieve (bi-encoder)</text>
<text x="360" y="162" font-size="14" fill="#1B2838" text-anchor="middle" >10,000,000 docs  ->  100 candidates</text>
<text x="360" y="190" font-size="13" fill="#8A8FA0" text-anchor="middle" >cheap cosines: 0.82 vs 0.71, both look fine</text>
<line x1="360" y1="212" x2="360" y2="240" stroke="#1B2838" stroke-width="2.5"/>
<line x1="360" y1="240" x2="364.48536498365524" y2="229.95602165656462" stroke="#1B2838" stroke-width="2.5"/>
<line x1="360" y1="240" x2="355.51463501634476" y2="229.95602165656462" stroke="#1B2838" stroke-width="2.5"/>
<rect x="150" y="244" width="420" height="110" rx="10" fill="#FFFFFF" stroke="#6C4BA6" stroke-width="3"/>
<text x="360" y="276" font-size="16" fill="#6C4BA6" text-anchor="middle" font-weight="bold">Cross-encoder rerank</text>
<text x="360" y="306" font-size="14" fill="#1B2838" text-anchor="middle" >100 candidates  ->  5 finalists</text>
<text x="360" y="334" font-size="13" fill="#8A8FA0" text-anchor="middle" >joint read: 0.94 vs 0.12, the false match dies</text>
<line x1="360" y1="356" x2="360" y2="384" stroke="#1B2838" stroke-width="2.5"/>
<line x1="360" y1="384" x2="364.48536498365524" y2="373.9560216565646" stroke="#1B2838" stroke-width="2.5"/>
<line x1="360" y1="384" x2="355.51463501634476" y2="373.9560216565646" stroke="#1B2838" stroke-width="2.5"/>
<rect x="240" y="388" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<text x="360" y="420" font-size="16" fill="#2E7D4F" text-anchor="middle" font-weight="bold">LLM reads 5</text>
<text x="360" y="448" font-size="13" fill="#8A8FA0" text-anchor="middle" >grounded answer</text>
<text x="40" y="514" font-size="14" fill="#1B2838" text-anchor="start" font-weight="bold">Why the second stage exists:</text>
<text x="40" y="540" font-size="13" fill="#2E7D4F" text-anchor="start" >C1 "Refunds within 30 days of purchase." -> 0.94</text>
<text x="40" y="564" font-size="13" fill="#B3402E" text-anchor="start" >C2 "Window shoppers get refunds never." -> 0.12</text>
<text x="360" y="606" font-size="14" fill="#1B2838" text-anchor="middle" >Each stage trades compute for precision.</text>
</svg>
