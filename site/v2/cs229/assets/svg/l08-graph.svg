<text x="70" y="262" font-size="13" fill="#1B2838" text-anchor="middle" font-weight="bold">dL/dx = 4 + 3 = 7</text>
<text x="360" y="330" font-size="14" fill="#2B5EA7" text-anchor="middle">forward: topological order, values computed</text>
<text x="360" y="352" font-size="14" fill="#B3402E" text-anchor="middle">backward: reverse order, VJPs at nodes; fan-out adds at x</text>
<text x="360" y="392" font-size="15" fill="#1B2838" text-anchor="middle" font-weight="bold">The residual + node is this fan-out: skip path and F path rejoin by addition.</text>
