<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="356" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Normal equations</text>
<rect x="60" y="70" width="600" height="120" rx="10" fill="#FFFFFF" stroke="#1B2838" stroke-width="2.5"/>
<text x="360" y="125" font-size="26" fill="#1B2838" text-anchor="middle" >θ = (XᵀX)⁻¹ Xᵀ y</text>
<text x="360" y="162" font-size="14" fill="#8A8FA0" text-anchor="middle" >Closed form. One shot, no iterations.</text>
<rect x="60" y="210" width="600" height="120" rx="10" fill="#FFF7E8" stroke="#C77F1A" stroke-width="2.5"/>
<text x="90" y="248" font-size="16" fill="#C77F1A" text-anchor="start" font-weight="bold">Catches:</text>
<text x="90" y="278" font-size="14" fill="#1B2838" text-anchor="start" >• XᵀX must be invertible: need more data points than parameters</text>
<text x="90" y="302" font-size="14" fill="#1B2838" text-anchor="start" >• Singular → null space → infinitely many θ, all equally valid</text>
</svg>
