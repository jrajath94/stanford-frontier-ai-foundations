<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="296" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">MLE: Gaussian noise gives least squares</text>
<rect x="40" y="70" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="2.5"/>
<text x="135" y="105" font-size="15" fill="#2B5EA7" text-anchor="middle" font-weight="bold">Model</text>
<text x="135" y="132" font-size="16" fill="#1B2838" text-anchor="middle" >y = θᵀx + ε</text>
<text x="135" y="158" font-size="15" fill="#1B2838" text-anchor="middle" >ε ~ N(0,σ²)</text>
<line x1="230" y1="130" x2="280" y2="130" stroke="#1B2838" stroke-width="2.5"/>
<line x1="280" y1="130" x2="269.9560216565646" y2="125.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="280" y1="130" x2="269.9560216565646" y2="134.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="290" y="70" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#6C4BA6" stroke-width="2.5"/>
<text x="385" y="105" font-size="15" fill="#6C4BA6" text-anchor="middle" font-weight="bold">Likelihood</text>
<text x="385" y="132" font-size="15" fill="#1B2838" text-anchor="middle" >L(θ) = Πᵢ p(yⁱ|xⁱ;θ)</text>
<text x="385" y="158" font-size="13" fill="#8A8FA0" text-anchor="middle" >iid → product</text>
<line x1="480" y1="130" x2="530" y2="130" stroke="#1B2838" stroke-width="2.5"/>
<line x1="530" y1="130" x2="519.9560216565646" y2="125.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="530" y1="130" x2="519.9560216565646" y2="134.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="540" y="70" width="150" height="120" rx="10" fill="#EAF3E4" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="615" y="105" font-size="15" fill="#2E7D4F" text-anchor="middle" font-weight="bold">MLE</text>
<text x="615" y="132" font-size="15" fill="#1B2838" text-anchor="middle" >max log L(θ)</text>
<text x="615" y="158" font-size="14" fill="#2E7D4F" text-anchor="middle" font-weight="bold">= least squares</text>
<text x="360" y="240" font-size="15" fill="#1B2838" text-anchor="middle" >Gaussian noise + MLE = the squared loss of L02. Not a coincidence.</text>
<text x="360" y="268" font-size="14" fill="#8A8FA0" text-anchor="middle"  font-style="italic">Maximum likelihood is the bedrock. ,  L03</text>
</svg>
