<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: stochastic gradient descent</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. One example per step, noisy but m times cheaper. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: full passes</text>
<text x="328" y="124">one example per step</text>
<text x="648" y="124">WITH: the noisy win</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">one step = all m examples</text>
<text x="180" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">2B x 40 = 80B multiply-adds</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">0.008 s of arithmetic</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">retrain hourly: passes too slow</text>
<text x="180" y="307.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">the full-pass schedule fails</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="600" fill="#1B2838">theta_j := theta_j - alpha (h - y) x_j</text>
<text x="480" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">no sum, no 1/m</text>
<text x="480" y="246.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">E[single gradient] = batch gradient</text>
<text x="480" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">toy: (-2 + -6)/2 = -4</text>
<text x="480" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">shuffle each epoch</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">m times cheaper per step</text>
<text x="780" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">bounces, but arrives sooner</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">batch 1: noisy; batch m: exact</text>
<text x="780" y="279.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">mini-batch B = 32 to 256</text>
<text x="780" y="311.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">64x less noise, ~same cost</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: noise is the price of speed.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Shuffle every epoch so no example's noise dominates.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the stochastic part is not a hack; it is why internet-scale training is possible.</text>
</svg>
