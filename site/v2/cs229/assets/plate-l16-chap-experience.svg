<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: learn without the model</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. DP needs P and R; the world rarely obliges. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: DP</text>
<text x="328" y="124">the stored object: the estimators</text>
<text x="648" y="124">WITH the rule: Q-learning</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">model given: P, R known</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">policy iteration: 2 rounds</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">exact and unusable</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">slippery floors unmodeled</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">no learning from experience</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">MC: wait, average returns</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">unbiased, high variance</text>
<text x="480" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">TD: bootstrap every step</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">V(9): 0 -&gt; 0.8 in one step</text>
<text x="480" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">biased, fast, online</text>
<text x="480" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">n-step: the dial between</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">Q(9,right): 0 -&gt; 4.0</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">next visit: 6.0 -&gt; 8.0</text>
<text x="780" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">max = off-policy</text>
<text x="780" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">SARSA: honest about exploration</text>
<text x="780" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">DQN: replay + target net</text>
<text x="780" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">old data stays usable</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: MC is unbiased and slow; TD is biased and fast; off-policy reuses data at the price of mismatch.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Modern RL is TD almost everywhere. Tables converge; networks negotiate.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: every method is an operation on the return G_t, and REINFORCE weights by it.</text>
</svg>
