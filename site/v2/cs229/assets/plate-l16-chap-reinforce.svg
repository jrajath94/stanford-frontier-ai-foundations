<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: REINFORCE and the variance bill</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Unbiased, wild, single-use. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: no gradient</text>
<text x="328" y="124">the stored object: the trick</text>
<text x="648" y="124">WITH the rule: calm it</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">values cannot improve pi_theta</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">reward not differentiable</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">future depends on own actions</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">the gradient seems impossible</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">grad E[R] = E[R grad log pi]</text>
<text x="480" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">d p = p d log p: p cancels</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">total 3: right up 0.12</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">total -12: left falls</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">reinforce the good actions</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">stochastic policies only</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">baseline -4.5: 7.5, -7.5</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">reward-to-go: cut past luck</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">actor-critic: TD error 1.2</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">theta 0.847 -&gt; 0.883</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">V(8): 5.0 -&gt; 5.12</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">advantage = return minus par</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the identity is exact, the estimator is wild. Subtract the predictable; learn from the surprise.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">On-policy: every gradient needs fresh trajectories. Old data is stale the moment theta moves.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: REINFORCE is the precursor because it never bootstraps, and everything after is variance repair.</text>
</svg>
