<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: cross-entropy</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The multi-class loss, and its unbounded anger. Source: original toy from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: no multi-class loss</text>
<text x="328" y="124">minus log(p_true class)</text>
<text x="648" y="124">WITH: the error vector</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">logistic loss covered k = 2</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">three diagnoses needed more</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">one-hot pushes scores to infinity</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="17" font-weight="600" fill="#1B2838">loss = -log(p_true)</text>
<text x="480" y="219.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">true class at 0.63: 0.46</text>
<text x="480" y="252.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">true class at 0.05: 3.00</text>
<text x="480" y="284.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">confident and right is cheap</text>
<text x="480" y="314.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">confident and wrong is ruinous</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">gradient: (p - one-hot) x</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">errors sum to zero</text>
<text x="780" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">-0.37 + 0.23 + 0.14 = 0</text>
<text x="780" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">k = 2: the lecture-3 loss</text>
<text x="780" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">smoothing 0.1: transformer default</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: unbounded: one mislabeled example at p = 10^-6 costs 13.8.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Label smoothing taxes overconfidence: 0.59 vs 0.46.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the losers' probability is given to the winner, errors summing to zero.</text>
</svg>
