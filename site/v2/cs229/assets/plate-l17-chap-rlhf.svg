<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: RLHF, preferences as reward</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The reward model is the task specification. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: no verifier</text>
<text x="328" y="124">the stored object: the reward model</text>
<text x="648" y="124">WITH the rule: the recipe</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">open-ended writing</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">no right answer</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">math's 0/1 does not apply</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">taste is not checkable</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">A scores 2.0, B 0.5</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">P(A beats B) = 0.818</text>
<text x="480" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">loss: 0.20</text>
<text x="480" y="270" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">4-9 responses per prompt</text>
<text x="480" y="296" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">annotators agree ~70%</text>
<text x="480" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">the data is the moat</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">SFT -&gt; reward model -&gt; PPO</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">KL leash to the SFT ref</text>
<text x="780" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">Goodhart: past the peak</text>
<text x="780" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">DPO: loss 0.644, no RM</text>
<text x="780" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">offline: never explores</text>
<text x="780" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">length bias, staleness</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: RLHF trains the model to please the reward model, which approximates pleasing humans.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">The approximation is the whole game. Hold out human evals; the peak is the operating point.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the KL leash is the SFT checkpoint's ghost, guarding every RL update against the proxy.</text>
</svg>
