<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: Naive Bayes</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The generative spam filter, fit by counting. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: bell curves only</text>
<text x="328" y="124">words vote independently</text>
<text x="648" y="124">WITH: dirt cheap</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">GDA needs real-valued features</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">words are indicators</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">'free' and 'money' travel together</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">not bell curves</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="16" font-weight="600" fill="#1B2838">p(x|y) = product p(x_j|y)</text>
<text x="480" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">naive: words independent given class</text>
<text x="480" y="248.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">fit: count</text>
<text x="480" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">Bernoulli: presence only</text>
<text x="480" y="311.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">multinomial: counts repeat</text>
<text x="480" y="341.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">spam: 0.8 x 0.8 x 0.5 = 0.32</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">real: 0.1 x 0.1 x 0.5 = 0.005</text>
<text x="780" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">spam wins 64 to 1</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">10M emails/day on one core</text>
<text x="780" y="279.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5C6B7A">Bernoulli 38-to-1, multinomial 192-to-1</text>
<text x="780" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">score in log space</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: the independence lie double-counts correlated evidence: 64-to-1 vs the honest 8-to-1.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">The ranking survives; calibration does not.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: when the lie hurts, logistic regression weighs the evidence jointly and splits the credit.</text>
</svg>
