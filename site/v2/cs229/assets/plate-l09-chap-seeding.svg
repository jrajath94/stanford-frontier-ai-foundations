<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: seed far apart, choose k</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Seeding is provably close. Choosing k stays heuristic.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">RANDOM seeds, eyeball k</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the seed lottery</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">seeds 0, 0.1 strand a cluster</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">empty cluster needs a rescue rule</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">elbow bends are eyeball-only</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">real curves bend gradually</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">k-means++ rule</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">seed proportional to squared distance</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">first seed at 2, next likely in {10,11,12}</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">squared distances: 64, 81, 100 vs 1, 1</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">sklearn default, plus 10 restarts</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">CAREFUL seeds, scored k</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">guarantee plus numbers</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">O(log k) expected approximation ratio</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">125.5, 4.0, 2.7, 1.5: bend at 2</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">silhouette: 0.85 on the toy point</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">gap statistic vs the uniform null</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: k-means++ buys a guarantee from seeding alone. It cannot buy optimality.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Elbow for exploration, silhouette for a number, gap for a significance claim.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: seeding proportional to squared distance samples each point&#x27;s share of the objective, which the proof needs.</text>
</svg>
