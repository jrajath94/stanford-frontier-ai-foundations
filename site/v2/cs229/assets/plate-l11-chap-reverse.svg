<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the learned reversal</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The objective collapses into T regression problems.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">ONE giant reversal</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the leap is unlearnable</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">a big jump has a multimodal reversal</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">the network cannot fit it</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">the ELBO bound loosens</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">generation stays too hard</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">predict each step&#x27;s noise</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">network takes (x_t, t), predicts eps</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">ELBO becomes noise-prediction MSE</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">one regression problem per level</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">stable, no adversary, no collapse games</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">T tiny reversals</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">noise points uphill</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">predicting noise estimates the score</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">the direction toward likely images</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">sampling: hill-climbing from static</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the U-Net is a learned compass</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: diffusion trains by denoising score matching: plain, stable regression.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price is sampling: the method is correct, and the meter is running.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: noise prediction is better conditioned: the target is always standard Gaussian, same scale at every step.</text>
</svg>
