<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: exploration vs exploitation</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Uncertainty is the criterion. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: exploit only</text>
<text x="328" y="124">the stored object: the dial</text>
<text x="648" y="124">WITH the rule: UCB</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">after 10 pulls: A 3/10</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">greedy: pull A forever</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">0.3 per pull</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">never finds C's 0.7</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">the unknown stays unknown</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">epsilon 0.1: 10% random</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">decay 1.0 -&gt; 0.01</text>
<text x="480" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">UCB: value + bonus</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">bonus = sqrt(2 ln t / n)</text>
<text x="480" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">Thompson: sample beliefs</text>
<text x="480" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">explore early, exploit late</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">t = 15: bonuses</text>
<text x="780" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">A 0.74, B 1.16, C 2.32</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">scores: 1.04, 1.66, 2.32</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">pull C: optimism wins</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">no random pulls</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">regret is logarithmic</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: exploration costs reward now for knowledge later. Epsilon is practical; UCB is principled.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Name the exploration strategy before the algorithm: no plan is a plan to get stuck.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the uncertain arm wins by optimism, and the bonus is how optimism is priced.</text>
</svg>
