<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: adapt without moving billions</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Small changes live in low-dimensional subspaces.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">FULL fine-tuning</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">move everything</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">7B knobs move on 500 labels</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">14 GB copy per task</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">overfitting-prone, overkill</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">each task its own giant</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">W_adapted = W + A x B</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">W frozen, A and B train</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">d = 1000, r = 10: 20K vs 1M</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">50x fewer degrees of freedom</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">d = 4096, r = 8: 256x cut</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">LoRA</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">merges free</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">deploy: W&#x27; = W + AB, once</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">one multiply: zero extra latency</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">128 KB per matrix in fp16</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">one base model, many pocket adapters</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the rank r is the dial: 8 to 64 in practice, tuned on dev.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">LoRA cannot express large behavioral changes: new domains need full fine-tuning.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: adapters that insert new layers cannot merge, which is why LoRA&#x27;s W plus AB formula won.</text>
</svg>
