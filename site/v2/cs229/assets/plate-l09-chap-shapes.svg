<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: shapes and covariance dials</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Match the algorithm to the shape.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">SPHERES only</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">straight bisectors</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">centers 2 and 11: border at 6.5</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">every k-means cell is convex</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">the bisector splits both moons</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">structural failure, not a bad seed</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">choose by shape</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">DBSCAN: density chains, finds k</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">spectral: graph cuts follow curves</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">hierarchical: one run, every k</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">plot a 2-D projection first</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the shape dial</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">covariance types, d=10, k=5</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">full: 275. diagonal: 50.</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">spherical: 5. tied: 55.</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">spherical is k-means, softened</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">start diagonal, go full with data</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: if the true groups are not separable by straight borders, k-means cannot find them.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The covariance type is the GMM&#x27;s bias-variance dial from lecture 6.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the Voronoi view predicts the crescent failure: curved moons cannot fit convex cells.</text>
</svg>
