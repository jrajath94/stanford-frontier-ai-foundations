<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: steer and compress</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Guidance is a dial, not a switch.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">UNCONDITIONAL, pixels</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">ignores the prompt</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">samples drift from the text</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">pixel space: 512x512x3</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">= 786,432 numbers per step</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">most of them redundant</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">guided noise plus VAE</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">guided = uncond + w (cond - uncond)</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">w = 7.5 amplifies the prompt direction</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">(0.1,0.2),(0.3,0.1) becomes (1.6,-0.55)</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">VAE encode once, decode once</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">STEERED, latent</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the product design</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">64x64x4 = 16,384: 48x smaller</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">Stable Diffusion&#x27;s design</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">past w ~ 15: saturate and distort</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">low w: diversity. high w: adherence</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: latent diffusion keeps the perceptual content and drops the pixel noise the eye ignores.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Pixel diffusion is the textbook. Latent diffusion is the product.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: the text embedding enters the denoiser at every step, so each small correction steers toward the prompt.</text>
</svg>
