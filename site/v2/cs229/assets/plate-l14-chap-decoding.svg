<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: decoding, from distribution to text</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The distribution is not text. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: greedy</text>
<text x="328" y="124">the stored object: the distribution</text>
<text x="648" y="124">WITH the rule: the nucleus</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">argmax every step</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">repetition loops</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">'the the the'</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">no backtrack</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">locally optimal, globally dull</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">logits [3, 2, 1]</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">T = 1: 0.665, 0.245, 0.090</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">T = 0.5: 0.867, 0.117, 0.016</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">T = 2: 0.506, 0.307, 0.186</text>
<text x="480" y="292" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">T -&gt; 0 is greedy, T -&gt; inf is uniform</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">top-p 0.9: cut the tail</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">keep 0.526, 0.316, 0.158</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">drop the 0.05 token</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">code: low T, prose: high T</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">penalty 1.0-1.2 for repeats</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: temperature sets creativity; top-p sets safety. Decoding tunes the draw from the distribution.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">It cannot fix the distribution. Exposure bias: 1% per token means 63% of 100-token answers err.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: decoding turns one distribution into many possible texts, and the dials pick which one.</text>
</svg>
