<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: least squares was MLE all along</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The loss chip gets a probabilistic meaning. Source: original derivation from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: arbitrary squares</text>
<text x="328" y="124">Gaussian noise in</text>
<text x="648" y="124">WITH: squares out</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">why squares, not absolute?</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">felt like a choice</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">the chip had no story</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">minimized, but no one knew why</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#1B2838">y = theta'x + eps, eps ~ N(0, s^2)</text>
<text x="480" y="214.5" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#1B2838">p(y|x) has exp(-(y-h)^2/2s^2)</text>
<text x="480" y="245.0" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#5C6B7A">log L = const - sum errors^2</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">sigma^2: constant, dropped</text>
<text x="480" y="306.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">maximize = minimize sum (h-y)^2</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">squares = Gaussian MLE</text>
<text x="780" y="218.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">every loss = a noise assumption</text>
<text x="780" y="250.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">Bernoulli wears cross-entropy</text>
<text x="780" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">multinomial wears softmax loss</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: change the noise assumption and MLE hands you a different loss.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Ask the noise, not the fashion.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: minimizing J is maximizing the probability of the data under Gaussian noise.</text>
</svg>
