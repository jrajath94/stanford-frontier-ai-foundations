<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: modules, VJPs, and the graph</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Frameworks never differentiate. They compose contracts.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the contract</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">hand-derived gradients</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">a new formula per architecture</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">full Jacobian 1024x1024</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">= 1,048,576 stored entries</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">memory dies at the first block</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">forward plus backward</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">each module ships both, locally</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">linear: dL/dx = W^T dL/dy</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">dL/dW = dL/dy outer x</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the tape saves x, nothing else</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the contract</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">matrix-free VJP</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">v^T J without ever forming J</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">dL/dW is rank 1 per example</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">fan-out adds: 4 + 3 = 7</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the graph is the program</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the backward function is local, so new architectures are new graphs with free backward passes.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: differentiability. ReLU at 0, sampling, and ties each need a substitute rule.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the residual plus node is fan-out by design, and its addition is why residual gradients survive depth.</text>
</svg>
