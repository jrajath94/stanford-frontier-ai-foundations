<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the normal equations</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The exact answer for lines, in one shot. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: hundreds of steps</text>
<text x="328" y="124">the one-shot formula</text>
<text x="648" y="124">WITH: the two bills</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">alpha tuned by hand</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">trace: 6.33 down to 0.028</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">hundreds of steps</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">neural nets: no closed form</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="17" font-weight="600" fill="#1B2838">theta = (X'X)^-1 X'y</text>
<text x="480" y="219.75" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#5C6B7A">X'X = [[3, 6], [6, 14]]</text>
<text x="480" y="250.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">det = 6</text>
<text x="480" y="280.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">theta = (1/3, 3/2), J = 0.028</text>
<text x="480" y="313.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">preds: 1.83, 3.33, 4.83</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">O(n^3): n = 10,000 is 10^12 ops</text>
<text x="780" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">singular: det near -0.0001</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">sq ft + sq m: no inverse</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">m &lt; n: singular too</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">fix: drop, or ridge</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: no alpha, no iterations, no bouncing.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">But only for small n, full rank, and linear models.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the normal equations are the statement that the gradient is zero, solved.</text>
</svg>
