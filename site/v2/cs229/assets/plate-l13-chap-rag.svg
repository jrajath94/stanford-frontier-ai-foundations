<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: RAG, knowledge in the store</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The model reads private docs at test time. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: fine-tune</text>
<text x="328" y="124">the stored object: the pipeline</text>
<text x="648" y="124">WITH the rule: retrieve</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">training run on the docs</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">hosted weights</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">small-data regime</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">forgetting is research</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">opaque and unleaky</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">embed the question</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">ANN retrieves 100</text>
<text x="480" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">cross-encoder reranks to 5</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">paste chunks into context</text>
<text x="480" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">generate grounded, cite</text>
<text x="480" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">update a doc: answers update</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">3 chunks x 500 tokens</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">1,500 tokens per query</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">128k fits ~85 retrievals</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">hybrid: +3 to 8 recall pts</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">rerank: 0.94 vs 0.12</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">middle of context: -10-20 pts</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: retrieval failures become answer failures. Modular, governable, deletable, cheap.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Raise k until recall@k flattens, then stop. Strongest chunk first or last.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: RAG moves knowledge from weights to a store, and the store's freshness is the model's freshness.</text>
</svg>
