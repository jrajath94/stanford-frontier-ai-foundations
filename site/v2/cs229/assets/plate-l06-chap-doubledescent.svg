<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: double descent</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The canon breaks past the interpolation peak. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the U-canon</text>
<text x="328" y="124">the interpolation threshold</text>
<text x="648" y="124">WITH: the second descent</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">big models must fail</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">the U is the whole story</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">neural nets broke it</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">decades of doctrine</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">p ~ n: parameters = data</text>
<text x="480" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">the fit is knife-edge</text>
<text x="480" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">12-point toy peaks at degree 11</text>
<text x="480" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">flat minima: a plausible mechanism</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">15% to spike 25% to 8%</text>
<text x="780" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">degree 100: 0.4, degree 1000: 0.25</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">past the peak, bigger helps</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">modern practice jumps the peak</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: the worst place to sit is just past the sweet spot.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Big enough to be sensitive, not big enough to be smooth.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the canon is not wrong, it is incomplete: it describes the left of the peak.</text>
</svg>
