<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the supervised setup</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Best gets a definition, and the definition has a price. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: no score</text>
<text x="328" y="124">the loss chip</text>
<text x="648" y="124">WITH: scored lines</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">any line through the cloud</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">hand-picked, unscored</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">Ames: hundreds of pairs</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">knobs with no judge</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="16" font-weight="600" fill="#1B2838">J(theta) = 1/(2m) sum (h - y)^2</text>
<text x="480" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">theta_0 = 50,000, theta_1 = 100</text>
<text x="480" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">1,800 sq ft predicts $230,000</text>
<text x="480" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">$10k miss x 100 = $100k miss</text>
<text x="480" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">1/m: no growth with data</text>
<text x="480" y="340.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">1/2: cancels the 2 in the derivative</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">3-house toy: J = 6.33</text>
<text x="780" y="218.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">one step: J = 3.32</text>
<text x="780" y="252.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">squared 105 vs absolute 13</text>
<text x="780" y="282.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">on misses 1, 2, 10</text>
<text x="780" y="313.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">absolute: kink at zero</text>
<text x="780" y="343.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">kink stalls gradient descent</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: squares are smooth and big-miss-phobic, but one $1M miss</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">contributes 10^12 and drags the whole line toward itself.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: minimizing J is the whole game of supervised learning.</text>
</svg>
