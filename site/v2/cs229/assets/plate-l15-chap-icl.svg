<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: in-context learning</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The prompt is the program. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: train per task</text>
<text x="328" y="124">the stored object: frozen weights</text>
<text x="648" y="124">WITH the rule: prompt</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">collect data, label it</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">train a model per task</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">months of work per task</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">a model per company</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">sea -&gt; mer, sky -&gt; ciel</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">cheese -&gt; fromage</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">no gradient step</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">no weight moved</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">patterns with a job inside</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">attention continues the pattern</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">emerges past ~10B</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">reliable at 175B</text>
<text x="780" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">order reversal: double-digit swing</text>
<text x="780" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">wording beats more examples</text>
<text x="780" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">20 x 100 = 2,000 tokens</text>
<text x="780" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">of overhead per query, forever</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: zero training buys fragility. Prototype with ICL, ship with SFT: the sketchpad vs the ink.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Match the method to the change rate: daily in the prompt, weekly in the store, stable in the weights.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: attention implements 'continue the pattern', and the prompt is where the pattern lives.</text>
</svg>
