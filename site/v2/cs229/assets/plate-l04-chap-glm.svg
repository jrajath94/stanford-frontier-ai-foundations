<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the GLM recipe</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Three steps generate every classical model. Source: original recipe from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: derive each</text>
<text x="328" y="124">the three steps</text>
<text x="648" y="124">WITH: models fall out</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">binary target: derive logistic</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">count target: derive Poisson</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">new target, new derivation</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">each from scratch</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">1. pick the distribution</text>
<text x="480" y="216.25" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="16" font-weight="600" fill="#1B2838">2. eta = theta'x</text>
<text x="480" y="250.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">3. predict a'(eta)</text>
<text x="480" y="282.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">canonical link: mean to eta</text>
<text x="480" y="313.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">probit: breaks the clean gradient</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Gaussian gives least squares</text>
<text x="780" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Bernoulli gives logistic</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">Poisson: weekend 100 to 200 hits</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">theta = log 2 = 0.69</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">R's glm: same IRLS engine</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: eta must be linear in x. Curved boundaries are impossible.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">That ceiling is why lectures 7 and 8 exist.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: let eta be a neural network instead of theta'x, and you get deep learning.</text>
</svg>
