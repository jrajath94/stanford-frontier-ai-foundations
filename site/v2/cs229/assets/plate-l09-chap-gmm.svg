<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the soft grown-up</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Responsibilities quantify doubt.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">HARD assignments</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">all or nothing</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">each point exactly one cluster</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">overlapping groups forced apart</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">the point at 100 drags the mean to 26.5</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">no notion of uncertainty</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">responsibility gamma_j(x)</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">posterior: how much cluster j claims x</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">point 3: 1.0 vs about 0</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">midpoint 6.5: 0.5 and 0.5</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">between: a smooth slide, not a wall</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">SOFT assignments</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the probabilistic model</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">70/30 splits: overlap quantified</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">k-means is the zero-variance limit</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">the ad-hoc algorithm was probabilistic</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">with the variance turned to zero</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: soft assignments model overlap and shape.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: the labels stay hidden, so MLE has no closed form and EM must iterate.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the bridge proves k-means was the Gaussian mixture all along, with sigma squared sent to zero.</text>
</svg>
