<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the scaling bill</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Millions to build the map, pocket change to steer.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the budget math</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">140 GB does not fit</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">70B in fp16: 140 GB</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">one GPU: 80 GB</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">scale felt like alchemy</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">bigger models, starved of data</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">6 x N x D FLOPs</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">forward 2, backward 4, per token</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">70B on 1.4T tokens: 5.9e23 FLOPs</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">2,000 A100s, 34 days</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">about $3.3M for one run</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the budget math</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">Chinchilla&#x27;s correction</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">20 tokens per parameter</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">70B on 1.4T beats 280B on 300B</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">3D parallelism: data, tensor, pipeline</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">adaptation: tens of dollars</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: scale is a budget allocation problem: parameters and data grow together.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Starve either and the law punishes you. Only a few organizations can pay the pre-training bill.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the paradigm concentrates pre-training and democratizes adaptation.</text>
</svg>
