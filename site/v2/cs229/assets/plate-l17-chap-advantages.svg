<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: advantages subtract the luck</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The baseline is half the algorithm. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: raw reward</text>
<text x="328" y="124">the stored object: the advantage</text>
<text x="648" y="124">WITH the rule: GAE</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one bit at the end</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">500 thinking tokens</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">490 good steps punished</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">lucky guess reinforced</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">too coarse for 500 decisions</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">A = return - baseline</text>
<text x="480" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">V = 0.5 from here</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">correct: 1 - 0.5 = +0.5</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">wrong: 0 - 0.5 = -0.5</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">better vs worse than usual</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">expectation unchanged</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">deltas +0.5, -0.2, +0.3</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">lambda 0.95 standard</text>
<text x="780" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">A_0 = 0.563</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">near deltas count most</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">group mean: free baseline</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">critic: doubles forward cost</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the expectation is unchanged, the variance drops. Baselines do not bias; they calm.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Baseline zoo: constant (crude), V(s) (pricey, best), group mean (free, binary rewards).</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: advantage turns 'right or wrong' into 'better or worse than usual', which is the learnable signal.</text>
</svg>
