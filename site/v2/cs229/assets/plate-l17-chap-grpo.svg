<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: GRPO deletes the critic</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The group's average is the baseline. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: the critic</text>
<text x="328" y="124">the stored object: the group</text>
<text x="648" y="124">WITH the rule: R1</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">value head on the policy</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">second forward pass</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">doubles the RL step cost</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">bias infects advantages</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">value loss, GAE, tuning</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">G = 4, rewards [1,1,0,0]</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">mean 0.5, std 0.5</text>
<text x="480" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">advantages +1,+1,-1,-1</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">no critic, no GAE</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">G = 8 standard</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">group mean is free</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">R1-Zero: no SFT at all</text>
<text x="780" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">AIME 15.6% -&gt; 71.0%</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">R1: 79.8%, matches o1</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">aha: self-corrects</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">rule rewards, no neural RM</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">rejection sampling: the baseline</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: crude baseline, G samples per prompt. Scale G with difficulty, not habit.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Blind spot: 5% of wins come from broken reasoning. Never trust a rising reward curve alone.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: verifiable 0/1 rewards need no learned judge, and the group mean is the cheapest baseline.</text>
</svg>
