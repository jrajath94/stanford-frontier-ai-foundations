<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the tape&#x27;s price</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Speed costs memory. The tape is the invoice.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the escape hatch</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the full tape</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">12 layers at 100 MB: 1,200 MB</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">activations grow with depth x batch</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">weights are fixed cost</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">activations dominate training memory</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">saved intermediates</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">the backward needs a1 and z1</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">forward values the VJP reads</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">sparse embedding backward:</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">touch 64 values, not 640,000</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the escape hatch</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">checkpointing</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">save every 4th layer: 300 MB</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">one extra forward pass</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">30-40 percent slower, memory down 4x</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">reversible: O(1) tape in depth</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: checkpoint when memory binds. Buy bigger GPUs when money binds.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Every large transformer run checkpoints, because the tape does not fit otherwise.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: the O(N) theorem buys speed, and the tape is the invoice it sends: memory is the real training budget.</text>
</svg>
