<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: depth and the skip</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The skip carries the gradient untouched. Source: He et al. 2015.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">DEPTH without skips</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the signal dies</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">0.25^50 is about 10^-30</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">early layers learn nothing</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">plain nets stall past ~20 layers</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">training error rises with depth</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">out = x + F(x)</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">learn the change, add the input back</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">F = 0: the block is an identity</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">adding blocks cannot hurt</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">skip multiplies the gradient by 1</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">DEPTH with skips</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">152 layers train</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">ResNet-152: 3.57 percent top-5 error</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">ILSVRC 2015 winner</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">34, 50, 101, 152 keep improving</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">every transformer block is residual</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: depth stopped being a risk and became a dial.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: x and F(x) must match dimension, and the dial still needs tuning.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: fan-out adds gradients, so the skip path and the F path rejoin by addition at the plus node.</text>
</svg>
