<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: bias and variance</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The two enemies, and the U between them. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: fit harder</text>
<text x="328" y="124">error = bias^2 + variance + noise</text>
<text x="648" y="124">WITH: the U-curve</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">degree-10: train 0.00</text>
<text x="180" y="216.25" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">test: 4.7</text>
<text x="180" y="250.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">line: train 0.42, test 0.51</text>
<text x="180" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">more knobs always fit training</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">bias: wrong assumptions</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">variance: noise sensitivity</text>
<text x="480" y="245.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5C6B7A">preds 0.7, 0.9, 1.1 at truth 1.0</text>
<text x="480" y="273.75" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="500" fill="#1B2838">bias^2 = 0.01, variance = 0.027</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">infinite data: bias survives</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">degree 3: train 0.08, test 0.18</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">degree 9: train 0.01, test 1.8</text>
<text x="780" y="246.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">degree 15: train 0.00, test 4.9</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">the sweet spot, found only on dev</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: data fights variance; flexibility fights bias.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">You need both moves.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: when a model fails, this split tells you which enemy to fight.</text>
</svg>
