<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="576" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the ad-hoc algorithm</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Assign, average, repeat. The seed decides the answer.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the algorithm</text>
<rect x="48" y="150" width="264" height="246" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">a million unlabeled records</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">no y anywhere</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">no natural groups visible</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">labels would cost human hours</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the machine must invent categories</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="246" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">assign, then average</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">{1,2,3,10,11,12}, k = 2</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">start (1, 12): assign, update</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">mu_1 = 2, mu_2 = 11, 1 round</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the mean minimizes the distortion</text>
<text x="480.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">each step optimal for its half</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the algorithm</text>
<rect x="648" y="150" width="264" height="246" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">converges to a local minimum</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">distortion falls every round</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">k = 1: 125.5. k = 2: 4.0</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">bad seed strands a cluster</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">distortion near 200 instead of 4.0</text>
<rect x="48" y="412" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the algorithm is deterministic given the seed, and the seed is luck.</text>
<text x="480" y="476" text-anchor="middle" font-size="15" fill="#1B2838">NP-hardness forbids a global guarantee: local minima are fundamental, not a bug.</text>
<text x="48" y="528" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: k-means is lecture 5&#x27;s GDA with the labels hidden, which is why lecture 10&#x27;s EM fits the grown-up version.</text>
</svg>
