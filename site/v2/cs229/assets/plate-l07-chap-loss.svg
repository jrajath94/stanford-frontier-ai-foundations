<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="576" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the loss vocabulary</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The loss must score what the task cares about.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WRONG scoreboard</text>
<rect x="48" y="150" width="264" height="246" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">MSE on class labels</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">optimizes the wrong pain</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">the numbers look fine</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">while the model is wrong</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">treats 0.49 vs 0.51 like any gap</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="246" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the loss: one number</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">loss(prediction, truth) = how wrong</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">three jobs: numbers, probabilities, margins</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">MSE: gap 20 becomes 400</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">cross-entropy: -log(0.7) = 0.357</text>
<text x="480.0" y="354" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">cross-entropy: -log(0.1) = 2.303</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the matched losses</text>
<rect x="648" y="150" width="264" height="246" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">softmax plus cross-entropy</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">softmax(2, 1, 0.5) = (0.63, 0.23, 0.14)</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">sum: 1.00. gradient is p - y</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">= (-0.37, 0.23, 0.14)</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">hinge: s = 0.3 pays 0.7</text>
<text x="780.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">(1000,999): log-sum-exp = 1000.31</text>
<rect x="48" y="412" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: regression squares the gap, classification logs the truth&#x27;s probability,</text>
<text x="480" y="476" text-anchor="middle" font-size="15" fill="#1B2838">the hinge charges only inside the margin. Match the loss to the data type.</text>
<text x="48" y="528" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: every output layer promises a data type, and the loss is the scoreboard that keeps that promise.</text>
</svg>
