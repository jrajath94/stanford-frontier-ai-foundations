<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: hard negatives keep the loss teaching</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Random negatives saturate. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT mining: easy negatives</text>
<text x="328" y="124">the stored object: the hard negative</text>
<text x="648" y="124">WITH mining: three generations</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">anchor: cat playing soccer</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">negative: a truck</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">similarity 0.05</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">loss already ~0</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">nothing learned</text>
<text x="180" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">100 easy: loss saturates</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">FIFA text vs cat photo</text>
<text x="480" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">shares soccer, misses the cat</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">gradient focuses on it</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">weight 0.3 vs 0.001</text>
<text x="480" y="292" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">300x harder push</text>
<text x="480" y="322" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">the loss spends itself</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">gen 1: in-batch, free</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">gen 2: MoCo queue 65k</text>
<text x="780" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">gen 3: cross-device, global</text>
<text x="780" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">false negatives: 2%</text>
<text x="780" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">poison rate at the top</text>
<text x="780" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">dedup gate: cosine 0.95</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: harder negatives teach finer distinctions, but 2% are true positives in disguise.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Dedup above 0.95 cosine before mining, not after.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the loss spends its gradient on the confusing pairs, so the negative pool is the curriculum.</text>
</svg>
