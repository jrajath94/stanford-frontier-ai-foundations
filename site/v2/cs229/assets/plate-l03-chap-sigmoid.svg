<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the sigmoid</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The squeeze that turns scores into probabilities. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the line</text>
<text x="328" y="124">g(z) = 1/(1+e^-z)</text>
<text x="648" y="124">WITH: logistic regression</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">line predicts 0.27 and 0.55</text>
<text x="180" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">no walls at 0 and 1</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">2.5 cm tumor scores 0.45: benign</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">threshold jumps, no gradient</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">g(-2) = 0.12, g(0) = 0.5</text>
<text x="480" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">g(2) = 0.88, g(10) = 0.99995</text>
<text x="480" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">smooth and monotone</text>
<text x="480" y="279.0" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#5C6B7A">g'(z) = g (1-g)</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="500" fill="#1B2838">h = g(theta'x), fit by MLE</text>
<text x="780" y="216.25" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="500" fill="#1B2838">gradient: (h - y) x</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">tumor toy: size knob to 0.25</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">fraud: threshold 0.2, recall 92%</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">error x feature, again</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: sigmoid plus squared loss is the flat-gradient trap.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Sigmoid plus cross-entropy is the design: the loss must match the squash.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the sigmoid's derivative factors into itself, so the learning rules stay clean.</text>
</svg>
