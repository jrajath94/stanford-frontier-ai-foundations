<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the cache diets, stacked</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Every diet attacks one axis. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT diets: full MHA</text>
<text x="328" y="124">the stored object: the diets</text>
<text x="648" y="124">WITH diets: the stack</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">32 query heads, 32 KV heads</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">512 KB per token</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">2 GB per 4k sequence</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">batch of 10, not 1,000</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">memory-bound decode</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">GQA-8: 128 KB, 4x</text>
<text x="480" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">MQA: 16 KB, 32x</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">MLA latent: ~16x smaller</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">CLA-2: halve, ~0.04 ppl</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">fp8 cache: halve, minimal loss</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">evict: fixed budget</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">GQA-8 + fp8 + evict</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">paged: 12% to 96% util</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">speculative: 2-3x</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">INT8: 2x the batch</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">$2/hr, 2000 tok/s</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">$0.28 per M tokens</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: heads, layers, precision, length, fragmentation. Shrink the bytes, then stop wasting them.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Eviction is lossy and irreversible: a question about an evicted token cannot be answered.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the cache is the most compressible state in the system, and each diet compresses a different axis.</text>
</svg>
