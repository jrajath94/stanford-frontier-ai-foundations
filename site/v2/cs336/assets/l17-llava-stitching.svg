<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">LLaVA stitching: freeze both ends, train the bridge</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">CLIP plus a projector plus Vicuna. Align, then fine-tune. Shell 3. Source: original toy for LLaVA.</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs>
<!-- stage 1 -->
<g>
<rect x="64" y="136" width="832" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="170" font-size="15" font-weight="600" fill="#1B2838">stage 1: align</text>
<rect x="80" y="188" width="160" height="64" rx="12" fill="#E6E2DA"/><text x="160" y="224" font-size="13" text-anchor="middle" fill="#1B2838">CLIP frozen</text>
<line x1="240" y1="220" x2="272" y2="220" stroke="#1E4D8C" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="272" y="188" width="200" height="64" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="372" y="214" font-size="13" text-anchor="middle" fill="#1B2838">projector W: trained</text><text x="372" y="236" font-size="13" text-anchor="middle" fill="#5C6B7A">the bridge</text>
<line x1="472" y1="220" x2="504" y2="220" stroke="#1E4D8C" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="504" y="188" width="160" height="64" rx="12" fill="#E6E2DA"/><text x="584" y="224" font-size="13" text-anchor="middle" fill="#1B2838">Vicuna frozen</text>
<text x="688" y="214" font-size="13" fill="#5C6B7A">image tokens:</text>
<text x="688" y="236" font-size="13" fill="#5C6B7A">look like text tokens</text>
<text x="80" y="292" font-size="13" fill="#5C6B7A">Only the mapping is learned: 158k GPT-4 conversations from COCO captions suffice.</text>
</g>
<!-- stage 2 -->
<g>
<rect x="64" y="352" width="832" height="168" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="386" font-size="15" font-weight="600" fill="#1B2838">stage 2: instruct</text>
<rect x="80" y="404" width="160" height="64" rx="12" fill="#E6E2DA"/><text x="160" y="440" font-size="13" text-anchor="middle" fill="#1B2838">CLIP frozen</text>
<line x1="240" y1="436" x2="272" y2="436" stroke="#1E4D8C" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="272" y="404" width="200" height="64" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="372" y="440" font-size="13" text-anchor="middle" fill="#1B2838">W plus Vicuna: trained</text>
<text x="504" y="430" font-size="13" fill="#5C6B7A">the LM learns to reason over image tokens;</text>
<text x="504" y="452" font-size="13" fill="#5C6B7A">the vision encoder stays frozen</text>
</g>
<line x1="64" y1="556" x2="896" y2="556" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="592" font-size="16" font-weight="500" fill="#1B2838">One claim: compose frozen experts, train the interfaces; the only missing piece is translation.</text>
</svg>
