<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Log-log line = power law</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Error ~ 1/n^alpha. Mean estimation: -1. Neural nets: -0.1, nonparametric-like.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">slope on log-log = exponent</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">mean estimation: error = sigma^2 / n  -&gt;  slope -1</text><text x="84" y="220" font-size="16" font-weight="700" fill="#C46B2C" text-anchor="start">neural nets (Kaplan/Hestness): slope ~ -0.1 to -0.3</text><text x="84" y="250" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">nonparametric in D dims: n^(-1/D). Nets learn like smooth functions in ~10 dims.</text><text x="84" y="290" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Far from the noise floor: the line tapers at the asymptote.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture stats slides, original plate. Shell 2: the slope is the story.</text></svg>