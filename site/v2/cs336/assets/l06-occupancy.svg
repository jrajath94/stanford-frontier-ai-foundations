<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Registers cap your occupancy</text><text x="36" y="78" font-size="17" fill="#5C6B7A">128 threads x 160 regs = 20K regs/block. 3 blocks/SM. 12 of 64 warps = 18%.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the math</text><text x="84" y="190" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">registers per block = 128 threads x 160 regs = 20,480</text><text x="84" y="222" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">B200: 65,536 regs/SM  -&gt;  3 blocks fit  (3 x 20,480)</text><text x="84" y="254" font-size="17" font-weight="700" fill="#C46B2C" text-anchor="start">3 blocks x 4 warps = 12 warps. Max 64. Occupancy = 12/64 = 18%.</text><rect x="60" y="350" width="410" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="374" font-size="14" font-weight="700" fill="#5C6B7A">high occupancy?</text><text x="84" y="396" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">more warps hide latency</text><text x="84" y="422" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">not always better</text><rect x="490" y="350" width="410" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="504" y="374" font-size="14" font-weight="700" fill="#5C6B7A">thread coarsening</text><text x="514" y="396" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">fewer, fatter threads</text><text x="514" y="422" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">8 elements per thread</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture occupancy slides, original plate. Shell 2: count registers.</text></svg>