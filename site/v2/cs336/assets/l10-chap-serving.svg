<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: serving the chaos</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Jagged traffic, continuous batches, paged caches. Source: lecture serving sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the batch</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">jagged live traffic</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">requests arrive at different times,</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">different lengths</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">GPUs idle between arrivals</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">fragmented cache: over-allocated</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">buffers, gaps between requests</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">chatbot latency poisoned</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">by the batch job's tolerance</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">continuous batching (Orca)</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">one token per seq per step;</text>
<text x="480" y="232" text-anchor="middle" font-size="14" fill="#1B2838">evict finished, admit new</text>
<text x="480" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">PagedAttention (vLLM)</text>
<text x="480" y="304" text-anchor="middle" font-size="14" fill="#1B2838">KV cache in blocks, like OS pages</text>
<text x="480" y="328" text-anchor="middle" font-size="14" fill="#1B2838">prefix sharing, copy-on-write</text>
<text x="480" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">selective batching</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#1B2838">MLP: one mega-seq; attention per-seq</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">the pipe never stalls</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">chunked prefill: long prompts</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">chopped, interleaved with decode</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">defragged, shared, steady</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">disaggregation: prefill and decode</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">on separate fleets</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">OS ideas, reused: paging for</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#1B2838">memory, batching for the queue</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: do not mix the chatbot and the batch pipeline in one batch.</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">Split the cluster or time-slice it, and size each side's batch for its own metric.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">Disaggregation wins when the cache transfer is cheap against the phase mismatch it fixes; it loses when the cache is too big.</text>
</svg>
