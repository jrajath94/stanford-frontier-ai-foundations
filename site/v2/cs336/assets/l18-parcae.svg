<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Parcae: loops that do not blow up</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Loop transformers scaled by constraining the spectral radius.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the instability</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">naive looping blows up: powering the A matrix amplifies activations</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">norms fight expansion: loss spikes, NaNs, 9 of 10 learning rates fail</text><rect x="60" y="306" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="330" font-size="14" font-weight="700" fill="#5C6B7A">the fix</text><text x="84" y="354" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">A becomes negative diagonal: spectral radius under 1, cannot explode</text><text x="84" y="380" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">scaling laws: as data grows, scale recurrence alongside parameters</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: guest lecture Parcae slides, original plate. Shell 5: architectures.</text></svg>