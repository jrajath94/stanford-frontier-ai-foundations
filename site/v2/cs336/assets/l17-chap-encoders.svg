<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Encoders: judge pairs, not batches</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. CLIP's batch-coupled loss gave way to SigLIP's independent pairs. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the reframe</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">CLIP: 2N softmax, the batch</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">is the objective</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">10 days on 256 TPUv3</text>
<text x="196" y="332" font-size="14" fill="#1B2838" text-anchor="middle">small batches: lazy features;</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">the loss forbids small labs</text>
<text x="196" y="388" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">the batch size is not tunable</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">SigLIP: binary sigmoid,</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">each pair judged alone</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">SigLIP-2: distillation plus</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">masked prediction</text>
<text x="472" y="328" font-size="13" fill="#5C6B7A" text-anchor="middle">batch-independent in expectation</text>
<text x="472" y="352" font-size="13" fill="#5C6B7A" text-anchor="middle">32K: the effective ceiling</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">default: SigLIP-2 (SO-400M)</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the reframe</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">devices compute local losses,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">rotate embeddings, no global</text>
<text x="756" y="248" font-size="14" fill="#1B2838" text-anchor="middle">softmax</text>
<rect x="648" y="272" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">5 days on 32 TPUv4</text>
<text x="756" y="354" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">16x fewer TPU-days,</text>
<text x="756" y="376" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">small batches work</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Default to SigLIP-2; reach for CLIP's loss only for compatibility with the open-weight ecosystem.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Text supplies the semantics augmentation never could: it teaches dog-ness across dogs, not invariance to crops.</text>
</g>
</svg>
