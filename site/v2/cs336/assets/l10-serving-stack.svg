<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The same ideas, production-hardened</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">vLLM, SGLang, TensorRT-LLM, DeepSeek: the lecture's ideas with harder edges.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<g font-size="14" font-weight="500" fill="#1B2838">
<rect x="48" y="136" width="424" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="16" font-weight="600">vLLM</text>
<text x="72" y="194" fill="#5C6B7A">the open serving standard</text>
<text x="72" y="220">PagedAttention: block-paged KV cache</text>
<text x="72" y="244">continuous batching, prefix caching</text>
<rect x="488" y="136" width="424" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="168" font-size="16" font-weight="600">SGLang</text>
<text x="512" y="194" fill="#5C6B7A">radix attention: prefix caching as a tree</text>
<text x="512" y="220">shared prefixes stored once</text>
<text x="512" y="244">strong on structured generation</text>
<rect x="48" y="312" width="424" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="344" font-size="16" font-weight="600">TensorRT-LLM</text>
<text x="72" y="370" fill="#5C6B7A">NVIDIA's compiled stack</text>
<text x="72" y="396">kernel autotuning, FP8/FP4 paths</text>
<text x="72" y="420">tight Hopper integration</text>
<rect x="488" y="312" width="424" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="344" font-size="16" font-weight="600">DeepSeek</text>
<text x="512" y="370" fill="#5C6B7A">MLA + FP8, TP=4 at inference (reported)</text>
<text x="512" y="396">MTP head repurposed as the draft head</text>
<text x="512" y="420">the draft model is built in</text>
</g>
<rect x="48" y="488" width="864" height="72" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="72" y="516" font-size="14" font-weight="600" fill="#1B2838">Speculative decoding everywhere: vLLM, SGLang, and TensorRT-LLM all ship it.</text>
<text x="72" y="538" font-size="14" font-weight="600" fill="#1B2838">The draft is usually a small dense model distilled from the target.</text>
<text x="48" y="572" font-size="13" fill="#5C6B7A">Source: project docs, Oct 2026. Vendor internals not public are unknown. Shell 5: the stack is the same ideas with harder edges.</text>
</svg>
