<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">One math, two machines</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Dense form trains in parallel. Recurrent form infers with fixed state.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="380" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">TRAIN: dense</text><text x="84" y="190" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">S = K^T V   (all at once)</text><text x="84" y="220" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">out = Q S</text><text x="84" y="260" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">parallel over n</text><rect x="520" y="140" width="380" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="534" y="164" font-size="14" font-weight="700" fill="#5C6B7A">INFER: recurrent</text><text x="544" y="190" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">S_t = S_{t-1} + k_t v_t^T</text><text x="544" y="220" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">out_t = q_t S_t</text><text x="544" y="260" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">fixed-size state S</text><line x1="440" y1="250" x2="520" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">same math</text><text x="60" y="420" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">RNNs are bad at training (serial) and good at inference (fixed state).</text><text x="60" y="446" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Linear attention gets both: train dense, infer recurrent. Best of both worlds.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 4: the state S becomes gated.</text></svg>