<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">ARC: reasoning without knowledge</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Grids a human solves in seconds, models could not. Reasoning models changed that.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the design</text><text x="84" y="190" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">100% human-solvable, knowledge-free, every task a snowflake</text><text x="84" y="216" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">GPT-3: zero. o1/o3: ARC-1 solved. ARC-2 nearly. ARC-3: interactive, scores low.</text><rect x="60" y="310" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="334" font-size="14" font-weight="700" fill="#5C6B7A">the caveat</text><text x="84" y="360" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">pure reasoning may not exist; still human-bounded, not superhuman</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture ARC slides, original plate. Shell 4: isolate the faculty.</text></svg>