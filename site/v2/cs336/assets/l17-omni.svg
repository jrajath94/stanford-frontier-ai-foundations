<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The omni model</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Any modality in, any modality out. The North Star.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the goal</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">text, image, audio, video: any combination in, any combination out</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">transformers speak tokens, so everything must become tokens</text><rect x="60" y="296" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">the question</text><text x="84" y="344" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">a pixel is not a semantic unit. What is the image BPE?</text><text x="84" y="370" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">discrete or continuous tokens: the two answers this lecture</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture intro slides, original plate. Shell 1: the North Star.</text></svg>