<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The 34sbh floor, divided by t</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">TP divides the 24. Sequence parallel divides the stubborn 10. Recompute deletes the quadratic.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: the parts -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">THE PARTS: 34sbh + 5as&#178;/h</text>
<g font-size="14" fill="#1B2838">
<text x="72" y="204" font-weight="600">MLP block: 24sbh</text>
<text x="72" y="228" fill="#5C6B7A">up-projection input, gate/up outputs,</text>
<text x="72" y="250" fill="#5C6B7A">down-projection input, saved inputs</text>
<text x="72" y="286" font-weight="600">attention block: 10sbh</text>
<text x="72" y="310" fill="#5C6B7A">QKV inputs, output input, masks,</text>
<text x="72" y="332" fill="#5C6B7A">residual input</text>
<text x="72" y="368" font-weight="600">quadratic: 5as&#178;/h</text>
<text x="72" y="392" fill="#5C6B7A">softmax probs, dropout over s x s</text>
</g>
<text x="72" y="440" font-size="14" font-weight="600" fill="#C46B2C">FlashAttention recompute</text>
<text x="72" y="462" font-size="14" fill="#5C6B7A">deletes the quadratic term.</text>
<!-- center arrow -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: the division -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">THE DIVISION</text>
<g font-size="14" fill="#1B2838">
<text x="504" y="204"><tspan font-weight="600">TP:</tspan> (24sbh + attention matmuls) / t</text>
<text x="504" y="228" fill="#5C6B7A">lives inside the split matmuls</text>
<text x="504" y="264"><tspan font-weight="600">sequence parallel:</tspan> 10sbh / t</text>
<text x="504" y="288" fill="#5C6B7A">shards the elementwise leftovers along s</text>
<text x="504" y="312" fill="#5C6B7A">rides on the sync TP already pays</text>
</g>
<rect x="504" y="336" width="384" height="72" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="520" y="364" font-size="16" font-weight="700" fill="#1F7A72">floor = 34sbh / t</text>
<text x="520" y="390" font-size="13" fill="#5C6B7A">with recomputation assumed</text>
<text x="504" y="444" font-size="14" fill="#1B2838">s=8192, b=8, h=8192, t=8, bf16:</text>
<text x="504" y="468" font-size="14" font-weight="600" fill="#1B2838">2.28e9 elements = 4.6GB</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture activation-memory slides, original plate. Shell 3: the formula tells you before you launch.</text>
</svg>
