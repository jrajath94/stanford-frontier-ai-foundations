<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">The kernel: think in blocks, not threads</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: THREADS</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">one thread per element,</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">manual index math, slow</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">tail block all zeros</text><text x="52" y="270" font-size="14" fill="#1B2838">grid drops the remainder,</text><text x="52" y="300" font-size="14" fill="#1B2838">nothing was ever written</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: THE BLOCK</text><text x="340" y="168" font-size="18" font-weight="700" fill="#1B2838">pid + offsets + mask</text><text x="340" y="200" font-size="14" fill="#5C6B7A">one block, one slice</text><text x="340" y="252" font-size="14" fill="#1B2838">tl.load, compute, tl.store</text><text x="340" y="282" font-size="14" fill="#1B2838">pointers are integers</text><text x="340" y="330" font-size="14" fill="#1B2838">masks guard the tail</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: THE GRID</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">(n+B-1)/B</text><text x="628" y="186" font-size="14" fill="#1B2838">blocks cover the tensor</text><text x="628" y="216" font-size="14" fill="#1B2838">one block per SM,</text><text x="628" y="246" font-size="14" fill="#1B2838">shared memory per block</text><text x="628" y="300" font-size="14" fill="#1B2838">count tiles vs SMs: no crater</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: blocks are the unit of parallelism. Threads are the unit of bookkeeping.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: thread thinking. Center: the block shape. Right: grid coverage.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson Triton slides, original plate. Shell 4: the block symbol.</text></svg>
