<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The exam treadmill</text><text x="36" y="78" font-size="17" fill="#5C6B7A">MMLU: 90s. MMLU-Pro: 33 to 88. GPQA: experts 65, models 94. HLE still hard. Multiple choice survives.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">MMLU (2020)</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#5C6B7A"/><text x="84" y="176" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">57 subjects, few-shot</text><text x="84" y="202" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">barely above chance -&gt; 90s</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">MMLU-Pro</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#D9E6F5"/><text x="84" y="276" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">10 choices, chain of thought</text><text x="84" y="302" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">33 -&gt; 88</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">GPQA</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="376" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">PhD contractors, diamond set</text><text x="84" y="402" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">experts 65%, models now 94</text><rect x="60" y="440" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="464" font-size="14" font-weight="700" fill="#5C6B7A">Humanity&#x27;s Last Exam</text><rect x="60" y="440" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="476" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">crowdsourced, private held-out</text><text x="84" y="502" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Mythos 64.7: still hard</text><text x="60" y="556" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Exams miss real use: nobody asks HLE questions except on HLE.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture benchmark slides, original plate. Shell 4: benchmarks have shelf lives.</text></svg>