<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The 4D prescription</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Fit the model first, then spend the rest on data parallel. Simple rules win.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="72" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">1. fit the model</text><rect x="60" y="140" width="10" height="72" rx="5" fill="#1F7A72"/><text x="84" y="186" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">TP or EP of 8 inside the fast node</text><rect x="60" y="224" width="840" height="72" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="248" font-size="14" font-weight="700" fill="#5C6B7A">2. fit across nodes</text><rect x="60" y="224" width="10" height="72" rx="5" fill="#D9E6F5"/><text x="84" y="270" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">pipeline parallel or ZeRO-3 on the slow links</text><rect x="60" y="308" width="840" height="72" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="332" font-size="14" font-weight="700" fill="#5C6B7A">3. spend the rest</text><rect x="60" y="308" width="10" height="72" rx="5" fill="#F4E6D4"/><text x="84" y="354" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">data parallel: maximize it, minimize model parallel</text><rect x="60" y="392" width="840" height="72" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="416" font-size="14" font-weight="700" fill="#5C6B7A">4. long context</text><rect x="60" y="392" width="10" height="72" rx="5" fill="#E7F4EF"/><text x="84" y="438" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">context parallel (ring attention)</text><text x="60" y="500" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Batch too small: gradient accumulation. Comm hiding: keep compute longer than comm.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture strategy + Megatron guidelines, original plate. Shell 5: rules of thumb.</text></svg>