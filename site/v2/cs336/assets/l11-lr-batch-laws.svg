<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">What the grids say</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Batch size follows the data. Learning rate falls with size, rises with data. Contours are smooth.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">batch size</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">depends only on D (tokens), not on N. Roughly sqrt(D) x const.</text><rect x="60" y="310" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="334" font-size="14" font-weight="700" fill="#5C6B7A">learning rate</text><text x="84" y="360" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">down with model size N, up with data D. Under Chinchilla both move: LR falls with compute.</text><text x="60" y="480" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">StepFun: high-res grids, smooth convex slices. Laws transfer to MoE at fixed active params.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture StepFun slides, original plate. Shell 4: read the contours.</text></svg>