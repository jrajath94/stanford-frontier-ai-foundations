<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Speculative decoding: guess, then verify</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Draft k=5, verify in one pass. Shell 3. Source: original toy for the lecture's speculation section.</text>
<!-- left: before -->
<g>
<rect x="64" y="136" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: serial decode</text>
<rect x="106" y="186" width="180" height="28" rx="14" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="196" y="205" font-size="13" fill="#1B2838" text-anchor="middle">token: 1 pass, 42.4 ms</text>
<rect x="106" y="222" width="180" height="28" rx="14" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="196" y="241" font-size="13" fill="#1B2838" text-anchor="middle">token: 1 pass, 42.4 ms</text>
<rect x="106" y="258" width="180" height="28" rx="14" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="196" y="277" font-size="13" fill="#1B2838" text-anchor="middle">token: 1 pass, 42.4 ms</text>
<rect x="106" y="294" width="180" height="28" rx="14" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="196" y="313" font-size="13" fill="#1B2838" text-anchor="middle">token: 1 pass, 42.4 ms</text>
<rect x="106" y="330" width="180" height="28" rx="14" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="196" y="349" font-size="13" fill="#1B2838" text-anchor="middle">token: 1 pass, 42.4 ms</text>
<text x="196" y="388" font-size="14" fill="#1B2838" text-anchor="middle">5 tokens, 5 passes</text>
<text x="196" y="410" font-size="14" fill="#1B2838" text-anchor="middle">5 x 42.4 ms = 212 ms</text>
</g>
<!-- chevron -->
<polygon points="336,270 352,278 336,286" fill="#1B2838"/>
<!-- center: the rule -->
<g>
<rect x="360" y="136" width="240" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="376" y="186" width="208" height="112" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="212" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">draft k=5, cheap</text>
<text x="480" y="234" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">target verifies in 1 pass</text>
<text x="480" y="256" font-size="13" fill="#1B2838" text-anchor="middle">prefill: compute-bound,</text>
<text x="480" y="278" font-size="13" fill="#1B2838" text-anchor="middle">parallel, not serial</text>
<text x="480" y="328" font-size="14" fill="#1B2838" text-anchor="middle">accept the agreements,</text>
<text x="480" y="350" font-size="14" fill="#1B2838" text-anchor="middle">correct the first miss</text>
<text x="480" y="392" font-size="14" fill="#1B2838" text-anchor="middle">acceptance rate</text>
<text x="480" y="414" font-size="14" fill="#1B2838" text-anchor="middle">decides the win</text>
</g>
<!-- chevron -->
<polygon points="608,270 624,278 608,286" fill="#1B2838"/>
<!-- right: after -->
<g>
<rect x="632" y="136" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="764" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: draft + verify</text>
<text x="764" y="204" font-size="14" fill="#1B2838" text-anchor="middle">accept 4, correct the 5th:</text>
<text x="764" y="226" font-size="14" fill="#1B2838" text-anchor="middle">5 tokens for ~1.2 passes</text>
<rect x="664" y="248" width="200" height="48" rx="8" fill="#E7F4EF"/>
<text x="764" y="276" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">~4x speedup</text>
<text x="764" y="330" font-size="14" fill="#1B2838" text-anchor="middle">accept 1 of 5: 1 pass</text>
<text x="764" y="352" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">+ draft cost: slower</text>
<text x="764" y="396" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">predictable text wins</text>
</g>
<line x1="64" y1="488" x2="896" y2="488" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="520" font-size="16" font-weight="500" fill="#1B2838">One claim: the draft guesses, the target verifies;</text>
<text x="64" y="544" font-size="16" font-weight="500" fill="#1B2838">the acceptance rate decides the win.</text>
<text x="64" y="570" font-size="13" fill="#5C6B7A">Numbers computed: 5 serial passes x 42.4 ms = 212 ms; speculation: 5 tokens for ~1.2 passes = ~4x.</text>
<text x="64" y="590" font-size="13" fill="#5C6B7A">Accept 1 of 5: 1 pass + draft cost, slower than baseline.</text>
</svg>
