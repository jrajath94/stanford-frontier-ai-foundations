<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="620" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The lifetime of a token</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Request to intelligence, one scheduling loop.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="62" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">request</text><rect x="60" y="140" width="10" height="62" rx="5" fill="#5C6B7A"/><text x="84" y="180" font-size="13.5" font-weight="400" fill="#5C6B7A" text-anchor="start">tokenize the prompt</text><rect x="60" y="218" width="840" height="62" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="242" font-size="14" font-weight="700" fill="#5C6B7A">schedule</text><rect x="60" y="218" width="10" height="62" rx="5" fill="#5C6B7A"/><text x="84" y="258" font-size="13.5" font-weight="400" fill="#5C6B7A" text-anchor="start">assign to GPUs (prefill vs decode pools)</text><rect x="60" y="296" width="840" height="62" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">KV cache</text><rect x="60" y="296" width="10" height="62" rx="5" fill="#1F7A72"/><text x="84" y="336" font-size="13.5" font-weight="400" fill="#5C6B7A" text-anchor="start">have we seen these tokens before?</text><rect x="60" y="374" width="840" height="62" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="398" font-size="14" font-weight="700" fill="#5C6B7A">execute</text><rect x="60" y="374" width="10" height="62" rx="5" fill="#F4E6D4"/><text x="84" y="414" font-size="13.5" font-weight="400" fill="#5C6B7A" text-anchor="start">prefill once, decode one token at a time</text><rect x="60" y="452" width="840" height="62" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="476" font-size="14" font-weight="700" fill="#5C6B7A">sample</text><rect x="60" y="452" width="10" height="62" rx="5" fill="#5C6B7A"/><text x="84" y="492" font-size="13.5" font-weight="400" fill="#5C6B7A" text-anchor="start">stop tokens, safety checks, return</text><text x="60" y="580" font-size="14" font-weight="700" fill="#1B2838" text-anchor="start">The engine repeats: schedule, execute, sample. Inference turns electricity into intelligence.</text><text x="36" y="596" font-size="14" fill="#5C6B7A">Source: guest lecture overview slides, original plate. Shell 1: the lifetime.</text></svg>