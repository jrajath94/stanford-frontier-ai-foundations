<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Bubbles are idle tax</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Naive pipeline: one GPU works at a time. Micro-batches fill the pipe. Zero-bubble splits B and W.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">naive: 4 stages, 1 batch</text><rect x="90" y="190" width="60" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="170" y="220" width="60" height="22" rx="4" fill="#E6E2DA" stroke="#1B2838" stroke-width="1"/><rect x="250" y="250" width="60" height="22" rx="4" fill="#E6E2DA" stroke="#1B2838" stroke-width="1"/><rect x="330" y="280" width="60" height="22" rx="4" fill="#E6E2DA" stroke="#1B2838" stroke-width="1"/><text x="90" y="330" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">utilization: terrible</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">micro-batches: 4 stages, 8 micros</text><rect x="530" y="190" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="620" y="190" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="710" y="190" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="542" y="220" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="632" y="220" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="722" y="220" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="554" y="250" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="644" y="250" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="734" y="250" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="566" y="280" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="656" y="280" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><rect x="746" y="280" width="70" height="22" rx="4" fill="#F4E6D4" stroke="#1B2838" stroke-width="1"/><text x="530" y="330" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">bubble -&gt; 0 as 1 / microbatches</text><rect x="60" y="370" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">zero-bubble: backward = B (propagate partials) + W (weight grads)</text><text x="84" y="420" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">B must come first: the next stage waits. W can wait. Do B now, W in the gaps.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture pipeline slides, original plate. Shell 4: schedule around the critical path.</text></svg>