<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Speculative decoding: check beats generate</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Draft K tokens with a cheap model. Verify in parallel with the big one. Accept with min(1, q/p).</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the loop</text><rect x="100" y="180" width="220" height="80" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="210.0" y="218.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">draft model p</text><text x="210.0" y="238.0" font-size="12" fill="#5C6B7A" text-anchor="middle">cheap, sequential</text><line x1="320" y1="60" x2="220" y2="60" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="270.0" y="50" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">K tokens</text><rect x="380" y="180" width="220" height="80" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="490.0" y="218.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">target model q</text><text x="490.0" y="238.0" font-size="12" fill="#5C6B7A" text-anchor="middle">big, parallel check</text><line x1="600" y1="60" x2="220" y2="60" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="410.0" y="50" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">accept?</text><rect x="660" y="180" width="200" height="80" rx="8" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/><text x="760.0" y="218.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">exact sample</text><text x="760.0" y="238.0" font-size="12" fill="#5C6B7A" text-anchor="middle">from q</text><rect x="60" y="350" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="374" font-size="14" font-weight="700" fill="#5C6B7A">why it is exact</text><text x="84" y="400" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">rejection sampling with a guaranteed sample: accept w.p. min(1, q/p), else sample the residual.</text><text x="84" y="426" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">sweet spot K = 3-4. Distill the draft toward the target.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture speculative-decoding slides, original plate. Shell 4: verify in parallel.</text></svg>