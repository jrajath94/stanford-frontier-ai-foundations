<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">32 banks, one thread each</text><text x="36" y="78" font-size="17" fill="#5C6B7A">32 threads hitting one column serialize: a 32-way bank conflict.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">shared memory: 32 banks x 4 bytes</text><rect x="100" y="200" width="80" height="80" rx="6" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="140" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b0</text><rect x="195" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="235" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b1</text><rect x="290" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="330" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b2</text><rect x="385" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="425" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b3</text><rect x="480" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="520" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b4</text><rect x="575" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="615" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b5</text><rect x="670" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="710" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b6</text><rect x="765" y="200" width="80" height="80" rx="6" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="805" y="245" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">b7</text><text x="100" y="320" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">32 threads read column 0 -&gt; all hit bank 0 -&gt; 32x serialized</text><rect x="60" y="370" width="840" height="110" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">fix</text><text x="84" y="414" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">rows are fine (spread across banks). Matmul needs rows AND columns:</text><text x="84" y="440" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">swizzling rearranges shared memory to dodge the conflict.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture bank-conflict slides, original plate. Shell 3: the bank rule.</text></svg>