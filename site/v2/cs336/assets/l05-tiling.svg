<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Tiling: load once, reuse T times</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Cut matrices into tiles. Compute in shared memory.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">naive N x N matmul</text><text x="84" y="200" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">each element read</text><text x="84" y="230" font-size="16" font-weight="700" fill="#C46B2C" text-anchor="start">N times from HBM</text><text x="84" y="280" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">global reads: O(N^3)</text><rect x="500" y="140" width="400" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">tiled, tile size T</text><rect x="540" y="190" width="120" height="120" rx="6" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><rect x="680" y="190" width="120" height="120" rx="6" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="540" y="320" width="120" height="60" rx="6" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="540" y="410" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">each element: N/T HBM reads</text><line x1="460" y1="280" x2="500" y2="280" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="270" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">tile</text><text x="60" y="470" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">T = N: read once from HBM, reuse N times in SRAM. T-limited by shared memory size.</text><text x="60" y="496" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Tile sizes are tuned: torch.compile max-autotune benchmarks them for ~15 minutes.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture tiling slides, original plate. Shell 3: the reuse rule.</text></svg>