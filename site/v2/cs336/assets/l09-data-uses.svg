<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Data scaling for engineering</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Mixtures move intercepts. Repetition holds 4 epochs. Filters loosen with scale.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="104" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">mixtures</text><rect x="60" y="140" width="10" height="104" rx="5" fill="#1F7A72"/><text x="84" y="184" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">slopes stay, intercepts shift. Best mix at small scale = best at large.</text><text x="84" y="210" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">Lesson: interventions move intercepts, rarely slopes.</text><rect x="60" y="260" width="840" height="104" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="284" font-size="14" font-weight="700" fill="#5C6B7A">repetition</text><rect x="60" y="260" width="10" height="104" rx="5" fill="#C46B2C"/><text x="84" y="304" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">up to 4 epochs: no harm. Past it: worse than fresh data. Infinite compute: ensemble.</text><text x="84" y="330" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">Lesson: interventions move intercepts, rarely slopes.</text><rect x="60" y="380" width="840" height="104" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="404" font-size="14" font-weight="700" fill="#5C6B7A">filtering</text><rect x="60" y="380" width="10" height="104" rx="5" fill="#D9E6F5"/><text x="84" y="424" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">small compute: filter hard. Big compute: loosen, or you rerun the same data.</text><text x="84" y="450" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">Lesson: interventions move intercepts, rarely slopes.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture data slides, original plate. Shell 4: slopes are stubborn.</text></svg>