<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The architecture picks the cuts</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">DeepSeek-V3: expert parallel replaces tensor. Llama 3 405B: dense, so tensor splits the layers.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: DeepSeek-V3 -->
<rect x="48" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="172" font-size="18" font-weight="600" fill="#1B2838">DeepSeek-V3</text>
<text x="72" y="196" font-size="14" fill="#5C6B7A">2048 H800s. MoE: experts are the thing that splits.</text>
<g font-size="14" font-weight="500" fill="#1B2838">
<text x="72" y="236">pipeline 16, DualPipe schedule</text>
<text x="72" y="262">expert parallel 64, across 8 nodes</text>
<text x="72" y="288">ZeRO-1 data parallel</text>
<text x="72" y="314">no tensor parallel in training</text>
</g>
<rect x="72" y="336" width="376" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="88" y="362" font-size="14" font-weight="600" fill="#1F7A72">EP replaces TP's job</text>
<text x="88" y="384" font-size="13" fill="#5C6B7A">TP only at inference (TP=4).</text>
<text x="72" y="440" font-size="14" fill="#5C6B7A">Hand-written all-to-all kernels hide</text>
<text x="72" y="462" font-size="14" fill="#5C6B7A">the dispatch traffic.</text>
<!-- right: Llama 3 -->
<rect x="488" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="172" font-size="18" font-weight="600" fill="#1B2838">Llama 3 405B</text>
<text x="512" y="196" font-size="14" fill="#5C6B7A">up to 16,384 H100s. Dense: every param active.</text>
<g font-size="14" font-weight="500" fill="#1B2838">
<text x="512" y="236">tensor parallel 8, in-node [uncertain]</text>
<text x="512" y="262">pipeline parallel 16 [uncertain]</text>
<text x="512" y="288">context parallel for long sequences</text>
<text x="512" y="314">FSDP data parallel across the fleet [uncertain]</text>
</g>
<rect x="512" y="336" width="376" height="64" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="528" y="362" font-size="14" font-weight="600" fill="#1E4D8C">TP is the only layer-split</text>
<text x="528" y="384" font-size="13" fill="#5C6B7A">No experts to split.</text>
<text x="512" y="440" font-size="14" fill="#5C6B7A">The paper names three types of parallelism</text>
<text x="512" y="462" font-size="14" fill="#5C6B7A">but publishes no exact degrees.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: DeepSeek-V3 report, Llama 3 paper, Oct 2026. Degrees [uncertain], not in the papers. Shell 5: the architecture picks the cuts.</text>
</svg>
