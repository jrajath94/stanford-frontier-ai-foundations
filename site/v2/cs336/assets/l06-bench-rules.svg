<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="500" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Benchmark like you mean it</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Warm up. CUDA events. Synchronize. Repeat. Then profile.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="150" width="10" height="52" rx="5" fill="#1F7A72"/><text x="96" y="172" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">1. warm up</text><text x="96" y="194" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">lazy compilation must not pollute timing</text><rect x="70" y="212" width="10" height="52" rx="5" fill="#1F7A72"/><text x="96" y="234" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">2. CUDA events</text><text x="96" y="256" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">record start/end on the device, not the wall</text><rect x="70" y="274" width="10" height="52" rx="5" fill="#C46B2C"/><text x="96" y="296" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">3. synchronize</text><text x="96" y="318" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">GPU is async: sync before reading the clock</text><rect x="70" y="336" width="10" height="52" rx="5" fill="#1F7A72"/><text x="96" y="358" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">4. repeat + average</text><text x="96" y="380" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">variance is real; P95 if you are picky</text><rect x="70" y="398" width="10" height="52" rx="5" fill="#1E4D8C"/><text x="96" y="420" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">5. profile</text><text x="96" y="442" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">profiler names the kernels: time tells you where</text><text x="36" y="476" font-size="14" fill="#5C6B7A">Source: lecture benchmarking slides, original plate. Shell 1: the measurement loop.</text></svg>