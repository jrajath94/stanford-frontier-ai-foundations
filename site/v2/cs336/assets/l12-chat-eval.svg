<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Judging open-ended chat</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Pairwise beats absolute. Judges have biases. Rubrics make it well-defined.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">Chatbot Arena</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#1F7A72"/><text x="84" y="180" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">humans pick A/B, ELO ranking</text><text x="84" y="206" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">real prompts; who are the raters? style vs correctness</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">AlpacaEval</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="290" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">LLM judge vs baseline, win rate</text><text x="84" y="316" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">length bias gamed it; debiased version</text><rect x="60" y="360" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">WildBench</text><rect x="60" y="360" width="10" height="94" rx="5" fill="#D9E6F5"/><text x="84" y="400" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">checklists per prompt</text><text x="84" y="426" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">rubrics scope the judgment</text><text x="60" y="496" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Evaluate the metric too: AlpacaEval correlated 0.98 with Arena. Sycophancy upweights pleasing lies.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture chat-eval slides, original plate. Shell 4: judge the judge.</text></svg>