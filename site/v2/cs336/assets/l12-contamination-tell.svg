<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Contamination has a tell: the order gap</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Same question, answer at A vs C. The order gap betrays memorization.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: clean -->
<rect x="48" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="172" font-size="18" font-weight="600" fill="#1B2838">A model that learned the skill</text>
<g font-size="14" fill="#1B2838">
<text x="72" y="212">correct at A: 68% [illustrative]</text>
<text x="72" y="236">correct at C: 67% [illustrative]</text>
</g>
<rect x="72" y="260" width="376" height="48" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="88" y="292" font-size="18" font-weight="700" fill="#1F7A72">the gap: ~1 point (noise)</text>
<text x="72" y="348" font-size="14" fill="#1B2838">reasoning is order-free:</text>
<text x="72" y="372" font-size="14" fill="#1B2838">Tungsten is Tungsten at A or C.</text>
<!-- right: contaminated -->
<rect x="488" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="172" font-size="18" font-weight="600" fill="#1B2838">A model that learned the test</text>
<g font-size="14" fill="#1B2838">
<text x="512" y="212">correct at A: 81% [illustrative]</text>
<text x="512" y="236">correct at C: 54% [illustrative]</text>
</g>
<rect x="512" y="260" width="376" height="48" rx="8" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="528" y="292" font-size="18" font-weight="700" fill="#C46B2C">the gap: 27 points (the tell)</text>
<text x="512" y="348" font-size="14" fill="#1B2838">memorization is order-specific:</text>
<text x="512" y="372" font-size="14" fill="#1B2838">it learned the question-letter link.</text>
<text x="512" y="420" font-size="14" fill="#5C6B7A">a purely behavioral probe:</text>
<text x="512" y="444" font-size="14" fill="#5C6B7A">no training-data access needed.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture contamination slides, original plate. Shell 4: catches the crude case.</text>
<text x="48" y="566" font-size="13" fill="#5C6B7A">Paraphrased or shuffled training defeats it: detect, report, refresh, privatize.</text>
</svg>
