<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Linear attention: change the complexity class</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: QUADRATIC</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">n^2 x d</text><text x="52" y="186" font-size="14" fill="#1B2838">build the n x n matrix first</text><text x="52" y="216" font-size="14" fill="#1B2838">double the sequence,</text><text x="52" y="246" font-size="14" fill="#1B2838">quadruple the work</text><text x="52" y="300" font-size="14" fill="#1B2838">KV cache: 4 GB per layer</text><text x="52" y="330" font-size="14" fill="#1B2838">at 1M tokens, grows with n</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: STATE S</text><text x="340" y="168" font-size="30" font-weight="700" fill="#1B2838">d x d</text><text x="340" y="200" font-size="14" fill="#5C6B7A">the KV summary</text><text x="340" y="252" font-size="14" fill="#1B2838">34 MB per layer at d=4,096</text><text x="340" y="282" font-size="14" fill="#1B2838">fixed, independent of n</text><text x="340" y="330" font-size="14" fill="#1B2838">100x smaller than the cache</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: LINEAR</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">n x d^2</text><text x="628" y="186" font-size="14" fill="#1B2838">move the parentheses: Q(K^TV)</text><text x="628" y="216" font-size="14" fill="#1B2838">wins when n is bigger than d</text><text x="628" y="268" font-size="14" fill="#1B2838">recurrence: O(d^2) per token,</text><text x="628" y="298" font-size="14" fill="#1B2838">train parallel, infer recurrent</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: dropping softmax is lossy. Forget gates and hybrids carry the quality back.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: quadratic attention. Center: the fixed state. Right: linear cost.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson linear-attention math, original plate. Shell 3: move the parentheses.</text></svg>
