<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">CLIP contrastive: the diagonal pulls, the rest pushes</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">N=4 toy. Eight softmax problems: each row picks its column, each column picks its row. Shell 2. Source: original toy for CLIP.</text>
<!-- 4x4 matrix -->
<g font-size="14">
<!-- row labels -->
<text x="52" y="182" text-anchor="end" fill="#1B2838">I1</text>
<text x="52" y="254" text-anchor="end" fill="#1B2838">I2</text>
<text x="52" y="326" text-anchor="end" fill="#1B2838">I3</text>
<text x="52" y="398" text-anchor="end" fill="#1B2838">I4</text>
<!-- col labels -->
<text x="116" y="120" text-anchor="middle" fill="#1B2838">T1</text>
<text x="188" y="120" text-anchor="middle" fill="#1B2838">T2</text>
<text x="260" y="120" text-anchor="middle" fill="#1B2838">T3</text>
<text x="332" y="120" text-anchor="middle" fill="#1B2838">T4</text>
<!-- cells: diagonal green, off-diagonal gray -->
<rect x="80" y="140" width="72" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<rect x="152" y="140" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="224" y="140" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="296" y="140" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="80" y="212" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="152" y="212" width="72" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<rect x="224" y="212" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="296" y="212" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="80" y="284" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="152" y="284" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="224" y="284" width="72" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<rect x="296" y="284" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="80" y="356" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="152" y="356" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="224" y="356" width="72" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="296" y="356" width="72" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
</g>
<g>
<rect x="416" y="140" width="480" height="280" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="432" y="174" font-size="15" font-weight="600" fill="#1B2838">the count</text>
<text x="432" y="208" font-size="14" fill="#1B2838">4 diagonal cells: positive, pull together.</text>
<text x="432" y="230" font-size="14" fill="#1B2838">12 off-diagonal cells: negative, push apart.</text>
<text x="432" y="264" font-size="14" fill="#1B2838">Scale to N=32,768: each row's softmax runs</text>
<text x="432" y="286" font-size="14" fill="#1B2838">over 32,767 negatives per positive.</text>
<rect x="432" y="308" width="448" height="48" rx="8" fill="#E7F1F8"/>
<text x="656" y="336" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">the batch is the objective</text>
<text x="432" y="392" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">10 days on 256 TPUv3: the loss demanded it</text>
</g>
<line x1="64" y1="496" x2="896" y2="496" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="532" font-size="16" font-weight="500" fill="#1B2838">One claim: the contrastive matrix makes the batch the supervision; shrink the batch and the features go lazy.</text>
<text x="64" y="560" font-size="13" fill="#5C6B7A">Numbers from CLIP: 400M pairs, N=32,768, zero-shot ImageNet beat the 1.2M-label ResNet. No labels were ever used.</text>
</svg>
