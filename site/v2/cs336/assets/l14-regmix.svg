<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">RegMix: learn the mixture</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Swarm of small models -&gt; regression -&gt; optimize -&gt; scale up.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">1. sample mixtures</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#D9E6F5"/><text x="84" y="196" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Dirichlet over domains, train small proxies (300M)</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">2. fit regression</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="296" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">mixture weights -&gt; loss (log-linear works)</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">3. optimize</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="396" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">find the best mixture, train the big model</text><text x="60" y="460" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">Two leaps of faith: the optimum is out-of-distribution for the regressor, and small-scale optima may not transfer.</text><text x="60" y="494" font-size="14" font-weight="700" fill="#1B2838" text-anchor="start">Simulated epoching: downsample small runs so they feel large-scale scarcity.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture RegMix/Olmix slides, original plate. Shell 4: optimize the mix.</text></svg>