<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Granularity: the cost of the wrong unit</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: CHARACTERS</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">22 ints</text><text x="52" y="186" font-size="14" fill="#1B2838">for the 6-word lesson example</text><text x="52" y="216" font-size="14" fill="#1B2838">vocab 100: tiny</text><text x="52" y="246" font-size="14" fill="#1B2838">fertility 3.7 per word</text><text x="52" y="300" font-size="15" font-weight="700" fill="#C46B2C">WORDS: 1M+ vocab</text><text x="52" y="330" font-size="14" fill="#1B2838">over a million parameters</text><text x="52" y="360" font-size="14" fill="#1B2838">per dimension, and OOV</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1F7A72">THE STORED OBJECT: THE CHIP</text><rect x="352" y="160" width="208" height="56" rx="999" fill="#FFFDF8" stroke="#1F7A72" stroke-width="2"/><text x="456" y="195" font-size="17" font-weight="600" fill="#1B2838" text-anchor="middle">" happi"</text><text x="340" y="252" font-size="14" fill="#1B2838">one vocabulary entry</text><text x="340" y="282" font-size="14" fill="#1B2838">one embedding row</text><text x="340" y="312" font-size="14" fill="#1B2838">vocab 50,257, fixed</text><text x="340" y="360" font-size="15" font-weight="700" fill="#1F7A72">nothing is unknown</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: SUBWORDS</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">fertility 1.3</text><text x="628" y="186" font-size="14" fill="#1B2838">tokens per English word</text><text x="628" y="216" font-size="14" fill="#1B2838">50,257 entries: bounded</text><text x="628" y="246" font-size="14" fill="#1B2838">rare words split, never lost</text><text x="628" y="300" font-size="15" font-weight="700" fill="#1B2838">near-word efficiency</text><text x="628" y="330" font-size="14" fill="#1B2838">without the vocab bill</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: the middle path wins. Bounded vocab like characters, efficiency like words.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: the two failures. Center: the unit the model trains on. Right: the fix.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson char/word/subword units, original plate. Shell 1: the granularity question.</text></svg>
