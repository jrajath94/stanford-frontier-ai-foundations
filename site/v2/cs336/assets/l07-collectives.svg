<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Three collectives run training</text><text x="36" y="78" font-size="17" fill="#5C6B7A">All-gather, reduce-scatter, all-reduce. Rank = device. World size = count.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="96" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">all-gather</text><text x="84" y="184" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">each rank&#x27;s piece -&gt; everyone holds everything</text><text x="84" y="210" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">forward: assemble full params</text><rect x="60" y="140" width="10" height="96" rx="5" fill="#1F7A72"/><rect x="60" y="250" width="840" height="96" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">reduce-scatter</text><text x="84" y="294" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">reduce per shard, scatter results</text><text x="84" y="320" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">backward: sum grads, split storage</text><rect x="60" y="250" width="10" height="96" rx="5" fill="#F4E6D4"/><rect x="60" y="360" width="840" height="96" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">all-reduce</text><text x="84" y="404" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">reduce + replicate to all</text><text x="84" y="430" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">= reduce-scatter + all-gather</text><rect x="60" y="360" width="10" height="96" rx="5" fill="#D9E6F5"/><text x="60" y="540" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Broadcast/scatter/gather/reduce are warmups. All-to-all routes tokens to experts in MoE.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture collectives slides, original plate. Shell 3: the three you must know.</text></svg>