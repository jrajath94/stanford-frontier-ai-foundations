<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The lineage deletes: critic, normalizations, warm start</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Each step deletes something and keeps the gains. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the deletions</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">PPO: four networks, 560 GB,</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">37 details, silent bandit</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">the open community: gone</text>
<text x="196" y="332" font-size="14" fill="#1B2838" text-anchor="middle">your PPO is probably</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">not their PPO</text>
<text x="196" y="388" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">learned rewards over-optimize</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">GRPO: delete the critic,</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">group is the baseline</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Dr. GRPO: delete the std,</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">delete the length norm</text>
<text x="472" y="318" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">R1-Zero: delete the SFT</text>
<text x="472" y="340" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">warm start</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">direction never reverses</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the deletions</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">one page of code, no critic,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">no explosions, near-o1</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">the open RLVR wave</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">RLOO, ReMax, REINFORCE++:</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">the critic-free family argues</text>
<text x="756" y="376" font-size="14" fill="#1B2838" text-anchor="middle">the details</text>
<text x="756" y="398" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">still bandit-shaped only</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">GRPO's home is the bandit: verifiable reward, many cheap rollouts per prompt; PPO stays the general hammer.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Kimi's squared-loss derivation landing on the same update is convergent evidence: the group mean is the natural baseline.</text>
</g>
</svg>
