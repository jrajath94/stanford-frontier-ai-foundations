<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Cache-aware disaggregation</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Route by cache hit rate. Two lines of code, 40% faster.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the routing</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">fresh request (book paste, low cache hits) -&gt; one GPU pool</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">warm conversation (mid-chat) -&gt; another pool. Never mix them.</text><rect x="60" y="296" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">the logic</text><text x="84" y="344" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">10-turn conversations mean ~10% of requests are fresh and expensive</text><text x="84" y="370" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">up to 40% faster serving from this routing alone</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: guest lecture disaggregation slides, original plate. Shell 3: routing.</text></svg>