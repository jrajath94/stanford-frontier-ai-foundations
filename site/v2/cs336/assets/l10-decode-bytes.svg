<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">One decode step: 140GB in, one token out</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">70B in bf16 on an H100. The step reads all parameters plus the cache. 42ms at 3.35 TB/s.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: the reads -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">READ: batch 1, 4K context</text>
<g font-size="14" fill="#1B2838">
<rect x="72" y="184" width="336" height="64" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="88" y="210" font-weight="600">parameters: 140GB</text>
<text x="88" y="232" fill="#5C6B7A">70B x 2 bytes</text>
<rect x="72" y="256" width="336" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="88" y="282" font-weight="600">KV cache: 1.3GB</text>
<text x="88" y="304" fill="#5C6B7A">80 x 8 x 128 x 2 x 2B x 4096</text>
</g>
<text x="72" y="360" font-size="14" fill="#1B2838">WRITE: one token.</text>
<text x="72" y="392" font-size="14" fill="#5C6B7A">the cache is 1% of the traffic:</text>
<text x="72" y="414" font-size="14" fill="#5C6B7A">at batch 1 the parameters dominate.</text>
<text x="72" y="452" font-size="14" font-weight="600" fill="#C46B2C">a memory copy with a little math</text>
<!-- center -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: the time -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">TIME: 141GB at 3.35 TB/s</text>
<text x="504" y="204" font-size="18" font-weight="700" fill="#1B2838">42ms per token = 24 tok/s</text>
<text x="504" y="240" font-size="14" fill="#5C6B7A">nothing about a faster matmul helps:</text>
<text x="504" y="262" font-size="14" fill="#5C6B7A">the matmul units are idle.</text>
<rect x="504" y="288" width="384" height="96" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="520" y="316" font-size="14" font-weight="600" fill="#1F7A72">batch 64: cache = 85GB</text>
<text x="520" y="340" font-size="14" fill="#1B2838">per step: 225GB for 64 tokens</text>
<text x="520" y="364" font-size="14" font-weight="600" fill="#1B2838">955 tok/s total, 15 tok/s per seq</text>
<text x="504" y="424" font-size="14" fill="#1B2838">Batching amortizes the parameter read.</text>
<text x="504" y="448" font-size="14" fill="#5C6B7A">Past B=108 the cache dominates:</text>
<text x="504" y="470" font-size="14" fill="#5C6B7A">throughput asymptotes to bandwidth / cache-per-token.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture decode example, original plate. Shell 2: fewer bytes per step, or more bytes per second.</text>
</svg>
