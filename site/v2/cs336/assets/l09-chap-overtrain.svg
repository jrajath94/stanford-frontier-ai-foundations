<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: overtrain for serving</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The cheapest model to train is expensive to serve. Source: lecture serving sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the ratio</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">train at 20:1, ship big</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">training-optimal model:</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">big, capable, pricey per token</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">serving FLOPs dwarf</text>
<text x="180" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">training FLOPs</text>
<text x="180" y="362" text-anchor="middle" font-size="14" fill="#5C6B7A">over the model's life</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">tokens per parameter</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">GPT-3: 3 (undertrained)</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">Chinchilla: 20 (research)</text>
<text x="480" y="264" text-anchor="middle" font-size="14" fill="#1B2838">modern: 100+ (deliberate)</text>
<text x="480" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the ratio answers how to spend</text>
<text x="480" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">a training budget,</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">not what model to ship</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">serve small, train long</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">Qwen 3: 153 tok/param</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">Llama 3: 39, V3: 22</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">capability per</text>
<text x="780" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">serving dollar</text>
<text x="780" y="362" text-anchor="middle" font-size="14" fill="#5C6B7A">test-time compute: the third</text>
<text x="780" y="386" text-anchor="middle" font-size="14" fill="#5C6B7A">dial (N, D, thinking)</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: extra training compute now for cheaper serving forever.</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">The economic optimum pushes past 20 whenever serving savings exceed training cost.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">Chinchilla's importance is not the number. It is the method: fix the budget, sweep the tradeoff, join the minima.</text>
</svg>
