<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: Kaplan vs Chinchilla</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The details decided: N^0.27 vs N^0.5. Source: Kaplan et al. 2020, Hoffmann et al. 2022.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the details</text>
<text x="336" y="124">the stored object: the three misses</text>
<text x="648" y="124">WITH the details</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">Kaplan 2020</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#1B2838">N ~ C^0.27, D ~ C^0.73</text>
<text x="180" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">train giants</text>
<text x="180" y="312" text-anchor="middle" font-size="14" fill="#5C6B7A">the GPT-3 era listened</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">GPT-3: 3 tokens per param,</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">undertrained</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">why Kaplan lost</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">excluded unembedding params</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">warmup too short for small models</text>
<text x="480" y="264" text-anchor="middle" font-size="14" fill="#1B2838">fixed a suboptimal batch size</text>
<text x="480" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">minor details, big shifts</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">Epoch AI refit method 3:</text>
<text x="480" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">it agrees with 1 and 2</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">Chinchilla 2022</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">N ~ C^0.5, D ~ C^0.5</text>
<text x="780" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">20 tokens per param</text>
<text x="780" y="312" text-anchor="middle" font-size="14" fill="#5C6B7A">three methods agreed:</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">envelope, IsoFLOP, parametric</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#1B2838">IsoFLOP is the default</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">you reach for</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: 20:1 is training-optimal, not serving-optimal. The lesson is the method, not the number.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Exponents are fit, not derived: treat them as recipe lower bounds, not physics.</text>
</svg>
