<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The 50-epoch trap: equal weights epoch the small pool</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">10T low-quality plus 10B high-quality, 1T training budget. Shell 3. Source: original toy for the lecture's trap.</text>
<!-- left: before -->
<g>
<rect x="64" y="136" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: equal weights</text>
<rect x="80" y="186" width="232" height="24" rx="4" fill="#E6E2DA"/>
<text x="196" y="204" font-size="13" fill="#1B2838" text-anchor="middle">10T low-quality</text>
<rect x="80" y="216" width="6" height="24" rx="4" fill="#E7F1F8"/>
<text x="120" y="234" font-size="13" fill="#1B2838">10B high-quality</text>
<text x="196" y="268" font-size="14" fill="#1B2838" text-anchor="middle">each source gets 500B tokens:</text>
<text x="196" y="290" font-size="14" fill="#1B2838" text-anchor="middle">500B drawn from the 10B pool</text>
<rect x="96" y="306" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="334" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">50 epochs, silently</text>
<text x="196" y="390" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">best case: wasted compute</text>
<text x="196" y="412" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">worst case: memorized, overfit</text>
</g>
<!-- chevron -->
<polygon points="336,270 352,278 336,286" fill="#1B2838"/>
<!-- center: the rule -->
<g>
<rect x="360" y="136" width="240" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="376" y="186" width="208" height="96" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="212" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">epochs = (budget x share)</text>
<text x="480" y="234" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">divided by pool size</text>
<text x="480" y="256" font-size="13" fill="#1B2838" text-anchor="middle">share is the weight, not the size</text>
<text x="480" y="308" font-size="14" fill="#1B2838" text-anchor="middle">the 10T pool sees 0.05 epochs.</text>
<text x="480" y="330" font-size="14" fill="#1B2838" text-anchor="middle">equal is not fair.</text>
<text x="480" y="372" font-size="14" fill="#1B2838" text-anchor="middle">if any source exceeds</text>
<text x="480" y="394" font-size="14" fill="#1B2838" text-anchor="middle">about 4 epochs, reweight</text>
</g>
<!-- chevron -->
<polygon points="608,270 624,278 608,286" fill="#1B2838"/>
<!-- right: after -->
<g>
<rect x="632" y="136" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="764" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: UniMax</text>
<text x="764" y="204" font-size="14" fill="#1B2838" text-anchor="middle">cap every source at 4 epochs:</text>
<text x="764" y="226" font-size="14" fill="#1B2838" text-anchor="middle">40B tokens from the 10B pool</text>
<rect x="664" y="248" width="200" height="48" rx="8" fill="#E7F4EF"/>
<text x="764" y="276" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">4 epochs, deliberate</text>
<text x="764" y="320" font-size="14" fill="#1B2838" text-anchor="middle">freed budget reallocates</text>
<text x="764" y="342" font-size="14" fill="#1B2838" text-anchor="middle">to the uncapped sources</text>
<text x="764" y="396" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">diversity survives the budget</text>
</g>
<line x1="64" y1="488" x2="896" y2="488" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="520" font-size="16" font-weight="500" fill="#1B2838">One claim: equal weights silently epoch the small pool 50 times;</text>
<text x="64" y="544" font-size="16" font-weight="500" fill="#1B2838">the epoch arithmetic is the cheapest QA in the pipeline.</text>
<text x="64" y="570" font-size="13" fill="#5C6B7A">Numbers computed: 1T / 2 = 500B per source; 500B/10B = 50 epochs; 500B/10T = 0.05 epochs.</text>
<text x="64" y="590" font-size="13" fill="#5C6B7A">4 x 10B = 40B capped tokens, 4% of the budget.</text>
</svg>
