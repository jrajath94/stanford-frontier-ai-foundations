<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Same game, bigger hierarchy</text><text x="36" y="78" font-size="17" fill="#5C6B7A">What was slow last week is fast this week. Orchestrate to avoid data bottlenecks.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="150" width="830" height="60" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="178.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="150" width="10" height="60" rx="5" fill="#1F7A72"/><text x="96" y="174" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">shared / L1</text><text x="96" y="196" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">registers, SM-local</text><text x="860" y="188" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="end">fastest</text><rect x="70" y="220" width="830" height="60" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="220" width="10" height="60" rx="5" fill="#D9E6F5"/><text x="96" y="244" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">HBM</text><text x="96" y="266" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">was slow, now fast</text><text x="860" y="258" font-size="15" font-weight="700" fill="#D9E6F5" text-anchor="end">8 TB/s</text><rect x="70" y="290" width="830" height="60" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="318.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="290" width="10" height="60" rx="5" fill="#F4E6D4"/><text x="96" y="314" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">NVLink / NVSwitch</text><text x="96" y="336" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">~4x slower than HBM</text><text x="860" y="328" font-size="15" font-weight="700" fill="#F4E6D4" text-anchor="end">1.8 TB/s</text><rect x="70" y="360" width="830" height="60" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="388.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="360" width="10" height="60" rx="5" fill="#C46B2C"/><text x="96" y="384" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">InfiniBand</text><text x="96" y="406" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">GPU -&gt; PCIe -&gt; IB</text><text x="860" y="398" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="end">much slower</text><rect x="70" y="430" width="830" height="60" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="458.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="430" width="10" height="60" rx="5" fill="#F3D9D9"/><text x="96" y="454" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">Ethernet</text><text x="96" y="476" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">via CPU socket buffer</text><text x="860" y="468" font-size="15" font-weight="700" fill="#F3D9D9" text-anchor="end">slowest</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture hierarchy slide, original plate. Shell 2: distance = cost.</text></svg>