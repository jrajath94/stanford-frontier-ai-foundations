<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="640" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">PPO's pains: the tax and the silent bandit</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Four networks in memory, 37 details in the code, one gamma that quietly kills the critic. Shell 3. Source: original toy for the lecture's PPO section.</text>
<g>
<rect x="64" y="136" width="416" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="170" font-size="15" font-weight="600" fill="#1B2838">pain 1: the four-network tax</text>
<text x="80" y="204" font-size="14" fill="#1B2838">policy plus reference plus reward</text>
<text x="80" y="226" font-size="14" fill="#1B2838">plus value network, each model-sized</text>
<rect x="80" y="248" width="384" height="48" rx="8" fill="#E6E2DA"/>
<text x="272" y="276" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">70B: 560 GB before optimizers</text>
<text x="80" y="330" font-size="13" fill="#5C6B7A">the value net is the resented one:</text>
<text x="80" y="350" font-size="13" fill="#5C6B7A">a model's memory for a baseline</text>
</g>
<g>
<rect x="496" y="136" width="400" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="170" font-size="15" font-weight="600" fill="#1B2838">pain 2: the silent bandit</text>
<text x="512" y="204" font-size="14" fill="#1B2838">gamma = lambda = 1: no discount,</text>
<text x="512" y="226" font-size="14" fill="#1B2838">no bootstrapping</text>
<rect x="512" y="248" width="368" height="48" rx="8" fill="#F4E6D4"/>
<text x="696" y="276" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">the critic learns nothing</text>
<text x="512" y="330" font-size="13" fill="#5C6B7A">each rollout is one arm, the reward</text>
<text x="512" y="350" font-size="13" fill="#5C6B7A">is the payout. No error, no warning.</text>
</g>
<g>
<rect x="64" y="384" width="832" height="120" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="80" y="418" font-size="15" font-weight="600" fill="#1B2838">pain 3: the 37 details</text>
<text x="80" y="450" font-size="14" fill="#1B2838">Advantage normalization, value-loss clipping, entropy bonuses, KL schedules: libraries disagree, many implementations are wrong.</text>
<text x="80" y="478" font-size="14" font-weight="500" fill="#1B2838">A wrong baseline does not slow training: it optimizes a different objective.</text>
</g>
<line x1="64" y1="552" x2="896" y2="552" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="588" font-size="16" font-weight="500" fill="#1B2838">One claim: the pseudocode fits on a slide; the memory, the details, and the silent bandit do not.</text>
<text x="64" y="616" font-size="13" fill="#5C6B7A">The field's fix: delete PPO. GRPO drops the critic; the group of rollouts is a free baseline.</text>
</svg>
