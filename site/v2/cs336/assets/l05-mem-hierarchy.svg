<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The memory hierarchy is the whole game</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Registers are free. Global memory is 10x L1. Respect the ladder.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="150" width="300" height="64" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="390" y="178" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">registers</text><text x="390" y="202" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">~1 cycle  -  per thread</text><rect x="70" y="238" width="260" height="64" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="350" y="266" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">L1 / shared</text><text x="350" y="290" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">20-30 cycles  -  per SM, programmable</text><rect x="70" y="326" width="220" height="64" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="310" y="354" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">L2 cache</text><text x="310" y="378" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">~200 cycles  -  on chip</text><rect x="70" y="414" width="180" height="64" rx="8" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="270" y="442" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">HBM global</text><text x="270" y="466" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">~10x L1  -  off chip, 80-144 GB</text><text x="70" y="500" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">SRAM is hundreds of times more expensive than DRAM. Hence the hierarchy.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture memory slides (A100 latencies), original plate. Shell 2: name the latencies.</text></svg>