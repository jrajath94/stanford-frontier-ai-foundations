<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Softmax: one row per block</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Row fits: direct. Row too long: loop over tiles with an accumulator.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">row fits in block</text><text x="84" y="190" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">blocksize = next pow2(cols)</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">max, sub, exp, sum, div</text><text x="84" y="242" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">masked -inf past the tail</text><text x="84" y="280" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">looks like PyTorch</text><rect x="500" y="140" width="400" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">row too long: tiles</text><text x="524" y="190" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">tile 0: cols 0-3</text><text x="524" y="216" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">tile 1: cols 4-7 ...</text><text x="524" y="242" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">accumulator += tile</text><text x="524" y="280" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">for loop inside the block</text><line x1="460" y1="250" x2="500" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">loop</text><text x="60" y="420" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Naive PyTorch softmax: 5MN reads + 3MN writes. Triton: 1 read + 1 write per row.</text><text x="60" y="446" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Blocks, not threads: the row is the unit. Tiles handle the overflow.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture softmax slides, original plate. Shell 4: the reduction pattern.</text></svg>