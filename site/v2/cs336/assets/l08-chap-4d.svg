<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the 4D prescription</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Minimize model parallel, maximize data parallel. Source: lecture prescription sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the order</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one cut at a time</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">DDP alone: 112GB, dead</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">TP alone: stops at 8</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">red in every row</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">no strategy dominates</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">batch too small: GPUs starve</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">batch too big: past B_crit</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">1. fit the model</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">TP or EP of 8, in the fast node</text>
<text x="480" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">2. cross the nodes</text>
<text x="480" y="272" text-anchor="middle" font-size="14" fill="#1B2838">pipeline or ZeRO-3 on slow links</text>
<text x="480" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">3. spend the rest</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">data parallel: maximize it</text>
<text x="480" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">4. long sequences</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#1B2838">context parallel, ring attention</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">the blend in the wild</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">OLMo 7B: FSDP only</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">V3: EP64 + PP16</text>
<text x="780" y="264" text-anchor="middle" font-size="14" fill="#1B2838">Llama3: TP8 PP16 DP128</text>
<text x="780" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1F7A72">accumulation restores</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#1F7A72">small-batch utilization</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">recompute buys batch size</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">buys utilization</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: all three cuts tax the engineer. 148 GPU failures in 54 days: at frontier scale, reliability is half the job.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">The prescription is a starting point, not a proof. The roofline tells you when to add a dimension.</text>
</svg>
