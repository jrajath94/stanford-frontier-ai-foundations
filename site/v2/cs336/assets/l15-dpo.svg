<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">DPO: RLHF without the RL</text><text x="36" y="78" font-size="17" fill="#5C6B7A">No reward model, no sampling. Just gradients: up on good, down on bad.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the derivation (one assumption)</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">assume the policy can be anything -&gt; closed form: tilt reference by reward</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">solve for the implied reward, plug into Bradley-Terry -&gt; DPO loss</text><rect x="60" y="306" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="330" font-size="14" font-weight="700" fill="#5C6B7A">the gradient intuition</text><text x="84" y="354" font-size="15" font-weight="700" fill="#F4E6D4" text-anchor="start">increase likelihood of the winner, decrease the loser</text><text x="84" y="380" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">step size scales with surprise: wrong predictions move more</text><text x="60" y="480" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">DPO vs PPO: fragile, setup-dependent. Variants (SimPO, length-norm) barely matter.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture DPO slides, original plate. Shell 3: the simplification.</text></svg>