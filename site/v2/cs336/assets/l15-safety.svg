<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Safety: the last line of defense</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Balance violation rate against false refusals.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the tradeoff</text><text x="84" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">&#x27;how do I kill a Python process&#x27; must not refuse</text><text x="84" y="212" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">few thousand examples (Llama 2). OLMo mined WildChat: 50k.</text><text x="60" y="290" font-size="16" font-weight="700" fill="#1F7A72" text-anchor="start">500 examples is surgical: malicious-instruction rate drops dramatically.</text><text x="60" y="324" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">But fine-grained safety needs large-scale collection anyway.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture safety slides, original plate. Shell 2: the tradeoff.</text></svg>