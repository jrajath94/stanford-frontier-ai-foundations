<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the decode wall</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Decode intensity ~1: only a smaller cache lowers the wall. Source: lecture intensity sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the intensity</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">intensity ~1 in decode</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">thin matvecs, one token at a time</text>
<text x="180" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">H100 needs ~295</text>
<text x="180" y="312" text-anchor="middle" font-size="14" fill="#5C6B7A">generation sits 300x below</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">batching cannot fix attention:</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">each sequence owns its cache</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">the chip waits on memory</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">MLP: B x T. Attention: ST/(S+T)</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">prefill: S/2, workable</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">generation: S/(S+1) ~ 1</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">shrink the cache:</text>
<text x="480" y="312" text-anchor="middle" font-size="14" fill="#1B2838">GQA, MLA 57x, CLA, sliding window</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">KIVI 2-bit, FP8 cache</text>
<text x="480" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">check beats generate:</text>
<text x="480" y="408" text-anchor="middle" font-size="14" fill="#1B2838">speculative decoding, K=3-4</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">less memory, more speed</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">MLA: 64KB to 1.1KB per token</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">128K context: 480GB to 8.4GB</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">impossible to routine</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">spend the savings on batch:</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">GQA fits batch 256</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">spec decode: 3.3x if all accept,</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#1B2838">exact samples, guaranteed</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: every shrink trades something. MLA complicates RoPE.</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">Sliding windows hurt accuracy alone. Quantization needs calibration.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">Speculative decoding is a net loss with a bad draft. The draft's origin moves r, and r moves the speedup.</text>
</svg>
