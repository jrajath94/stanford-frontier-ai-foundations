<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">RLVR: rewards you cannot over-optimize</text><text x="36" y="78" font-size="17" fill="#5C6B7A">RLHF rewards are learned and hackable. Verifiable rewards are not.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the RLHF ceiling</text><text x="84" y="188" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">push a learned reward model hard -&gt; overfit it. Compute stops helping.</text><rect x="60" y="296" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">the RLVR bet</text><text x="84" y="344" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">math and code have checkable answers. Optimize the real objective.</text><text x="84" y="370" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">AlphaGo worked because the win condition was exact. Same idea.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture RLVR-motivation slides, original plate. Shell 1: the bet.</text></svg>