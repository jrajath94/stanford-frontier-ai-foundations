<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: Muon</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Orthogonalize the update: every spectral direction to unit size. Source: lecture Muon sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the update</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">Adam: per-coordinate</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">m / sqrt(v): a million tiny</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">independent scalings</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">coordinates are arbitrary</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">the basis has no geometry</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">NanoGPT speedrun: big win;</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">at scale the gap shrank</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">momentum, then Newton-Schultz</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">5 iterations of matmuls, no SVD</text>
<text x="480" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">U S V' to U V':</text>
<text x="480" y="280" text-anchor="middle" font-size="14" fill="#1B2838">all singular values to 1</text>
<text x="480" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the family tree:</text>
<text x="480" y="352" text-anchor="middle" font-size="14" fill="#1B2838">SGD, Adam, AdamW, Lion, Muon,</text>
<text x="480" y="376" text-anchor="middle" font-size="14" fill="#1B2838">SOAP/Shampoo: what the update</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#1B2838">normalizes, and what it costs</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">spectral Adam</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">the update's shape preserved,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">only scale normalized</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">Kimi K2: works at scale</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">vector params keep AdamW</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#1B2838">watch both axes: compute</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">and the Chinchilla ratio</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: beating Adam at scale is unproven (no Kimi K2 ablation). 5 extra matmuls per step, GPU-friendly.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Tune the baseline first: an under-tuned Adam manufactures fake wins for anything.</text>
</svg>
