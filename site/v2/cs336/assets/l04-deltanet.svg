<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Gated delta net: erase before you write</text><text x="36" y="78" font-size="17" fill="#5C6B7A">(I - beta k k^T) projects out the old key direction.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="170" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">state update</text><text x="84" y="195" font-size="18" font-weight="700" fill="#1B2838" text-anchor="start">S_t = gamma(t) S_{t-1} (I - beta(t) k_t k_t^T) + beta(t) k_t v_t^T</text><text x="84" y="240" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">gamma: forget gate.  beta: input gate.  (I - beta k k^T): erase old key.</text><text x="84" y="266" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">Writing k_t? First remove what the state already stored along k_t.</text><rect x="60" y="340" width="410" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">LSTM parallel</text><text x="84" y="386" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">forget gate + input gate</text><text x="84" y="412" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">same principles, new derivation</text><rect x="490" y="340" width="410" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="504" y="364" font-size="14" font-weight="700" fill="#5C6B7A">in the wild</text><text x="514" y="386" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">Qwen 3.5 / Qwen Next: 3:1 hybrid</text><text x="514" y="412" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">strong quality, strong throughput</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture SSM slides, original plate. Shell 4: the projector.</text></svg>