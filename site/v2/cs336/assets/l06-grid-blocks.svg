<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Think in blocks, not threads</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Grid of blocks. Block on one SM. Threads share its memory.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">GRID: launch a grid of thread blocks</text><rect x="110" y="200" width="170" height="100" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="195.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">block 0</text><text x="195.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">one SM</text><rect x="310" y="200" width="170" height="100" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="395.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">block 1</text><text x="395.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">one SM</text><rect x="510" y="200" width="170" height="100" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="595.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">block 2</text><text x="595.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">one SM</text><rect x="710" y="200" width="170" height="100" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="795.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">block 3</text><text x="795.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">one SM</text><rect x="60" y="370" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">inside one block</text><rect x="110" y="410" width="130" height="60" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="175.0" y="438.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">threads</text><text x="175.0" y="458.0" font-size="12" fill="#5C6B7A" text-anchor="middle">32 = warp</text><rect x="280" y="410" width="200" height="60" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="380.0" y="438.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">shared memory</text><text x="380.0" y="458.0" font-size="12" fill="#5C6B7A" text-anchor="middle">block-local</text><rect x="520" y="410" width="130" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="585.0" y="438.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">registers</text><text x="585.0" y="458.0" font-size="12" fill="#5C6B7A" text-anchor="middle">per thread</text><text x="680" y="445" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">HBM: global to all</text><text x="60" y="530" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Why blocks: softmax and matmul need threads to talk. Blocks share memory. Threads alone cannot.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture programming-model slides, original plate. Shell 4: the block symbol.</text></svg>