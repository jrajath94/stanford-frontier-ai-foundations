<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Tiling: reuse is the whole game</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: NAIVE MATMUL</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">each element read N times</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">from HBM, never reused</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">epilogue costs a pass</text><text x="52" y="270" font-size="14" fill="#1B2838">ReLU after the matmul:</text><text x="52" y="300" font-size="14" fill="#1B2838">another full HBM round trip</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: THE C TILE</text><rect x="340" y="152" width="120" height="96" rx="8" fill="#FFFDF8" stroke="#1E4D8C" stroke-width="2"/><text x="400" y="204" font-size="16" font-weight="700" fill="#1B2838" text-anchor="middle">C tile</text><text x="340" y="280" font-size="14" fill="#1B2838">one block owns one tile,</text><text x="340" y="310" font-size="14" fill="#1B2838">accumulates in shared memory</text><text x="340" y="358" font-size="14" fill="#1B2838">sweep k tiles of A, B</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: TILED</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">N/T reads</text><text x="628" y="186" font-size="14" fill="#1B2838">T fast shared reads each</text><text x="628" y="216" font-size="14" fill="#1B2838">epilogue fuses free:</text><text x="628" y="246" font-size="14" fill="#1B2838">ReLU before the store</text><text x="628" y="300" font-size="14" fill="#1B2838">returns in FlashAttention</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: tile size is set by shared memory. Bigger tiles, fewer passes.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: naive reads. Center: the accumulator tile. Right: tiled reuse.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson matmul slides, original plate. Shell 5: tiling returns.</text></svg>
