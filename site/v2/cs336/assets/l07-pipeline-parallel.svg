<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Pipeline parallel: split the layers</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Each rank owns some layers. Micro-batches shrink the idle bubbles.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">4 ranks, 4 layer groups</text><rect x="100" y="170" width="170" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="185.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">rank 0</text><text x="185.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">layers 0</text><rect x="300" y="170" width="170" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="385.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">rank 1</text><text x="385.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">layers 1</text><rect x="500" y="170" width="170" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="585.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">rank 2</text><text x="585.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">layers 2</text><rect x="700" y="170" width="170" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="785.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">rank 3</text><text x="785.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">layers 3</text><line x1="270" y1="30" x2="205" y2="30" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="237.5" y="20" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><line x1="470" y1="30" x2="205" y2="30" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="337.5" y="20" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><line x1="670" y1="30" x2="205" y2="30" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="437.5" y="20" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><rect x="60" y="310" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="334" font-size="14" font-weight="700" fill="#5C6B7A">micro-batches</text><text x="84" y="360" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">batch -&gt; micro-batches: send activations forward, grads backward (send/recv)</text><text x="84" y="386" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">bubble: rank idle while waiting on neighbors. More micro-batches = smaller bubbles.</text><text x="84" y="412" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">overlap comm + compute: receive while computing</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture pipeline slides, original plate. Shell 4: bubbles are the tax.</text></svg>