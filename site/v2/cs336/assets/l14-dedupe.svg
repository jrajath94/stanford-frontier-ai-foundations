<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Deduplication</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Exact and near. Waste flops, memorize copyrighted text, or both.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">exact</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#D9E6F5"/><text x="84" y="204" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">hash, remove all but one. C4: 3-sentence spans (breaks coherence!)</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">near</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="314" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Jaccard &gt; 0.99 via MinHash LSH. Licenses, headers, templates</text><rect x="60" y="360" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">the exhibit</text><rect x="60" y="360" width="10" height="94" rx="5" fill="#C46B2C"/><text x="84" y="424" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">one gas mask description appeared 61,000 times in C4</text><text x="60" y="496" font-size="14" font-weight="700" fill="#1B2838" text-anchor="start">Dedupe across the whole dataset, not per source. Decontaminate the test set too.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture dedup slides, original plate. Shell 3: stop repeating yourself.</text></svg>