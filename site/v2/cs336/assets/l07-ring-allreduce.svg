<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The ring all-reduce moves 2x the data</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">n-1 reduce-scatter steps, n-1 all-gather steps. Each rank moves 2(n-1)/n of the data.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: before, 4 ranks on a ring, each holding 4MB in 1MB chunks -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">BEFORE: 4 ranks, 4MB each</text>
<g font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">
<rect x="72" y="184" width="160" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="152" y="206">rank 0</text><text x="152" y="226" fill="#5C6B7A">4 x 1MB chunks</text>
<rect x="248" y="184" width="160" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="328" y="206">rank 1</text><text x="328" y="226" fill="#5C6B7A">4 x 1MB chunks</text>
<rect x="72" y="256" width="160" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="152" y="278">rank 2</text><text x="152" y="298" fill="#5C6B7A">4 x 1MB chunks</text>
<rect x="248" y="256" width="160" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="328" y="278">rank 3</text><text x="328" y="298" fill="#5C6B7A">4 x 1MB chunks</text>
</g>
<text x="72" y="348" font-size="14" fill="#5C6B7A">each rank sends one chunk right,</text>
<text x="72" y="370" font-size="14" fill="#5C6B7A">adds the chunk from its left.</text>
<text x="72" y="392" font-size="14" fill="#5C6B7A">Circle the ring: no rank idles.</text>
<text x="72" y="428" font-size="14" font-weight="600" fill="#C46B2C">reduce-scatter: 3 steps x 1MB</text>
<text x="72" y="452" font-size="14" font-weight="600" fill="#C46B2C">all-gather: 3 more steps x 1MB</text>
<!-- center: arrow -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: after -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">AFTER: every rank moved 6MB</text>
<g font-size="14" font-weight="500" fill="#1B2838">
<text x="504" y="204">per rank: 6 steps x 1MB = 6MB</text>
<text x="504" y="232">formula: 2 x (n-1)/n x size</text>
<text x="504" y="260">2 x 3/4 x 4MB = 6MB</text>
</g>
<rect x="504" y="288" width="384" height="72" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="520" y="316" font-size="14" font-weight="600" fill="#1F7A72">(n-1)/n converges to 1 as n grows</text>
<text x="520" y="340" font-size="14" fill="#1B2838">each rank moves about 2x the data,</text>
<text x="504" y="396" font-size="14" fill="#1B2838">no matter how many ranks join.</text>
<text x="504" y="428" font-size="14" font-weight="600" fill="#1B2838">Bandwidth is independent of world size.</text>
<text x="504" y="456" font-size="14" fill="#5C6B7A">The lecture's 400GB/s held for all-reduce</text>
<text x="504" y="476" font-size="14" fill="#5C6B7A">and reduce-scatter alike.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture all-reduce toy, original plate. Shell 3: the ring is bandwidth-optimal by construction.</text>
</svg>
