<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">ELO is a ledger, not a score</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">The upset is worth more because it was worth less. K=32.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: upset -->
<rect x="48" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">THE UPSET</text>
<g font-size="15" fill="#1B2838">
<text x="72" y="208">underdog beats the favorite:</text>
<text x="72" y="232">expected 0.24, observed 1.0</text>
</g>
<rect x="72" y="256" width="376" height="48" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="88" y="288" font-size="18" font-weight="700" fill="#1F7A72">gains 32 x (1 - 0.24) = 24</text>
<text x="72" y="332" font-size="14" fill="#1B2838">the winner takes points</text>
<text x="72" y="356" font-size="14" fill="#1B2838">proportional to the surprise.</text>
<text x="72" y="404" font-size="14" fill="#5C6B7A">the loss confirms the system:</text>
<text x="72" y="428" font-size="14" fill="#5C6B7A">almost nothing moves.</text>
<!-- right: favorite -->
<rect x="488" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="168" font-size="14" font-weight="600" fill="#5C6B7A">THE EXPECTED</text>
<g font-size="15" fill="#1B2838">
<text x="512" y="208">favorite wins, as expected:</text>
<text x="512" y="232">expected 0.76, observed 1.0</text>
</g>
<rect x="512" y="256" width="376" height="48" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="528" y="288" font-size="18" font-weight="700" fill="#1E4D8C">gains 32 x (1 - 0.76) = 8</text>
<text x="512" y="332" font-size="14" fill="#1B2838">confirming expectations</text>
<text x="512" y="356" font-size="14" fill="#1B2838">earns little.</text>
<text x="512" y="404" font-size="14" font-weight="600" fill="#1B2838">a rating is a weighted history</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture ELO slides, original plate. Shell 3: ELO assumes one rating per player;</text>
<text x="48" y="566" font-size="13" fill="#5C6B7A">style and matchups confound it. Win rates hide strength of schedule.</text>
</svg>
