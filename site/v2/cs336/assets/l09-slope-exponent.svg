<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The slope is the exponent</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Mean estimation: slope -1. Neural nets: slope about -0.1. Read the line, know the learner.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: steep line -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">STEEP: slope -1</text>
<text x="72" y="194" font-size="14" fill="#1B2838">Gaussian mean: error = sigma&#178;/n</text>
<line x1="96" y1="440" x2="384" y2="240" stroke="#1E4D8C" stroke-width="3"/>
<text x="96" y="472" font-size="13" fill="#5C6B7A">log n &#8594;</text>
<text x="72" y="240" font-size="13" fill="#5C6B7A">log error</text>
<rect x="72" y="380" width="336" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="88" y="404" font-size="14" font-weight="600" fill="#1E4D8C">double the data: halve the error</text>
<text x="88" y="426" font-size="13" fill="#5C6B7A">parametric: the truth is a few numbers</text>
<!-- center rule -->
<rect x="448" y="136" width="64" height="360" rx="12" fill="#F7F4EE"/>
<text x="480" y="300" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">log(error) =</text>
<text x="480" y="324" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">log(C) - alpha log(n)</text>
<!-- right: shallow line -->
<rect x="528" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="552" y="168" font-size="14" font-weight="600" fill="#5C6B7A">SHALLOW: slope about -0.1</text>
<text x="552" y="194" font-size="14" fill="#1B2838">neural nets: -0.1 to -0.3</text>
<line x1="576" y1="400" x2="864" y2="340" stroke="#C46B2C" stroke-width="3"/>
<text x="576" y="472" font-size="13" fill="#5C6B7A">log n &#8594;</text>
<rect x="552" y="380" width="336" height="56" rx="8" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="568" y="404" font-size="14" font-weight="600" fill="#C46B2C">double the data: error falls 7%</text>
<text x="568" y="426" font-size="13" fill="#5C6B7A">2^0.1 = 1.07x: the price of flexibility</text>
<text x="552" y="464" font-size="13" fill="#5C6B7A">nonparametric-like, ~10 dimensions</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture stats slides, original plate. Shell 2: steeper line, faster learning.</text>
</svg>
