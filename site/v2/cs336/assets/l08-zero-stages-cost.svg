<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">ZeRO: memory falls, cost stays 2P until stage 3</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">7B on 8 A100s at 16 bytes/param. DDP: 112GB per GPU, dead. Stage 3: 3P, and 50B fits.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<g font-size="14" font-weight="500" fill="#1B2838">
<rect x="48" y="136" width="204" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="150" y="168" text-anchor="middle" font-weight="600">DDP</text>
<text x="150" y="196" text-anchor="middle" fill="#C46B2C" font-weight="700">112GB / GPU</text>
<text x="150" y="220" text-anchor="middle" fill="#5C6B7A">replicate all</text>
<text x="150" y="260" text-anchor="middle">comm: 2P</text>
<text x="150" y="284" text-anchor="middle" fill="#5C6B7A">one all-reduce</text>
<text x="150" y="340" text-anchor="middle" fill="#C46B2C" font-weight="600">dead on 80GB</text>
<rect x="264" y="136" width="204" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="366" y="168" text-anchor="middle" font-weight="600">ZeRO-1</text>
<text x="366" y="196" text-anchor="middle" font-weight="700" fill="#1F7A72">~56GB / GPU</text>
<text x="366" y="220" text-anchor="middle" fill="#5C6B7A">shard optimizer state</text>
<text x="366" y="260" text-anchor="middle">comm: 2P</text>
<text x="366" y="284" text-anchor="middle" fill="#5C6B7A">reduce-scatter + all-gather</text>
<text x="366" y="340" text-anchor="middle" fill="#1F7A72" font-weight="600">free memory</text>
<rect x="480" y="136" width="204" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="582" y="168" text-anchor="middle" font-weight="600">ZeRO-2</text>
<text x="582" y="196" text-anchor="middle" font-weight="700" fill="#1F7A72">~40GB / GPU</text>
<text x="582" y="220" text-anchor="middle" fill="#5C6B7A">shard gradients too</text>
<text x="582" y="260" text-anchor="middle">comm: 2P</text>
<text x="582" y="284" text-anchor="middle" fill="#5C6B7A">reduce-scatter in backward</text>
<text x="582" y="340" text-anchor="middle" fill="#1F7A72" font-weight="600">free memory</text>
<rect x="696" y="136" width="216" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="804" y="168" text-anchor="middle" font-weight="600">ZeRO-3 / FSDP</text>
<text x="804" y="196" text-anchor="middle" font-weight="700" fill="#1F7A72">params sharded</text>
<text x="804" y="220" text-anchor="middle" fill="#5C6B7A">one slice of everything</text>
<text x="804" y="260" text-anchor="middle">comm: 3P</text>
<text x="804" y="284" text-anchor="middle" fill="#5C6B7A">2 all-gathers + 1 reduce-scatter</text>
<text x="804" y="340" text-anchor="middle" fill="#1F7A72" font-weight="600">one extra all-gather</text>
</g>
<rect x="48" y="456" width="864" height="64" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="484" font-size="15" font-weight="600" fill="#1B2838">The payoff: sweep-and-free + overlap make stage 3 near-free. An A100 fits 50B where the baseline could not fit 7B.</text>
<text x="72" y="506" font-size="13" fill="#5C6B7A">All-gather layer n+1 while computing layer n: if compute outlasts communication, the extra traffic hides completely.</text>
<text x="48" y="560" font-size="13" fill="#5C6B7A">Source: lecture ZeRO slides, original plate. Shell 3: shard more, pay nothing until stage 3.</text>
</svg>
