<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Continuous batching</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Time flows down. Requests join and leave mid-step.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><text x="60" y="150" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">step 1: long request generating</text><text x="60" y="200" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">step 2: short request joins, shares compute and KV cache</text><text x="60" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">step 3: short request finishes, new one arrives</text><text x="60" y="300" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">step 4: GPU memory full: KV cache cannot grow, queue forms</text><text x="60" y="350" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">step 5: long request ends, queued request starts</text><text x="60" y="420" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Many requests live in one system. Batching is per-step, not per-request.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: guest lecture batching slides, original plate. Shell 2: batching.</text></svg>