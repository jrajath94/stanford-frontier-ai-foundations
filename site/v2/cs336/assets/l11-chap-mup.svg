<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: muP</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Reparameterize so the optimal learning rate stops moving. Source: lecture muP sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the invariants</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">the LR drifts with width</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">tune at 1B, deploy at 5x:</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">the optimum moved</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">retuning costs a fortune</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">update-to-weight ratio = eta x n:</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">double the width, halve the LR</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">Adam complicates it: per-coordinate</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">normalization changes the accounting</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">A1: activations O(1) at init</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">A2: O(1) feature learning/step</text>
<text x="480" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">out come the rules:</text>
<text x="480" y="280" text-anchor="middle" font-size="14" fill="#1B2838">init by fan ratios, residuals</text>
<text x="480" y="304" text-anchor="middle" font-size="14" fill="#1B2838">1/sqrt(depth), per-layer LRs</text>
<text x="480" y="328" text-anchor="middle" font-size="14" fill="#1B2838">Adam: 1/fan-in per layer</text>
<text x="480" y="376" text-anchor="middle" font-size="14" fill="#5C6B7A">Xavier assumed tanh; He fixed ReLU;</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#5C6B7A">muP fixed width and rectangles</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">every minimum at 1e-2</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">MiniCPM: tune once small,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">deploy 5x larger</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">the optimum stops moving</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">Cerebras GPT: stabilizes</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">the scaling-law fits too</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">verify with a 2-5% short run</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#1B2838">at 2x and 0.5x LR</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: assumptions are strong. SwiGLU and RMSNorm survive;</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">learned gains, Lion, and large decoupled weight decay break the transfer.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">Weight decay is not a free regularizer under muP: a scale-sensitive term to re-derive, not copy from the small run.</text>
</svg>
