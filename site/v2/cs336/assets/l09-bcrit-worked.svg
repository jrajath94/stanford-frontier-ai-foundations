<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The critical batch size is the crossover</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Below B_crit: perfect returns. Above: diminishing. B_crit = E_min / S_min, fit from sweeps.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: noise-limited -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">BELOW: noise-limited</text>
<text x="72" y="200" font-size="15" font-weight="600" fill="#1B2838">batch 1k: double the batch,</text>
<text x="72" y="224" font-size="15" font-weight="600" fill="#1B2838">halve the steps</text>
<text x="72" y="256" font-size="14" fill="#5C6B7A">1000 steps become 500.</text>
<text x="72" y="280" font-size="14" fill="#5C6B7A">extra examples cut variance:</text>
<text x="72" y="304" font-size="14" fill="#5C6B7A">perfect returns.</text>
<rect x="72" y="336" width="336" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="88" y="362" font-size="14" font-weight="600" fill="#1F7A72">grow the batch: free steps</text>
<text x="88" y="384" font-size="13" fill="#5C6B7A">the regime data parallel loves</text>
<text x="72" y="440" font-size="14" fill="#5C6B7A">B_crit grows as the loss falls:</text>
<text x="72" y="462" font-size="14" fill="#5C6B7A">near the minimum, noise matters more.</text>
<!-- center -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: bias-limited -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">ABOVE: bias-limited</text>
<text x="504" y="200" font-size="15" font-weight="600" fill="#1B2838">batch 1M: double the batch,</text>
<text x="504" y="224" font-size="15" font-weight="600" fill="#1B2838">steps fall 5%</text>
<text x="504" y="256" font-size="14" fill="#5C6B7A">100 steps become 95.</text>
<text x="504" y="280" font-size="14" fill="#5C6B7A">the local view disagrees with the</text>
<text x="504" y="304" font-size="14" fill="#5C6B7A">global optimum: diminishing.</text>
<rect x="504" y="336" width="384" height="64" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5"/>
<text x="520" y="362" font-size="14" font-weight="600" fill="#5C6B7A">grow the model or the data instead</text>
<text x="520" y="384" font-size="13" fill="#5C6B7A">the batch is spent</text>
<text x="504" y="440" font-size="14" fill="#5C6B7A">This is the ceiling data parallel</text>
<text x="504" y="462" font-size="14" fill="#5C6B7A">hits in the parallelism lectures.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture B_crit slides, original plate. Shell 3: the crossover is the ceiling.</text>
</svg>
