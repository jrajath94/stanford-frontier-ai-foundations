<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Mamba-2: gate what you carry forward</text><text x="36" y="78" font-size="17" fill="#5C6B7A">gamma(t) forgets. Input-dependent only, so the duality survives.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">state update</text><text x="84" y="200" font-size="20" font-weight="700" fill="#1B2838" text-anchor="start">S_t  =  gamma(t) * S_{t-1}  +  k_t v_t^T</text><text x="84" y="244" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">gamma(t) from current input only. No state dependence.</text><rect x="60" y="320" width="410" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="344" font-size="14" font-weight="700" fill="#5C6B7A">gamma = 1</text><text x="84" y="366" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">keep everything</text><text x="84" y="392" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">pure linear attention</text><rect x="490" y="320" width="410" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="504" y="344" font-size="14" font-weight="700" fill="#5C6B7A">gamma = 0</text><text x="514" y="366" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">forget everything</text><text x="514" y="392" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">fresh state</text><text x="60" y="480" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">LSTM lesson relearned: choose when to remember. Nemotron-3 alternates Mamba-2 with full attention.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture SSM slides, original plate. Shell 4: the gate symbol.</text></svg>