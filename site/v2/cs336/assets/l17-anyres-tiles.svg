<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="640" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">AnyRes: crop, do not downsample</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">16 crops plus 1 overview: resolution is a token purchase. Shell 3. Source: original toy for AnyRes.</text>
<!-- 4x4 crop grid -->
<g>
<rect x="64" y="136" width="336" height="336" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<g fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5">
<rect x="80" y="152" width="72" height="72" rx="8"/><rect x="156" y="152" width="72" height="72" rx="8"/>
<rect x="232" y="152" width="72" height="72" rx="8"/><rect x="308" y="152" width="72" height="72" rx="8"/>
<rect x="80" y="228" width="72" height="72" rx="8"/><rect x="156" y="228" width="72" height="72" rx="8"/>
<rect x="232" y="228" width="72" height="72" rx="8"/><rect x="308" y="228" width="72" height="72" rx="8"/>
<rect x="80" y="304" width="72" height="72" rx="8"/><rect x="156" y="304" width="72" height="72" rx="8"/>
<rect x="232" y="304" width="72" height="72" rx="8"/><rect x="308" y="304" width="72" height="72" rx="8"/>
<rect x="80" y="380" width="72" height="72" rx="8"/><rect x="156" y="380" width="72" height="72" rx="8"/>
<rect x="232" y="380" width="72" height="72" rx="8"/><rect x="308" y="380" width="72" height="72" rx="8"/>
</g>
<text x="232" y="500" font-size="13" fill="#5C6B7A" text-anchor="middle">16 crops at 336x336: legible</text>
</g>
<!-- overview + math -->
<g>
<rect x="432" y="136" width="464" height="336" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<rect x="448" y="152" width="120" height="120" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="508" y="214" font-size="13" text-anchor="middle" fill="#1B2838">overview</text>
<text x="592" y="180" font-size="14" fill="#1B2838">1 crop = 576 tokens</text>
<text x="592" y="206" font-size="14" fill="#1B2838">17 encodings x 576 =</text>
<rect x="592" y="224" width="200" height="48" rx="8" fill="#E7F1F8"/>
<text x="692" y="252" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">9,792 tokens</text>
<text x="592" y="308" font-size="13" fill="#5C6B7A">before the question is even asked.</text>
<text x="592" y="336" font-size="13" fill="#5C6B7A">The overview keeps the layout;</text>
<text x="592" y="358" font-size="13" fill="#5C6B7A">the crops keep the detail.</text>
<text x="448" y="420" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="start">336x336 on a document: 10 pixels per character, illegible.</text>
<text x="448" y="444" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">Crop, do not downsample.</text>
</g>
<line x1="64" y1="556" x2="896" y2="556" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="592" font-size="16" font-weight="500" fill="#1B2838">One claim: resolution is paid in context length; the binding constraint on VLM resolution is the LLM's context window.</text>
<text x="64" y="620" font-size="13" fill="#5C6B7A">Computed: 17 x 576 = 9,792. Qwen3-VL's 2x2 merger cuts it to 2,448: a quarter of the bill.</text>
</svg>
