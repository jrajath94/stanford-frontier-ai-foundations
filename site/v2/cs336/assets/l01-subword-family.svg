<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Same corpus, three different vocabularies</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Three recipes, one job: rare words split into reusable pieces.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="136" width="280" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="168" font-size="16" font-weight="700" fill="#1B2838">BPE</text><text x="52" y="194" font-size="14" fill="#5C6B7A">merge the most frequent pair</text><rect x="52" y="224" width="104" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="104" y="256" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">low</text><rect x="164" y="224" width="88" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="208" y="256" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">er</text><text x="52" y="312" font-size="13" fill="#5C6B7A">"lower": (l,o) wins, then</text><text x="52" y="334" font-size="13" fill="#5C6B7A">(lo,w), then (e,r)</text><text x="52" y="384" font-size="14" font-weight="700" fill="#1F7A72">count wins</text><rect x="340" y="136" width="280" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="356" y="168" font-size="16" font-weight="700" fill="#1B2838">WordPiece</text><text x="356" y="194" font-size="14" fill="#5C6B7A">merge the best likelihood lift</text><rect x="356" y="224" width="72" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="392" y="256" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">un</text><rect x="436" y="224" width="96" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="484" y="256" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">##happi</text><rect x="540" y="224" width="64" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="572" y="256" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">##ness</text><text x="356" y="312" font-size="13" fill="#5C6B7A">"unhappiness": (s,t) wins first,</text><text x="356" y="334" font-size="13" fill="#5C6B7A">count 1, lift 1.00</text><text x="356" y="384" font-size="14" font-weight="700" fill="#1F7A72">lift wins</text><rect x="644" y="136" width="280" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="660" y="168" font-size="16" font-weight="700" fill="#1B2838">Unigram</text><text x="660" y="194" font-size="14" fill="#5C6B7A">prune the piece that hurts least</text><rect x="660" y="224" width="104" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="712" y="256" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">low</text><rect x="772" y="224" width="56" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="800" y="256" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">e</text><rect x="836" y="224" width="56" height="52" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="864" y="256" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">r</text><text x="660" y="312" font-size="13" fill="#5C6B7A">"lower": dropping "er" costs</text><text x="660" y="334" font-size="13" fill="#5C6B7A">2.70, less than "est" at 5.57</text><text x="660" y="384" font-size="14" font-weight="700" fill="#1F7A72">cheapest loss wins</text><text x="36" y="472" font-size="15" font-weight="400" fill="#1B2838">BPE grows by frequency. WordPiece grows by likelihood lift. Unigram prunes from a large start.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lesson worked toys (lower / unhappiness), original plate. Shell 3: three merge rules.</text></svg>
