<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">FlashAttention = tiling + online softmax + recompute</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Never materialize the n x n matrix. Three tricks, one kernel.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">1. TILE the QK^T and PV matmuls</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">dashed blocks live in SRAM. K, Q, V stream from HBM in tiles.</text><rect x="60" y="300" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="324" font-size="14" font-weight="700" fill="#5C6B7A">2. ONLINE softmax per tile</text><text x="84" y="350" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">track running max m and sum l. New max? Rescale and continue.</text><text x="84" y="380" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">m_new = max(m, rowmax).  l_new = l*e^(m-m_new) + rowsum*e^(rowmax-m_new).</text><rect x="60" y="460" width="840" height="80" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="484" font-size="14" font-weight="700" fill="#5C6B7A">3. FUSE + RECOMPUTE backward</text><text x="84" y="510" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">one kernel end to end. Backward recomputes tiles: no n^2 activation stored.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: FlashAttention paper, lecture slides. Shell 5: the fused kernel returns in Triton.</text></svg>