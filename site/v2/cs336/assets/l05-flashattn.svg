<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">FlashAttention tiles the attention matmuls</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Never materialize the n x n matrix. Dashed tiles live in SRAM.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="48" y="136" width="296" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="64" y="168" font-size="14" font-weight="700" fill="#5C6B7A">HBM: FULL MATRICES LIVE HERE</text><rect x="80" y="200" width="64" height="216" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="112" y="300" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><text x="112" y="324" font-size="12" fill="#5C6B7A" text-anchor="middle">n x d</text><rect x="160" y="200" width="64" height="216" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="192" y="300" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">K</text><text x="192" y="324" font-size="12" fill="#5C6B7A" text-anchor="middle">n x d</text><rect x="240" y="200" width="64" height="216" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="272" y="300" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">V</text><text x="272" y="324" font-size="12" fill="#5C6B7A" text-anchor="middle">n x d</text><line x1="352" y1="296" x2="608" y2="296" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480" y="280" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">stream one tile at a time</text><rect x="616" y="136" width="296" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="632" y="168" font-size="14" font-weight="700" fill="#5C6B7A">SRAM: ONE TILE AT A TIME</text><rect x="648" y="200" width="72" height="72" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="8,6"/><text x="684" y="244" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="744" y="200" width="72" height="72" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="8,6"/><text x="780" y="244" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">K</text><rect x="648" y="296" width="72" height="72" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="8,6"/><text x="684" y="340" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">S</text><rect x="744" y="296" width="72" height="72" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="8,6"/><text x="780" y="340" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">O</text><rect x="648" y="400" width="24" height="24" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="8,6"/><text x="684" y="418" font-size="14" fill="#1B2838">dashed = tile held in SRAM</text><text x="36" y="528" font-size="15" font-weight="600" fill="#1B2838">The n x n score matrix is never built: only tiles sit on chip.</text><text x="36" y="564" font-size="14" fill="#5C6B7A">Source: FlashAttention paper, lecture slides. Shell 3: tile the matmuls.</text></svg>
