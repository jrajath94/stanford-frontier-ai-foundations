<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Discrete lost: elegance pays in pixels</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Chameleon's one token space was elegant, unstable, and detail-losing. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the elegant idea</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">VQ-VAE: 512x512 image to</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">1,024 tokens, 8,000-code book</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E7F1F8"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">one token space, no adapter</text>
<text x="196" y="332" font-size="14" fill="#1B2838" text-anchor="middle">interleaved text and images:</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">the transformer is the generator</text>
<text x="196" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the omni North Star, pure</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">high-entropy tokens:</text>
<text x="472" y="228" font-size="14" fill="#1B2838" text-anchor="middle">which exact blue? norms</text>
<text x="472" y="250" font-size="14" fill="#1B2838" text-anchor="middle">grow, training destabilizes</text>
<text x="472" y="294" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">discretization tax: 8,000</text>
<text x="472" y="316" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">codes lose small text</text>
<text x="472" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">QK-norm and z-loss mitigate,</text>
<text x="472" y="382" font-size="13" fill="#5C6B7A" text-anchor="middle">the entropy is structural</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the verdict</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">diffusion won generation:</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">continuous, micro-optimized</text>
<text x="756" y="248" font-size="14" fill="#1B2838" text-anchor="middle">for detail</text>
<rect x="648" y="272" width="216" height="48" rx="8" fill="#E6E2DA"/>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">VQ-VAE faded</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">best guess: continuous encode,</text>
<text x="756" y="376" font-size="14" fill="#1B2838" text-anchor="middle">diffusion generate</text>
<text x="756" y="398" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">elegant and wrong for generation</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Match the architecture to the product's verb: read (continuous) versus make (discrete): detail needs continuity.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">No universal encoder yet: classification wants semantics, OCR wants pixels; one encoder cannot serve both optimally.</text>
</g>
</svg>
