<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">RoPE rotates queries and keys by position</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Inner products are rotation-invariant, so only relative distance matters.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="240" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">BEFORE: absolute positions</text><rect x="110" y="210" width="90" height="60" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="155.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">we</text><text x="155.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">pos 0</text><rect x="230" y="210" width="90" height="60" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="275.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">know</text><text x="275.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">pos 1</text><text x="110" y="320" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">shift the sentence,</text><text x="110" y="344" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">scores change</text><rect x="500" y="140" width="400" height="240" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">AFTER: rotate by position</text><rect x="550" y="210" width="90" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="595.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">we</text><text x="595.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">rot 2t</text><rect x="670" y="210" width="90" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="715.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">know</text><text x="715.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">rot 3t</text><text x="550" y="320" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">shift the sentence,</text><text x="550" y="344" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">relative angle still 1t</text><line x1="460" y1="260" x2="500" y2="260" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="250" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">rotate</text><text x="60" y="440" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Split d dims into pairs. Rotate each pair at its own frequency.</text><text x="60" y="466" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Slow pairs catch long range. Fast pairs catch neighbors.</text><text x="60" y="492" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Apply to Q and K at every attention layer. No cross terms, purely relative.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture RoPE slides, original plate. Shell 4: rotated Q/K reused in inference.</text></svg>