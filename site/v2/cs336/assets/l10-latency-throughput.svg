<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Batch size: the bus tradeoff</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Small batches: good latency, bad throughput. Big batches: the reverse. Memory caps the bus.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">batch = 1 (car)</text><text x="84" y="190" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">latency 0.008 s/token</text><text x="84" y="220" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">throughput 124 tok/s</text><text x="84" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Llama2-13B on H100</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">batch = 256 (bus)</text><text x="524" y="190" font-size="16" font-weight="700" fill="#C46B2C" text-anchor="start">latency worse</text><text x="524" y="220" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">throughput much better</text><text x="524" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">until KV cache fills HBM</text><text x="60" y="390" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Latency ~ linear in B (KV cache grows). Throughput ~ B/(B + const): asymptotes.</text><text x="60" y="420" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">Shrinking memory helps both. Only the batch dimension pits them against each other.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture Llama2 example, original plate. Shell 4: pick the metric, then the batch.</text></svg>