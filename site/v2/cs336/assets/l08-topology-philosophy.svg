<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Mesh vs tree, and convergence</text><text x="36" y="78" font-size="17" fill="#5C6B7A">TPU torus: neighbors only, scales forever. GPU fat tree: all-to-all, flexible. MoE pushed TPUs toward trees.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="240" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">TPU: toroidal mesh</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">each chip talks to neighbors</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">neighbors wrap around</text><text x="84" y="242" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">same degree at any scale</text><text x="84" y="280" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">great for dense, regular</text><rect x="500" y="140" width="400" height="240" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">GPU: fat tree</text><text x="524" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">fast links at bottom</text><text x="524" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">pods + spine switches</text><text x="524" y="242" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">any-to-any routing</text><text x="524" y="280" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">great for MoE, irregular</text><rect x="60" y="410" width="840" height="90" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="434" font-size="14" font-weight="700" fill="#5C6B7A">convergent evolution: TPU8i moved to a tree. Workloads define the network.</text><text x="84" y="456" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">MoE token routing needs all-to-all. Huawei Ascend: weaker chips, fiber everywhere, 4x power.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture hardware slides, original plate. Shell 3: workloads shape the wire.</text></svg>