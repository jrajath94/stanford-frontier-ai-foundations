<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Multimodality: the state of play</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Continuous encoders understand. Diffusion generates.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">understanding</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="196" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">continuous encoders (CLIP/SigLIP): no information lost</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">generation</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#E7F1F8"/><text x="84" y="296" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">diffusion heads: micro-optimize fine detail</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">weighting</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="396" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">video is low-density: do not let it drown the text</text><text x="60" y="470" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">No universal encoder: classification wants semantics, OCR wants pixels.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture closing slides, original plate. Shell 5: the state of play.</text></svg>