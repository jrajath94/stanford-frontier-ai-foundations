<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Mid-training: the blur</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Instruction data now lands in the decay phase of pre-training.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the decay phase</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">highest quality data, lowest learning rate, closest to deployment</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">MiniCPM: internet mix -&gt; chatty mix (UltraChat, StackExchange QA)</text><text x="60" y="320" font-size="16" font-weight="700" fill="#C46B2C" text-anchor="start">&#x27;Base model&#x27; is a lie: it already trained on chat data.</text><text x="60" y="354" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Mixtures are trial and error. Decay ablations are cheap enough to run.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture mid-training slides, original plate. Shell 2: the blur.</text></svg>