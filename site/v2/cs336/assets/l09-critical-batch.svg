<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Critical batch size</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Noise-limited: perfect returns. Bias-limited: diminishing. B_crit grows as loss drops.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">noise-limited</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">extra examples cut</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">gradient variance</text><text x="84" y="250" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">perfect scaling</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">bias-limited</text><text x="524" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">local view vs global</text><text x="524" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">optimum disagree</text><text x="524" y="250" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">diminishing returns</text><rect x="60" y="370" width="840" height="100" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">B_crit = min examples / min steps; scales as a power law in loss</text><text x="84" y="424" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Closer to the minimum, noise matters more. Big runs earn big batches.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture critical-batch slides, original plate. Shell 4: size the batch to the noise.</text></svg>