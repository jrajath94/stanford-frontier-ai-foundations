<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Coalesce: one burst per warp</text><text x="36" y="78" font-size="17" fill="#5C6B7A">DRAM serves 128-byte bursts. Threads in a burst read for free.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">NOT coalesced</text><rect x="100" y="200" width="60" height="60" rx="6" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="130" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t0</text><rect x="190" y="200" width="60" height="60" rx="6" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="220" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t1</text><rect x="280" y="200" width="60" height="60" rx="6" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="310" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t2</text><rect x="370" y="200" width="60" height="60" rx="6" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="400" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t3</text><text x="100" y="300" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">4 threads, 4 bursts</text><text x="100" y="322" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">column reads in row-major</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">coalesced</text><rect x="540" y="200" width="320" height="60" rx="6" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="580" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t0</text><text x="660" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t1</text><text x="740" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t2</text><text x="820" y="235" font-size="14" font-weight="700" fill="#1B2838" text-anchor="middle">t3</text><text x="540" y="300" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">4 threads, 1 burst</text><text x="540" y="322" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">row reads in row-major</text><line x1="460" y1="240" x2="500" y2="240" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="230" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">reorder</text><text x="60" y="400" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Mnemonic: threads moving along the major axis are NOT coalesced.</text><text x="60" y="426" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Karpathy: padding vocab 50257 -&gt; 50304 gave 25% speedup via alignment.</text><text x="60" y="472" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Sizes divisible by 16/32 fill whole burst windows. Powers of 2 are not magic.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture coalescing slides, original plate. Shell 3: the burst rule.</text></svg>