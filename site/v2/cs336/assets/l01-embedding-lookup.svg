<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Token IDs index the embedding matrix</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Each ID picks one learned row. The row is the token's vector.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="48" y="160" width="176" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="188" font-size="14" font-weight="700" fill="#5C6B7A">TOKEN ID</text><rect x="64" y="208" width="144" height="48" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/><text x="136" y="238" font-size="18" font-weight="600" fill="#1B2838" text-anchor="middle">1169</text><text x="136" y="270" font-size="12" fill="#5C6B7A" text-anchor="middle">example id</text><rect x="264" y="136" width="320" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="280" y="164" font-size="14" font-weight="700" fill="#5C6B7A">EMBEDDING MATRIX E, V x d</text><rect x="280" y="184" width="288" height="32" rx="4" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1"/><text x="424" y="206" font-size="13" fill="#5C6B7A" text-anchor="middle">row 0</text><rect x="280" y="216" width="288" height="32" rx="4" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1"/><text x="424" y="238" font-size="13" fill="#5C6B7A" text-anchor="middle">...</text><rect x="280" y="248" width="288" height="40" rx="4" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="424" y="274" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="middle">row 1169</text><rect x="280" y="288" width="288" height="32" rx="4" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1"/><text x="424" y="310" font-size="13" fill="#5C6B7A" text-anchor="middle">...</text><rect x="624" y="136" width="288" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="640" y="164" font-size="14" font-weight="700" fill="#5C6B7A">THE VECTOR</text><rect x="640" y="184" width="40" height="40" rx="4" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><rect x="688" y="184" width="40" height="40" rx="4" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><rect x="736" y="184" width="40" height="40" rx="4" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="800" y="212" font-size="16" fill="#5C6B7A">...</text><text x="640" y="256" font-size="14" fill="#1B2838">d numbers, learned</text><text x="640" y="280" font-size="14" fill="#5C6B7A">d = 12,288 in GPT-3</text><line x1="224" y1="220" x2="264" y2="220" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="244" y="210" font-size="13" font-weight="700" fill="#1E4D8C" text-anchor="middle">lookup</text><line x1="584" y1="220" x2="624" y2="220" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="360" width="864" height="64" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="72" y="398" font-size="15" font-weight="700" fill="#1B2838">GPT-3: 50,257 x 12,288 x 2 bytes = 1.24 GB for the table alone.</text><text x="36" y="470" font-size="15" font-weight="400" fill="#1B2838">The mapping is lossless. The tokenizer is frozen before training: replace it and every row is wrong.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lesson embedding math, original plate. Shell 4: the embedding row symbol.</text></svg>
