<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Memory: the states are the hog</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: NO BUDGET</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">count params, forget the</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">optimizer, forget the batch</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">OOM at 2 a.m.</text><text x="52" y="270" font-size="14" fill="#1B2838">states outnumber params</text><text x="52" y="300" font-size="14" fill="#1B2838">activations grow with batch</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: 12 BYTES</text><text x="340" y="168" font-size="34" font-weight="700" fill="#1B2838">2+2+4+4</text><text x="340" y="200" font-size="14" fill="#5C6B7A">bytes per param, AdamW</text><text x="340" y="252" font-size="14" fill="#1B2838">2 params + 2 grads</text><text x="340" y="282" font-size="14" fill="#1B2838">4 first + 4 second moment</text><text x="340" y="330" font-size="14" fill="#1B2838">gradient accumulation: 0 extra</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: THE FIT</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">53B params</text><text x="628" y="186" font-size="14" fill="#1B2838">max on 8 x 80 GB H100s</text><text x="628" y="216" font-size="14" fill="#1B2838">640 / 12 = 53B</text><text x="628" y="268" font-size="15" font-weight="700" fill="#1B2838">activations: 2 x B x D x L</text><text x="628" y="298" font-size="14" fill="#1B2838">microbatch them or checkpoint</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: states dominate the budget. Activations scale with batch, params with depth.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: the OOM run. Center: the byte budget. Right: the fit math.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson memory math, original plate. Shell 2: count the bytes.</text></svg>
