<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: perplexity</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Perplexity: what it means and what it does not. Source: lecture perplexity sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the formula</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">numbers without meaning</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">lower is better, and that</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">is all anyone says</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">5.1 vs 1.44: meaningless</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">cross-tokenizer comparisons</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">are category errors</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">lowercase and formatting change</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">the number without changing skill</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">2 to the average negative LL</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">toy: 0.1, 0.1, 0.729</text>
<text x="480" y="232" text-anchor="middle" font-size="14" fill="#1B2838">avg LL 2.35: PPL = 5.1</text>
<text x="480" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">bits per byte:</text>
<text x="480" y="304" text-anchor="middle" font-size="14" fill="#1B2838">the tokenizer-fair unit</text>
<text x="480" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">training scales predict it:</text>
<text x="480" y="376" text-anchor="middle" font-size="14" fill="#1B2838">power laws on tokens,</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#1B2838">not on downstream scores</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one tokenizer, one corpus</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">report bits/byte alongside</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">perplexity</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">compare fairly, predict training</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">perplexity measures fit,</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">not skill: downstream is</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">a different instrument</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: perplexity is cheap and predictable, but it cannot tell you whether the model can do anything.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Train on perplexity, evaluate on tasks. A model with great perplexity and terrible agent scores is a compression artifact.</text>
</svg>
