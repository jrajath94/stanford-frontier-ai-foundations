<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Mixing: from vibes to regression</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. The mixture is a distribution; human intuition about it is unreliable. Source: original synthesis of the lecture and RegMix paper.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the arithmetic</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">vibes, uniform, proportional:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">the huge low-quality pool</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">eats the budget</text>
<rect x="96" y="272" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">small pool: 100 epochs</text>
<text x="196" y="356" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">mixtures that felt right: 20x</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">UniMax: cap at 4 epochs</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">RegMix: 512 tiny models,</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">regress, optimize</text>
<text x="472" y="296" font-size="13" fill="#5C6B7A" text-anchor="middle">simulate epoching for scale</text>
<text x="472" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">never optimize on the evals</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">the epoch arithmetic first</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the arithmetic</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">RegMix: 1M-param swarm,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">1B tokens each, predicted</text>
<text x="756" y="248" font-size="14" fill="#1B2838" text-anchor="middle">the best of 64 at 1B/25B</text>
<rect x="648" y="272" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">web beats Wikipedia</text>
<text x="756" y="356" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">two leaps of faith, named</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">RegMix is the best available method, which is not the same as a reliable one: the optimizer hunts the regressor's extremes.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Method cost should scale with run cost: vibes for probes, UniMax for serious runs, RegMix for the flagship.</text>
</g>
</svg>
