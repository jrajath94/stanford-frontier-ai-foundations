<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: WSD</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The trapezoid is the shape of reusable training. Source: lecture WSD sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the schedule</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">cosine: restart at 100%</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">5 budgets, 5 full runs,</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">5 warmups, 5 decays</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">6 full runs for one answer</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">the horizon is baked into</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">every step</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">warmup, stable, decay</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">warmup: constant steps</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">stable: hold max, most of the run</text>
<text x="480" y="264" text-anchor="middle" font-size="14" fill="#1B2838">decay: 10-20%, down to ~10%</text>
<text x="480" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">stable is horizon-independent:</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">step 100k does not know</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#1B2838">200k or 2M</text>
<text x="480" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">only the decay needs the horizon</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">rewind and re-decay</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">roll back to a stable checkpoint,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">extend, re-decay</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">~5.1 runs, not 6</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">savings compound with every</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">decision: each is a rewind</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">matches cosine after the decay:</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#1B2838">the decay does the annealing</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: judge a schedule only after its decay. WSD looks worse</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">than cosine until the decay hits, then matches or exceeds it.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">The rewind point must be inside the stable phase: rewinding into the decay contaminates the annealing.</text>
</svg>
