<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: tensor parallel</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Column up, row down, one sync per pair. Source: lecture tensor-parallel sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the layer</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one GPU, the whole layer</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">4096x4096: 33MB in bf16</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">full width every matmul</text>
<text x="180" y="288" text-anchor="middle" font-size="14" fill="#C46B2C" font-weight="600">the layer outgrows HBM:</text>
<text x="180" y="312" text-anchor="middle" font-size="14" fill="#C46B2C">Llama-70B: 8192 wide,</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#C46B2C">80 layers, no single GPU</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">row-split before the nonlinearity</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">would sync inside the pair</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">a transformer block pair</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">column split up, row split down</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">nonlinearity stays local</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">one all-reduce per pair:</text>
<text x="480" y="312" text-anchor="middle" font-size="14" fill="#1B2838">2 per layer forward, 2 backward</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">f/g duality: flipped in backward</text>
<text x="480" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">sequence parallel rides the sync</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">4 ranks, 1/4 of each layer</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">all-gather forward</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">reduce-scatter backward</text>
<text x="780" y="288" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">7B layer: ~3GB per rank/step</text>
<text x="780" y="312" text-anchor="middle" font-size="14" fill="#5C6B7A">Llama-70B: 86GB per rank/step</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#1B2838">per-layer, every step</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: per-layer chatter only NVLink can carry. 86GB at 1.8 TB/s is 48ms; on InfiniBand it is 1.7s.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Never tensor across the slow boundary. The link decides whether tensor parallel is viable.</text>
</svg>
