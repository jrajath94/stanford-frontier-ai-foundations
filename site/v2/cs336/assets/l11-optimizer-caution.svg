<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Small-scale wins can lie</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Muon crushed Adam on NanoGPT. At scale the gap shrank. Tune the baseline or the comparison is fiction.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">two axes of scale</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">compute (N and D coupled)  x  Chinchilla ratio (D/N)</text><text x="84" y="220" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">an optimizer can win on one axis and lose on the other</text><rect x="60" y="310" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="334" font-size="14" font-weight="700" fill="#5C6B7A">Marin: beautiful scaling, then blowup</text><text x="84" y="360" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">great for orders of magnitude, then deviation, then divergence.</text><text x="84" y="386" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">fix: muP-style parameterization. Scaling trends are not promises.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture optimizer slides, original plate. Shell 5: distrust small wins.</text></svg>