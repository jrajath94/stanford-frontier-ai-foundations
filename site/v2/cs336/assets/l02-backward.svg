<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The backward pass runs two matmuls</text><text x="36" y="78" font-size="17" fill="#5C6B7A">One for the input gradient, one for the weight gradient.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">FORWARD (einsum)</text><text x="84" y="190" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">h2[batch, out] = sum_in  h1[batch, in] x w2[in, out]</text><text x="84" y="222" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">cost: 2 x batch x in x out</text><rect x="60" y="300" width="410" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="324" font-size="14" font-weight="700" fill="#5C6B7A">BACKWARD message</text><text x="84" y="346" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">dh1[batch, in] = sum_out</text><text x="84" y="372" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">dh2[batch, out] x w2[in, out]</text><text x="84" y="406" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">same cost: 2 x batch x in x out</text><rect x="490" y="300" width="410" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="504" y="324" font-size="14" font-weight="700" fill="#5C6B7A">WEIGHT gradient</text><text x="514" y="346" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">dw2[in, out] = sum_batch</text><text x="514" y="372" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">dh2[batch, out] x h1[batch, in]</text><text x="514" y="406" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">same cost: 2 x batch x in x out</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture einsum board, original plate. Shell 3: einsum names kill transpose bugs.</text></svg>