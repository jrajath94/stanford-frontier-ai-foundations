<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">SigLIP: judge pairs, not batches</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Softmax picks a winner per row; sigmoid judges each pair alone. Shell 3. Source: original toy for SigLIP.</text>
<!-- before: softmax -->
<g>
<rect x="64" y="136" width="400" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="170" font-size="15" font-weight="600" fill="#1B2838">before: CLIP's softmax</text>
<text x="80" y="204" font-size="14" fill="#1B2838">each row: softmax over N columns</text>
<text x="80" y="226" font-size="14" fill="#1B2838">the negatives compete: making T2</text>
<text x="80" y="248" font-size="14" fill="#1B2838">worse helps T1 win</text>
<rect x="80" y="270" width="368" height="48" rx="8" fill="#E6E2DA"/>
<text x="264" y="298" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">loss couples the whole batch</text>
<text x="80" y="352" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="start">expected loss moves with batch size:</text>
<text x="80" y="374" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="start">small batches degrade</text>
</g>
<polygon points="472,260 488,268 472,276" fill="#1B2838"/>
<!-- after: sigmoid -->
<g>
<rect x="496" y="136" width="400" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="170" font-size="15" font-weight="600" fill="#1B2838">after: SigLIP's sigmoid</text>
<text x="512" y="204" font-size="14" fill="#1B2838">each of the N^2 pairs: one binary</text>
<text x="512" y="226" font-size="14" fill="#1B2838">decision, independent</text>
<text x="512" y="248" font-size="14" fill="#1B2838">(I1,T1) positive; (I1,T2) negative</text>
<rect x="512" y="270" width="368" height="48" rx="8" fill="#E7F4EF"/>
<text x="696" y="298" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">no competition between negatives</text>
<text x="512" y="352" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">expected loss batch-independent:</text>
<text x="512" y="374" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">small batches work, 32K is the ceiling</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: one loss change decouples the objective from the batch; the systems win compounds to 16x fewer TPU-days.</text>
<text x="64" y="516" font-size="13" fill="#5C6B7A">Computed: 10 days x 256 TPUv3 = 2,560 TPU-days; 5 days x 32 TPUv4 = 160 TPU-days. 2560/160 = 16x.</text>
</svg>
