<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Perplexity: score the surprise, not the hit</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: ACCURACY</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">0 or 1</text><text x="52" y="186" font-size="14" fill="#1B2838">per position, nothing between</text><text x="52" y="216" font-size="14" fill="#1B2838">90% sure wrong = 100% sure wrong</text><text x="52" y="246" font-size="14" fill="#1B2838">too coarse to train on</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: LOG-PROB</text><text x="340" y="168" font-size="38" font-weight="700" fill="#1B2838">-1.47</text><text x="340" y="200" font-size="14" fill="#5C6B7A">average log probability per token</text><text x="340" y="252" font-size="14" fill="#1B2838">log-likelihood over the test text</text><text x="340" y="282" font-size="14" fill="#1B2838">divided by the token count</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: PERPLEXITY</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">4.36</text><text x="628" y="186" font-size="14" fill="#1B2838">e raised to 1.47</text><text x="628" y="216" font-size="14" fill="#1B2838">as surprised as 4.36 choices</text><text x="628" y="268" font-size="15" font-weight="700" fill="#1B2838">2.885 bits per byte</text><text x="628" y="298" font-size="14" fill="#1B2838">fair across tokenizers</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: train on log prob, evaluate on perplexity, compare tokenizers on bits per byte.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: accuracy is binary. Center: the averaged surprise. Right: the scores.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson scoring math, original plate. Shell 2: count the surprise.</text></svg>
