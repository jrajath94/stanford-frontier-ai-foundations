<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">MoE scaling is the new frontier</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Sparsity has a scaling law too. Kimi K2 picked 48: diminishing returns beyond.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">what labs fit now</text><text x="84" y="190" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Kimi K2: sparsity 48, sparser is better until it is not</text><text x="84" y="216" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Hunyuan: 96 tokens per active param at fixed sparsity</text><text x="84" y="242" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">LLaMA3: IsoFLOP + loss-to-accuracy sigmoid</text><rect x="60" y="310" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="334" font-size="14" font-weight="700" fill="#5C6B7A">MiniMax-01: architecture bake-off</text><text x="84" y="360" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">lightning vs hybrid vs softmax attention: comparable scaling, hybrid wins by decision</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture survey, original plate. Shell 5: the frontier moved to MoE.</text></svg>