<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Prefill vs decode</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Two operations, two bottlenecks, two machine fleets.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">prefill: 10,000 tokens in, 1 token out</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">compute bound: like training without the backward pass</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">uses the GPU well. Runs once per request.</text><rect x="60" y="306" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="330" font-size="14" font-weight="700" fill="#5C6B7A">decode: 1 token at a time</text><text x="84" y="354" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">memory bandwidth bound: load the whole model for one token</text><text x="84" y="380" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">runs once per generated token. Prefill takes longer; decode runs far more steps.</text><text x="60" y="486" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">Split them onto different machines: NVIDIA GPUs for prefill, LPU chips for decode.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: guest lecture prefill/decode slides, original plate. Shell 2: the split.</text></svg>