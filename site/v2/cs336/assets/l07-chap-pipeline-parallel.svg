<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: pipeline parallel</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Micro-batches fill the pipe; schedules shrink the rest. Source: lecture pipeline sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the schedule</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one batch, 4 stages</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">rank 3 waits on ranks 0-2</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">then the reverse</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">75% idle tax</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">GPipe: all forwards, then all</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">backwards; pays both sides</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">holds m micro-batches of</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">activations per stage</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">idle = (p-1)/(m+p-1)</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">1F1B: (p-1)/m, paid once</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">interleave: /(v x m)</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">zero-bubble: split B and W</text>
<text x="480" y="312" text-anchor="middle" font-size="14" fill="#1B2838">B critical, W fills the gaps</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">DualPipe: waves from both ends,</text>
<text x="480" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">comm hides behind compute</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">8 micro-batches, 4 stages</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">the pipe stays mostly full</text>
<text x="780" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">idle: 27% (GPipe)</text>
<text x="780" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">37.5% once (1F1B)</text>
<text x="780" y="340" text-anchor="middle" font-size="14" fill="#1B2838">point-to-point activations</text>
<text x="780" y="364" text-anchor="middle" font-size="14" fill="#1B2838">only b x s x h per hop</text>
<text x="780" y="412" text-anchor="middle" font-size="14" fill="#5C6B7A">tolerates slow links,</text>
<text x="780" y="436" text-anchor="middle" font-size="14" fill="#5C6B7A">even across the world</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: the bubble never fully dies. Every schedule trades memory</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">for utilization: more micro-batches, more activations held.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">Pipeline's virtue is communication: small point-to-point tensors survive links that kill tensor parallel.</text>
</svg>
