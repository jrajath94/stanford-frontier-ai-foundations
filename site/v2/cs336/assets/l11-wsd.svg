<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">WSD: the reusable schedule</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Warmup, stable, decay. Rewind to the stable phase and re-decay: no more restarts.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the trapezoid</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">warmup: constant steps, horizon-independent</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">stable: hold LR constant for most of the run</text><text x="84" y="242" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">decay: 10-20% of run, down to ~10% of max</text><text x="84" y="280" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">matches cosine; decay does the annealing work</text><rect x="60" y="370" width="840" height="100" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">the payoff</text><text x="84" y="414" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">want a longer run? Roll back to stable, extend, re-decay. Chinchilla sweeps for 10% cost.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture WSD slides, original plate. Shell 4: schedules you can rewind.</text></svg>