<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="480" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">z-loss pins the softmax normalizer</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Add (log z)^2 to the loss. Penalize drift from zero.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">log prob = u - log z</text><text x="84" y="190" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">u: model output, well-behaved</text><text x="84" y="220" font-size="16" font-weight="700" fill="#C46B2C" text-anchor="start">log z: exp() can blow up either way</text><rect x="60" y="300" width="840" height="80" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="324" font-size="14" font-weight="700" fill="#5C6B7A">fix: loss += c * (log z)^2</text><text x="84" y="350" font-size="16" font-weight="700" fill="#1F7A72" text-anchor="start">z near 1 keeps the output softmax numerically stable</text><text x="60" y="430" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Devlin 2014. Revived by Baichuan, DCLM, OLMo.</text><text x="36" y="456" font-size="14" fill="#5C6B7A">Source: lecture stability slides, original plate. Shell 3: one added term, one danger removed.</text></svg>