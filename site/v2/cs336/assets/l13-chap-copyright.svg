<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Copyright: the three layers decide independently</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Fair use covers layer 3 only. Source: 2025 rulings discussed in lecture.</text>
<!-- left: cost without -->
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the layers</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">take ~500,000 books from</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">shadow libraries, train,</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">call it fair use</text>
<text x="196" y="300" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">copying was the crime,</text>
<text x="196" y="322" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">not the training</text>
<rect x="96" y="344" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="372" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">$1.5B: ~$3,000 per book</text>
</g>
<!-- center: stored object -->
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">layer 1: access</text>
<text x="472" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">robots.txt, terms, anti-bot</text>
<text x="472" y="262" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">layer 2: copying</text>
<text x="472" y="284" font-size="13" fill="#5C6B7A" text-anchor="middle">the download itself</text>
<text x="472" y="318" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">layer 3: training</text>
<text x="472" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">fair use, narrowly, so far</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">terms of service sit on top</text>
</g>
<!-- right: cost with -->
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the layers</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">license-only data clears</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">all three layers at once</text>
<text x="756" y="258" font-size="14" fill="#1B2838" text-anchor="middle">Common Pile: 8TB, all clean</text>
<rect x="648" y="280" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="308" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">safe at every layer</text>
<text x="756" y="372" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">legal at layer 2 and layer 3</text>
</g>
<!-- bottom tradeoff -->
<g>
<rect x="64" y="440" width="832" height="72" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Caution costs the frontier: license-only reaches 2023-era models, not Qwen.</text>
</g>
</svg>
