<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">A decade of pre-training datasets</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Bigger, messier, more filtered. The watershed: Books3 got Meta in trouble.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">BERT (2018)</text><rect x="60" y="140" width="10" height="36" rx="5" fill="#5C6B7A"/><text x="84" y="165" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">Wikipedia + Books (BookCorpus): documents, not sentences</text><rect x="60" y="184" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="208" font-size="14" font-weight="700" fill="#5C6B7A">GPT-2 (2019)</text><rect x="60" y="184" width="10" height="36" rx="5" fill="#5C6B7A"/><text x="84" y="209" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">Reddit &gt;3 karma outgoing links: 40GB, 8M pages</text><rect x="60" y="228" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="252" font-size="14" font-weight="700" fill="#5C6B7A">CCNet (2019)</text><rect x="60" y="228" width="10" height="36" rx="5" fill="#5C6B7A"/><text x="84" y="253" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">Wikipedia-like LM classifier for quality</text><rect x="60" y="272" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="296" font-size="14" font-weight="700" fill="#5C6B7A">C4 (2019)</text><rect x="60" y="272" width="10" height="36" rx="5" fill="#5C6B7A"/><text x="84" y="297" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">rules only: 156B tokens, 800GB</text><rect x="60" y="316" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="340" font-size="14" font-weight="700" fill="#5C6B7A">GPT-3 (2020)</text><rect x="60" y="316" width="10" height="36" rx="5" fill="#D9E6F5"/><text x="84" y="341" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">CC + WebText + Books1/2 + Wiki: 500GB, quality classifier, fuzzy dedup</text><rect x="60" y="360" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">The Pile (2020)</text><rect x="60" y="360" width="10" height="36" rx="5" fill="#C46B2C"/><text x="84" y="385" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">grassroots: Books3 from a shadow library</text><rect x="60" y="404" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="428" font-size="14" font-weight="700" fill="#5C6B7A">Llama 1 (2022)</text><rect x="60" y="404" width="10" height="36" rx="5" fill="#C46B2C"/><text x="84" y="429" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">1.2T tokens. Books3 announced -&gt; the watershed</text><rect x="60" y="448" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="472" font-size="14" font-weight="700" fill="#5C6B7A">Refined/FineWeb</text><rect x="60" y="448" width="10" height="36" rx="5" fill="#1F7A72"/><text x="84" y="473" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">web-only: 5T / 15T tokens, rules-first</text><rect x="60" y="492" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="516" font-size="14" font-weight="700" fill="#5C6B7A">DCLM (2024)</text><rect x="60" y="492" width="10" height="36" rx="5" fill="#F4E6D4"/><text x="84" y="517" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">fastText classifier: keep 1.4% of 240T tokens</text><rect x="60" y="536" width="840" height="36" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="560" font-size="14" font-weight="700" fill="#5C6B7A">Nemotron (2024)</text><rect x="60" y="536" width="10" height="36" rx="5" fill="#F4E6D4"/><text x="84" y="561" font-size="12" font-weight="400" fill="#1B2838" text-anchor="start">educational scoring + synthetic data: 6T tokens</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture dataset history, original plate. Shell 4: the timeline.</text></svg>