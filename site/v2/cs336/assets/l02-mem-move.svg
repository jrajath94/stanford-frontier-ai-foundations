<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="500" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Memory moves set the clock</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Every tensor travels from HBM to the chip and back.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="150" width="220" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="174" font-size="14" font-weight="700" fill="#5C6B7A">BEFORE: HBM</text><rect x="90" y="210" width="160" height="60" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="170.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">tensor x</text><text x="170.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">1M bf16 = 2 MB</text><rect x="90" y="285" width="160" height="50" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="170.0" y="308.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">weights w</text><text x="170.0" y="328.0" font-size="12" fill="#5C6B7A" text-anchor="middle">sits in HBM</text><line x1="290" y1="250" x2="410" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="350.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">read 2n bytes</text><rect x="420" y="150" width="220" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="434" y="174" font-size="14" font-weight="700" fill="#5C6B7A">RULE: compute on chip</text><rect x="475" y="220" width="110" height="60" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="530.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">ReLU</text><text x="530.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">n FLOPs</text><text x="440" y="320" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">compute time = FLOPs / FLOP/s</text><text x="440" y="342" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">move time = bytes / 3.35 TB/s</text><line x1="650" y1="250" x2="770" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="710.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">write 2n bytes</text><rect x="780" y="150" width="120" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="794" y="174" font-size="14" font-weight="700" fill="#5C6B7A">AFTER</text><rect x="795" y="210" width="90" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="840.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">tensor y</text><text x="840.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">2 MB back</text><text x="60" y="420" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Total time = max(move time, compute time). ReLU: 1us vs 0.001us.</text><text x="60" y="446" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Move time wins by 1000x. ReLU is memory bound.</text><text x="36" y="476" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 2: count bytes and FLOPs, name the bottleneck.</text></svg>