<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The decode tax: 140 GB per token</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">One decode step loads the whole model to produce one token. Shell 2. Source: original toy for the lecture's decode section.</text>
<!-- the arithmetic -->
<g>
<rect x="64" y="136" width="832" height="232" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="170" font-size="15" font-weight="600" fill="#1B2838">the arithmetic, end to end</text>
<text x="80" y="206" font-size="14" fill="#1B2838">70B parameters in bf16: 2 bytes each, 140 GB of weights.</text>
<text x="80" y="232" font-size="14" fill="#1B2838">One decode step: load all 140 GB from HBM to the SMs, a few hundred GFLOPs of math, one token's logits.</text>
<g font-size="14" font-weight="600">
<rect x="80" y="256" width="240" height="64" rx="8" fill="#E7F1F8"/><text x="200" y="282" text-anchor="middle" fill="#1B2838">140 GB per token</text><text x="200" y="304" text-anchor="middle" fill="#5C6B7A" font-weight="400" font-size="13">memory traffic</text>
<text x="352" y="296" fill="#1B2838" font-size="18">&#247;</text>
<rect x="380" y="256" width="240" height="64" rx="8" fill="#E7F1F8"/><text x="500" y="282" text-anchor="middle" fill="#1B2838">3.3 TB/s bandwidth</text><text x="500" y="304" text-anchor="middle" fill="#5C6B7A" font-weight="400" font-size="13">H100</text>
<text x="652" y="296" fill="#1B2838" font-size="18">=</text>
<rect x="680" y="256" width="200" height="64" rx="8" fill="#F4E6D4"/><text x="780" y="282" text-anchor="middle" fill="#1B2838">42 ms per token</text><text x="780" y="304" text-anchor="middle" fill="#5C6B7A" font-weight="400" font-size="13">about 24 tok/s</text>
</g>
<text x="80" y="352" font-size="13" fill="#5C6B7A">The matmuls are tiny (one token's worth): the compute is nearly free. The bill is all memory movement.</text>
</g>
<!-- consequence -->
<g>
<rect x="64" y="384" width="832" height="112" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="418" font-size="15" font-weight="600" fill="#1B2838">the consequence</text>
<text x="80" y="450" font-size="14" fill="#1B2838">Decode throughput scales with bandwidth, not flops: a 2x-flops GPU with the same bandwidth decodes no faster.</text>
<text x="80" y="476" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">Batching amortizes the tax: one 140 GB load serves the whole batch's tokens at once.</text>
</g>
<line x1="64" y1="540" x2="896" y2="540" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="576" font-size="16" font-weight="500" fill="#1B2838">One claim: at decode, the GPU is a glorified memory loader; the tax scales linearly with model bytes.</text>
<text x="64" y="604" font-size="13" fill="#5C6B7A">Computed: 140/3300 = 0.0424 s = 42.4 ms; 3300/140 = 23.6 tokens/s. That is why Groq's LPU trades flops for bandwidth.</text>
</svg>
