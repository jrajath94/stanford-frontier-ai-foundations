<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="620" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Four ways to shrink the KV cache</text><text x="36" y="78" font-size="17" fill="#5C6B7A">GQA shares heads. MLA compresses. CLA shares layers. Sliding window bounds the past.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">GQA</text><rect x="60" y="140" width="10" height="92" rx="5" fill="#1F7A72"/><text x="84" y="178" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">fewer KV heads: KV / (N/K)</text><text x="84" y="204" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">K=8 keeps accuracy, much faster</text><rect x="60" y="248" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="272" font-size="14" font-weight="700" fill="#5C6B7A">MLA</text><rect x="60" y="248" width="10" height="92" rx="5" fill="#F4E6D4"/><text x="84" y="286" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">project K,V to C dims (16000-&gt;512)</text><text x="84" y="312" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">DeepSeek: ~MHA accuracy, tiny cache</text><rect x="60" y="356" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="380" font-size="14" font-weight="700" fill="#5C6B7A">CLA</text><rect x="60" y="356" width="10" height="92" rx="5" fill="#D9E6F5"/><text x="84" y="394" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">share KV across layers</text><text x="84" y="420" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">another axis of sharing</text><rect x="60" y="464" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="488" font-size="14" font-weight="700" fill="#5C6B7A">sliding window</text><rect x="60" y="464" width="10" height="92" rx="5" fill="#C46B2C"/><text x="84" y="502" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">attend to last K tokens only</text><text x="84" y="528" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">cache independent of length; hybrid with global</text><text x="60" y="586" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Rule: shrink the cache, keep accuracy. Linear attention/Mamba compress history into a state.</text><text x="36" y="596" font-size="14" fill="#5C6B7A">Source: lecture KV-cache slides, original plate. Shell 4: find the squeeze.</text></svg>