<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">DSA: index first, attend to the survivors</text><text x="36" y="78" font-size="17" fill="#5C6B7A">A cheap indexer picks top-k tokens. Full attention runs on the subset.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="250" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">1. INDEX</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">qk inner products</text><text x="84" y="214" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">ReLU + weights</text><text x="84" y="238" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">-&gt; top-k positions</text><text x="84" y="270" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">lightweight:</text><text x="84" y="292" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">low-dim, low precision</text><line x1="310" y1="250" x2="390" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="350.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">subset</text><rect x="390" y="140" width="250" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="404" y="164" font-size="14" font-weight="700" fill="#5C6B7A">2. ATTEND</text><text x="414" y="190" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">full attention</text><text x="414" y="214" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">on k tokens only</text><text x="414" y="238" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">k &lt;&lt; n, bounded</text><line x1="640" y1="250" x2="720" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="680.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><rect x="720" y="140" width="180" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="734" y="164" font-size="14" font-weight="700" fill="#5C6B7A">3. OUTPUT</text><text x="744" y="230" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">emit K, V</text><text x="60" y="420" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Not trained from scratch. Bolted on during long-context extension.</text><text x="60" y="446" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">DeepSeek v3.2 matches Claude 4.5 Sonnet / Gemini 3. GLM5 validated it.</text><text x="60" y="472" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Top-k is non-differentiable. Surprisingly, that is fine.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture DSA slides, original plate. Shell 4: the indexer pattern returns in MoE routing.</text></svg>