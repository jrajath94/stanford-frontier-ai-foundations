<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Three labs, one direction: spend compute on verifiable rewards</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. R1, Kimi K1.5, Qwen 3: three answers to how to spend the compute. Source: original synthesis of the lecture and the three reports.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">R1: the clean experiment</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">base plus GRPO, accuracy</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">and format rewards, outcome only</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E7F4EF"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">AIME 79.8%, MATH 97.3%</text>
<text x="196" y="332" font-size="13" fill="#5C6B7A" text-anchor="middle">671B MoE, 37B active, MIT</text>
<text x="196" y="354" font-size="13" fill="#5C6B7A" text-anchor="middle">800K distillation samples</text>
<text x="196" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">RL generates; distillation spreads</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">verifiable rewards:</text>
<text x="472" y="228" font-size="14" fill="#1B2838" text-anchor="middle">the checker is right</text>
<text x="472" y="250" font-size="14" fill="#1B2838" text-anchor="middle">by construction</text>
<text x="472" y="294" font-size="13" fill="#5C6B7A" text-anchor="middle">math and code: the slice</text>
<text x="472" y="316" font-size="13" fill="#5C6B7A" text-anchor="middle">where compute keeps helping</text>
<text x="472" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">AlphaGo's exact win condition</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">for language tasks</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Kimi and Qwen</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">Kimi: best-of-8 curriculum,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">length as a cost to compress</text>
<text x="756" y="258" font-size="14" fill="#1B2838" text-anchor="middle">Qwen: six-stage pipeline,</text>
<text x="756" y="280" font-size="14" fill="#1B2838" text-anchor="middle">RL on 4,000 examples,</text>
<text x="756" y="302" font-size="14" fill="#1B2838" text-anchor="middle">70.6% SWE-bench at 3B active</text>
<rect x="648" y="326" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="354" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">compute is the same;</text>
<text x="756" y="376" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">the spending is the strategy</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">The verifiable slice is real but bounded: math and code check; taste, judgment, and writing have no verifier.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Start from the R1 recipe; add back only what your defects demand: language consistency, length control, safety.</text>
</g>
</svg>
