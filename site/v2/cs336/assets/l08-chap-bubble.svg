<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: killing the bubble</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The bubble is a schedule, free to redesign. Source: lecture pipeline sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the schedule</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">naive: one GPU at a time</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">forward then backward,</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">one batch</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">75% idle tax</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">GPipe: pays fill and drain</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">micro-batches: bubble ~ 1/m</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">p=8, m=32: 1F1B at 22%</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">backward = B + W</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">B: input grads, critical path</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">W: weight grads, a leaf</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the family:</text>
<text x="480" y="312" text-anchor="middle" font-size="14" fill="#1B2838">ZB-H1: W in the gaps</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">ZB-H2: W overlaps forward</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#1B2838">ZB-V: V-shaped, near zero</text>
<text x="480" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">DualPipe: two waves, four chunks</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">B chains continuously</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">W fills the idle gaps</text>
<text x="780" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">backward bubble ~0</text>
<text x="780" y="312" text-anchor="middle" font-size="14" fill="#1B2838">forward fill remains</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#1B2838">ZB-V: near zero total</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">point-to-point bsh traffic:</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">lives on the slowest links</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: W needs its activations, so holding W longer raises</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">peak memory. Every redesign trades memory for utilization.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">DualPipe's lesson: the best pipeline schedule is co-designed with the architecture it serves.</text>
</svg>
