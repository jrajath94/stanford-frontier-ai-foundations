<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Serving pushes past 20 on purpose</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Chinchilla 20:1 trains cheapest. Production overtrains: small, capable, cheap to serve.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- bars: max 160, width 800px scale: 5px per unit -->
<g font-size="14" font-weight="500" fill="#1B2838">
<text x="48" y="168">Chinchilla optimum</text>
<rect x="240" y="148" width="100" height="24" rx="4" fill="#1E4D8C"/>
<text x="352" y="168" fill="#5C6B7A">20</text>
<text x="48" y="208">DeepSeek-V3 (671B, 14.8T)</text>
<rect x="240" y="188" width="110" height="24" rx="4" fill="#1E4D8C"/>
<text x="362" y="208" fill="#5C6B7A">~22</text>
<text x="48" y="248">Kimi K2 (1T, 15.5T)</text>
<rect x="240" y="228" width="80" height="24" rx="4" fill="#1E4D8C"/>
<text x="332" y="248" fill="#5C6B7A">~16</text>
<text x="48" y="288">Llama 3 405B (15.6T)</text>
<rect x="240" y="268" width="195" height="24" rx="4" fill="#C46B2C"/>
<text x="447" y="288" fill="#5C6B7A">~39</text>
<text x="48" y="328">Qwen 3 235B-A22B (36T)</text>
<rect x="240" y="308" width="765" height="24" rx="4" fill="#C46B2C"/>
<text x="240" y="352" fill="#5C6B7A">~153</text>
</g>
<text x="48" y="392" font-size="14" fill="#5C6B7A">tokens per parameter, October 2026, verified from public reports.</text>
<rect x="48" y="412" width="864" height="64" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="440" font-size="14" fill="#1B2838">Read the pattern: V3 sits near the optimum (MoE serves cheaply anyway). Llama 3 overtrains 2x. Qwen 3 goes 7x past.</text>
<text x="72" y="462" font-size="14" fill="#5C6B7A">Serving FLOPs dwarf training FLOPs over a model's life. GPT-4, Gemini, Claude: unknown, never published.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: company technical reports, Oct 2026. Shell 5: the ratio answers how to spend a training budget, not what to ship.</text>
</svg>
