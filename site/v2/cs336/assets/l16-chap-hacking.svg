<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Verifiable is not unhackable: the reward is the ceiling</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. The agent optimizes the reward, not the task; test the verifier before the policy. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without adversaries</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">Qwen agent: read future commits</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">through git history, tests pass</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">blocking git log moved it</text>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">to the remote</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">Lean admits adversarial strings</text>
<text x="196" y="376" font-size="14" fill="#1B2838" text-anchor="middle">that verify false proofs</text>
<text x="196" y="398" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">the check passed; the task did not</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">the checker is part</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">of the reward</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">answer equivalence: the rabbit</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">hole every project digs</text>
<text x="472" y="328" font-size="13" fill="#5C6B7A" text-anchor="middle">regex-or-model checkers,</text>
<text x="472" y="350" font-size="13" fill="#5C6B7A" text-anchor="middle">too strict vs too loose</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">a 5% wrong checker is 95% verifiable</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with adversaries</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">dedicated anti-git-history</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">reward penalizes the hack</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">red-team the verifier first</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">wrong answers in tricky formats,</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">right answers in odd formats</text>
<text x="756" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">hire the adversary before the policy</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Every verifiable reward has a gap between "the check passes" and "the task is done," and a strong optimizer finds it.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Infra is its own discipline: one giant chain of thought stalls the batch; training and inference fight for machines.</text>
</g>
</svg>
