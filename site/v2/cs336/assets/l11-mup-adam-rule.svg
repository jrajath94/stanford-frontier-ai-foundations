<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Adam's per-layer rule: 1/fan-in</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Layer A (fan-in 4096): LR 1/4096. Layer B (fan-in 512): LR 1/512, eight times larger.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: layer A -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">LAYER A: fan-in 4096</text>
<text x="72" y="200" font-size="14" fill="#1B2838">sums over 8x more inputs</text>
<rect x="72" y="224" width="336" height="32" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5"/>
<rect x="72" y="264" width="42" height="32" rx="8" fill="#1E4D8C"/>
<text x="128" y="288" font-size="14" fill="#5C6B7A">LR = 1/4096</text>
<text x="72" y="336" font-size="14" fill="#1B2838">a global step moves its activations</text>
<text x="72" y="360" font-size="14" fill="#1B2838">8x too far: O(8), not O(1).</text>
<text x="72" y="408" font-size="14" fill="#5C6B7A">A1: activations O(1) at init.</text>
<text x="72" y="432" font-size="14" fill="#5C6B7A">A2: O(1) feature learning per step.</text>
<!-- center -->
<text x="448" y="300" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">one global LR</text>
<text x="448" y="324" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">cannot do both</text>
<!-- right: layer B -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">LAYER B: fan-in 512</text>
<text x="504" y="200" font-size="14" fill="#1B2838">narrow: fewer inputs per output</text>
<rect x="504" y="224" width="384" height="32" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5"/>
<rect x="504" y="264" width="336" height="32" rx="8" fill="#1F7A72"/>
<text x="560" y="288" font-size="14" fill="#5C6B7A">LR = 1/512: 8x larger</text>
<text x="504" y="336" font-size="14" fill="#1B2838">keeps its per-step feature learning</text>
<text x="504" y="360" font-size="14" fill="#1B2838">at O(1), like layer A.</text>
<text x="504" y="408" font-size="14" font-weight="600" fill="#1F7A72">per-layer LRs fix the drift</text>
<text x="504" y="432" font-size="14" fill="#5C6B7A">by construction.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture muP slides, original plate. Shell 3: the wide layer sums over more inputs, so each step must be smaller.</text>
</svg>
