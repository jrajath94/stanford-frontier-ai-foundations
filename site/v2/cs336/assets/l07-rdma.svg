<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="500" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">RDMA: cut out the CPU</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Ethernet copies via the CPU kernel. RDMA lets GPUs write each other&#x27;s memory directly.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="380" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">standard Ethernet</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">GPU -&gt; CPU socket buffer</text><line x1="200" y1="220" x2="260" y2="220" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="230.0" y="210" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">copy</text><text x="84" y="290" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">CPU builds packets -&gt; NIC</text><text x="84" y="330" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">high latency</text><rect x="480" y="140" width="420" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="494" y="164" font-size="14" font-weight="700" fill="#5C6B7A">RDMA: NVLink / InfiniBand / RoCE</text><text x="504" y="190" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">GPU writes GPU memory</text><text x="504" y="216" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">no CPU in the path</text><text x="504" y="242" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">RoCE = RDMA over Ethernet</text><text x="36" y="476" font-size="14" fill="#5C6B7A">Source: lecture networking slides, original plate. Shell 3: bypass the middleman.</text></svg>