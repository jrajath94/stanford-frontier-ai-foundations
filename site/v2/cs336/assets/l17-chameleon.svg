<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Chameleon: everything is a token</text><text x="36" y="78" font-size="17" fill="#5C6B7A">VQ-VAE discretizes images. One model, text and images interleaved.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the machinery</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">512x512 image -&gt; 1,024 tokens from an 8,000-code codebook</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">then: plain language-model training. No adapter, no encoder.</text><rect x="60" y="306" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="330" font-size="14" font-weight="700" fill="#5C6B7A">the problems</text><text x="84" y="354" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">image tokens are high-entropy: norms grow, training destabilizes</text><text x="84" y="380" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">discretization loses fine detail (OCR). QK-norm + z-loss mitigate.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture Chameleon slides, original plate. Shell 4: the elegant alternative.</text></svg>