<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">You cannot crawl the whole internet</text><text x="36" y="78" font-size="17" fill="#5C6B7A">&#x27;Trained on the internet&#x27; does not type-check.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">dynamic web</text><rect x="60" y="140" width="10" height="50" rx="5" fill="#5C6B7A"/><text x="84" y="174" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">apps, forms, Discord: crawling is not doing</text><rect x="60" y="202" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="226" font-size="14" font-weight="700" fill="#5C6B7A">deep web</text><rect x="60" y="202" width="10" height="50" rx="5" fill="#5C6B7A"/><text x="84" y="236" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">no hyperlinks to follow</text><rect x="60" y="264" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="288" font-size="14" font-weight="700" fill="#5C6B7A">auth walls</text><rect x="60" y="264" width="10" height="50" rx="5" fill="#5C6B7A"/><text x="84" y="298" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">Facebook, X, LinkedIn, NYT: walled gardens</text><rect x="60" y="326" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="350" font-size="14" font-weight="700" fill="#5C6B7A">robots.txt</text><rect x="60" y="326" width="10" height="50" rx="5" fill="#C46B2C"/><text x="84" y="360" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">Consent in Crisis: ~50% fully restricted by mid-2023</text><rect x="60" y="388" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="412" font-size="14" font-weight="700" fill="#5C6B7A">anti-bot</text><rect x="60" y="388" width="10" height="50" rx="5" fill="#5C6B7A"/><text x="84" y="422" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">Cloudflare, CAPTCHA, IP blocks, rate limits</text><rect x="60" y="450" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="474" font-size="14" font-weight="700" fill="#5C6B7A">terms of service</text><rect x="60" y="450" width="10" height="50" rx="5" fill="#5C6B7A"/><text x="84" y="484" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">&#x27;no AI training&#x27; clauses rising since 2016</text><rect x="60" y="512" width="840" height="50" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="536" font-size="14" font-weight="700" fill="#5C6B7A">licenses</text><rect x="60" y="512" width="10" height="50" rx="5" fill="#5C6B7A"/><text x="84" y="546" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">everything is copyrighted by default</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture crawling + Consent in Crisis slides, original plate. Shell 1: barriers.</text></svg>