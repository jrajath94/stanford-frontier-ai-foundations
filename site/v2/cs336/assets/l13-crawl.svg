<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="644" fill="#F7F4EE"/>
<text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">You cannot crawl the whole internet</text>
<text x="36" y="78" font-size="17" fill="#5C6B7A">&#x27;Trained on the internet&#x27; does not type-check.</text>
<line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/>
<rect x="60" y="140" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="140" width="10" height="56" rx="5" fill="#5C6B7A"/>
<text x="74" y="163" font-size="14" font-weight="700" fill="#5C6B7A">dynamic web</text>
<text x="74" y="182" font-size="13" font-weight="400" fill="#1B2838">apps, forms, Discord: crawling is not doing</text>
<rect x="60" y="204" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="204" width="10" height="56" rx="5" fill="#5C6B7A"/>
<text x="74" y="227" font-size="14" font-weight="700" fill="#5C6B7A">deep web</text>
<text x="74" y="246" font-size="13" font-weight="400" fill="#1B2838">no hyperlinks to follow</text>
<rect x="60" y="268" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="268" width="10" height="56" rx="5" fill="#5C6B7A"/>
<text x="74" y="291" font-size="14" font-weight="700" fill="#5C6B7A">auth walls</text>
<text x="74" y="310" font-size="13" font-weight="400" fill="#1B2838">Facebook, X, LinkedIn, NYT: walled gardens</text>
<rect x="60" y="332" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="332" width="10" height="56" rx="5" fill="#C46B2C"/>
<text x="74" y="355" font-size="14" font-weight="700" fill="#5C6B7A">robots.txt</text>
<text x="74" y="374" font-size="13" font-weight="400" fill="#1B2838">Consent in Crisis: ~50% fully restricted by mid-2023</text>
<rect x="60" y="396" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="396" width="10" height="56" rx="5" fill="#5C6B7A"/>
<text x="74" y="419" font-size="14" font-weight="700" fill="#5C6B7A">anti-bot</text>
<text x="74" y="438" font-size="13" font-weight="400" fill="#1B2838">Cloudflare, CAPTCHA, IP blocks, rate limits</text>
<rect x="60" y="460" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="460" width="10" height="56" rx="5" fill="#5C6B7A"/>
<text x="74" y="483" font-size="14" font-weight="700" fill="#5C6B7A">terms of service</text>
<text x="74" y="502" font-size="13" font-weight="400" fill="#1B2838">&#x27;no AI training&#x27; clauses rising since 2016</text>
<rect x="60" y="524" width="840" height="56" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="524" width="10" height="56" rx="5" fill="#5C6B7A"/>
<text x="74" y="547" font-size="14" font-weight="700" fill="#5C6B7A">licenses</text>
<text x="74" y="566" font-size="13" font-weight="400" fill="#1B2838">everything is copyrighted by default</text>
<text x="36" y="612" font-size="14" fill="#5C6B7A">Source: lecture crawling + Consent in Crisis slides, original plate. Shell 1: barriers.</text>
</svg>
