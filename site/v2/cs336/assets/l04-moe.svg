<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">MoE: 4x the parameters, 1x the FLOPs</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Split the FFN into experts. Route each token to one.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="360" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">BEFORE: one big FFN</text><rect x="150" y="220" width="180" height="100" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="240.0" y="268.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">FFN</text><text x="240.0" y="288.0" font-size="12" fill="#5C6B7A" text-anchor="middle">all tokens</text><text x="90" y="370" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">P params, P FLOPs</text><rect x="480" y="140" width="420" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="494" y="164" font-size="14" font-weight="700" fill="#5C6B7A">AFTER: four experts</text><rect x="500" y="220" width="90" height="100" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="545.0" y="268.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">E1</text><rect x="600" y="220" width="90" height="100" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="645.0" y="268.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">E2</text><text x="645.0" y="288.0" font-size="12" fill="#5C6B7A" text-anchor="middle">active</text><rect x="700" y="220" width="90" height="100" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="745.0" y="268.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">E3</text><rect x="800" y="220" width="90" height="100" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="845.0" y="268.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">E4</text><rect x="620" y="140" width="130" height="44" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="685.0" y="160.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">router</text><text x="685.0" y="180.0" font-size="12" fill="#5C6B7A" text-anchor="middle">token -&gt; E2</text><text x="510" y="370" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">4P params, ~P FLOPs</text><line x1="420" y1="280" x2="480" y2="280" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="450.0" y="270" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">split + route</text><text x="60" y="470" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Mental model: more parameters than you pay for. Switch Transformer: more experts,</text><text x="60" y="496" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">same active params, lower and lower loss. OlMoE: ~2x faster training than dense.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture MoE slides (Fedus et al. 2022), original plate. Shell 5: experts become devices.</text></svg>