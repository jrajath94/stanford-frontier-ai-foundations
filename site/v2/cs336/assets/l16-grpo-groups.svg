<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">GRPO: the group is the baseline</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Six rollouts, mean 0.67, std 0.47. No critic consulted. Shell 3. Source: original toy for the lecture's GRPO section.</text>
<!-- six rollout chips -->
<g font-size="14">
<rect x="64" y="136" width="128" height="64" rx="999" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="128" y="162" text-anchor="middle" fill="#1B2838">r=1</text><text x="128" y="184" text-anchor="middle" fill="#1F7A72" font-size="13">+0.71</text>
<rect x="200" y="136" width="128" height="64" rx="999" fill="#E6E2DA"/><text x="264" y="162" text-anchor="middle" fill="#1B2838">r=0</text><text x="264" y="184" text-anchor="middle" fill="#C46B2C" font-size="13">-1.41</text>
<rect x="336" y="136" width="128" height="64" rx="999" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="400" y="162" text-anchor="middle" fill="#1B2838">r=1</text><text x="400" y="184" text-anchor="middle" fill="#1F7A72" font-size="13">+0.71</text>
<rect x="472" y="136" width="128" height="64" rx="999" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="536" y="162" text-anchor="middle" fill="#1B2838">r=1</text><text x="536" y="184" text-anchor="middle" fill="#1F7A72" font-size="13">+0.71</text>
<rect x="608" y="136" width="128" height="64" rx="999" fill="#E6E2DA"/><text x="672" y="162" text-anchor="middle" fill="#1B2838">r=0</text><text x="672" y="184" text-anchor="middle" fill="#C46B2C" font-size="13">-1.41</text>
<rect x="744" y="136" width="128" height="64" rx="999" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="808" y="162" text-anchor="middle" fill="#1B2838">r=1</text><text x="808" y="184" text-anchor="middle" fill="#1F7A72" font-size="13">+0.71</text>
</g>
<g>
<rect x="64" y="232" width="832" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="266" font-size="15" font-weight="600" fill="#1B2838">the baseline, computed not learned</text>
<text x="80" y="300" font-size="14" fill="#1B2838">mean = 4/6 = 0.67. std = 0.47. advantage = (reward - mean) / std.</text>
<text x="80" y="332" font-size="14" fill="#1B2838">The four correct get +0.71 each: push up. The two wrong get -1.41 each: push down.</text>
<text x="80" y="374" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">The group mean is exact for this prompt: zero bias by construction, no value network, no extra memory.</text>
<text x="80" y="408" font-size="13" fill="#5C6B7A">Online the clipping vanishes (fresh rollouts, ratio = 1): advantage minus KL, one page of code.</text>
</g>
<line x1="64" y1="496" x2="896" y2="496" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="532" font-size="16" font-weight="500" fill="#1B2838">One claim: delete the critic; the group's mean is the baseline and the group's std is the scale.</text>
<text x="64" y="560" font-size="13" fill="#5C6B7A">Numbers computed: mean 0.6667, std 0.4714, advantages +0.707/-1.414. Works where rollouts are cheap to score: math, code.</text>
</svg>
