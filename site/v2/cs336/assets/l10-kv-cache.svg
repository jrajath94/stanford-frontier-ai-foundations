<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The KV cache kills the cube</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Naive: T^3. Causal reuse: prefill once in parallel, decode one token at a time.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">naive</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">each token recomputes</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">all previous keys/values</text><text x="84" y="250" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">T tokens -&gt; O(T^3)</text><rect x="500" y="140" width="400" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">KV cache</text><text x="524" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">causal: past never changes</text><text x="524" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">store K,V per layer/head</text><text x="524" y="250" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">prefill + O(T) decode</text><rect x="60" y="350" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="374" font-size="14" font-weight="700" fill="#5C6B7A">size = B x S x layers x KV-heads x head-dim x 2 (K,V) x 2 bytes</text><text x="84" y="400" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">prefill: encode prompt in parallel, compute-bound. decode: one token, memory-bound.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture KV-cache slides, original plate. Shell 4: cache the past.</text></svg>