<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Micro-batches shrink the bubble</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Idle fraction = (p-1)/(m+p-1). Feed the pipe more work per stage.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: naive p=4 m=1 -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">BEFORE: p=4 stages, m=1 batch</text>
<g>
<rect x="72" y="184" width="336" height="40" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<rect x="72" y="232" width="336" height="40" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="72" y="280" width="336" height="40" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="72" y="328" width="336" height="40" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5" stroke-dasharray="6 4"/>
</g>
<text x="72" y="400" font-size="14" fill="#1B2838">3 of 4 ranks idle at any moment.</text>
<text x="72" y="428" font-size="18" font-weight="700" fill="#C46B2C">idle = 3/4 = 75%</text>
<text x="72" y="456" font-size="14" fill="#5C6B7A">fill-and-drain: p-1 idle slots.</text>
<!-- center arrow -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: p=4 m=8 -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">AFTER: p=4 stages, m=8 micro-batches</text>
<g>
<rect x="504" y="184" width="384" height="40" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<rect x="504" y="232" width="384" height="40" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<rect x="504" y="280" width="384" height="40" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<rect x="504" y="328" width="384" height="40" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
</g>
<text x="504" y="400" font-size="14" fill="#1B2838">the pipe stays mostly full.</text>
<text x="504" y="428" font-size="18" font-weight="700" fill="#1F7A72">idle = 3/11 = 27%</text>
<text x="504" y="456" font-size="14" fill="#5C6B7A">1F1B pays (p-1)/m once: 3/8 = 37.5% total.</text>
<text x="504" y="478" font-size="14" fill="#5C6B7A">Zero-bubble splits B and W: the drain dies.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture pipeline slides, original plate. Shell 4: the bubble is a schedule, not a tax.</text>
</svg>
