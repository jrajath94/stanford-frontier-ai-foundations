<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Filtering: find more of what you want</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Target T (small, good), raw R (huge, messy). Keep the subset of R that looks like T.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">generative</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#D9E6F5"/><text x="84" y="204" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">KenLM 5-gram on T, keep low perplexity (OpenMathText)</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">discriminative</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="314" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">fastText linear: T positive, R sample negative, threshold</text><text x="60" y="380" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Must generalize AND run on 100T tokens. Language ID: easy. Math: 15B tokens that beat 20x.</text><text x="60" y="414" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Quality has no universal definition: define it, then filter for it.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture filtering slides, original plate. Shell 2: the recipe.</text></svg>