<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">SFT masking: loss flows only through the response</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">The mask is what makes SFT conditional, not continuation. Shell 3. Source: original toy for the lecture's masking section.</text>
<!-- before: unmasked -->
<g>
<rect x="64" y="136" width="264" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: no mask</text>
<g font-size="14">
<rect x="88" y="190" width="88" height="40" rx="999" fill="#E6E2DA"/><text x="132" y="215" text-anchor="middle" fill="#1B2838">user</text>
<rect x="184" y="190" width="120" height="40" rx="999" fill="#E6E2DA"/><text x="244" y="215" text-anchor="middle" fill="#1B2838">assistant</text>
</g>
<text x="196" y="270" font-size="14" fill="#1B2838" text-anchor="middle">gradient flows everywhere:</text>
<text x="196" y="292" font-size="14" fill="#1B2838" text-anchor="middle">model learns to predict</text>
<text x="196" y="314" font-size="14" fill="#1B2838" text-anchor="middle">the user's questions too</text>
<text x="196" y="360" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">at inference it role-plays</text>
<text x="196" y="382" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">the user instead of answering</text>
</g>
<polygon points="336,260 352,268 336,276" fill="#1B2838"/>
<!-- rule -->
<g>
<rect x="360" y="136" width="240" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="376" y="186" width="208" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="214" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">loss x mask: 1 on response</text>
<text x="480" y="236" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">tokens, 0 on prompt tokens</text>
<text x="480" y="252" font-size="13" fill="#1B2838" text-anchor="middle">one line of code</text>
<text x="480" y="308" font-size="14" fill="#1B2838" text-anchor="middle">forward pass runs over both:</text>
<text x="480" y="330" font-size="14" fill="#1B2838" text-anchor="middle">context needs the prompt</text>
<text x="480" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">system prompt masked too</text>
</g>
<polygon points="608,260 624,268 608,276" fill="#1B2838"/>
<!-- after: masked -->
<g>
<rect x="632" y="136" width="264" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="764" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: masked</text>
<g font-size="14">
<rect x="656" y="190" width="88" height="40" rx="999" fill="#E6E2DA"/><text x="700" y="215" text-anchor="middle" fill="#1B2838">user</text>
<rect x="752" y="190" width="120" height="40" rx="999" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="812" y="215" text-anchor="middle" fill="#1B2838">assistant</text>
</g>
<text x="764" y="270" font-size="14" fill="#1B2838" text-anchor="middle">gradient flows only through</text>
<text x="764" y="292" font-size="14" fill="#1B2838" text-anchor="middle">the response tokens</text>
<rect x="664" y="312" width="200" height="40" rx="8" fill="#E7F4EF"/>
<text x="764" y="337" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">given user text, produce this</text>
<text x="764" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">conditional, not continuation</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: the mask teaches exactly the tokens the model should generate at inference; everything else is context.</text>
<text x="64" y="516" font-size="13" fill="#5C6B7A">Mask the response instead and the model learns to be the user. Check the mask's coverage before training.</text>
</svg>
