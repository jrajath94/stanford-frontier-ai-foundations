<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the KV cache</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. In a causal model the past never changes: never recompute it. Source: lecture KV sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: K and V</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">run training code per token</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">token t attends over t tokens:</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">O(t&#178;) work per step</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">O(T&#179;) total</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">T=1000: 1e9 attention ops</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">for a paragraph</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">the recomputation is pure waste:</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">the past never changes</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">B x S x layers x KV-heads</text>
<text x="480" y="208" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">x head-dim x 2 x 2 bytes</text>
<text x="480" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">prefill: encode in parallel,</text>
<text x="480" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">fill the cache (compute-bound)</text>
<text x="480" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">decode: one token, append K/V</text>
<text x="480" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">(memory-bound)</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#5C6B7A">Llama2-13B-ish: 3.36GB</text>
<text x="480" y="424" text-anchor="middle" font-size="14" fill="#5C6B7A">reread every token</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">prefill once, decode linear</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">causal: past never changes,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">so caching is exact</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">O(T) decode</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">bidirectional models cannot:</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">a new token changes everything</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">the cache is a direct consequence</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#1B2838">of the causal mask</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: the cache is memory per token. At batch 1 it is 1% of the traffic; past B=108 it dominates parameters.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Everything after is one question: what if less memory is more speed?</text>
</svg>
