<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Two fleets: split by bottleneck</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Prefill is compute-bound once; decode is memory-bound forever. Shell 3. Source: original toy for the lecture's disaggregation section.</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs>
<!-- before: one fleet -->
<g>
<rect x="64" y="136" width="384" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="170" font-size="15" font-weight="600" fill="#1B2838">before: one fleet</text>
<text x="80" y="204" font-size="14" fill="#1B2838">the book-paste takes 5 seconds of</text>
<text x="80" y="226" font-size="14" fill="#1B2838">prefill while 90 chat requests queue</text>
<text x="80" y="248" font-size="14" fill="#1B2838">behind it</text>
<rect x="80" y="270" width="352" height="48" rx="8" fill="#E6E2DA"/>
<text x="256" y="298" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">P99 latency: 5+ seconds</text>
<text x="80" y="352" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="start">static batches wait for the slowest;</text>
<text x="80" y="374" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="start">FIFO is the enemy of SLAs</text>
</g>
<polygon points="456,260 472,268 456,276" fill="#1B2838"/>
<!-- after: two fleets -->
<g>
<rect x="480" y="136" width="416" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="496" y="170" font-size="15" font-weight="600" fill="#1B2838">after: disaggregate</text>
<rect x="496" y="188" width="192" height="72" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="592" y="216" font-size="13" font-weight="600" text-anchor="middle" fill="#1B2838">prefill fleet</text>
<text x="592" y="238" font-size="13" text-anchor="middle" fill="#5C6B7A">tensor-core GPUs</text>
<rect x="704" y="188" width="176" height="72" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="792" y="216" font-size="13" font-weight="600" text-anchor="middle" fill="#1B2838">decode fleet</text>
<text x="792" y="238" font-size="13" text-anchor="middle" fill="#5C6B7A">bandwidth chips</text>
<text x="496" y="300" font-size="14" fill="#1B2838">cache-aware routing: two lines,</text>
<text x="496" y="322" font-size="14" fill="#1B2838">cold pool vs warm pool</text>
<rect x="496" y="340" width="384" height="40" rx="8" fill="#E7F4EF"/>
<text x="688" y="365" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">40% faster serving</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: never let the elephant block the mice; each fleet runs at its own bottleneck's optimum.</text>
<text x="64" y="516" font-size="13" fill="#5C6B7A">The KV cache transfer is the cost: colocate, compress with MLA, or recompute. The 40% win is net, not gross.</text>
</svg>
