<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Megakernel: fuse the layer, overlap everything</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Loads hide behind compute: the memory pipeline never stalls. Shell 3. Source: original toy for the lecture's Megakernel section.</text>
<!-- before: one kernel per op -->
<g>
<rect x="64" y="136" width="832" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="170" font-size="15" font-weight="600" fill="#1B2838">before: one kernel per op</text>
<g font-size="13">
<rect x="80" y="188" width="120" height="48" rx="8" fill="#E6E2DA"/><text x="140" y="216" text-anchor="middle" fill="#1B2838">QKV+RoPE</text>
<rect x="232" y="188" width="120" height="48" rx="8" fill="#E6E2DA"/><text x="292" y="216" text-anchor="middle" fill="#1B2838">attention</text>
<rect x="384" y="188" width="120" height="48" rx="8" fill="#E6E2DA"/><text x="444" y="216" text-anchor="middle" fill="#1B2838">O proj</text>
<rect x="536" y="188" width="120" height="48" rx="8" fill="#E6E2DA"/><text x="596" y="216" text-anchor="middle" fill="#1B2838">MLP</text>
</g>
<text x="80" y="280" font-size="14" fill="#1B2838">Between kernels: launch gaps, tail effects, HBM round trips. The gaps are pure waste: no flops, no useful bytes.</text>
<text x="80" y="312" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="start">SMs idle at every boundary, every layer, every decode step.</text>
</g>
<!-- after: overlapped schedule -->
<g>
<rect x="64" y="352" width="832" height="168" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="386" font-size="15" font-weight="600" fill="#1B2838">after: one kernel, overlapped</text>
<!-- timeline: compute row + load row -->
<g font-size="12">
<text x="80" y="420" fill="#5C6B7A">compute</text>
<rect x="160" y="404" width="200" height="32" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="260" y="425" text-anchor="middle" fill="#1B2838">QKV+RoPE</text>
<rect x="360" y="404" width="200" height="32" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="460" y="425" text-anchor="middle" fill="#1B2838">attention</text>
<rect x="560" y="404" width="200" height="32" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="660" y="425" text-anchor="middle" fill="#1B2838">O proj + MLP</text>
<text x="80" y="468" fill="#5C6B7A">loads</text>
<rect x="280" y="452" width="200" height="32" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="380" y="473" text-anchor="middle" fill="#1B2838">KV cache in flight</text>
<rect x="480" y="452" width="200" height="32" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="580" y="473" text-anchor="middle" fill="#1B2838">O weights in flight</text>
</g>
<text x="80" y="508" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">72% of peak HBM bandwidth. 30-70% faster attention. One Llama-1B layer in one kernel.</text>
</g>
<line x1="64" y1="556" x2="896" y2="556" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="592" font-size="16" font-weight="500" fill="#1B2838">One claim: hand-fit the schedule to the exact shape; the price is one engineer, one hardware, batch 1-16, per year.</text>
</svg>
