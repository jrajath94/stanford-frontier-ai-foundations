<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Speculative decoding arithmetic</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Speedup = (K x r) / (1 + K x c). K=4, draft cost 1/20: cost 1.2 passes per round.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<g font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">
<rect x="48" y="136" width="272" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="184" y="168" font-weight="600">accept all 4</text>
<text x="184" y="220" font-size="28" font-weight="700" fill="#1F7A72">3.3x</text>
<text x="184" y="252">4 / 1.2</text>
<text x="184" y="300" fill="#5C6B7A">distill the draft toward</text>
<text x="184" y="322" fill="#5C6B7A">the target: p hugs q</text>
<text x="184" y="380" font-weight="600" fill="#1F7A72">the draft quality is</text>
<text x="184" y="402" font-weight="600" fill="#1F7A72">the whole game</text>
<rect x="344" y="136" width="272" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="168" font-weight="600">accept 2 of 4</text>
<text x="480" y="220" font-size="28" font-weight="700" fill="#1B2838">1.7x</text>
<text x="480" y="252">2 / 1.2</text>
<text x="480" y="300" fill="#5C6B7A">at 50% acceptance you</text>
<text x="480" y="322" fill="#5C6B7A">still win</text>
<text x="480" y="380" font-weight="600">sweet spot: K = 3-4</text>
<text x="480" y="402" fill="#5C6B7A">too few wastes the check,</text>
<text x="480" y="424" fill="#5C6B7A">too many rejects</text>
<rect x="640" y="136" width="272" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="776" y="168" font-weight="600">accept none</text>
<text x="776" y="220" font-size="28" font-weight="700" fill="#C46B2C">0.83x</text>
<text x="776" y="252">1 / 1.2</text>
<text x="776" y="300" fill="#5C6B7A">still yields the</text>
<text x="776" y="322" fill="#5C6B7A">correction token,</text>
<text x="776" y="344" fill="#5C6B7A">but slower</text>
<text x="776" y="380" font-weight="600" fill="#C46B2C">bad draft: net loss</text>
</g>
<rect x="48" y="456" width="864" height="88" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="484" font-size="15" font-weight="600" fill="#1B2838">The guarantee holds regardless: rejection sampling makes the output</text>
<text x="72" y="506" font-size="15" font-weight="600" fill="#1B2838">exactly the target's distribution. Speed is the only variable.</text>
<text x="72" y="528" font-size="13" fill="#5C6B7A">Cheaper draft raises every outcome. Closer draft raises the numerator. Medusa 2.0x, EAGLE 2.8x, distilled draft 2.7x, MTP 3.4x.</text>
<text x="48" y="560" font-size="13" fill="#5C6B7A">Source: lecture spec-decode slides, original plate. Shell 4: checking beats generating.</text>
</svg>
