<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Tensor parallel cuts the matmuls</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Column cuts on the way up, row cuts on the way down. Small layers replicate.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">one transformer block</text><rect x="90" y="190" width="200" height="60" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="190.0" y="218.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">x -&gt; A</text><text x="190.0" y="238.0" font-size="12" fill="#5C6B7A" text-anchor="middle">column cut</text><rect x="330" y="190" width="140" height="60" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="400.0" y="218.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">GeLU</text><text x="400.0" y="238.0" font-size="12" fill="#5C6B7A" text-anchor="middle">replicated</text><rect x="510" y="190" width="200" height="60" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="610.0" y="218.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">B -&gt; z</text><text x="610.0" y="238.0" font-size="12" fill="#5C6B7A" text-anchor="middle">row cut</text><line x1="290" y1="40" x2="220" y2="40" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="255.0" y="30" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><line x1="470" y1="40" x2="220" y2="40" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="345.0" y="30" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><text x="90" y="300" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">MLP up-projection and attention QKV: column-wise.</text><text x="90" y="326" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">MLP down-projection and attention out: row-wise.</text><rect x="60" y="390" width="840" height="100" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="414" font-size="14" font-weight="700" fill="#5C6B7A">the f/g duality</text><text x="84" y="434" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">forward: f = identity, g = all-reduce. Backward: flipped. Know this to write TP.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture tensor-parallel slides, original plate. Shell 4: cut wide, reduce narrow.</text></svg>