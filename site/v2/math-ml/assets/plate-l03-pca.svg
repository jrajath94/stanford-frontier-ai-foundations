<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img">
<rect x="0" y="0" width="760" height="440" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">PCA by hand: four points, real variance numbers</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Top component (x-axis) holds 80% of the variance. Keep it, drop the rest.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Source: original toy. Project: Stanford Frontier AI.</text>
<text x="736" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="96" width="440" height="260" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Four centered points</text>
<line x1="60" y1="245.0" x2="420" y2="245.0" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="240.0" y1="150" x2="240.0" y2="340" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="81.6" y1="245.0" x2="398.40000000000003" y2="245.0" stroke="#1F7A72" stroke-width="2"/>
<line x1="398.40000000000003" y1="245.0" x2="389.3" y2="240.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="398.40000000000003" y1="245.0" x2="389.3" y2="249.1" stroke="#1F7A72" stroke-width="2"/>
<text x="240.0" y="237.0" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">PC1: variance 2.0</text>
<circle cx="384.0" cy="245.0" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<circle cx="96.0" cy="245.0" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<circle cx="240.0" cy="181.7" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<circle cx="240.0" cy="308.3" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<rect x="492" y="96" width="244" height="260" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="508" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Read the answer</text>
<text x="508" y="158" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">cov = [2 0; 0 0.5]</text>
<text x="508" y="188" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">eigenvalues: 2, 0.5</text>
<text x="508" y="218" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">2 / 2.5 = 80% kept</text>
<text x="508" y="248" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">drop y: 2-D -&gt; 1-D</text>
</svg>