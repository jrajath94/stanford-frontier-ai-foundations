<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Every vector splits uniquely</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">[3,4] = [3,0] + [0,4]: a part on the line, a part perpendicular to it.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: a vector is its space part plus its complement part, uniquely.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original toy</text>
<rect x="24" y="96" width="256" height="280" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="312" y="96" width="136" height="280" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="480" y="96" width="256" height="280" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="280" y1="236" x2="312" y2="236" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="236" x2="302.9" y2="231.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="236" x2="302.9" y2="240.1" stroke="#1F7A72" stroke-width="2"/>
<text x="296.0" y="222" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">project</text>
<line x1="448" y1="236" x2="480" y2="236" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="236" x2="470.9" y2="231.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="236" x2="470.9" y2="240.1" stroke="#1F7A72" stroke-width="2"/>
<text x="464.0" y="222" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">split</text>
<text x="40" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The toy</text>
<text x="40" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">b = [3,4]</text>
<text x="40" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">line: x-axis</text>
<text x="40" y="212" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">a = [1,0]</text>
<text x="328" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Project</text>
<text x="328" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">((a·b)/(a·a))·a</text>
<text x="328" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">= (3/1)·[1,0]</text>
<text x="328" y="212" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="start">drop the ⊥</text>
<text x="496" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The unique split</text>
<text x="496" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">line part: [3,0]</text>
<text x="496" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">complement: [0,4]</text>
<text x="496" y="212" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">[0,4]·[1,0] = 0  ⊥</text>
<text x="496" y="240" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">[3,0]+[0,4]=[3,4]</text>
</svg>
