<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img">
<rect x="0" y="0" width="760" height="440" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Calculus: what is used where</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Derivatives are the engine; the chain rule is the transmission.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Source: standard ML practice. Project: Stanford Frontier AI.</text>
<text x="736" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<text x="24" y="116" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">Math idea</text>
<text x="250" y="116" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">Where it appears</text>
<text x="520" y="116" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">Why there</text>
<line x1="24" y1="124" x2="736" y2="124" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="24" y="128" width="200" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="34" y="152" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">gradient</text>
<text x="250" y="144" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="500" fill="#1B2838" text-anchor="start">every optimizer</text>
<text x="250" y="162" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="start">descent walks against it (L08)</text>
<rect x="24" y="180" width="200" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="34" y="204" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">chain rule</text>
<text x="250" y="196" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="500" fill="#1B2838" text-anchor="start">backprop</text>
<text x="250" y="214" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="start">one backward sweep per network</text>
<rect x="24" y="232" width="200" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="34" y="256" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">Jacobian-vector</text>
<text x="250" y="248" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="500" fill="#1B2838" text-anchor="start">autograd</text>
<text x="250" y="266" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="start">never form the full matrix</text>
<rect x="24" y="284" width="200" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="34" y="308" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">partial derivatives</text>
<text x="250" y="300" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="500" fill="#1B2838" text-anchor="start">sensitivity</text>
<text x="250" y="318" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="start">which input moves the output</text>
</svg>