<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Binomial: exactly k yeses in n trials</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">P(3 spam of 10) = 120 * 0.2^3 * 0.8^7 = 0.201. Mean 2, variance 1.6.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: ways times per-way probability.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="96" width="336" height="280" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="400" y="96" width="336" height="280" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Count the ways</text>
<text x="416" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Probability and moments</text>
<text x="40" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">C(10,3) = 120 orders</text>
<text x="40" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">0.2^3 = 0.008 (the yeses)</text>
<text x="40" y="212" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">0.8^7 = 0.2097 (the nos)</text>
<text x="416" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">P = 120*0.008*0.2097 = 0.201</text>
<text x="416" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">E = np = 2</text>
<text x="416" y="212" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">Var = np(1-p) = 1.6</text>
<line x1="360" y1="236" x2="400" y2="236" stroke="#1F7A72" stroke-width="2"/>
<line x1="400" y1="236" x2="390.9" y2="231.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="400" y1="236" x2="390.9" y2="240.1" stroke="#1F7A72" stroke-width="2"/>
<text x="380" y="222" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">multiply</text>
</svg>