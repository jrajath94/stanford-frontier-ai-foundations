<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: one backward pass</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The chain rule orders the multiplies; backprop runs them once. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: bump each weight</text>
<text x="328" y="124">the chain rule</text>
<text x="648" y="124">WITH: backprop</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">n weights =</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">n forward passes</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">w1 = 3.01: y = 24.08</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">slope 8, one weight</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">at a time</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">dy/dw1 =</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">(dy/dh)(dh/dw1)</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">= 4 x 2 = 8</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">ordered product</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">of Jacobians</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">one forward,</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">one backward</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">dy/dw2 = 6,</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">dy/dw1 = 8</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">bump test agrees</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: activations are stored for the backward pass; 0.9^10 = 0.35 vanishes, 1.1^10 = 2.59 explodes.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: L08 walks downhill along this gradient; the step size decides everything.</text>
</svg>
