<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img">
<rect x="0" y="0" width="760" height="440" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Covariance: how two variables move together</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Cov = 1.33 on three collinear points. Var(X+Y) = 6: the +2Cov term added 2.67.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Source: original arithmetic. Project: Stanford Frontier AI.</text>
<text x="736" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="96" width="360" height="260" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="56" y1="130" x2="56" y2="330" stroke="#1B2838" stroke-width="1.5"/>
<line x1="56" y1="330" x2="336" y2="330" stroke="#1B2838" stroke-width="1.5"/>
<line x1="56.0" y1="390.0" x2="336.0" y2="109.99999999999997" stroke="#1F7A72" stroke-width="2.5"/>
<circle cx="102.7" cy="310.0" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<text x="112.66666666666666" y="302.0" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">(1,2)</text>
<circle cx="196.0" cy="230.0" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<text x="206.0" y="222.0" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">(2,4)</text>
<circle cx="289.3" cy="150.0" r="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<text x="299.33333333333337" y="142.0" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">(3,6)</text>
<rect x="408" y="96" width="328" height="260" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="424" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The variance inflation</text>
<text x="424" y="158" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">Cov = [(1-2)(2-4) + 0 + (1)(2)]/3</text>
<text x="424" y="188" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">    = 1.33 (positive: rising)</text>
<text x="424" y="218" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">Var(X)=0.67, Var(Y)=2.67</text>
<text x="424" y="248" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">Var(X+Y) = 0.67+2.67+2*1.33</text>
<text x="424" y="278" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">         = 6.00</text>
</svg>