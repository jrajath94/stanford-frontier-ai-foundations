<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img">
<rect x="0" y="0" width="760" height="640" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">MATH-ML: if this, then that</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Decision rules. Read the left, do the right.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="624" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Source: the ten lessons. Project: Stanford Frontier AI.</text>
<text x="736" y="624" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="98" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="123" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF features look duplicated</text>
<line x1="330" y1="118" x2="352" y2="118" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="118" x2="342.9" y2="113.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="118" x2="342.9" y2="122.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="98" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="123" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN check det(X^T X); drop or regularize</text>
<rect x="24" y="144" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="169" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF loss explodes mid-training</text>
<line x1="330" y1="164" x2="352" y2="164" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="164" x2="342.9" y2="159.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="164" x2="342.9" y2="168.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="144" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="169" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN learning rate too big: halve eta</text>
<rect x="24" y="190" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="215" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF rare class, 99% accuracy</text>
<line x1="330" y1="210" x2="352" y2="210" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="210" x2="342.9" y2="205.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="210" x2="342.9" y2="214.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="190" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="215" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN report precision and recall, not accuracy</text>
<rect x="24" y="236" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="261" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF need direction, not size</text>
<line x1="330" y1="256" x2="352" y2="256" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="256" x2="342.9" y2="251.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="256" x2="342.9" y2="260.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="236" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="261" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN cosine, not dot product</text>
<rect x="24" y="282" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="307" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF matrix not square</text>
<line x1="330" y1="302" x2="352" y2="302" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="302" x2="342.9" y2="297.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="302" x2="342.9" y2="306.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="282" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="307" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN SVD, not eigen-decomposition</text>
<rect x="24" y="328" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="353" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF slow-decaying spectrum</text>
<line x1="330" y1="348" x2="352" y2="348" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="348" x2="342.9" y2="343.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="348" x2="342.9" y2="352.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="328" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="353" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN do not truncate: compression will hurt</text>
<rect x="24" y="374" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="399" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF noise has outliers</text>
<line x1="330" y1="394" x2="352" y2="394" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="394" x2="342.9" y2="389.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="394" x2="342.9" y2="398.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="374" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="399" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN squared loss is wrong: use absolute</text>
<rect x="24" y="420" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="445" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF q assigns 0 to a live event</text>
<line x1="330" y1="440" x2="352" y2="440" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="440" x2="342.9" y2="435.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="440" x2="342.9" y2="444.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="420" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="445" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN smooth: infinite loss otherwise</text>
<rect x="24" y="466" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="491" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF KL looks symmetric</text>
<line x1="330" y1="486" x2="352" y2="486" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="486" x2="342.9" y2="481.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="486" x2="342.9" y2="490.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="466" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="491" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN it is not: KL(p||q) != KL(q||p)</text>
<rect x="24" y="512" width="300" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="537" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1B2838" text-anchor="start">IF covariance is zero</text>
<line x1="330" y1="532" x2="352" y2="532" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="532" x2="342.9" y2="527.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="352" y1="532" x2="342.9" y2="536.1" stroke="#1F7A72" stroke-width="2"/>
<rect x="356" y="512" width="380" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="368" y="537" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1B2838" text-anchor="start">THEN not independence: try y = x^2</text>
</svg>