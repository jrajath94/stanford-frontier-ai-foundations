<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="28" font-weight="600" fill="#1B2838" text-anchor="start">Power iteration converges to the top eigenvector</text>
<text x="24" y="64" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Three steps: [1,0] to [0.911,0.413], near [0.894,0.447].</text>
<text x="24" y="86" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Rayleigh quotient 4.96 vs true 5.</text>
<line x1="24" y1="100" x2="736" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: repeating Cx converges to the top eigenvector.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
