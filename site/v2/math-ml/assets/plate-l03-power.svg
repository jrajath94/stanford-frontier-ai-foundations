<text x="296.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">iterate</text>
<line x1="448" y1="252" x2="480" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="464.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">estimate</text>
<text x="40" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Three steps</text>
<text x="40" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">x0 = [1,0]</text>
<text x="40" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">x1 = [0.970,0.243]</text>
<text x="40" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">x2 = [0.932,0.362]</text>
<text x="40" y="256" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">x3 = [0.911,0.413]</text>
<text x="328" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Iterate</text>
<text x="328" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">x ← Cx/‖Cx‖</text>
<text x="496" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Converged</text>
