<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: what cosine buys</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Size fools the dot product. Cosine divides size out. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the raw dot product</text>
<text x="328" y="124">the norm</text>
<text x="648" y="124">WITH: cosine</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">A scores 3</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">A3 scores 9</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">3x the score,</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">same words</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">length wins by cheating</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">||x|| = sqrt(sum xi^2)</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">||A|| = 2.24</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">||A3|| = 6.71</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">2.24 x 1.73 = 3.87</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">size, measured alone</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">3 / 3.87 = 0.77</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">9 / 11.6 = 0.77</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">identical</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">tweet matches article</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">direction only</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: cosine throws size away; when size carries signal (spending behavior), trust distance.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: L02 stacks these vectors into matrices, so one call scores a whole batch.</text>
</svg>
