<text x="24" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Source: standard ML practice. Project: Stanford Frontier AI.</text>
<text x="736" y="424" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
