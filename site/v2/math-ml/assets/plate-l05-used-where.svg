<text x="34" y="152" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">Bayes rule</text>
<text x="250" y="144" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="500" fill="#1B2838" text-anchor="start">naive Bayes (CS229 L05)</text>
<text x="250" y="162" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="start">priors x likelihoods, classify by posterior</text>
