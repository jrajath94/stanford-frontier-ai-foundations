<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Probability: what is used where</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Every classifier is a bet priced by these rules.</text>
