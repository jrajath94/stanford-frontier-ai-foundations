<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the honest price of compression</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. SVD writes any matrix as stretch pieces; truncation drops the small ones. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: full rank</text>
<text x="328" y="124">the spectrum</text>
<text x="648" y="124">WITH: rank-64</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">4096x4096 =</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">16,777,216 numbers</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">full memory,</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">full compute</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">no structure used</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">A = U Sigma V^T</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">sigma = [5, 3] (toy)</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">rank = nonzero sigma</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">error = dropped sigma</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">Eckart-Young: optimal</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">64 x 8193 =</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">524,352 numbers</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">32x fewer numbers</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">LoRA updates the pieces</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">same behavior, less</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: every dropped sigma is permanent error; computing the SVD itself costs O(n^3).</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: L08 reads this spectrum as a valley: kappa = sigma-max / sigma-min.</text>
</svg>
