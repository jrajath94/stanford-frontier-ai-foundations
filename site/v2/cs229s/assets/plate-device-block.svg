<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
  <text x="480" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B2838">The device block</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" fill="#5C6B7A">One symbol for the machine you rent. MS&amp;E435 reuses this block.</text>

  <!-- One GPU -->
  <rect x="40" y="100" width="270" height="400" rx="14" fill="#FFFDF8" stroke="#1B2838" stroke-width="2.5"/>
  <text x="175" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B2838">One GPU (device)</text>

  <rect x="60" y="148" width="230" height="92" rx="10" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
  <text x="175" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2838">Streaming multiprocessors</text>
  <text x="175" y="196" text-anchor="middle" font-size="13" fill="#5C6B7A">108 SMs on an A100</text>
  <text x="175" y="218" text-anchor="middle" font-size="13" fill="#5C6B7A">warps of 32 threads run here</text>

  <rect x="60" y="252" width="230" height="92" rx="10" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
  <text x="175" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2838">On-chip memory</text>
  <text x="175" y="300" text-anchor="middle" font-size="13" fill="#5C6B7A">registers 256 KB / SM</text>
  <text x="175" y="322" text-anchor="middle" font-size="13" fill="#5C6B7A">shared memory 192 KB / SM</text>

  <rect x="60" y="356" width="230" height="60" rx="10" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
  <text x="175" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2838">L2 cache, 40 MB</text>

  <rect x="60" y="428" width="230" height="56" rx="10" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
  <text x="175" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2838">HBM device memory, 40 GB</text>
  <text x="175" y="474" text-anchor="middle" font-size="13" fill="#5C6B7A">2 TB/s on an A100</text>

  <!-- arrows inside GPU -->
  <line x1="175" y1="240" x2="175" y2="252" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="175" y1="344" x2="175" y2="356" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="175" y1="416" x2="175" y2="428" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="60" y="548" font-size="13" fill="#5C6B7A">A kernel is one GPU operation.</text>
  <text x="60" y="568" font-size="13" fill="#5C6B7A">Threads load from HBM, compute, write back.</text>

  <!-- One node -->
  <rect x="350" y="100" width="270" height="400" rx="14" fill="#FFFDF8" stroke="#1B2838" stroke-width="2.5"/>
  <text x="485" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B2838">One node (8 GPUs)</text>
  <g>
    <rect x="370" y="148" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="426" y="183" text-anchor="middle" font-size="13" fill="#1B2838">GPU 0</text>
    <rect x="490" y="148" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="546" y="183" text-anchor="middle" font-size="13" fill="#1B2838">GPU 1</text>
    <rect x="370" y="216" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="426" y="251" text-anchor="middle" font-size="13" fill="#1B2838">GPU 2</text>
    <rect x="490" y="216" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="546" y="251" text-anchor="middle" font-size="13" fill="#1B2838">GPU 3</text>
    <rect x="370" y="284" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="426" y="319" text-anchor="middle" font-size="13" fill="#1B2838">GPU 4</text>
    <rect x="490" y="284" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="546" y="319" text-anchor="middle" font-size="13" fill="#1B2838">GPU 5</text>
    <rect x="370" y="352" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="426" y="387" text-anchor="middle" font-size="13" fill="#1B2838">GPU 6</text>
    <rect x="490" y="352" width="112" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="546" y="387" text-anchor="middle" font-size="13" fill="#1B2838">GPU 7</text>
  </g>
  <text x="485" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F7A72">NVLink inside the node</text>
  <text x="485" y="470" text-anchor="middle" font-size="13" fill="#5C6B7A">all 8 GPUs talk fast to each other</text>
  <text x="370" y="548" font-size="13" fill="#5C6B7A">Tensor parallelism lives here.</text>
  <text x="370" y="568" font-size="13" fill="#5C6B7A">Its all-reduces need this speed.</text>

  <!-- Cluster -->
  <rect x="660" y="100" width="260" height="400" rx="14" fill="#FFFDF8" stroke="#1B2838" stroke-width="2.5"/>
  <text x="790" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B2838">Many nodes (cluster)</text>
  <rect x="680" y="148" width="220" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="790" y="190" text-anchor="middle" font-size="13" fill="#1B2838">Node A (8 GPUs)</text>
  <rect x="680" y="238" width="220" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="790" y="280" text-anchor="middle" font-size="13" fill="#1B2838">Node B (8 GPUs)</text>
  <rect x="680" y="328" width="220" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="790" y="370" text-anchor="middle" font-size="13" fill="#1B2838">Node C (8 GPUs)</text>
  <text x="790" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#C46B2C">InfiniBand between nodes</text>
  <text x="790" y="452" text-anchor="middle" font-size="13" fill="#5C6B7A">much slower than NVLink</text>
  <text x="680" y="548" font-size="13" fill="#5C6B7A">Data parallelism lives here.</text>
  <text x="680" y="568" font-size="13" fill="#5C6B7A">Its all-reduces are rarer and bigger.</text>

  <!-- connect node to cluster -->
  <line x1="620" y1="260" x2="660" y2="183" stroke="#1E4D8C" stroke-width="2"/>
  <line x1="620" y1="300" x2="660" y2="273" stroke="#1E4D8C" stroke-width="2"/>
  <text x="640" y="345" text-anchor="middle" font-size="12" fill="#1E4D8C">InfiniBand</text>

  <line x1="310" y1="520" x2="310" y2="520" stroke="#1B2838" stroke-width="0"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#1B2838" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="480" y="600" text-anchor="middle" font-size="15" fill="#1B2838">Key idea: the machine is a memory hierarchy. Algorithms win by moving less data across it.</text>
</svg>
