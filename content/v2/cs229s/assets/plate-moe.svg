<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="#F7F4EE"/>
  <text x="480" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B2838">Dense model vs. mixture of experts</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" fill="#5C6B7A">One rule: route each token to a few experts, not all of them.</text>

  <text x="120" y="112" font-size="16" font-weight="bold" fill="#1B2838">Dense: every token uses the whole layer</text>
  <rect x="120" y="128" width="260" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
  <rect x="150" y="160" width="200" height="56" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
  <text x="250" y="194" text-anchor="middle" font-size="14" fill="#1B2838">full MLP layer</text>
  <circle cx="250" cy="270" r="26" fill="#1F7A72"/>
  <text x="250" y="276" text-anchor="middle" font-size="15" fill="#FFFDF8">x</text>
  <line x1="250" y1="216" x2="250" y2="244" stroke="#1B2838" stroke-width="2"/>
  <text x="250" y="356" text-anchor="middle" font-size="13" fill="#5C6B7A">all weights touch every token</text>

  <text x="600" y="112" font-size="16" font-weight="bold" fill="#1B2838">Sparse: the gate picks 1 or 2 experts</text>
  <rect x="520" y="128" width="320" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
  <g>
    <rect x="540" y="152" width="120" height="44" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="600" y="180" text-anchor="middle" font-size="13" fill="#1B2838">expert 1</text>
    <rect x="676" y="152" width="120" height="44" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="736" y="180" text-anchor="middle" font-size="13" fill="#1B2838">expert 2</text>
    <rect x="540" y="208" width="120" height="44" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="600" y="236" text-anchor="middle" font-size="13" fill="#5C6B7A">expert 3</text>
    <rect x="676" y="208" width="120" height="44" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="736" y="236" text-anchor="middle" font-size="13" fill="#5C6B7A">expert 4</text>
  </g>
  <rect x="630" y="262" width="130" height="40" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
  <text x="695" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2838">gate</text>
  <circle cx="695" cy="330" r="0"/>
  <line x1="600" y1="196" x2="660" y2="262" stroke="#1F7A72" stroke-width="2.5"/>
  <line x1="736" y1="196" x2="710" y2="262" stroke="#1F7A72" stroke-width="2.5"/>
  <text x="680" y="356" text-anchor="middle" font-size="13" fill="#5C6B7A">only green experts compute</text>

  <text x="480" y="412" text-anchor="middle" font-size="15" fill="#1B2838">Key idea: total capacity grows (more experts), cost per token stays flat (few active).</text>
  <text x="480" y="440" text-anchor="middle" font-size="13" fill="#5C6B7A">Shazeer, Mirhoseini et al., 2017. Switch Transformers, Fedus et al., 2021.</text>
</svg>
