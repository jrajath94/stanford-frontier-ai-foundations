      <rect x="640" y="132" width="52" height="26" rx="5" fill="#C46B2C"/><text x="666" y="150" fill="#FFFDF8">B2</text>
      <rect x="696" y="132" width="52" height="26" rx="5" fill="#C46B2C"/><text x="722" y="150" fill="#FFFDF8">B1</text>
    </g>
    <g>
      <text x="60" y="186" text-anchor="start" font-size="13" fill="#1B2838" font-weight="bold">Stage 2</text>
      <rect x="140" y="168" width="52" height="26" rx="5" fill="#E6E2DA"/><text x="166" y="186" fill="#5C6B7A">idle</text>
      <rect x="196" y="168" width="52" height="26" rx="5" fill="#1F7A72"/><text x="222" y="186" fill="#FFFDF8">F1</text>
