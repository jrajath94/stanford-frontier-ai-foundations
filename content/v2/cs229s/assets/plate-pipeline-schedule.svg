      <rect x="196" y="132" width="52" height="26" rx="5" fill="#1F7A72"/><text x="222" y="150" fill="#FFFDF8">F2</text>
      <rect x="252" y="132" width="52" height="26" rx="5" fill="#1F7A72"/><text x="278" y="150" fill="#FFFDF8">F3</text>
      <rect x="308" y="132" width="52" height="26" rx="5" fill="#1F7A72"/><text x="334" y="150" fill="#FFFDF8">F4</text>
