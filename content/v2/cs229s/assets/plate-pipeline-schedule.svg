      <rect x="276" y="464" width="44" height="26" rx="5" fill="#1F7A72"/><text x="298" y="482" fill="#FFFDF8">F1</text>
      <rect x="324" y="464" width="44" height="26" rx="5" fill="#1F7A72"/><text x="346" y="482" fill="#FFFDF8">F2</text>
      <rect x="372" y="464" width="44" height="26" rx="5" fill="#1F7A72"/><text x="394" y="482" fill="#FFFDF8">F3</text>
