      <text x="60" y="258" text-anchor="start" font-size="13" fill="#1B2838" font-weight="bold">Stage 4</text>
      <rect x="140" y="240" width="156" height="26" rx="5" fill="#E6E2DA"/><text x="218" y="258" fill="#5C6B7A">idle</text>
      <rect x="300" y="240" width="52" height="26" rx="5" fill="#1F7A72"/><text x="326" y="258" fill="#FFFDF8">F1</text>
