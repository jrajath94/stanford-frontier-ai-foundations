  <text x="40" y="520" font-size="14" fill="#1F7A72">Smaller bubbles. Same work, less idle time. More microbatches shrink the bubble further.</text>
  <text x="40" y="544" font-size="14" fill="#1B2838">Teal = forward. Orange = backward. Gray = idle. 4 stages, 4 microbatches.</text>
