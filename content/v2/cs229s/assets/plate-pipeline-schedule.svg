<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#F7F4EE"/>
  <text x="480" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B2838">Pipeline parallelism: bubbles cost money</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" fill="#5C6B7A">Split the layers across devices in space, split the batch across time.</text>

  <!-- GPipe -->
