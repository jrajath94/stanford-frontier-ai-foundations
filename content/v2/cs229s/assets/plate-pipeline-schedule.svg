      <rect x="616" y="356" width="44" height="26" rx="5" fill="#C46B2C"/><text x="638" y="374" fill="#FFFDF8">B2</text>
      <rect x="664" y="356" width="44" height="26" rx="5" fill="#1F7A72"/><text x="686" y="374" fill="#FFFDF8">F2</text>
      <rect x="712" y="356" width="44" height="26" rx="5" fill="#C46B2C"/><text x="734" y="374" fill="#FFFDF8">B1</text>
