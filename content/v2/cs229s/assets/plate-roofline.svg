<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#F7F4EE"/>
  <text x="480" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B2838">Arithmetic intensity picks your bottleneck</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" fill="#5C6B7A">FLOPs per byte. Compare it to the machine's ridge: 161 FLOPs/byte on an A100.</text>

  <!-- axes -->
  <line x1="120" y1="440" x2="880" y2="440" stroke="#1B2838" stroke-width="2"/>
  <line x1="120" y1="440" x2="120" y2="120" stroke="#1B2838" stroke-width="2"/>
  <text x="500" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Arithmetic intensity (FLOPs per byte), log scale</text>
  <text x="70" y="280" text-anchor="middle" font-size="15" fill="#1B2838" transform="rotate(-90 70 280)">Performance (GFLOPs/s)</text>

  <!-- roofline: memory slope then compute ceiling -->
  <polyline points="150,400 470,160 860,160" fill="none" stroke="#1B2838" stroke-width="3"/>
  <line x1="470" y1="160" x2="470" y2="440" stroke="#D9D3C7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="462" text-anchor="middle" font-size="13" fill="#1E4D8C">ridge = 161</text>
  <text x="300" y="240" font-size="14" fill="#5C6B7A" transform="rotate(-38 300 240)">memory roof</text>
  <text x="660" y="140" font-size="14" fill="#5C6B7A">compute roof</text>

  <!-- points -->
  <g font-size="13">
    <circle cx="300" cy="330" r="10" fill="#C46B2C"/>
    <text x="300" y="362" text-anchor="middle" fill="#1B2838">small matmul, AI 124</text>
    <text x="300" y="380" text-anchor="middle" fill="#5C6B7A">memory bound</text>
    <circle cx="640" cy="160" r="10" fill="#1F7A72"/>
    <text x="640" y="196" text-anchor="middle" fill="#1B2838">large matmul, AI 2731</text>
    <text x="640" y="214" text-anchor="middle" fill="#5C6B7A">compute bound</text>
    <circle cx="220" cy="386" r="10" fill="#1E4D8C"/>
    <text x="220" y="418" text-anchor="middle" fill="#1B2838">naive attention</text>
    <text x="220" y="436" text-anchor="middle" fill="#5C6B7A">memory bound</text>
  </g>

  <text x="480" y="518" text-anchor="middle" font-size="15" fill="#1B2838">Key idea: left of the ridge, buy bandwidth. Right of the ridge, buy compute. Numbers from the lecture slides.</text>
</svg>
