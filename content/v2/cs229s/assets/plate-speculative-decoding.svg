<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#F7F4EE"/>
  <text x="480" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B2838">Speculative decoding</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" fill="#5C6B7A">Decoding is memory bound. Guessing is cheap. Checking is one big batch.</text>

  <text x="60" y="112" font-size="16" font-weight="bold" fill="#1B2838">1. A small draft model guesses the next tokens</text>
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="128" width="90" height="52" rx="10" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/><text x="105" y="160" fill="#1B2838">the</text>
    <rect x="162" y="128" width="90" height="52" rx="10" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/><text x="207" y="160" fill="#1B2838">cat</text>
    <rect x="264" y="128" width="90" height="52" rx="10" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="309" y="160" fill="#1B2838">sat</text>
    <rect x="366" y="128" width="90" height="52" rx="10" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="411" y="160" fill="#1B2838">on</text>
    <rect x="468" y="128" width="90" height="52" rx="10" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="513" y="160" fill="#1B2838">the</text>
  </g>
  <text x="60" y="206" font-size="13" fill="#5C6B7A">prompt tokens (blue) plus 3 guessed tokens (green). A draft model ~15x smaller does this fast.</text>

  <text x="60" y="244" font-size="16" font-weight="bold" fill="#1B2838">2. The big model checks all guesses in one parallel batch</text>
  <rect x="60" y="260" width="840" height="70" rx="10" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
  <text x="480" y="288" text-anchor="middle" font-size="14" fill="#1B2838">One forward pass over prompt + 3 guesses. Same memory reads as 1 token.</text>
  <text x="480" y="312" text-anchor="middle" font-size="13" fill="#5C6B7A">Verify: does the big model agree with each guess?</text>

  <text x="60" y="368" font-size="16" font-weight="bold" fill="#1B2838">3. Accept the agreed prefix, keep the rest</text>
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="384" width="90" height="52" rx="10" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="105" y="416" fill="#1B2838">sat</text>
    <rect x="162" y="384" width="90" height="52" rx="10" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="207" y="416" fill="#1B2838">on</text>
    <rect x="264" y="384" width="90" height="52" rx="10" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="309" y="416" fill="#5C6B7A">the</text>
    <text x="380" y="416" font-size="16" fill="#1B2838">&#10003; &#10003;</text>
    <text x="440" y="416" font-size="16" fill="#C46B2C">&#10007; discard</text>
  </g>
  <text x="60" y="462" font-size="13" fill="#5C6B7A">"the" was rejected, so the big model samples the correct token there instead. Net: 2 free tokens for the price of one decode.</text>

  <text x="480" y="504" text-anchor="middle" font-size="15" fill="#1B2838">Result on Chinchilla 70B, T5 11B, LaMDA 137B: 2-3x speedup. Source: Leviathan &amp; Kalman et al., 2023.</text>
</svg>
