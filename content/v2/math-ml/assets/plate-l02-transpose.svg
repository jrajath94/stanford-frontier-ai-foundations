<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Transpose flips rows and columns</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">(AB)^T = B^T A^T: both equal [5 1; 2 1]. Order flips.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: the transpose flips, and reverses product order.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="96" width="336" height="280" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="400" y="96" width="336" height="280" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Flip M</text>
<text x="416" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">(AB)^T vs B^T A^T</text>
<text x="40" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">M  = [ 2 1 ; 0 3 ]</text>
<text x="40" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">M^T = [ 2 0 ; 1 3 ]</text>
<text x="416" y="156" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">(AB)^T  = [ 5 1 ; 2 1 ]</text>
<text x="416" y="184" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">B^T A^T = [ 5 1 ; 2 1 ]</text>
<text x="416" y="212" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#5C6B7A" text-anchor="start">M^T M never has negative eigenvalues</text>
<line x1="360" y1="236" x2="400" y2="236" stroke="#1F7A72" stroke-width="2"/>
<line x1="400" y1="236" x2="390.9" y2="231.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="400" y1="236" x2="390.9" y2="240.1" stroke="#1F7A72" stroke-width="2"/>
<text x="380" y="222" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">order</text>
</svg>