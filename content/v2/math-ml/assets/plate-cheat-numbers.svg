<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img">
<rect x="0" y="0" width="760" height="560" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">MATH-ML: the ten numbers that matter</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">One number per lesson. If you remember these, you remember the course.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="544" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Source: the ten lessons. Project: Stanford Frontier AI.</text>
<text x="736" y="544" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="98" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="123" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L01 cosine</text>
<text x="180" y="123" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">0.77</text>
<text x="360" y="123" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">direction, not size</text>
<rect x="24" y="144" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="169" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L02 rotation</text>
<text x="180" y="169" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">[-2, 1]</text>
<text x="360" y="169" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">[0 -1; 1 0] turns [1,2]</text>
<rect x="24" y="190" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="215" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L03 eigen</text>
<text x="180" y="215" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">l = 3, 2</text>
<text x="360" y="215" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">[1,1] triples, [1,0] doubles</text>
<rect x="24" y="236" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="261" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L04 SVD</text>
<text x="180" y="261" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">s = 5, 0</text>
<text x="360" y="261" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">rank 1; drop s2, error = s2</text>
<rect x="24" y="282" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="307" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L05 Bayes</text>
<text x="180" y="307" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">8.8%</text>
<text x="360" y="307" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">95% test, 1% base rate</text>
<rect x="24" y="328" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="353" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L06 binomial</text>
<text x="180" y="353" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">0.201</text>
<text x="360" y="353" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">exactly 3 of 10 at p=0.2</text>
<rect x="24" y="374" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="399" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L07 backprop</text>
<text x="180" y="399" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">dy/dw1 = 8</text>
<text x="360" y="399" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">chain: 4 x 2</text>
<rect x="24" y="420" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="445" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L08 step</text>
<text x="180" y="445" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">eta &lt; 1</text>
<text x="360" y="445" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">eta=1.1 diverges</text>
<rect x="24" y="466" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="491" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L09 fit</text>
<text x="180" y="491" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">w = 1.0357</text>
<text x="360" y="491" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">14 w = 14.5</text>
<rect x="24" y="512" width="130" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="36" y="537" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">L10 loss</text>
<text x="180" y="537" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#1F7A72" text-anchor="start">0.515 bits</text>
<text x="360" y="537" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">truth [1,0], pred [0.7,0.3]</text>
</svg>