<text x="24" y="380" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Exam rule of thumb:</text>
<text x="24" y="408" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">every interview question is one of these five moves;</text>
