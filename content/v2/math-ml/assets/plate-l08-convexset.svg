<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">A convex set holds every segment</text>
<text x="24" y="66" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Disk: the segment between any two points stays inside. Crescent: it escapes.</text>
<line x1="24" y1="80" x2="736" y2="80" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: convexity is the segment test; the disk passes, the crescent fails.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original toy</text>
<rect x="24" y="96" width="256" height="280" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="312" y="96" width="136" height="280" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="480" y="96" width="256" height="280" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="280" y1="236" x2="312" y2="236" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="236" x2="302.9" y2="231.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="236" x2="302.9" y2="240.1" stroke="#1F7A72" stroke-width="2"/>
<text x="296.0" y="222" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">segment test</text>
<line x1="448" y1="236" x2="480" y2="236" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="236" x2="470.9" y2="231.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="236" x2="470.9" y2="240.1" stroke="#1F7A72" stroke-width="2"/>
<text x="464.0" y="222" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">check</text>
<text x="40" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Convex</text>
<circle cx="152" cy="244" r="88" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<line x1="100" y1="200" x2="210" y2="290" stroke="#1F7A72" stroke-width="2"/>
<circle cx="100" cy="200" r="5" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/><text x="88" y="196" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="start">A</text>
<circle cx="210" cy="290" r="5" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/><text x="216" y="306" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="start">B</text>
<text x="40" y="348" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">disk: ||w|| &lt;= 1</text>
<text x="40" y="368" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="start">segment stays inside</text>
<text x="328" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Test</text>
<text x="328" y="172" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">take any two</text>
<text x="328" y="196" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">points in the set</text>
<text x="328" y="228" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">all of AB</text>
<text x="328" y="252" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="start">inside?</text>
<text x="496" y="126" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Not convex</text>
<path d="M 620,175 A 88 88 0 1 0 620,313 A 76 76 0 0 1 620,175 Z" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<line x1="620" y1="175" x2="620" y2="313" stroke="#C46B2C" stroke-width="2"/>
<circle cx="620" cy="175" r="5" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/><text x="600" y="168" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#C46B2C" text-anchor="start">A</text>
<circle cx="620" cy="313" r="5" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/><text x="600" y="332" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#C46B2C" text-anchor="start">B</text>
<text x="496" y="348" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">crescent moon</text>
<text x="496" y="368" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#C46B2C" text-anchor="start">segment escapes</text>
</svg>
