<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: keep the stretch that matters</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Eigen-decomposition finds the stretch directions; PCA keeps the biggest. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: all directions</text>
<text x="328" y="124">eigenpairs</text>
<text x="648" y="124">WITH: top-k</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">C = [2 0; 0 0.5]</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">variance 2.5 in 2 dims</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">12,288 dims:</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">n^3 = ~2T ops</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">pay the full price</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">Av = lambda v</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">lambda = 2.0 (80%)</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">lambda = 0.5 (20%)</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">perpendicular</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">when symmetric</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">x-axis keeps 2/2.5</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">= 80% of the spread</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">1 dim, 80% kept</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">power iteration finds it</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">drop the y-axis</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: the dropped 20% is gone; non-square or defective matrices break the recipe.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: L04's SVD does this for rectangles, where eigenvalues do not exist.</text>
</svg>
