<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">The denominator, derived</text>
<text x="24" y="64" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">P(positive) = 0.0095 + 0.0990 = 0.1085.</text>
<text x="24" y="86" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Every hypothesis contributes its share.</text>
<line x1="24" y1="100" x2="736" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: the denominator sums every hypothesis share.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original</text>
<rect x="24" y="112" width="256" height="264" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="312" y="112" width="136" height="264" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="480" y="112" width="256" height="264" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="280" y1="252" x2="312" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="252" x2="302.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="252" x2="302.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="296.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">weight</text>
<line x1="448" y1="252" x2="480" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="464.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">add</text>
<text x="40" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Two hypotheses</text>
<text x="40" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">sick: 1% of people</text>
<text x="40" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">P(+|sick) = 0.95</text>
<text x="40" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">healthy: 99%</text>
<text x="40" y="256" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">P(+|healthy) = 0.10</text>
<text x="328" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Add shares</text>
<text x="328" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">P(E) = Σ</text>
<text x="328" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">P(E|H)·P(H)</text>
<text x="496" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The denominator</text>
<text x="496" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">0.95 × 0.01 = 0.0095</text>
<text x="496" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">0.10 × 0.99 = 0.0990</text>
<text x="496" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">sum = 0.1085</text>
</svg>
