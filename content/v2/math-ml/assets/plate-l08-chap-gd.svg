<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: one valley, one step size</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Convexity promises one valley; eta &lt; 2/L keeps the walk inside it. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: wrong step</text>
<text x="328" y="124">the rule</text>
<text x="648" y="124">WITH: sane step</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">eta = 1.1</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">loss 9.0 -&gt; 26.87</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">each step overshoots</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">further out</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">non-convex: traps</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">eta &lt; 2/L</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">L = 2, so eta &lt; 1</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">1.1 is 10% past</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">f'' &gt;= 0: one valley</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">local = global</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">eta = 0.1:</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">gap closes 20%/step</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">loss x0.64 per step</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">Newton: x1 = 3</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">one step, exact</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: convex is the special case; ravines (kappa = 25) zigzag and crawl without momentum.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: momentum and Adam exist for the ravines this bowl does not have.</text>
</svg>
