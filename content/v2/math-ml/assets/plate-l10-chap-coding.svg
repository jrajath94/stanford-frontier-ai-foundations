<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the floor and the bill</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Entropy is the coding floor; cross-entropy is the bill the model pays. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: bad bets</text>
<text x="328" y="124">entropy H</text>
<text x="648" y="124">WITH: pay the floor</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">predict 0.01 on truth:</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">6.64 bits</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">q = 0 on truth:</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">infinite bill</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">wrong code: H + KL</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">H = 1.75 bits</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">surprise = -log2 p</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">KL = 0.189 bits</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">asymmetric:</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">not a distance</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">Huffman: 1.75 avg</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">codes 0/10/110/111</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">= the floor</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">3 bits -&gt; perplexity 8</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">gradient q-p bounded</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: smoothing defends the infinite bill; cross-entropy only prices the true class.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: every LM trains on this bill; 3 bits of cross-entropy is a perplexity of 8.</text>
</svg>
