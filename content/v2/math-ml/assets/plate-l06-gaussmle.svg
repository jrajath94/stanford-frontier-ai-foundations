<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Gaussian MLE: the sample mean and variance</text>
<text x="24" y="64" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Data [2,4,4,4,5,5,7,9]: the maximizing (mu, sigma) are mu = 5, sigma2 = 4.</text>
<text x="24" y="86" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">No search needed: closed forms.</text>
<line x1="24" y1="100" x2="736" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: fit a Gaussian = compute the mean, compute the variance.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original arithmetic</text>
<rect x="24" y="112" width="256" height="264" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="312" y="112" width="136" height="264" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="480" y="112" width="256" height="264" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="280" y1="252" x2="312" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="252" x2="302.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="252" x2="302.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="296.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">maximize</text>
<line x1="448" y1="252" x2="480" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="464.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">read off</text>
<text x="40" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The data</text>
<text x="40" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">[2,4,4,4,5,5,7,9]</text>
<text x="40" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">n = 8</text>
<text x="328" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Maximize</text>
<text x="328" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">mu-hat = x-bar</text>
<text x="328" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">sigma2 = mean of</text>
<text x="328" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">(xi - mu-hat)2</text>
<text x="496" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The MLE</text>
<text x="496" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">mu-hat = 40/8 = 5</text>
<text x="496" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">sq dev sum = 32</text>
<text x="496" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">sigma2 = 32/8 = 4</text>
</svg>
