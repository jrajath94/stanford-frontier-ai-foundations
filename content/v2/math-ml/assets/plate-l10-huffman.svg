<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect x="0" y="0" width="760" height="430" fill="#F7F4EE"/>
<text x="24" y="40" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="30" font-weight="600" fill="#1B2838" text-anchor="start">Huffman hits the entropy floor</text>
<text x="24" y="64" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Probs [0.5, 0.25, 0.125, 0.125]: H = 1.75 bits.</text>
<text x="24" y="86" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="450" fill="#5C6B7A" text-anchor="start">Codes 0/10/110/111 average 1.75 bits. Exactly entropy.</text>
<line x1="24" y1="100" x2="736" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="24" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">One claim: no code averages below entropy; Huffman reaches it.</text>
<text x="736" y="414" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" text-anchor="end">Source: original arithmetic</text>
<rect x="24" y="112" width="256" height="264" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="312" y="112" width="136" height="264" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="480" y="112" width="256" height="264" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="280" y1="252" x2="312" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="252" x2="302.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="312" y1="252" x2="302.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="296.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">assign</text>
<line x1="448" y1="252" x2="480" y2="252" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="247.9" stroke="#1F7A72" stroke-width="2"/>
<line x1="480" y1="252" x2="470.9" y2="256.1" stroke="#1F7A72" stroke-width="2"/>
<text x="464.0" y="238" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">reach floor</text>
<text x="40" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">The symbols</text>
<text x="40" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">p = [0.5, 0.25,</text>
<text x="40" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">     0.125, 0.125]</text>
<text x="40" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">H = 1.75 bits</text>
<text x="328" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Short for likely</text>
<text x="328" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">0.5 -&gt; 0</text>
<text x="328" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">0.25 -&gt; 10</text>
<text x="328" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#1B2838" text-anchor="start">0.125 -&gt; 110, 111</text>
<text x="496" y="142" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Average = floor</text>
<text x="496" y="172" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">0.5·1 + 0.25·2</text>
<text x="496" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1B2838" text-anchor="start">+ 2·0.125·3</text>
<text x="496" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="500" fill="#1F7A72" text-anchor="start">= 1.75 = H</text>
</svg>
