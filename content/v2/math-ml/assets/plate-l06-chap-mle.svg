<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: maximize the log</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Raw likelihoods underflow; the log turns products into sums. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: raw likelihood</text>
<text x="328" y="124">log-likelihood</text>
<text x="648" y="124">WITH: closed forms</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">0.5^1000 = 9.3e-302</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">1100 flips: float64</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rounds to 0.0</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">every candidate scores 0</text>
<text x="180" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">grid search guesses p</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">log L = sum log p(xi)</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">1000 flips: -693.1</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">monotone: same argmax</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">NLL = the loss</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1E4D8C">products become sums</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">Bernoulli: p = 0.4</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">counting is estimating</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">Gaussian: mean 5,</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">variance 4</text>
<text x="780" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1F7A72">two lines of code</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: MLE divides by n (4.0, biased 7/8); n-1 (4.5714) unbiases; large n: the same.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: L10's cross-entropy is this NLL on a categorical model.</text>
</svg>
