<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: search at ten million vectors</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Exact search does not ship. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: exact</text>
<text x="328" y="124">the stored object: the index</text>
<text x="648" y="124">WITH the rule: approximate</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">10M x 768 = 7.7B ops</text>
<text x="180" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">per query, exact</text>
<text x="180" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">~1 second on a GPU</text>
<text x="180" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">forever on a CPU fleet</text>
<text x="180" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">recall 1.0, cost fatal</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">IVF: 10k clusters, nprobe 10</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">HNSW: layered graph</text>
<text x="480" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">PQ: 96 groups of 8 dims</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">one byte per group</text>
<text x="480" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">shard past 100M vectors</text>
<text x="480" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">merge is exact</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">IVF: 7.7M ops, recall 0.95</text>
<text x="780" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">HNSW: ~50k, recall 0.98</text>
<text x="780" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">PQ: 30 GB down to 1 GB</text>
<text x="780" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">recall ~0.90</text>
<text x="780" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">every point past 0.90</text>
<text x="780" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">is bought with latency</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: measure recall@k against exact search, then pick the fastest index clearing the bar.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">A search product missing the photo 5% of the time has a recall problem, not a model problem.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: ANN turns a linear scan into a navigable structure, and the recall dial prices every choice.</text>
</svg>
