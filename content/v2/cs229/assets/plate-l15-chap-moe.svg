<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: mixture of experts</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Scale parameters, not compute. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: dense</text>
<text x="328" y="124">the stored object: the router</text>
<text x="648" y="124">WITH the rule: sparse</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">every parameter, every token</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">671B params = 671B active</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">compute grows with size</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">one GPU cannot hold it</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">logits [2.0, 1.0, 0.5, -1.0]</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">softmax: 0.609, 0.224, 0.136, 0.030</text>
<text x="480" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">top-2: 0.731, 0.269</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">2 of 4 experts compute</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">rest are dark</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">router is one linear layer</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">DeepSeek-V3</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">256 experts, top-8</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">+ 1 shared expert</text>
<text x="780" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">671B params, 37B active</text>
<text x="780" y="296" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">5.5% active per token</text>
<text x="780" y="322" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">Mixtral: 2 of 8</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: flat per-token compute for a systems project: memory, load balance, all-to-all, router collapse.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Token-choice floods; the aux loss or per-expert bias keeps the balance.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the router is one linear layer, and its decisions are the entire capacity bet.</text>
</svg>
