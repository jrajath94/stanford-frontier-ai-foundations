<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: two definitions of learning</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Samuel names the dream, Mitchell names the test. Source: original toy on the spam job.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: hand rules</text>
<text x="328" y="124">the stored object: T, E, P</text>
<text x="648" y="124">WITH the rule: measured learning</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">5 engineers, 1,000 rules</text>
<text x="180" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">30 min per rule: 500 engineer-hours</text>
<text x="180" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">waves every 14 days</text>
<text x="180" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">probes cost ~1,000 emails</text>
<text x="180" y="309.5" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">humans: 10 rules/day</text>
<text x="180" y="343.5" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">spammers: 100 evasions/day</text>
<text x="180" y="377.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rules interact: 63% false positives</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">T: sort email into spam or not</text>
<text x="480" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">E: 10,000 labeled emails</text>
<text x="480" y="248.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">P: accuracy on new mail</text>
<text x="480" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">P on 2,000 held-out emails</text>
<text x="480" y="311.25" text-anchor="middle" font-size="22" font-weight="600" fill="#1B2838">94% then 99% as E grows</text>
<text x="480" y="355.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">train 100% = memorization</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">threshold 0.9: precision 98%</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">recall 49%</text>
<text x="780" y="246.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">threshold 0.1: precision 47.5%</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">recall 95%</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">accuracy lies on skewed tasks</text>
<text x="780" y="340.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">spam buys precision</text>
<text x="780" y="370.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">fraud buys recall</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: adaptability costs data: 10,000 labels are 5 labeler-days.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Mitchell's P is a choice, not a default.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: Mitchell turns Samuel's dream into a test: P must rise with E on new data.</text>
</svg>
