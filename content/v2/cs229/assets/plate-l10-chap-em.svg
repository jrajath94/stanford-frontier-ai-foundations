<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: EM: two easy steps</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. EM is k-means grown up: soft instead of hard.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">HARD guess-fit-repeat</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">force the boundary</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">the point at 5.0 gets one label</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">full weight, zero doubt</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">drags its cluster&#x27;s mean</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">uncertainty thrown away</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">E-step, M-step</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">E: responsibilities under current params</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">M: responsibility-weighted MLE</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">weighted means, spreads, mixing weights</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">coordinate ascent on (Q, theta)</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">SOFT expectation-maximization</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the toy, honestly weighted</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">converges to mu = 0.33 and 10.0</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">sigma_1^2 = 0.389, sigma_1 = 0.62</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">MAP with prior: 0.433, not 0.389</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">sigma to 0: density to infinity</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: soft weights handle boundary points honestly instead of forcing them.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: local maxima, a slow crawl near the top, and degenerate collapse. The prior is the guardrail.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: the doubt from the E-step flows into the M-step&#x27;s parameters, which is what the weighted formulas implement.</text>
</svg>
