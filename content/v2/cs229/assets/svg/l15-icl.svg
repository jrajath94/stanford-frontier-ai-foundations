<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="336" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Zero-shot vs few-shot</text>
<rect x="30" y="60" width="320" height="200" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="3"/>
<text x="190" y="95" font-size="16" fill="#2B5EA7" text-anchor="middle" font-weight="bold">Zero-shot</text>
<text x="60" y="130" font-size="13" fill="#1B2838" text-anchor="start" >Task: translate to French.</text>
<text x="60" y="155" font-size="13" fill="#1B2838" text-anchor="start" >Input: hello</text>
<text x="60" y="185" font-size="13" fill="#2E7D4F" text-anchor="start" font-weight="bold">→ bonjour</text>
<text x="60" y="215" font-size="12" fill="#8A8FA0" text-anchor="start" >no examples given</text>
<rect x="370" y="60" width="320" height="200" rx="10" fill="#FFFFFF" stroke="#6C4BA6" stroke-width="3"/>
<text x="530" y="95" font-size="16" fill="#6C4BA6" text-anchor="middle" font-weight="bold">Few-shot</text>
<text x="400" y="130" font-size="13" fill="#1B2838" text-anchor="start" >cat → chat</text>
<text x="400" y="155" font-size="13" fill="#1B2838" text-anchor="start" >dog → chien</text>
<text x="400" y="185" font-size="13" fill="#1B2838" text-anchor="start" >hello → ?</text>
<text x="400" y="215" font-size="12" fill="#8A8FA0" text-anchor="start" >examples in the prompt</text>
<text x="360" y="310" font-size="15" fill="#1B2838" text-anchor="middle" >No parameter updates. The prompt IS the training set.</text>
</svg>
