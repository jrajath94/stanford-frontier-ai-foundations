<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="450" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">MLA: compress the latent</text>
<text x="40" y="66" font-size="16" fill="#1B2838" text-anchor="start" font-weight="bold">MLA: store the latent, rebuild K and V on the fly</text>
<rect x="40" y="100" width="220" height="200" rx="10" fill="#FBEDEC" stroke="#B3402E" stroke-width="3"/>
<text x="150" y="132" font-size="15" fill="#B3402E" text-anchor="middle" font-weight="bold">MHA cache</text>
<text x="150" y="156" font-size="12" fill="#8A8FA0" text-anchor="middle" >per token, per layer</text>
<rect x="65" y="175" width="90" height="60" rx="10" fill="#FFFFFF" stroke="#B3402E" stroke-width="2"/>
<text x="110" y="200" font-size="15" fill="#B3402E" text-anchor="middle" font-weight="bold">K</text>
<text x="110" y="220" font-size="11" fill="#8A8FA0" text-anchor="middle" >32x128</text>
<rect x="165" y="175" width="90" height="60" rx="10" fill="#FFFFFF" stroke="#B3402E" stroke-width="2"/>
<text x="210" y="200" font-size="15" fill="#B3402E" text-anchor="middle" font-weight="bold">V</text>
<text x="210" y="220" font-size="11" fill="#8A8FA0" text-anchor="middle" >32x128</text>
<text x="150" y="268" font-size="16" fill="#B3402E" text-anchor="middle" font-weight="bold">16 KB</text>
<line x1="265" y1="200" x2="330" y2="200" stroke="#1B2838" stroke-width="2.5"/>
<line x1="330" y1="200" x2="319.9560216565646" y2="195.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="330" y1="200" x2="319.9560216565646" y2="204.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<text x="297" y="180" font-size="14" fill="#2E7D4F" text-anchor="middle" font-weight="bold">16x</text>
<rect x="335" y="130" width="130" height="140" rx="10" fill="#EAF3E4" stroke="#2E7D4F" stroke-width="3"/>
<text x="400" y="162" font-size="15" fill="#2E7D4F" text-anchor="middle" font-weight="bold">latent c</text>
<text x="400" y="186" font-size="13" fill="#1B2838" text-anchor="middle" >512 dims</text>
<text x="400" y="210" font-size="12" fill="#8A8FA0" text-anchor="middle" >per token</text>
<text x="400" y="244" font-size="16" fill="#2E7D4F" text-anchor="middle" font-weight="bold">1 KB</text>
<line x1="470" y1="170" x2="530" y2="170" stroke="#2B5EA7" stroke-width="2.5"/>
<line x1="530" y1="170" x2="519.9560216565646" y2="165.51463501634473" stroke="#2B5EA7" stroke-width="2.5"/>
<line x1="530" y1="170" x2="519.9560216565646" y2="174.48536498365527" stroke="#2B5EA7" stroke-width="2.5"/>
<line x1="470" y1="230" x2="530" y2="230" stroke="#2B5EA7" stroke-width="2.5"/>
<line x1="530" y1="230" x2="519.9560216565646" y2="225.51463501634473" stroke="#2B5EA7" stroke-width="2.5"/>
<line x1="530" y1="230" x2="519.9560216565646" y2="234.48536498365527" stroke="#2B5EA7" stroke-width="2.5"/>
<text x="500" y="158" font-size="12" fill="#2B5EA7" text-anchor="middle" >up-project</text>
<rect x="535" y="140" width="70" height="50" rx="10" fill="#E8EEF7" stroke="#2B5EA7" stroke-width="2"/>
<text x="570" y="162" font-size="14" fill="#2B5EA7" text-anchor="middle" font-weight="bold">K</text>
<text x="570" y="180" font-size="11" fill="#8A8FA0" text-anchor="middle" >rebuilt</text>
<rect x="535" y="205" width="70" height="50" rx="10" fill="#E8EEF7" stroke="#2B5EA7" stroke-width="2"/>
<text x="570" y="227" font-size="14" fill="#2B5EA7" text-anchor="middle" font-weight="bold">V</text>
<text x="570" y="245" font-size="11" fill="#8A8FA0" text-anchor="middle" >rebuilt</text>
<text x="570" y="292" font-size="12" fill="#8A8FA0" text-anchor="middle" >at attention time</text>
<text x="40" y="340" font-size="14" fill="#1B2838" text-anchor="start" >The trick: absorb the up-projection into the query projection.</text>
<text x="40" y="364" font-size="14" fill="#1B2838" text-anchor="start" font-weight="bold">Reconstruction costs almost nothing at runtime.</text>
<text x="40" y="392" font-size="13" fill="#8A8FA0" text-anchor="start" >RoPE needs care: decoupled rotary path (rotation vs compression).</text>
<text x="360" y="424" font-size="14" fill="#1B2838" text-anchor="middle" >DeepSeek-V3 ships MLA at 671B params. Change what is stored, not just how much.</text>
</svg>
