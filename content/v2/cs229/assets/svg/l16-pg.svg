<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="316" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Policy gradient intuition</text>
<rect x="40" y="70" width="300" height="110" rx="10" fill="#EAF3E4" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="190" y="108" font-size="15" fill="#2E7D4F" text-anchor="middle" font-weight="bold">good trajectory</text>
<text x="190" y="136" font-size="14" fill="#1B2838" text-anchor="middle"  font-family="Source Serif 4, Newsreader, serif">return = +10</text>
<text x="190" y="160" font-size="14" fill="#2E7D4F" text-anchor="middle" font-weight="bold">↑ P(actions)</text>
<rect x="380" y="70" width="300" height="110" rx="10" fill="#FBEDEC" stroke="#B3402E" stroke-width="2.5"/>
<text x="530" y="108" font-size="15" fill="#B3402E" text-anchor="middle" font-weight="bold">bad trajectory</text>
<text x="530" y="136" font-size="14" fill="#1B2838" text-anchor="middle"  font-family="Source Serif 4, Newsreader, serif">return = −3</text>
<text x="530" y="160" font-size="14" fill="#B3402E" text-anchor="middle" font-weight="bold">↓ P(actions)</text>
<rect x="120" y="210" width="480" height="80" rx="10" fill="#FFFFFF" stroke="#1B2838" stroke-width="2.5"/>
<text x="360" y="240" font-size="20" fill="#1B2838" text-anchor="middle"  font-family="Source Serif 4, Newsreader, serif">∇J = E[ Σₜ ∇log π(aₜ|sₜ) · R ]</text>
<text x="360" y="268" font-size="14" fill="#8A8FA0" text-anchor="middle" >sample, score, shift probability toward winners</text>
</svg>
