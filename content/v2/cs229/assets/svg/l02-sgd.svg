<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="366" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Batch vs stochastic gradient descent</text>
<rect x="30" y="60" width="320" height="280" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="3"/>
<text x="190" y="92" font-size="17" fill="#2B5EA7" text-anchor="middle" font-weight="bold">Batch GD</text>
<text x="190" y="130" font-size="14" fill="#1B2838" text-anchor="middle" >gradient over ALL data</text>
<text x="190" y="160" font-size="14" fill="#1B2838" text-anchor="middle" >one exact step</text>
<text x="190" y="200" font-size="14" fill="#B3402E" text-anchor="middle" >slow on huge data</text>
<text x="190" y="240" font-size="14" fill="#8A8FA0" text-anchor="middle" >cost per step ∝ m</text>
<rect x="370" y="60" width="320" height="280" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<text x="530" y="92" font-size="17" fill="#2E7D4F" text-anchor="middle" font-weight="bold">SGD / minibatch</text>
<text x="530" y="130" font-size="14" fill="#1B2838" text-anchor="middle" >gradient over a batch</text>
<text x="530" y="160" font-size="14" fill="#1B2838" text-anchor="middle" >many noisy steps</text>
<text x="530" y="200" font-size="14" fill="#2E7D4F" text-anchor="middle" >fast; noise helps escape</text>
<text x="530" y="240" font-size="14" fill="#8A8FA0" text-anchor="middle" >shuffle each epoch</text>
</svg>
