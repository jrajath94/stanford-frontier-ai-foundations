<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="296" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">The foundation-model paradigm</text>
<rect x="30" y="70" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="3"/>
<text x="180" y="105" font-size="17" fill="#2B5EA7" text-anchor="middle" font-weight="bold">Pre-training</text>
<text x="180" y="135" font-size="13" fill="#1B2838" text-anchor="middle" >massive unlabeled data</text>
<text x="180" y="158" font-size="13" fill="#1B2838" text-anchor="middle" >one big model</text>
<text x="180" y="181" font-size="13" fill="#8A8FA0" text-anchor="middle" >messy internet text</text>
<line x1="334" y1="145" x2="386" y2="145" stroke="#1B2838" stroke-width="2.5"/>
<line x1="386" y1="145" x2="375.9560216565646" y2="140.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="386" y1="145" x2="375.9560216565646" y2="149.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="390" y="70" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<text x="540" y="105" font-size="17" fill="#2E7D4F" text-anchor="middle" font-weight="bold">Adaptation</text>
<text x="540" y="135" font-size="13" fill="#1B2838" text-anchor="middle" >many tasks</text>
<text x="540" y="158" font-size="13" fill="#1B2838" text-anchor="middle" >probing / finetuning</text>
<text x="540" y="181" font-size="13" fill="#8A8FA0" text-anchor="middle" >prompts / SFT / RL</text>
<text x="360" y="270" font-size="15" fill="#1B2838" text-anchor="middle" >Good foundation first, then adapt. Never train per task from scratch.</text>
</svg>
