<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="504" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">RoPE: rotation is relative</text>
<text x="40" y="66" font-size="16" fill="#1B2838" text-anchor="start" font-weight="bold">RoPE: rotate by position, keep only the distance</text>
<circle cx="190" cy="220" r="80" fill="#FFFFFF" stroke="#D8D2C4"/>
<line x1="110" y1="220" x2="270" y2="220" stroke="#8A8FA0" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="190" y1="140" x2="190" y2="300" stroke="#8A8FA0" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="190" y1="220" x2="194.9516041167392" y2="150.1753509377162" stroke="#2B5EA7" stroke-width="3"/>
<line x1="194.9516041167392" y1="150.1753509377162" x2="189.76699211082806" y2="159.87688681345062" stroke="#2B5EA7" stroke-width="3"/>
<line x1="194.9516041167392" y1="150.1753509377162" x2="198.71525027939907" y2="160.51145114825476" stroke="#2B5EA7" stroke-width="3"/>
<text x="190" y="120" font-size="12" fill="#8A8FA0" text-anchor="middle" >rotated by 1.5 rad</text>
<text x="190" y="328" font-size="13" fill="#2B5EA7" text-anchor="middle" font-weight="bold">query q=[1,0]</text>
<text x="190" y="352" font-size="13" fill="#1B2838" text-anchor="middle" >position m=3</text>
<text x="190" y="378" font-size="12" fill="#1B2838" text-anchor="middle" >[0.0707, 0.9975]</text>
<circle cx="530" cy="220" r="80" fill="#FFFFFF" stroke="#D8D2C4"/>
<line x1="450" y1="220" x2="610" y2="220" stroke="#8A8FA0" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="530" y1="140" x2="530" y2="300" stroke="#8A8FA0" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="530" y1="220" x2="591.4307793323261" y2="186.44021229770578" stroke="#6C4BA6" stroke-width="3"/>
<line x1="591.4307793323261" y1="186.44021229770578" x2="580.4659605629973" y2="187.3192739313667" stroke="#6C4BA6" stroke-width="3"/>
<line x1="591.4307793323261" y1="186.44021229770578" x2="584.766757609248" y2="195.1918301181058" stroke="#6C4BA6" stroke-width="3"/>
<text x="530" y="120" font-size="12" fill="#8A8FA0" text-anchor="middle" >rotated by 0.5 rad</text>
<text x="530" y="328" font-size="13" fill="#6C4BA6" text-anchor="middle" font-weight="bold">key k=[1,0]</text>
<text x="530" y="352" font-size="13" fill="#1B2838" text-anchor="middle" >position n=1</text>
<text x="530" y="378" font-size="12" fill="#1B2838" text-anchor="middle" >[0.8776, 0.4794]</text>
<line x1="330" y1="220" x2="390" y2="220" stroke="#1B2838" stroke-width="2.5"/>
<line x1="390" y1="220" x2="379.9560216565646" y2="215.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="390" y1="220" x2="379.9560216565646" y2="224.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<text x="360" y="200" font-size="13" fill="#1B2838" text-anchor="middle" font-weight="bold">dot</text>
<text x="360" y="424" font-size="15" fill="#1B2838" text-anchor="middle" font-weight="bold" font-family="Source Serif 4, Newsreader, serif">q.k = 0.5403 = cos((m-n).theta) = cos(1.0)</text>
<text x="360" y="452" font-size="14" fill="#2E7D4F" text-anchor="middle" font-weight="bold">Absolute angles cancel. Only the relative distance m-n survives.</text>
<text x="360" y="478" font-size="13" fill="#8A8FA0" text-anchor="middle" >Llama 3: theta_base = 500,000. RoPE is the 2026 default.</text>
</svg>
