<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 466" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="776" height="462" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">Triplet loss vs InfoNCE</text>
<text x="40" y="66" font-size="16" fill="#1B2838" text-anchor="start" font-weight="bold">Triplet: one negative, one margin</text>
<circle cx="120" cy="240" r="12" fill="#2B5EA7" stroke="none"/>
<text x="120" y="220" font-size="13" fill="#2B5EA7" text-anchor="middle" font-weight="bold">anchor</text>
<text x="120" y="274" font-size="12" fill="#8A8FA0" text-anchor="middle" >[1, 0]</text>
<circle cx="205" cy="205" r="10" fill="#2E7D4F" stroke="none"/>
<text x="221" y="197" font-size="13" fill="#2E7D4F" text-anchor="start" font-weight="bold">positive</text>
<text x="221" y="215" font-size="12" fill="#8A8FA0" text-anchor="start" >[0.9, 0.1]</text>
<line x1="134" y1="234" x2="193" y2="209" stroke="#2E7D4F" stroke-width="2" stroke-dasharray="7 5"/>
<text x="165" y="175" font-size="13" fill="#2E7D4F" text-anchor="middle" font-weight="bold" font-family="Source Serif 4, Newsreader, serif">d = 0.141</text>
<circle cx="300" cy="300" r="10" fill="#B3402E" stroke="none"/>
<text x="316" y="292" font-size="13" fill="#B3402E" text-anchor="start" font-weight="bold">negative</text>
<text x="316" y="310" font-size="12" fill="#8A8FA0" text-anchor="start" >[0.2, 0.9]</text>
<line x1="128" y1="250" x2="288" y2="292" stroke="#B3402E" stroke-width="2" stroke-dasharray="7 5"/>
<text x="225" y="300" font-size="13" fill="#B3402E" text-anchor="middle" font-weight="bold" font-family="Source Serif 4, Newsreader, serif">d = 1.204</text>
<text x="40" y="356" font-size="15" fill="#1B2838" text-anchor="start" font-weight="bold" font-family="Source Serif 4, Newsreader, serif">L = max(0, 0.141 - 1.204 + 0.2) = 0</text>
<text x="40" y="382" font-size="13" fill="#8A8FA0" text-anchor="start" >Satisfied already: no learning. Mine hard triplets.</text>
<line x1="400" y1="60" x2="400" y2="400" stroke="#D8D2C4" stroke-width="2"/>
<text x="420" y="66" font-size="16" fill="#1B2838" text-anchor="start" font-weight="bold">InfoNCE: every negative competes at once</text>
<text x="420" y="116" font-size="13" fill="#1B2838" text-anchor="start" >positive 0.9</text>
<rect x="530" y="100" width="130" height="22" rx="6" fill="#FFFFFF" stroke="#1B2838" stroke-width="2"/>
<rect x="533" y="103" width="123.9" height="16" rx="4" fill="#2E7D4F"/>
<text x="668" y="116" font-size="12" fill="#1B2838" text-anchor="start" >0.9990</text>
<text x="420" y="172" font-size="13" fill="#1B2838" text-anchor="start" >neg 0.1</text>
<rect x="530" y="156" width="130" height="22" rx="6" fill="#FFFFFF" stroke="#1B2838" stroke-width="2"/>
<rect x="533" y="159" width="0.0" height="16" rx="4" fill="#B3402E"/>
<text x="668" y="172" font-size="12" fill="#1B2838" text-anchor="start" >0.0003</text>
<text x="420" y="228" font-size="13" fill="#1B2838" text-anchor="start" >neg 0.1</text>
<rect x="530" y="212" width="130" height="22" rx="6" fill="#FFFFFF" stroke="#1B2838" stroke-width="2"/>
<rect x="533" y="215" width="0.0" height="16" rx="4" fill="#B3402E"/>
<text x="668" y="228" font-size="12" fill="#1B2838" text-anchor="start" >0.0003</text>
<text x="420" y="284" font-size="13" fill="#1B2838" text-anchor="start" >neg 0.1</text>
<rect x="530" y="268" width="130" height="22" rx="6" fill="#FFFFFF" stroke="#1B2838" stroke-width="2"/>
<rect x="533" y="271" width="0.0" height="16" rx="4" fill="#B3402E"/>
<text x="668" y="284" font-size="12" fill="#1B2838" text-anchor="start" >0.0003</text>
<text x="420" y="348" font-size="15" fill="#1B2838" text-anchor="start" font-weight="bold">weights sum to 1.0000</text>
<text x="420" y="374" font-size="15" fill="#1B2838" text-anchor="start" font-weight="bold" font-family="Source Serif 4, Newsreader, serif">loss = -log(0.9990) = 0.0010</text>
<text x="420" y="400" font-size="13" fill="#8A8FA0" text-anchor="start" >The margin becomes the temperature.</text>
<text x="390" y="436" font-size="14" fill="#1B2838" text-anchor="middle" >One negative with a margin vs all negatives in one softmax.</text>
</svg>
