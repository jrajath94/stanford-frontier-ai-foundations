<text x="620" y="146" font-size="18" fill="#1B2838" text-anchor="middle" >w·φ(x)</text>
<text x="360" y="250" font-size="15" fill="#1B2838" text-anchor="middle" >Linear probing: cheap test of what the representation knows.</text>
<text x="360" y="278" font-size="14" fill="#8A8FA0" text-anchor="middle" >Also used to interpret LLMs (mechanistic interpretability).</text>
