<text x="140" y="120" font-size="20" fill="#2B5EA7" text-anchor="middle" font-weight="bold">φ(x)</text>
<text x="140" y="148" font-size="13" fill="#8A8FA0" text-anchor="middle" >frozen</text>
<text x="140" y="170" font-size="13" fill="#1B2838" text-anchor="middle" >representation</text>
<line x1="244" y1="140" x2="296" y2="140" stroke="#1B2838" stroke-width="2.5"/>
<line x1="296" y1="140" x2="285.9560216565646" y2="135.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="296" y1="140" x2="285.9560216565646" y2="144.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="300" y="80" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="400" y="120" font-size="20" fill="#2E7D4F" text-anchor="middle" font-weight="bold">w</text>
<text x="400" y="148" font-size="13" fill="#8A8FA0" text-anchor="middle" >trained</text>
<text x="400" y="170" font-size="13" fill="#1B2838" text-anchor="middle" >linear probe</text>
<line x1="504" y1="140" x2="556" y2="140" stroke="#1B2838" stroke-width="2.5"/>
