<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Georgia, serif">
<rect x="2" y="2" width="716" height="326" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">The loss chip: J(θ)</text>
<rect x="60" y="80" width="600" height="220" rx="18" fill="#FFFFFF" stroke="#1B2838" stroke-width="3"/>
<text x="360" y="122" font-size="24" fill="#1B2838" text-anchor="middle" font-weight="bold">LOSS</text>
<line x1="90" y1="140" x2="630" y2="140" stroke="#8A8FA0" stroke-width="1.5"/>
<text x="360" y="190" font-size="26" fill="#1B2838" text-anchor="middle" >J(θ) = ½ Σᵢ ( h_θ(x⁽ⁱ⁾) − y⁽ⁱ⁾ )²</text>
<text x="360" y="232" font-size="15" fill="#8A8FA0" text-anchor="middle" >prediction − truth, squared, averaged (½ = convention)</text>
<text x="360" y="262" font-size="15" fill="#1B2838" text-anchor="middle" >Smaller J(θ) = better fit. Training = minimize J.</text>
</svg>
