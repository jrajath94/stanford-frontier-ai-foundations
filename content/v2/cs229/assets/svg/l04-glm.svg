<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect x="2" y="2" width="716" height="296" rx="14" fill="#F7F4EE" stroke="#D8D2C4" stroke-width="2"/>
<text x="24" y="38" font-size="21" font-weight="bold" fill="#1B2838">The GLM recipe</text>
<rect x="40" y="70" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#2B5EA7" stroke-width="3"/>
<text x="140" y="105" font-size="16" fill="#2B5EA7" text-anchor="middle" font-weight="bold">1. Pick</text>
<text x="140" y="127" font-size="16" fill="#2B5EA7" text-anchor="middle" font-weight="bold">distribution</text>
<text x="140" y="165" font-size="13" fill="#1B2838" text-anchor="middle" >Gaussian? Bernoulli?</text>
<text x="140" y="185" font-size="13" fill="#1B2838" text-anchor="middle" >Multinomial?</text>
<line x1="244" y1="145" x2="261" y2="145" stroke="#1B2838" stroke-width="2.5"/>
<line x1="261" y1="145" x2="250.95602165656462" y2="140.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="261" y1="145" x2="250.95602165656462" y2="149.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="265" y="70" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#6C4BA6" stroke-width="3"/>
<text x="365" y="105" font-size="16" fill="#6C4BA6" text-anchor="middle" font-weight="bold">2. Link η = θᵀx</text>
<text x="365" y="165" font-size="13" fill="#1B2838" text-anchor="middle" >linear predictor</text>
<text x="365" y="185" font-size="13" fill="#1B2838" text-anchor="middle" >into natural param</text>
<line x1="469" y1="145" x2="486" y2="145" stroke="#1B2838" stroke-width="2.5"/>
<line x1="486" y1="145" x2="475.9560216565646" y2="140.51463501634473" stroke="#1B2838" stroke-width="2.5"/>
<line x1="486" y1="145" x2="475.9560216565646" y2="149.48536498365527" stroke="#1B2838" stroke-width="2.5"/>
<rect x="490" y="70" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<text x="590" y="105" font-size="16" fill="#2E7D4F" text-anchor="middle" font-weight="bold">3. Fit by MLE</text>
<text x="590" y="165" font-size="13" fill="#1B2838" text-anchor="middle" >maximize log L;</text>
<text x="590" y="185" font-size="13" fill="#1B2838" text-anchor="middle" >gradient or Newton</text>
<text x="360" y="270" font-size="15" fill="#1B2838" text-anchor="middle" >Least squares, logistic regression, softmax: all GLMs.</text>
</svg>
