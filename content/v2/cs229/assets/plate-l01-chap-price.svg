<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the honest price</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Adaptability costs three currencies. Source: original synthesis of the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the rule list</text>
<text x="328" y="124">the three currencies</text>
<text x="648" y="124">WITH: what you buy</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">one clever engineer</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">runs in microseconds</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">precise and auditable</text>
<text x="180" y="275.5" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">dies every Monday</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">data: 10,000 labels</text>
<text x="480" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">= 5 labeler-days</text>
<text x="480" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">some labels unbuyable: rare diseases</text>
<text x="480" y="277.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">compute: millions of operations</text>
<text x="480" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">retrain repeats the bill</text>
<text x="480" y="340.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">trust: a box nobody can read</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">filter survives Monday</text>
<text x="780" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">spammers adapt, mail relabeled</text>
<text x="780" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">no code rewritten</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">course goal: shrink all three</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">but 3 a.m. mail = spam?</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: a learned model adapts, but nobody can read its rules back.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">When it fails, it fails in ways no human predicted.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the rest of this course makes each of these three costs as small as possible.</text>
</svg>
