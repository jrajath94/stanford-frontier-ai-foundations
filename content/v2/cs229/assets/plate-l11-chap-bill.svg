<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the sampling bill</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Diffusion won by being the most trainable.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">GAN sampling</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">1 eval per image</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">one forward pass</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">fast sampling</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">unstable training</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">mode collapse</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">T network evals per image</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">T = 1,000: 1,000 evals</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">tiny steps keep reversals learnable</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">10,000 images at 100 evals/s/GPU:</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">27.8 GPU-hours at full steps</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">diffusion sampling</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the discounts, priced</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">DDIM: 50 steps, 20x cheaper</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">distilled: 4 steps, 250x cheaper</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">7 minutes for 10,000 images</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">fine detail lags the full sampler</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: each discount trades a little sample quality for speed.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Price the quality tier, not the method: batch shots tolerate 4 steps, hero images get 1,000.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: DDIM takes bigger steps along the trajectory, consistency models jump off it, and neither repeals the bill.</text>
</svg>
