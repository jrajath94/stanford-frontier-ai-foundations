<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: Gaussian discriminant analysis</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Shared spread deletes the quadratic term. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the boundary drawn</text>
<text x="328" y="124">bells per class</text>
<text x="648" y="124">WITH: the linear line</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">logistic draws the line directly</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">models p(y|x)</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">boundary learned directly</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">the discriminative road</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">cats ~ Gaussian(4, 1)</text>
<text x="480" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">elephants ~ Gaussian(40, 1)</text>
<text x="480" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">MLE = class averages, one pass</text>
<text x="480" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">class 0 = {1, 3}, class 1 = {7, 9}</text>
<text x="480" y="309.5" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">bells cross at x = 22</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="500" fill="#1B2838">w = Sigma^-1 (mu_1 - mu_0)</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">shared Sigma: quadratics cancel</text>
<text x="780" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">d = 100: 5,251 vs 10,301 knobs</text>
<text x="780" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">QDA crossings: 1.42 and -3.42</text>
<text x="780" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">QDA curves around the tighter class</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: shared spread buys linearity and half the knobs.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Wildly different spreads plus plenty of data earn QDA.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the linearity is not an assumption; it is the shared covariance deleting the quadratic term.</text>
</svg>
