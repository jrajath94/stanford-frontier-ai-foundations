<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: softmax</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. One normalization where classes compete. Source: original toy from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: three sigmoids</text>
<text x="328" y="124">the one normalization</text>
<text x="648" y="124">WITH: the four whys</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">(0.88, 0.73, 0.62)</text>
<text x="180" y="216.25" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2838">sum: 2.23</text>
<text x="180" y="252.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">normalize: (0.39, 0.33, 0.28)</text>
<text x="180" y="282.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">not probabilities</text>
<text x="180" y="313.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">cannot be compared</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="600" fill="#1B2838">P(y=j|x) = e^z_j / sum e^z_c</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">(7.39, 2.72, 1.65) / 11.76</text>
<text x="480" y="245.0" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2838">(0.63, 0.23, 0.14)</text>
<text x="480" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">shift-invariant: subtract max</text>
<text x="480" y="311.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">classes compete in one sum</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">GLM-dictated, smooth</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">max-entropy, convenient</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">tau 0.5: (0.84, 0.11, 0.04)</text>
<text x="780" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">tau 2: (0.48, 0.29, 0.23)</text>
<text x="780" y="306.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5C6B7A">tau -&gt; 0: hard max; tau -&gt; inf: uniform</text>
<text x="780" y="334.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">K = 2: 0.731 = sigmoid(1)</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: softmax costs O(k) per prediction.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">At k = 50,000 words, the normalization is the bottleneck.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: everything proved about logistic regression transfers to softmax at k = 2.</text>
</svg>
