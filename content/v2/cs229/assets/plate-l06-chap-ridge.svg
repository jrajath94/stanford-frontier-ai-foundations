<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: ridge regression</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Pay for big knobs, calm the curve. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: whipsaws</text>
<text x="328" y="124">the knob tax</text>
<text x="648" y="124">WITH: the calmed curve</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">degree-10 whipsaws</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">enormous knobs: violent swings</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">X'X singular: det near -0.0001</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">infinitely many fits, n &lt; d</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="600" fill="#1B2838">J = sum (h-y)^2 + rho sum t_j^2</text>
<text x="480" y="214.5" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="600" fill="#1B2838">theta = (X'X + rho I)^-1 X'y</text>
<text x="480" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rho I: every eigenvalue + rho</text>
<text x="480" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rho = 0: normal equations</text>
<text x="480" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">always invertible for rho &gt; 0</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">rho = 0: 4.7; rho = 1: 0.9</text>
<text x="780" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rho = 100: 2.1, bias dominates</text>
<text x="780" y="248.5" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="500" fill="#5C6B7A">MAP: rho = s^2/tau^2</text>
<text x="780" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">lasso keeps 17 of 1,000</text>
<text x="780" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">Lasso's diamond deletes</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: ridge costs bias on purpose: underfit a little to overfit a lot less.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Tune rho on dev, never on training.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: if we make theta really big, it has got to be worth it by fitting the data a lot better.</text>
</svg>
