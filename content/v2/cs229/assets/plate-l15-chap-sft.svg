<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: SFT teaches the job description</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Pre-training teaches the world. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: base model</text>
<text x="328" y="124">the stored object: the pair</text>
<text x="648" y="124">WITH the rule: SFT</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">completes text</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">any continuation</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">not an assistant</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">helpfulness not selected</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">x = instruction, y = answer</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">loss on y ONLY</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">labels: [-100,-100,-100,mer]</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">mask the instruction</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">chat template first</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">predict response given x</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">1,000 curated beats 50,000</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">LoRA: 131k vs 16.8M</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">128x fewer params</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">forgetting: 1-3 points</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">LR 1e-5, 1-3 epochs</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">mix 5-10% pretrain data</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: SFT narrows the model. Spend the budget on quality, not count. Teach the format, keep the world.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">The stack: pretrain the world, SFT the format, RL the taste. Each stage cheaper than the last.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the loss mask focuses every gradient step on the response, and the response format is the whole lesson.</text>
</svg>
