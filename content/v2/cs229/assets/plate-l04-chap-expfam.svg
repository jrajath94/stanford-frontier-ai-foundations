<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the exponential family</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. One algebraic shape under two lectures. Source: original algebra from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: two inventions</text>
<text x="328" y="124">the one shape</text>
<text x="648" y="124">WITH: members and dividends</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">least squares for numbers</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">logistic for yes-or-no</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">felt like different machines</text>
<text x="180" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">two lectures, one basement</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="14" font-weight="600" fill="#1B2838">p(y; eta) = b(y) e^(eta'T(y)-a(eta))</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">eta: natural parameter</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">T(y): sufficient statistic</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">a(eta): the normalizer</text>
<text x="480" y="306.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">b(y): base measure</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">Bernoulli: eta = logit</text>
<text x="780" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">a = log(1+e^eta)</text>
<text x="780" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">Gaussian: eta = mu, a = eta^2/2</text>
<text x="780" y="275.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">mean = a'(eta), always</text>
<text x="780" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">sigmoid = inverse of logit</text>
<text x="780" y="338.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">phi 0.8: eta 1.386, a' = 0.8</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: the mean falls out of the normalizer by differentiation,</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">for every member of the family.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: lecture 3's Gaussian-noise story is this family in another costume.</text>
</svg>
