<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: train, dev, test</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The discipline that keeps the numbers honest. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: training error lies</text>
<text x="328" y="124">three jobs, three sets</text>
<text x="648" y="124">WITH: the honest report</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">polynomial scored 0.00</text>
<text x="180" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">and lied</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">train 100% = memorization</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">no peeking at the future</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">train: fits the knobs</text>
<text x="480" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">dev: compares models</text>
<text x="480" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">test: reports once</text>
<text x="480" y="275.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">decide on dev, report on test</text>
<text x="480" y="306.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">6,000 / 2,000 / 2,000</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">degree 3: dev 0.18, test 0.21</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">0.03: the luck margin</text>
<text x="780" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">k-fold: mean 0.21, sd 0.015</text>
<text x="780" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">k = 5 or 10 for small data</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: a locked test set costs 10,000 examples the model never trains on.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Cross-validation costs k training runs.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: every decision made on a dataset contaminates it; the test set decides nothing, ever.</text>
</svg>
