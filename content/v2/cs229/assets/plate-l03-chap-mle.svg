<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: maximum likelihood</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The bedrock framework of the course. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: fit the values</text>
<text x="328" y="124">the coin scoreboard</text>
<text x="648" y="124">WITH: log it</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">line + threshold at 0.5</text>
<text x="180" y="214.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">one outlier: 1.75 to 2.9</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">a diagnosis flips</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">treats 0.9-&gt;1.0 like 0.4-&gt;0.5</text>
<text x="180" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">outputs are not probabilities</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="16" font-weight="600" fill="#1B2838">L(phi) = phi^7 (1-phi)^3</text>
<text x="480" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">0.00098, 0.00179</text>
<text x="480" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">0.00222, 0.00168</text>
<text x="480" y="279.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">peak at 0.7, 2.3x the fair coin</text>
<text x="480" y="311.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">log: products become sums</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="500" fill="#1B2838">ell = 7 log phi + 3 log(1-phi)</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">ell(0.7) = -6.11 vs ell(0.5) = -6.93</text>
<text x="780" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">0.5^10000 = 0; logs give -6931</text>
<text x="780" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">concave: one peak, no traps</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: write the probability of the data as a function of the knobs,</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">and maximize it. That is the whole framework.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: every loss in this course is MLE wearing a noise assumption.</text>
</svg>
