<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the KV cache kills the cubic</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. State is memory. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: recompute</text>
<text x="328" y="124">the stored object: the cache</text>
<text x="648" y="124">WITH the rule: O(t) per token</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">token t costs t^2 scores</text>
<text x="180" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">sum to 4096: 2.3e10</text>
<text x="180" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">per layer per head</text>
<text x="180" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">tokens 1-100 unchanged</text>
<text x="180" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">every score recomputed</text>
<text x="180" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">unservable</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">store K, V of past tokens</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">512 KB per token</text>
<text x="480" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">4k sequence: 2 GB</text>
<text x="480" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">batch of 10: 20 GB</text>
<text x="480" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">+ 14 GB weights = 34 GB</text>
<text x="480" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">on an 80 GB GPU: fits, barely</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">token t costs t scores</text>
<text x="780" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">sum to 4096: 8.4M</text>
<text x="780" y="240" text-anchor="middle" font-size="18" font-weight="600" fill="#1F7A72">2,730x cheaper</text>
<text x="780" y="270" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">cubic becomes quadratic</text>
<text x="780" y="296" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">not a constant shaved</text>
<text x="780" y="322" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">an order of growth deleted</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the cache deletes an order of growth and fills the GPU. Bytes, not big-O, set the batch size.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Cache fills memory, batch shrinks, parallelism dies, throughput dies.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: keys and values do not change between steps, so storing them turns O(N^3) into O(N^2).</text>
</svg>
