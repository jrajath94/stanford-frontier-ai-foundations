<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: positions, from tables to rotation</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Attention has no order. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: no order</text>
<text x="328" y="124">the stored object: the encoding</text>
<text x="648" y="124">WITH the rule: relative</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">'dog bites man'</text>
<text x="180" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">equals 'man bites dog'</text>
<text x="180" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">permutation-invariant</text>
<text x="180" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">shuffle in, shuffle out</text>
<text x="180" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">order is invisible</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">sinusoidal: fixed waves</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">learned: the table ends</text>
<text x="480" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">RoPE: rotate by position</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">ALiBi: penalize distance</text>
<text x="480" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">NoPE: the mask leaks it</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">2026 default: RoPE</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">theta = 500,000</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">dot keeps cos((m-n)theta)</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">NoPE: 2.1 vs 250 perplexity</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">ALiBi: 2.3, stable to 1.8k</text>
<text x="780" y="318" text-anchor="middle" font-size="13" font-weight="500" fill="#5C6B7A">[uncertain: secondary analysis]</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: RoPE is the default; ALiBi extrapolates best; NoPE is free only with a causal mask.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Absolute methods are history, except learned tables in BERT-style encoders.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: RoPE turns absolute labels into relative rotation, and the dot product keeps only the distance.</text>
</svg>
