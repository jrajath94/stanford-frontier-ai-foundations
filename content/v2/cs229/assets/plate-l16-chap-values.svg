<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: values price the future</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Greedy is blind; values see. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: greedy</text>
<text x="328" y="124">the stored object: the Bellman chain</text>
<text x="648" y="124">WITH the rule: act on V*</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">at 3: left -1, right -1</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">tie: wander forever</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">never reasons 9 rights</text>
<text x="180" y="262" text-anchor="middle" font-size="16" font-weight="500" fill="#5C6B7A">discounted total: -10</text>
<text x="180" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">optimal now != optimal later</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">V(9)=8.0, V(8)=6.2</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">V(7)=4.58, V(6)=3.12</text>
<text x="480" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">V(5)=1.81, V(4)=0.63</text>
<text x="480" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#1F7A72">V(3) = -0.43</text>
<text x="480" y="292" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">value now = reward + gamma x value later</text>
<text x="480" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">contraction: error x 0.9 per sweep</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">Q(3,right) = -0.43</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">Q(3,left) = -2.25</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">right wins by the numbers</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">not profitable: least loss</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">pi* = argmax Q*</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">greedy on V* is optimal</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: values turn delayed rewards into present prices, including bad news.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Greedy on immediate reward is ruin; greedy on optimal values is optimal.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: the value at 3 is negative, and acting on that honest number still picks right.</text>
</svg>
