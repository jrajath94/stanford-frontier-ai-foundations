<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: labels hiding in the data</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The self-supervised objective invents its own labels.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">LABELS cost money</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the startup has 500 labels</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">billions of unlabeled sentences</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">classical tools starve</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">labeling is the bottleneck</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the text order is free</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">three self-supervised objectives</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">next-token: predict &quot;mat&quot;</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">masked: fill the [MASK]</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">contrastive: pull the pair, push the rest</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">a trillion words: a trillion examples</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the data labels itself</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the worked losses</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">next-token: -log(0.02) = 3.91</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">masked: -log(0.3) = 1.20</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">contrastive: 1 positive, 127 negatives</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">BERT reads both ways, GPT generates</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: grammar, facts, and reasoning arrive as side effects of predicting the next word well.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The objective picks the strength: bidirectional for understanding, left-to-right for generation.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: next-token prediction is classification with 50,000 classes, repeated a trillion times.</text>
</svg>
