<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="576" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: activations and initialization</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Match activation to layer, init to activation.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">MISMATCHED</text>
<rect x="48" y="150" width="264" height="246" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">saturating and cloned</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">sigmoid at z = 10: slope 0.00005</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">tanh at z = 2: slope 0.071</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">zeros clone: 64 neurons, one feature</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">identical starts never diverge</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="246" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">two matching rules</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">hidden layers: ReLU or GELU</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">binary output: sigmoid. multi-class: softmax</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">GELU(2) = 1.95, GELU(-2) = -0.046</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">ReLU(2) = 2, ReLU(-2) = 0</text>
<text x="480.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">Leaky ReLU keeps a trickle alive</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">MATCHED</text>
<rect x="648" y="150" width="264" height="246" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">variance-preserving init</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">He for ReLU: Var = 2/100 = 0.02</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">std 0.141 at n = 100</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">Xavier for tanh: Var = 1/100 = 0.01</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">std 0.10. match init to activation</text>
<text x="780.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">wrong scale: signal dies to dust</text>
<rect x="48" y="412" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the failure is silent: the net trains, just badly.</text>
<text x="480" y="476" text-anchor="middle" font-size="15" fill="#1B2838">Match the activation to the layer&#x27;s job and the init to the activation.</text>
<text x="48" y="528" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: both the bend and the starting dice decide whether the signal survives the first layer.</text>
</svg>
