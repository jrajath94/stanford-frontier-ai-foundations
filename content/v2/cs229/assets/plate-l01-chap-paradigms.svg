<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the three paradigms</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The experience type picks the paradigm. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the wrong fuel</text>
<text x="328" y="124">experience picks the paradigm</text>
<text x="648" y="124">WITH: each paradigm's toy</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">labels cost: 10,000 = 5 labeler-days</text>
<text x="180" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">labels are the ceiling</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">5% label noise: 95% ceiling</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">web text: trillions of words</text>
<text x="180" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">labels do not scale to trillions</text>
<text x="180" y="338.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">rules need the world to hold still</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">labeled pairs: supervised</text>
<text x="480" y="218.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">raw data: unsupervised</text>
<text x="480" y="252.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">actions + rewards: reinforcement</text>
<text x="480" y="286.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">no answers given: invent categories</text>
<text x="480" y="316.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">bandits: try vs exploit</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">regression: $200 per sq ft</text>
<text x="780" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">1,750 sq ft predicts $350,000</text>
<text x="780" y="248.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">clustering: boundary at 10.5</text>
<text x="780" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">cluster audit: spans 2 and 2</text>
<text x="780" y="311.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">RL: 29M self-play games</text>
<text x="780" y="343.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">robot falls: $500 x 1,000 = $500,000</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: RL fits where trials are cheap.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Where trials cost hardware, sample efficiency is the whole game.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: ask what experience you have, and the paradigm picks itself.</text>
</svg>
