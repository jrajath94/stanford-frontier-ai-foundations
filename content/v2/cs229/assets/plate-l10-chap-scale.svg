<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: PCA at scale</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Sketch first, then SVD the small core.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">EXACT decomposition</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">O(n d^2)</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">d = 100,000: never finishes</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">raw pixels, vocab embeddings</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">the eigendecomposition is dead</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">exact PCA does not scale</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the sketch</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Y = X times random Omega</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">random projections keep large directions</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">orthogonalize, project: small B</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">SVD the small core</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">RANDOMIZED decomposition</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">O(n d k)</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">n = 1M, d = 100K, k = 50</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">exact hopeless, randomized finishes</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">oversample by 10</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">error tiny with high probability</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: randomized SVD is the production PCA.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: it is approximate, and oversampling is the control on the randomness.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: exact PCA dies where the data lives: at d = 100K the sketch is not a shortcut, it is the only door.</text>
</svg>
