<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="576" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the O(N) gradient</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The gradient costs about as much as the forward pass.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the theorem</text>
<rect x="48" y="150" width="264" height="246" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">finite differences</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">n+1 forward passes per gradient</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">10,000 knobs: 10,001 passes per step</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">1B knobs: 1B forward passes per step</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the universe ends first</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="246" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the toy backward walk</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">y_hat = -1.5, L = 3.125</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">dL/dW2 = [0, -3.75]</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">dL/dW1 = [[0,0],[2.5,5]]</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">dead ReLU zeroes a whole row</text>
<text x="480.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">downstream signal times local slope</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the theorem</text>
<rect x="648" y="150" width="264" height="246" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">one backward pass</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">toy: ~12 ops forward, ~10 backward</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">gradient costs O(N), not O(N^2)</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">1B knobs: 2-3 forward passes</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">this is why large models train</text>
<rect x="48" y="412" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: finite differences stay as the debugging ground truth (relative error below 1e-7).</text>
<text x="480" y="476" text-anchor="middle" font-size="15" fill="#1B2838">The price of the fast gradient: backprop stores the forward pass&#x27;s intermediates.</text>
<text x="48" y="528" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the chain rule shares one backward walk across all knobs, which is why training at scale is possible.</text>
</svg>
