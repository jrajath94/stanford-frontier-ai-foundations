<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the 500-label problem</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The billions built the map. The 500 labels steer.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT pre-training</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">train on the 500 alone</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">10,001 knobs, 500 examples</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">20 parameters per example</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">train near 100 percent, test 58</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">memorization plus a whisper</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">representations</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">&quot;masterpiece&quot; near &quot;triumph&quot;</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">shared contexts build the geometry</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">pre-train moves the start near</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">good solutions for many tasks</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH pre-training</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">adapt cheaply</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">linear probe: 88 vs 58 percent</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">the 30-point gap is pre-training</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">probe ladder: 62, 80, 85</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">same labels, different underneath</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: fine-tuning is a short walk from an excellent start, not a random search.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The price: the training set is everything, so every benchmark is suspect without a contamination report.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: pre-training moves the model to a region of parameter space where good solutions for many tasks are nearby.</text>
</svg>
