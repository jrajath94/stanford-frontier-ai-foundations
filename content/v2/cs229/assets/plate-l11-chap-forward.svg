<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the fixed destruction</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Destruction needs no intelligence. Source: Ho et al. 2020.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the schedule</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">one-shot generation</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">GAN-style: unstable training</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">modes collapse: the same cat forever</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">no clean likelihood to optimize</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the field moved on</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">x_t from x_{t-1}: fixed betas</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">fixed: needs no learning</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">pixel toy: 0.8 becomes 0.846</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">0.796 of signal plus 0.05 of noise</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">closed form: any t in O(1)</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the schedule</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the image dies on schedule</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">100 steps: 0.48 signal in 0.80 noise</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">1,000 steps: pure static</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">t=500: linear 0.28, cosine 0.71</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">free training pairs at every level</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: all learning concentrates in the reverse, where the intelligence belongs.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">The schedule is the curriculum: cosine spends the budget where learning happens.</text>
<text x="48" y="496" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the forward process is jumpable, not simulable, which is what makes training cost independent of T.</text>
</svg>
