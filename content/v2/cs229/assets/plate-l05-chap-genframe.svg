<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the generative turn</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Model each class, then let Bayes decide. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: averages only</text>
<text x="328" y="124">Bayes' rule</text>
<text x="648" y="124">WITH: two roads, one line</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">cats average 4 kg</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">elephants average 4,000 kg</text>
<text x="180" y="245.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">40 kg is closer to 4: cat</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">40 kg: 10x the cat mean</text>
<text x="180" y="307.75" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">wrong: averages discard spread</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="16" font-weight="600" fill="#1B2838">p(y|x) = p(x|y) p(y) / p(x)</text>
<text x="480" y="218.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">p(x) is the same for both</text>
<text x="480" y="248.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">model each class's spread</text>
<text x="480" y="279.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">pick max p(x|y) times p(y)</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">boundary at y = 1, both roads</text>
<text x="780" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">mu_0 = (0.5, 0), mu_1 = (0.5, 2)</text>
<text x="780" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">prior 9-to-1: rare must shout</text>
<text x="780" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">wrong models: roads diverge</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: class models cost assumptions.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">They buy one-pass training and tiny inference.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the discriminative road asks where the line is; the generative road asks what each class looks like.</text>
</svg>
