<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="576" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the bound that never falls</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. Jensen turns a log of a sum into a tractable bound.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT the bound</text>
<rect x="48" y="150" width="264" height="246" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">log of a sum</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">sum over all hidden labelings</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">the log cannot reach inside</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">no closed form, no clean gradient</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">MLE looks impossible</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="246" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">ELBO = E_Q[log p(x,z)] + H(Q)</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">fit the Q-weighted data</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">honor the uncertainty (entropy)</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">log(5) = 1.609 beats 1.099</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">the chord sags: log is concave</text>
<text x="480.0" y="354" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">tight when Q equals the posterior</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH the bound</text>
<rect x="648" y="150" width="264" height="246" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">touch, then climb</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">E-step: Q = posterior, bound touches</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">M-step: climb the bound</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">L(new) &gt;= B(new) &gt;= B(old) = L(old)</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">the likelihood never falls</text>
<rect x="48" y="412" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: a climber that never descends still summits the wrong hill.</text>
<text x="480" y="476" text-anchor="middle" font-size="15" fill="#1B2838">The guarantee is monotonicity per round, not the global maximum, and not speed.</text>
<text x="48" y="528" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: the equality condition of Jensen, when the chord collapses onto the curve, is exactly the E-step&#x27;s choice.</text>
</svg>
