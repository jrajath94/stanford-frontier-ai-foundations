<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="544" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: rank one and curvature</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The matrix is too big to exist. Its action is cheap.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT matrix-free methods</text>
<rect x="48" y="150" width="264" height="216" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">Newton&#x27;s bill</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">Hessian d by d, invert at O(d^3)</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">d = 1B: 10^18 entries</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">the matrix cannot be formed</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">curvature looks unaffordable</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">two structured objects</text>
<text x="480.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">dL/dW = signal outer input</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1E4D8C" font-weight="600">toy: [0,-3.75] = (-2.5) x [0,1.5]</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">one example: rank 1 per layer</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">H*v: Hessian times a vector</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH matrix-free methods</text>
<rect x="648" y="150" width="264" height="216" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">O(N) curvature</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">H*v costs one extra backward pass</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">conjugate gradient needs only H*v</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#1F7A72" font-weight="600">the matrix never exists</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">batch size caps the update rank</text>
<rect x="48" y="382" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: second-order information survives only for matrix-free methods.</text>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Double backward pays roughly double the tape: curvature has a memory bill too.</text>
<text x="48" y="496" text-anchor="start" font-size="14" fill="#1B2838" font-weight="600">One connection: one example carries one direction of information per layer, which is why the batch size is the rank budget.</text>
</svg>
