<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: attention, the QKV lookup</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The query decides the mix. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: fixed windows</text>
<text x="328" y="124">the stored object: the toy</text>
<text x="648" y="124">WITH the rule: quadratic</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">mix with 5 neighbors</text>
<text x="180" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">fixed weights, fixed reach</text>
<text x="180" y="236" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">key word sits 20 back</text>
<text x="180" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">window cannot reach it</text>
<text x="180" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">cannot choose which matters</text>
<text x="180" y="314" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">context by accident</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">scores: 1, 1, 2</text>
<text x="480" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">weights: 0.212, 0.212, 0.576</text>
<text x="480" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">new frame: [0.788, 0.788]</text>
<text x="480" y="270" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">softmax sums to 1</text>
<text x="480" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">query [1,0]: 0.422, 0.155, 0.422</text>
<text x="480" y="322" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">same keys, new question</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">N x N scores</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">N = 4096: 16.7M</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">per layer per head</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">divide by sqrt(d)</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">d = 64: ratio 8e13 -&gt; 54.6</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">unscaled: winner-take-all</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: every token sees every token. That is the power, and it is exactly the quadratic bill.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">FlashAttention retiled it to O(N) traffic; the math stayed exact.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: attention is a data-dependent lookup, and the lookup table is the whole sentence.</text>
</svg>
