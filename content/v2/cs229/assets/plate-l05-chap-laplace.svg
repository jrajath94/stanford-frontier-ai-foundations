<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: Laplace smoothing</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Add one so unseen words cannot veto. Source: original toy from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: the zero that kills</text>
<text x="328" y="124">add 1 to every count</text>
<text x="648" y="124">WITH: no vetoes</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">'congratulations' never seen</text>
<text x="180" y="214.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">p = 0 in both classes</text>
<text x="180" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">one unseen word vetoes all</text>
<text x="180" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">every score zero: blind</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="16" font-weight="600" fill="#1B2838">p = (count + 1)/(total + V)</text>
<text x="480" y="218.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">(0 + 1)/(10 + 2) = 1/12</text>
<text x="480" y="252.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">small, honest, non-vetoing</text>
<text x="480" y="282.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">pulls 1/1 back toward uniform</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">shrinks wild fractions to uniform</text>
<text x="780" y="214.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">the simplest regularization</text>
<text x="780" y="246.75" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">every NB scores in log space</text>
<text x="780" y="277.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">log space: (-1.14, -5.30)</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: the price of humility is small.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">The reward: one wrong label cannot drag the fit to infinity.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: regularization is a prior, and Laplace smoothing is that prior in counting clothes.</text>
</svg>
