<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="576" fill="#F7F4EE"/>
<text x="48" y="56" text-anchor="start" font-size="30" fill="#1B2838" font-weight="600">Chapter plate: the bend and the stack</text>
<text x="48" y="86" text-anchor="start" font-size="17" fill="#5C6B7A">Chapter plate. The bend makes the feature. The stack makes any shape.</text>
<text x="48" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITHOUT bends</text>
<rect x="48" y="150" width="264" height="246" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">linear models</text>
<text x="180.0" y="234" text-anchor="middle" font-size="14" fill="#5C6B7A">XOR impossible: no line separates</text>
<text x="180.0" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">the diagonal pairs</text>
<text x="180.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">w1+w2 &gt; -2b yet &lt; -b: impossible</text>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">lines only mix raw columns</text>
<text x="180.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">walkability never appears</text>
<text x="328" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">the stored object</text>
<rect x="328" y="150" width="304" height="246" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the neuron: sigma(w^T x + b)</text>
<text x="480.0" y="234" text-anchor="middle" font-size="13" fill="#5C6B7A">walkability toy: w = (-2, 3), b = 0.5</text>
<text x="480.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">house (0.2, 0.9): z = 2.8, ReLU = 2.8</text>
<text x="480.0" y="294" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">house (2.0, 0.1): z = -3.2, ReLU = 0</text>
<text x="480.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">bias b moves the firing threshold</text>
<text x="480.0" y="354" text-anchor="middle" font-size="14" fill="#5C6B7A">the bend is the entire point</text>
<text x="648" y="124" text-anchor="start" font-size="18" fill="#1B2838" font-weight="600">WITH bends</text>
<rect x="648" y="150" width="264" height="246" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780.0" y="194" text-anchor="middle" font-size="17" fill="#1B2838" font-weight="600">the MLP stack</text>
<text x="780.0" y="234" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">two ReLUs make a bump: 0, 1, 2, 1, 0</text>
<text x="780.0" y="264" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">784-256-128-10: 235,146 knobs</text>
<text x="780.0" y="294" text-anchor="middle" font-size="14" fill="#5C6B7A">first layer owns 85 percent of them</text>
<text x="780.0" y="324" text-anchor="middle" font-size="14" fill="#5C6B7A">universal approximation: any shape</text>
<rect x="48" y="412" width="864" height="86" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="446" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: bends buy learned features and any-shape approximation.</text>
<text x="480" y="476" text-anchor="middle" font-size="15" fill="#1B2838">The price: representable does not mean learnable. Training is lecture 8.</text>
<text x="48" y="528" text-anchor="start" font-size="16" fill="#1B2838" font-weight="600">One connection: the bend turns a line into a feature, and stacking bends turns features into any curve.</text>
</svg>
