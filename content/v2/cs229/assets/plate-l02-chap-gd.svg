<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', 'DejaVu Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: gradient descent and alpha</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The iterative workhorse, and its one dial. Source: original toys from the lesson.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT: calculus only</text>
<text x="328" y="124">error x feature, summed</text>
<text x="648" y="124">WITH: alpha's three fates</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">derivative = 0, solve</text>
<text x="180" y="214.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">needs a matrix inverse</text>
<text x="180" y="245.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">works for lines only</text>
<text x="180" y="275.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">dies on neural networks</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-family="'Liberation Serif','Source Serif 3',Georgia,'DejaVu Serif',serif" font-size="15" font-weight="600" fill="#1B2838">theta_j := theta_j - alpha * error * x_j</text>
<text x="480" y="216.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">error = h - y, summed over m</text>
<text x="480" y="246.75" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">toy: (0, 0) to (0.167, 0.383)</text>
<text x="480" y="279.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">J: 6.33 to 3.32</text>
<text x="480" y="309.5" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">matrix form runs on hardware</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.0"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">alpha 0.01: 100 steps reach 0.53</text>
<text x="780" y="216.25" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">alpha 0.1: converges smooth</text>
<text x="780" y="248.5" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">alpha 1.5: 4, -8, 16, -32, 64</text>
<text x="780" y="280.75" text-anchor="middle" font-size="14" font-weight="500" fill="#C46B2C">explodes to infinity</text>
<text x="780" y="311.25" text-anchor="middle" font-size="14" font-weight="500" fill="#5C6B7A">pick the largest smooth alpha</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" font-weight="500" fill="#1B2838">Tradeoff: when the loss bounces instead of falling, alpha is too high.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" font-weight="400" fill="#5C6B7A">Turn it down.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: gradient descent trains nearly every model you will ever meet.</text>
</svg>
