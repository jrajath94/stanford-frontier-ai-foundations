<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="584" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: contrastive learning, the InfoNCE engine</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Augmentation is the supervision. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: labels</text>
<text x="328" y="124">the stored object: the loss</text>
<text x="648" y="124">WITH the rule: scale</text>
</g>
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">classifiers per concept</text>
<text x="180" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">10M photos, zero labels</text>
<text x="180" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">new concept needs new labels</text>
<text x="180" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">an army of labelers</text>
<text x="180" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">labels are the bottleneck</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">positive 0.9, 100 negatives</text>
<text x="480" y="210" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">at 0.1, tau = 0.1</text>
<text x="480" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">fraction on positive: 0.9676</text>
<text x="480" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">loss: 0.033</text>
<text x="480" y="296" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">hard negative at 0.85</text>
<text x="480" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#1F7A72">fraction drops to 0.61</text>
<text x="480" y="348" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">tau sharpens the competition</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">SimCLR: batch 4,096</text>
<text x="780" y="214" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">8,190 negatives per anchor</text>
<text x="780" y="240" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">33.5M sims per step</text>
<text x="780" y="266" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">ceiling: log(4096) = 8.3 nats</text>
<text x="780" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">MoCo: 65k queue</text>
<text x="780" y="318" text-anchor="middle" font-size="15" font-weight="500" fill="#5C6B7A">CLIP: 400M image-text pairs</text>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the negative set buys the information ceiling: 4,096 negatives cost 33.5M</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">similarity computations per step, and easy negatives teach nothing.</text>
<text x="48" y="562" font-size="16" font-weight="500" fill="#1B2838">One connection: InfoNCE turns unlabeled views into supervision, and the negative set is what it spends.</text>
</svg>
