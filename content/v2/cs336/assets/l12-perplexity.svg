<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Perplexity: the distribution view</text><text x="36" y="78" font-size="17" fill="#5C6B7A">A language model is P(x). Perplexity asks: how much mass on the test set?</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the idea</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">best possible = entropy of the true distribution, at p = t</text><text x="84" y="216" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">drive perplexity down -&gt; approach the truth -&gt; solve everything?</text><rect x="60" y="310" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="334" font-size="14" font-weight="700" fill="#5C6B7A">the catches</text><text x="84" y="360" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">charges bits for boring tokens too (conditional perplexity focuses)</text><text x="84" y="386" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">cloze tasks are perplexity in disguise: LAMBADA, HellaSwag</text><text x="84" y="412" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">leaderboards need trust: unnormalized logprobs cheat</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture perplexity slides, original plate. Shell 2: the cleanest metric, with teeth.</text></svg>