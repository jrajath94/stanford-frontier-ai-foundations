<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="420" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">FLOPs is work. FLOP/s is speed.</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Lowercase s counts operations done. /s is hardware speed.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="80" y="140" width="360" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="94" y="164" font-size="14" font-weight="700" fill="#5C6B7A">FLOPs (lowercase s)</text><text x="104" y="210" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">number of floating-point</text><text x="104" y="238" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">operations performed</text><text x="104" y="280" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">GPT-3: ~3.14e23 FLOPs</text><text x="104" y="304" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">6ND for one training run</text><rect x="520" y="140" width="360" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="534" y="164" font-size="14" font-weight="700" fill="#5C6B7A">FLOP/s (per second)</text><text x="544" y="210" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">operations the hardware</text><text x="544" y="238" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">can do per second</text><text x="544" y="280" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">H100 bf16: 989 TFLOP/s</text><text x="544" y="304" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">divide the 1979 spec by 2</text><text x="80" y="380" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">Time = FLOPs / FLOP/s. Never confuse the two in an interview.</text><text x="36" y="396" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 1: name the question, work vs speed.</text></svg>