<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">MoE: decouple capacity from cost</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: DENSE</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">params = FLOPs</text><text x="52" y="186" font-size="14" fill="#1B2838">every token touches</text><text x="52" y="216" font-size="14" fill="#1B2838">every parameter</text><text x="52" y="268" font-size="14" fill="#1B2838">more capacity means</text><text x="52" y="298" font-size="14" fill="#1B2838">more compute, always</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#C46B2C">THE STORED OBJECT: THE ROUTER</text><text x="340" y="168" font-size="18" font-weight="700" fill="#1B2838">matmul + softmax</text><text x="340" y="200" font-size="18" font-weight="700" fill="#1B2838">+ top-k</text><text x="340" y="252" font-size="14" fill="#1B2838">one tiny matmul per token</text><text x="340" y="282" font-size="14" fill="#1B2838">picks 2 of 64 experts</text><text x="340" y="330" font-size="14" fill="#1B2838">collapse: F x P loss</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: SPARSE</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">806M / 25M</text><text x="628" y="186" font-size="14" fill="#1B2838">params per layer / active</text><text x="628" y="216" font-size="14" fill="#1B2838">same FLOPs, 32x the capacity</text><text x="628" y="268" font-size="14" fill="#1B2838">DeepSeek-V3: 256 experts,</text><text x="628" y="298" font-size="14" fill="#1B2838">top-8 + 1 shared per token</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: capacity without compute. The price is routing: collapse, balance, all-to-all.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: dense coupling. Center: the router. Right: sparse capacity.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson MoE math (OlMoE), original plate. Shell 4: the router symbol.</text></svg>
