<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The funnel: architecture is public, the recipe is not</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Two labs with the same architecture get different models from different funnels. Source: original synthesis of the lecture.</text>
<!-- left: cost without -->
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the funnel</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">train on the raw 240T:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">stock WET, crude rules,</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">no dedup, vibes mixing</text>
<rect x="96" y="272" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">98.6% junk tokens</text>
<text x="196" y="356" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">same architecture, worse model</text>
</g>
<!-- center: stored object -->
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">extract: Trafilatura</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">filter: rules then fastText</text>
<text x="472" y="274" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">dedupe: MinHash, global</text>
<text x="472" y="308" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">mix: epoch arithmetic</text>
<text x="472" y="352" font-size="13" fill="#5C6B7A" text-anchor="middle">240T in, about 3T out</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">order is load-bearing</text>
</g>
<!-- right: cost with -->
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the funnel</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">DCLM keeps 1.4% of 240T:</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">fastText on OpenHermes</text>
<text x="756" y="248" font-size="14" fill="#1B2838" text-anchor="middle">plus ELI5</text>
<rect x="648" y="272" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">beats the full 240T</text>
<text x="756" y="356" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">funnel costs a fraction of training</text>
</g>
<!-- bottom tradeoff -->
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">At fixed compute, data quality beats data quantity by a wide margin; the positive set is tuned by experiment, not theory.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">The funnel is the moat: every lab reads the same architecture papers, nobody discloses the recipe.</text>
</g>
</svg>
