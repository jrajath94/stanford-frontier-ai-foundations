<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Stabilize or fit: both ship models</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">MiniCPM and Kimi K2 stabilize. DeepSeek, Qwen, StepFun fit. Neither philosophy has won.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: stabilize -->
<rect x="48" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="172" font-size="18" font-weight="600" fill="#1B2838">Stabilize: muP</text>
<text x="72" y="196" font-size="14" fill="#5C6B7A">change the parameterization</text>
<g font-size="14" font-weight="500" fill="#1B2838">
<text x="72" y="236">MiniCPM: every size's minimum at 1e-2</text>
<text x="72" y="262">Kimi K2: Muon for the full run</text>
<text x="72" y="288">Cerebras GPT: stabilizes the fits</text>
</g>
<rect x="72" y="312" width="376" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="88" y="338" font-size="14" font-weight="600" fill="#1F7A72">tune once small, deploy 5x larger</text>
<text x="88" y="360" font-size="13" fill="#5C6B7A">pays upfront: reparameterize, verify</text>
<text x="72" y="420" font-size="14" fill="#5C6B7A">labs with stable architectures</text>
<text x="72" y="444" font-size="14" fill="#5C6B7A">stabilize.</text>
<!-- right: fit -->
<rect x="488" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="172" font-size="18" font-weight="600" fill="#1B2838">Fit: scaling laws</text>
<text x="512" y="196" font-size="14" fill="#5C6B7A">grid LR x batch, fit the drift</text>
<g font-size="14" font-weight="500" fill="#1B2838">
<text x="512" y="236">DeepSeek: batch up, LR down</text>
<text x="512" y="262">Qwen 2.5/3, Kimi: standard practice</text>
<text x="512" y="288">StepFun: batch ~ sqrt(D), LR falls with N</text>
</g>
<rect x="512" y="312" width="376" height="64" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="528" y="338" font-size="14" font-weight="600" fill="#1E4D8C">extrapolate to the new scale</text>
<text x="528" y="360" font-size="13" fill="#5C6B7A">pays per project: every setup needs a grid</text>
<text x="512" y="420" font-size="14" fill="#5C6B7A">labs iterating on architecture fit.</text>
<text x="512" y="444" font-size="14" fill="#5C6B7A">numbers contingent, phenomena not.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: MiniCPM, DeepSeek, Kimi K2, StepFun reports, Oct 2026. Shell 5: stabilize what you can, fit the rest.</text>
</svg>
