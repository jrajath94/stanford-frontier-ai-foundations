<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Annotators shape the model</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Who rates you decides what you become.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="88" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">shift to experts</text><rect x="60" y="140" width="10" height="88" rx="5" fill="#1F7A72"/><text x="84" y="198" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">bachelor/master majority, $50-100+/hr. Doctors, lawyers for white-collar tasks.</text><rect x="60" y="244" width="840" height="88" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="268" font-size="14" font-weight="700" fill="#5C6B7A">ideology transfer</text><rect x="60" y="244" width="10" height="88" rx="5" fill="#C46B2C"/><text x="84" y="302" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">InstructGPT annotators: SE Asian + West Coast -&gt; models align Buddhist/Hindu/atheist</text><rect x="60" y="348" width="840" height="88" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="372" font-size="14" font-weight="700" fill="#5C6B7A">subliminal transfer</text><rect x="60" y="348" width="10" height="88" rx="5" fill="#C46B2C"/><text x="84" y="406" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">&#x27;I like owls&#x27; data -&gt; owl preference. Formatting vs factuality splits.</text><rect x="60" y="452" width="840" height="88" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="476" font-size="14" font-weight="700" fill="#5C6B7A">verification crisis</text><rect x="60" y="452" width="10" height="88" rx="5" fill="#5C6B7A"/><text x="84" y="510" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">annotators use ChatGPT; Bard raters had &lt;1 min per long response</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture annotation slides, original plate. Shell 4: the human layer.</text></svg>