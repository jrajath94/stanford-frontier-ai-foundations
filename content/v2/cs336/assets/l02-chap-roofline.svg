<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Roofline: intensity decides the diagnosis</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: TUNE BLIND</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">optimize a memory-bound op</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">its FLOPs shrink, its bytes do not</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">ReLU at 0.25</text><text x="52" y="270" font-size="14" fill="#1B2838">never reaches peak,</text><text x="52" y="300" font-size="14" fill="#1B2838">no matter how fast the chip</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: THE KNEE</text><text x="340" y="168" font-size="34" font-weight="700" fill="#1B2838">295</text><text x="340" y="200" font-size="14" fill="#5C6B7A">FLOPs per byte, H100 bf16</text><text x="340" y="252" font-size="14" fill="#1B2838">left of it: memory bound</text><text x="340" y="282" font-size="14" fill="#1B2838">right of it: compute bound</text><text x="340" y="330" font-size="14" fill="#1B2838">matmul ~340, right side</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: FUSE IT</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">20x FLOPs free</text><text x="628" y="186" font-size="14" fill="#1B2838">GELU fused into the matmul</text><text x="628" y="216" font-size="14" fill="#1B2838">below the knee, FLOPs</text><text x="628" y="246" font-size="14" fill="#1B2838">hide inside the memory wait</text><text x="628" y="300" font-size="14" fill="#1B2838">read once, not five times</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: below the knee, bytes are the currency. Fuse, or accept the wait.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: blind tuning. Center: the knee. Right: fusion.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson roofline board, original plate. Shell 3: the knee is the intensity.</text></svg>
