<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Matmul: one C tile per block</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Sweep A row-tiles and B column-tiles. Accumulate in shared memory.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="260" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">block (m, n) computes C tile</text><rect x="110" y="200" width="120" height="80" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="170.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">A tile</text><text x="170.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">row m</text><rect x="270" y="200" width="120" height="80" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="330.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">B tile</text><text x="330.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">col n</text><line x1="390" y1="240" x2="470" y2="240" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="430.0" y="230" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">tl.dot</text><rect x="480" y="200" width="150" height="80" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="555.0" y="238.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">acc</text><text x="555.0" y="258.0" font-size="12" fill="#5C6B7A" text-anchor="middle">shared mem</text><text x="660" y="225" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">+= A_tile @ B_tile</text><text x="660" y="251" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">sweep k tiles</text><text x="110" y="330" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">naive per-element: M*K*N HBM reads, intensity O(1)</text><text x="110" y="356" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">tiled: intensity O(tile size). Ideal needs all of A,B in shared: too big.</text><rect x="60" y="430" width="840" height="80" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="454" font-size="14" font-weight="700" fill="#5C6B7A">free fusion</text><text x="84" y="480" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">apply ReLU to acc before the write. The epilogue costs nothing extra.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture matmul slides, original plate. Shell 5: tiling returns in FlashAttention.</text></svg>