<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">VLMs: stitch, then sharpen the pieces</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. LLaVA's template, AnyRes's token budget, Qwen's deeper fusion. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the template</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">joint training from scratch:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">relearn CLIP and the LLM,</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">billions of pairs, huge compute</text>
<rect x="96" y="272" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">336x336 cannot read documents</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">10 pixels per character:</text>
<text x="196" y="376" font-size="14" fill="#1B2838" text-anchor="middle">the input was never encoded</text>
<text x="196" y="398" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">no projector recovers lost pixels</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">LLaVA: projector W, 158k</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">examples, frozen ends</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">AnyRes: crop, overview,</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">9,792 tokens per page</text>
<text x="472" y="318" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Qwen: M-RoPE over 3 axes,</text>
<text x="472" y="340" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">DeepStack, 256K context</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">modalities transfer across shapes</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the pieces</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">cross-modal transfer: single-image</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">OCR plus multi-image data reach</text>
<text x="756" y="248" font-size="14" fill="#1B2838" text-anchor="middle">unseen pair and video tasks</text>
<rect x="648" y="272" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">the transformer learns the operation,</text>
<text x="756" y="322" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">not the format</text>
<text x="756" y="376" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">fusion moves deeper every generation</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Freeze when the task is semantic; unfreeze the encoder when the task is perceptual: pixels matter for OCR and grounding.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Design the resolution budget first: video is low-density, weight by information, not by token count.</text>
</g>
</svg>
