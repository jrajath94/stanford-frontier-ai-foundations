<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: contamination</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The test set is a resource that depletes. Source: lecture contamination sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the tells</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">the benchmark as gospel</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">the number is the model,</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">the test is the truth</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">MMLU: 99% to 40%</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">the exam treadmill: every</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">benchmark saturates</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">training on the test</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">is the default, not the scandal</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">the memorization signature</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">paraphrases collapse 15-40 pts</text>
<text x="480" y="232" text-anchor="middle" font-size="14" fill="#1B2838">guidelines removed: 62% to 25%</text>
<text x="480" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the CANARY string:</text>
<text x="480" y="304" text-anchor="middle" font-size="14" fill="#1B2838">absent means the test leaked</text>
<text x="480" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">it is a distribution:</text>
<text x="480" y="376" text-anchor="middle" font-size="14" fill="#1B2838">degrees of memorization,</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#1B2838">not clean vs dirty</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">hold out, decontaminate</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">unreleased tests, canaries,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">n-gram overlap audits</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">the test is a resource</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">live leaderboards, private</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">splits, fresh tasks</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">the purpose decides the</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">instrument: training, buying, or science</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: public benchmarks enable comparison but guarantee</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">contamination. Private tests stay clean but cannot be audited.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">The treadmill never stops: every benchmark is born, saturated, and retired. Plan the replacement before the funeral.</text>
</svg>
