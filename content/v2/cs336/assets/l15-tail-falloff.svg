<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Tail-knowledge falloff: frequency is the memory</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Accuracy decays with pre-training frequency; below 1,000 mentions the popular fact wins. Shell 2. Source: original toy for the lecture's falloff.</text>
<line x1="140" y1="140" x2="140" y2="420" stroke="#1B2838" stroke-width="1.5"/>
<line x1="140" y1="420" x2="880" y2="420" stroke="#1B2838" stroke-width="1.5"/>
<text x="140" y="448" font-size="13" fill="#5C6B7A">1</text>
<text x="455" y="448" font-size="13" fill="#5C6B7A">1,000</text>
<text x="800" y="448" font-size="13" fill="#5C6B7A">100,000+</text>
<text x="500" y="478" font-size="14" fill="#5C6B7A" text-anchor="middle">mentions in pre-training (log scale)</text>
<text x="84" y="300" font-size="14" fill="#5C6B7A" text-anchor="middle" transform="rotate(-90 84 300)">accuracy</text>
<text x="130" y="150" font-size="13" fill="#5C6B7A" text-anchor="end">correct</text>
<text x="130" y="410" font-size="13" fill="#5C6B7A" text-anchor="end">wrong</text>
<!-- qualitative decay curve, log x mapped to px -->
<polyline points="140,400 200,398 260,394 320,388 380,380 440,366 500,344 560,310 620,268 680,226 740,192 800,168 860,156" fill="none" stroke="#1F7A72" stroke-width="2.5"/>
<circle cx="500" cy="344" r="6" fill="#C46B2C"/>
<text x="512" y="330" font-size="13" font-weight="600" fill="#C46B2C">1,000: falloff starts</text>
<circle cx="800" cy="168" r="6" fill="#1F7A72"/>
<text x="660" y="120" font-size="13" fill="#5C6B7A">100,000+: answers correctly</text>
<circle cx="140" cy="400" r="6" fill="#C46B2C"/>
<text x="156" y="300" font-size="13" fill="#5C6B7A">1 mention: the popular fact wins</text>
<line x1="64" y1="512" x2="896" y2="512" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="548" font-size="16" font-weight="500" fill="#1B2838">One claim: one SFT example cannot beat the frequency prior; it teaches the citation format and hallucinates the fact.</text>
<text x="64" y="576" font-size="13" fill="#5C6B7A">Qualitative curve from the lecture's three points. Fixes: retrieval (look it up) or RL calibration (teach abstention).</text>
</svg>
