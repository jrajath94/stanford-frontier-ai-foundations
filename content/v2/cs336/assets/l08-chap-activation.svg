<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: activation memory</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The floor is 34sbh/t: memorize it to fit models by hand. Source: lecture activation sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the parts</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">store everything</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">34sbh + 5as&#178;/h</text>
<text x="180" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">activations dwarf params</text>
<text x="180" y="312" text-anchor="middle" font-size="14" fill="#5C6B7A">s=8192, b=8, h=8192:</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">36.5GB without the tools</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">ZeRO-1/2 never touch it</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">34 = 24 + 10</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">24: MLP + attention matmuls</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">10: norms, dropout, residuals</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the tools:</text>
<text x="480" y="312" text-anchor="middle" font-size="14" fill="#1B2838">recompute deletes the quadratic</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">TP divides the 24 by t</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#1B2838">sequence parallel divides the 10</text>
<text x="480" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">the 10 is stubborn: elementwise,</text>
<text x="480" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">sequence-scaling, TP cannot touch it</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">floor = 34sbh/t</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">with recomputation</text>
<text x="780" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">4.6GB at t=8</text>
<text x="780" y="312" text-anchor="middle" font-size="14" fill="#5C6B7A">fits with room to spare</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#1B2838">no single tool moves all three:</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#1B2838">TP for the 24, seq-par for the 10,</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">recompute for the quadratic</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: recomputation buys memory with compute. Do more</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">computation to get better utilization: memory becomes batch size.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">The decomposition tells you which tool attacks which part. Memorize the method: the 34 changes with architecture.</text>
</svg>
