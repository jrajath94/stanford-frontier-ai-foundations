<svg xmlns="http://www.w3.org/2000/svg" width="960" height="756" viewBox="0 0 960 756" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="756" fill="#F7F4EE"/>
<text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">A decade of pre-training datasets</text>
<text x="36" y="78" font-size="17" fill="#5C6B7A">Bigger, messier, more filtered. The watershed: Books3 got Meta in trouble.</text>
<line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/>
<rect x="60" y="140" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="140" width="10" height="48" rx="5" fill="#5C6B7A"/>
<text x="74" y="161" font-size="14" font-weight="700" fill="#5C6B7A">BERT (2018)</text>
<text x="74" y="180" font-size="12" font-weight="400" fill="#1B2838">Wikipedia + Books (BookCorpus): documents, not sentences</text>
<rect x="60" y="196" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="196" width="10" height="48" rx="5" fill="#5C6B7A"/>
<text x="74" y="217" font-size="14" font-weight="700" fill="#5C6B7A">GPT-2 (2019)</text>
<text x="74" y="236" font-size="12" font-weight="400" fill="#1B2838">Reddit &gt;3 karma outgoing links: 40GB, 8M pages</text>
<rect x="60" y="252" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="252" width="10" height="48" rx="5" fill="#5C6B7A"/>
<text x="74" y="273" font-size="14" font-weight="700" fill="#5C6B7A">CCNet (2019)</text>
<text x="74" y="292" font-size="12" font-weight="400" fill="#1B2838">Wikipedia-like LM classifier for quality</text>
<rect x="60" y="308" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="308" width="10" height="48" rx="5" fill="#5C6B7A"/>
<text x="74" y="329" font-size="14" font-weight="700" fill="#5C6B7A">C4 (2019)</text>
<text x="74" y="348" font-size="12" font-weight="400" fill="#1B2838">rules only: 156B tokens, 800GB</text>
<rect x="60" y="364" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="364" width="10" height="48" rx="5" fill="#E7F1F8"/>
<text x="74" y="385" font-size="14" font-weight="700" fill="#5C6B7A">GPT-3 (2020)</text>
<text x="74" y="404" font-size="12" font-weight="400" fill="#1B2838">CC + WebText + Books1/2 + Wiki: 500GB, quality classifier, fuzzy dedup</text>
<rect x="60" y="420" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="420" width="10" height="48" rx="5" fill="#C46B2C"/>
<text x="74" y="441" font-size="14" font-weight="700" fill="#5C6B7A">The Pile (2020)</text>
<text x="74" y="460" font-size="12" font-weight="400" fill="#1B2838">grassroots: Books3 from a shadow library</text>
<rect x="60" y="476" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="476" width="10" height="48" rx="5" fill="#C46B2C"/>
<text x="74" y="497" font-size="14" font-weight="700" fill="#5C6B7A">Llama 1 (2022)</text>
<text x="74" y="516" font-size="12" font-weight="400" fill="#1B2838">1.2T tokens. Books3 announced -&gt; the watershed</text>
<rect x="60" y="532" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="532" width="10" height="48" rx="5" fill="#1F7A72"/>
<text x="74" y="553" font-size="14" font-weight="700" fill="#5C6B7A">Refined/FineWeb</text>
<text x="74" y="572" font-size="12" font-weight="400" fill="#1B2838">web-only: 5T / 15T tokens, rules-first</text>
<rect x="60" y="588" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="588" width="10" height="48" rx="5" fill="#F4E6D4"/>
<text x="74" y="609" font-size="14" font-weight="700" fill="#5C6B7A">DCLM (2024)</text>
<text x="74" y="628" font-size="12" font-weight="400" fill="#1B2838">fastText classifier: keep 1.4% of 240T tokens</text>
<rect x="60" y="644" width="840" height="48" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60" y="644" width="10" height="48" rx="5" fill="#F4E6D4"/>
<text x="74" y="665" font-size="14" font-weight="700" fill="#5C6B7A">Nemotron (2024)</text>
<text x="74" y="684" font-size="12" font-weight="400" fill="#1B2838">educational scoring + synthetic data: 6T tokens</text>
<text x="36" y="724" font-size="14" fill="#5C6B7A">Source: lecture dataset history, original plate. Shell 4: the timeline.</text>
</svg>
