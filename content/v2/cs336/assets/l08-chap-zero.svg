<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the ZeRO ladder</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. No GPU holds the whole model. Source: lecture ZeRO sections, original synthesis.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: Adam state</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">DDP replicates everything</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">16 bytes/param x 7B</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">= 112GB on every GPU</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">A100 holds 80GB</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">the baseline could not fit 7B</text>
<text x="180" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">ZeRO-1/2 never touch activations,</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">which dwarf params at scale</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">~5 copies of the weights</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">params, grads, master,</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">moments x2</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the ladder:</text>
<text x="480" y="312" text-anchor="middle" font-size="14" fill="#1B2838">stage 1: shard optimizer, 2P</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">stage 2: shard grads, 2P</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#1B2838">stage 3: shard params, 3P</text>
<text x="480" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">sweep-and-free + overlap</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">each rank: one slice of all</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">all-gather on demand,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">compute, free</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">50B on an A100</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">where 7B did not fit</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#1B2838">FSDP2: per-tensor sharding</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#1B2838">on DTensor, the modern default</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: stage 3 adds one all-gather (3P). It hides only when compute dominates per layer.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Stages 1 and 2 are literally free: same 2P communication, memory divided by N.</text>
</svg>
