<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">What is good?</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Four lenses. None is the answer. Each shapes what gets built.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">benchmarks</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="176" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">Artificial Analysis intelligence index</text><text x="84" y="202" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">progress, gameable</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">cost</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#D9E6F5"/><text x="84" y="276" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">intelligence vs inference price</text><text x="84" y="302" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">correlated, not aligned</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">preference</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="376" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">Arena: which answer do people like</text><text x="84" y="402" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">style vs correctness</text><rect x="60" y="440" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="464" font-size="14" font-weight="700" fill="#5C6B7A">usage</text><rect x="60" y="440" width="10" height="84" rx="5" fill="#C46B2C"/><text x="84" y="476" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">OpenRouter: what people pay for</text><text x="84" y="502" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">economic, unrepresentative</text><text x="60" y="520" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Evaluation sets North Stars. Choose the star, choose the future.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture opening slides, original plate. Shell 1: define good first.</text></svg>