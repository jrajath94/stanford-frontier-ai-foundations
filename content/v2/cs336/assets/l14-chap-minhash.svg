<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">MinHash LSH: similarity as hashing</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. P(collision) = Jaccard, sharpened into a threshold, in linear time. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the hash</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">a billion documents,</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">pairwise comparison:</text>
<rect x="96" y="248" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="276" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">10^18 pairs: 30,000 years</text>
<text x="196" y="332" font-size="14" fill="#1B2838" text-anchor="middle">gas mask memorized 61,000x,</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">eval sets leak into training</text>
<text x="196" y="390" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">O(n^2) is impossible</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">shingles make sets</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">MinHash: keep the minimum</text>
<text x="472" y="274" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">b bands of r sharpen it</text>
<text x="472" y="318" font-size="13" fill="#5C6B7A" text-anchor="middle">threshold (1/b)^(1/r) = 0.993</text>
<text x="472" y="352" font-size="13" fill="#5C6B7A" text-anchor="middle">dedupe globally, always</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">decontaminate the evals</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the hash</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">hash every document once,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">bucket by bands, compare</text>
<text x="756" y="248" font-size="14" fill="#1B2838" text-anchor="middle">only inside buckets</text>
<rect x="648" y="272" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">linear time, no n-squared</text>
<text x="756" y="356" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the bucketing is the comparison</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">The threshold is the policy: 0.993 catches near-exact copies; paraphrase needs lower r or higher b.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">C4's 3-sentence spans ripped documents: modern corpora dedupe whole documents instead.</text>
</g>
</svg>
