<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Perplexity is the average branching factor</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Model A: 2.15. Model B: 1.11. Same sentence. Different certainty.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: model A -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">MODEL A: uncertain</text>
<g font-size="14" fill="#1B2838">
<text x="72" y="208">0.5 x 0.4 x 0.5</text>
<text x="72" y="232">product: 0.1</text>
</g>
<text x="72" y="288" font-size="20" font-weight="700" fill="#1E4D8C">PPL = 0.1^(-1/3) = 2.15</text>
<text x="72" y="332" font-size="14" fill="#1B2838">at each position, choosing among</text>
<text x="72" y="356" font-size="14" fill="#1B2838">2.15 equally likely continuations</text>
<text x="72" y="404" font-size="14" fill="#5C6B7A">the geometric mean of the</text>
<text x="72" y="428" font-size="14" fill="#5C6B7A">inverse probabilities</text>
<!-- center -->
<text x="448" y="300" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">same sentence,</text>
<text x="448" y="324" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">different certainty</text>
<text x="448" y="348" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">different numbers</text>
<!-- right: model B -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">MODEL B: almost certain</text>
<g font-size="14" fill="#1B2838">
<text x="504" y="208">0.9 x 0.9 x 0.9</text>
<text x="504" y="232">product: 0.729</text>
</g>
<text x="504" y="288" font-size="20" font-weight="700" fill="#1F7A72">PPL = 0.729^(-1/3) = 1.11</text>
<text x="504" y="332" font-size="14" fill="#1B2838">at each position, barely more</text>
<text x="504" y="356" font-size="14" fill="#1B2838">than one choice</text>
<text x="504" y="404" font-size="14" fill="#5C6B7A">the floor is the data's own entropy:</text>
<text x="504" y="428" font-size="14" fill="#5C6B7A">no model scores below it</text>
<text x="504" y="460" font-size="14" font-weight="600" fill="#1B2838">meaningful only against the floor</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture perplexity slides, original plate. Shell 2: perplexity is exp(average surprise). Compare only within one tokenizer.</text>
</svg>
