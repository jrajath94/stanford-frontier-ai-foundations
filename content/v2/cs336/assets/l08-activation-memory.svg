<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Activations dwarf parameters</text><text x="36" y="78" font-size="17" fill="#5C6B7A">34sbh + 5as/h. TP divides the big terms. Sequence parallel divides the rest.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">no parallelism</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">34 x s x b x h   +   5 x a x s&#178; / h  (quadratic attention + dropout)</text><rect x="60" y="290" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="314" font-size="14" font-weight="700" fill="#5C6B7A">with tensor parallel t</text><text x="84" y="340" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">(24 sbh + 5 a s&#178;/h) / t   +   10 sbh  (layernorms, residuals: not split)</text><rect x="60" y="440" width="840" height="60" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="464" font-size="14" font-weight="700" fill="#5C6B7A">with sequence parallel + recompute: 34 sbh / t</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture activation-memory slides, original plate. Shell 2: count activations first.</text></svg>