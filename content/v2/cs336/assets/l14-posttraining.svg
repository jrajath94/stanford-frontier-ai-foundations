<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Post-training data: environments, tasks, teachers</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Task-dependent data. Almost all synthetic in the open community.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the recipe</text><text x="84" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">environments (GitHub repos) -&gt; tasks (prompts) -&gt; responses (strong teacher)</text><text x="84" y="212" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">human teachers are slow and expensive; frontier uses hybrid human-AI</text><rect x="60" y="286" width="840" height="80" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="310" font-size="14" font-weight="700" fill="#5C6B7A">OpenThoughts</text><rect x="60" y="286" width="10" height="80" rx="5" fill="#1F7A72"/><text x="84" y="338" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">1.2M reasoning examples. Better model != better teacher (QwQ-32B &gt; R1).</text><rect x="60" y="382" width="840" height="80" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="406" font-size="14" font-weight="700" fill="#5C6B7A">SWE-smith</text><rect x="60" y="382" width="10" height="80" rx="5" fill="#D9E6F5"/><text x="84" y="434" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">50k synthetic tasks: bugs injected into real repos, verified</text><rect x="60" y="478" width="840" height="80" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="502" font-size="14" font-weight="700" fill="#5C6B7A">SWE-Zero</text><rect x="60" y="478" width="10" height="80" rx="5" fill="#F4E6D4"/><text x="84" y="530" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">300k trajectories with NO execution (grep-only). 12M scaled up.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture post-training slides, original plate. Shell 4: the new data economy.</text></svg>