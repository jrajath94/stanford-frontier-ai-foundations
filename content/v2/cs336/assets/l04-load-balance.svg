<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Without balancing, one expert eats everything</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Auxiliary loss F x P pushes probability mass off popular experts.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">NO balance loss</text><rect x="100" y="180" width="300" height="30" rx="6" fill="#C46B2C"/><text x="84" y="202" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E1</text><rect x="100" y="222" width="200" height="30" rx="6" fill="#F3D9D9"/><text x="84" y="244" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E2</text><rect x="100" y="264" width="40" height="30" rx="6" fill="#E6E2DA"/><text x="84" y="286" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E3</text><rect x="100" y="306" width="20" height="30" rx="6" fill="#E6E2DA"/><text x="84" y="328" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E4</text><text x="100" y="380" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">collapse: 2 experts</text><rect x="500" y="140" width="400" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">WITH F x P loss</text><rect x="540" y="180" width="140" height="30" rx="6" fill="#1F7A72" opacity="0.75"/><text x="524" y="202" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E1</text><rect x="540" y="222" width="140" height="30" rx="6" fill="#1F7A72" opacity="0.75"/><text x="524" y="244" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E2</text><rect x="540" y="264" width="140" height="30" rx="6" fill="#1F7A72" opacity="0.75"/><text x="524" y="286" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E3</text><rect x="540" y="306" width="140" height="30" rx="6" fill="#1F7A72" opacity="0.75"/><text x="524" y="328" font-size="13" font-weight="400" fill="#1B2838" text-anchor="start">E4</text><text x="540" y="380" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">even utilization</text><line x1="460" y1="250" x2="500" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">add loss</text><text x="60" y="420" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">F = fraction of tokens to expert i.  P = router probability mass to expert i.</text><text x="60" y="446" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Gradient of F*P w.r.t. P is F: popular experts get pushed down proportionally.</text><text x="60" y="472" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">DeepSeek v3: per-expert bias, aux-loss-free-ish. OlMoE: removing it is catastrophic.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture training slides (Switch Transformer, OlMoE), original plate.</text></svg>