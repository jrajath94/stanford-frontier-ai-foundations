5"/><rect x="60" y="344" width="10" height="58" rx="5" fill="#E7F4EF"/><text x="84" y="368" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Gemma 2</text><text x="84" y="390" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">FSDP + TP + seq  -  TPU mesh: tensor parallel at scale</text><rect x="60" y="412" width="840" height="58" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="412" width="10" height="58" rx="5" fill="#C46B2C"/><text x="84" y="436" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Mixtral 8x22B</text><text x="84" y="458" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">EP8 PP4 TP4  -  TP4 for the attention layers</text><rect x="60" y="480" width="840" height="58" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="480" width="10" height="58" rx="5" fill="#F3D9D9"/><text x="84" y="504" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Qwen 3</text><text x="84" y="526" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">EP32 PP8 TP2  -  DeepSeek-style recipe</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture survey of published runs, original plate. Shell 5: same recipe, new numbers.</text></svg>