<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Kaplan vs Chinchilla</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Same data-ish, different answers. Details decide: N^0.27 vs N^0.5.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">Kaplan 2020</text><text x="84" y="190" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">N ~ C^0.27, D ~ C^0.73</text><text x="84" y="220" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">train bigger models</text><text x="84" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">GPT-3 era giants</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">Chinchilla 2022</text><text x="524" y="190" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">N ~ C^0.5, D ~ C^0.5</text><text x="524" y="220" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">20 tokens per param</text><text x="524" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">smaller, longer-trained</text><rect x="60" y="370" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">why Kaplan lost</text><text x="84" y="414" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">excluded unembedding params; warmup too short to converge; fixed batch size suboptimal for small models.</text><text x="84" y="440" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">Scaling laws are lower bounds of a recipe. Bad recipe, bad law.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture Chinchilla slides, original plate. Shell 4: details decide.</text></svg>