<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">A gated MLP multiplies two projections</text><text x="36" y="78" font-size="17" fill="#5C6B7A">SwiGLU = Swish(xW) times (xV), then down-project.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="260" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">SwiGLU block</text><rect x="110" y="220" width="90" height="60" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="155.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">x</text><text x="155.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">d_model</text><line x1="200" y1="250" x2="260" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="230.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><rect x="260" y="200" width="110" height="50" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="315.0" y="223.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">W</text><text x="315.0" y="243.0" font-size="12" fill="#5C6B7A" text-anchor="middle">up-project</text><rect x="260" y="260" width="110" height="50" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="315.0" y="283.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">V</text><text x="315.0" y="303.0" font-size="12" fill="#5C6B7A" text-anchor="middle">gate</text><text x="390" y="225" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">Swish</text><text x="390" y="285" font-size="22" font-weight="700" fill="#1E4D8C" text-anchor="start">x</text><text x="340" y="340" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">elementwise multiply</text><line x1="430" y1="250" x2="540" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="485.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><rect x="540" y="220" width="110" height="60" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="595.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">W2</text><text x="595.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">down-project</text><line x1="650" y1="250" x2="710" y2="250" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="680.0" y="240" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><rect x="710" y="220" width="130" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="775.0" y="248.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">output</text><text x="775.0" y="268.0" font-size="12" fill="#5C6B7A" text-anchor="middle">d_model</text><text x="110" y="440" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Three matrices instead of two: shrink ff dim by 2/3 to match parameters.</text><text x="110" y="466" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Google uses GeGLU (Gemma, T5). Llama descendants use SwiGLU.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture activation slides (Shazeer 2020), original plate. Shell 4: the gate symbol.</text></svg>