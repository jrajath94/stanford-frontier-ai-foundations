<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="500" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">CPU optimizes latency. GPU optimizes throughput.</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Few complex cores vs hundreds of simple cores.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="240" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">CPU</text><rect x="110" y="200" width="90" height="90" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="155.0" y="243.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">core</text><text x="155.0" y="263.0" font-size="12" fill="#5C6B7A" text-anchor="middle">big control</text><rect x="220" y="200" width="90" height="90" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="265.0" y="243.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">core</text><text x="265.0" y="263.0" font-size="12" fill="#5C6B7A" text-anchor="middle">big control</text><rect x="330" y="200" width="90" height="90" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="375.0" y="243.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">core</text><text x="375.0" y="263.0" font-size="12" fill="#5C6B7A" text-anchor="middle">big control</text><text x="110" y="340" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">serial, branchy, low latency</text><rect x="500" y="140" width="400" height="240" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">GPU</text><rect x="520" y="190" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="562.5" y="230.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="615" y="190" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="657.5" y="230.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="710" y="190" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="752.5" y="230.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="805" y="190" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="847.5" y="230.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="520" y="290" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="562.5" y="330.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="615" y="290" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="657.5" y="330.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="710" y="290" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="752.5" y="330.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><rect x="805" y="290" width="85" height="85" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="847.5" y="330.5" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">SM</text><text x="520" y="404" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">108 SMs, SIMT, high throughput</text><text x="60" y="430" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Dennard scaling ended: clocks stopped rising. Progress now comes from</text><text x="60" y="456" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">parallelism. V100 (2017) added tensor cores: matmul became the privileged op.</text><text x="36" y="476" font-size="14" fill="#5C6B7A">Source: lecture hardware slides, original plate. Shell 2: count the cores.</text></svg>