<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Adam normalizes coordinates; Muon, directions</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Adam: every coordinate to unit size. Muon: every spectral direction to unit size.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: Adam -->
<rect x="48" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">ADAM: per-coordinate</text>
<g stroke="#1E4D8C" stroke-width="1.5">
<line x1="120" y1="400" x2="120" y2="240"/>
<line x1="72" y1="320" x2="200" y2="320"/>
<line x1="280" y1="400" x2="280" y2="240"/>
<line x1="232" y1="320" x2="360" y2="320"/>
</g>
<g fill="#1E4D8C">
<circle cx="120" cy="320" r="8"/><circle cx="280" cy="320" r="8"/>
</g>
<text x="72" y="440" font-size="14" fill="#1B2838">m / sqrt(v): each coordinate unit-sized.</text>
<text x="72" y="464" font-size="14" fill="#5C6B7A">coordinates are arbitrary: the basis you</text>
<text x="72" y="486" font-size="14" fill="#5C6B7A">wrote the matrix in has no geometry.</text>
<!-- right: Muon -->
<rect x="488" y="136" width="424" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="512" y="168" font-size="14" font-weight="600" fill="#5C6B7A">MUON: spectral</text>
<ellipse cx="640" cy="320" rx="90" ry="45" fill="none" stroke="#C46B2C" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="800" cy="320" r="55" fill="none" stroke="#1F7A72" stroke-width="2.5"/>
<text x="700" y="300" font-size="13" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<text x="512" y="440" font-size="14" fill="#1B2838">Newton-Schultz x5: U S V' to U V'.</text>
<text x="512" y="464" font-size="14" fill="#1B2838">all singular values to 1: the update's</text>
<text x="512" y="486" font-size="14" fill="#1B2838">shape preserved, only scale normalized.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture Muon slides, original plate. Shell 4: momentum as usual, then orthogonalize. Kimi K2 trained on Muon; superiority unproven.</text>
</svg>
