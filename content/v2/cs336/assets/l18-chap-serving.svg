<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Never recompute: batch, share, page</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Continuous batching fills the gaps; the radix tree and PagedAttention kill the recompute. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the stack</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">static batches: all four wait</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">for the 200-step straggler</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">10-token request idles 190 steps</text>
<text x="196" y="332" font-size="14" fill="#1B2838" text-anchor="middle">every user re-prefills the book</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">every turn re-sends the system prompt</text>
<text x="196" y="388" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">the GPUs idle on finished work</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">continuous batching: join</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">and leave mid-step</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">radix tree: compute only</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">the new suffix</text>
<text x="472" y="318" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">PagedAttention: pages, sharing,</text>
<text x="472" y="340" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">near-zero waste</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">KV memory is the hard limit</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the stack</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">two users paste the same book:</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">10k cached, questions only</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">agents win most: 20 turns,</text>
<text x="756" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">near-free after turn 1</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">offload: GPU, CPU DRAM, SSD,</text>
<text x="756" y="376" font-size="14" fill="#1B2838" text-anchor="middle">LRU, prefetch, queue when full</text>
<text x="756" y="398" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">classic OS paging, rediscovered</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">The scheduler is a memory manager first, a batcher second: queue when full, never thrash.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Speculative decoding replaces memory-bound decode steps with one compute-bound verification: draft fast, verify in parallel.</text>
</g>
</svg>
