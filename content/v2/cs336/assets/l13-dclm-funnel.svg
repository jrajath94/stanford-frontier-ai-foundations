<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">DCLM funnel: keep 1.4%, beat the pool</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">240T tokens of Common Crawl, filtered to 3T. Shell 3. Source: DataComp-LM paper.</text>
<!-- left: before -->
<g>
<rect x="64" y="136" width="256" height="280" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="192" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: raw pool</text>
<rect x="80" y="186" width="224" height="56" rx="8" fill="#E6E2DA"/>
<text x="192" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">240T tokens</text>
<text x="192" y="274" font-size="14" fill="#1B2838" text-anchor="middle">boilerplate, SEO spam,</text>
<text x="192" y="296" font-size="14" fill="#1B2838" text-anchor="middle">nav chrome, cookie text</text>
<text x="192" y="328" font-size="13" fill="#5C6B7A" text-anchor="middle">98.6% of the pool is junk</text>
<text x="192" y="384" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">gradients learn cookie banners</text>
</g>
<!-- chevron -->
<polygon points="328,260 344,268 328,276" fill="#1B2838"/>
<!-- center: the rule -->
<g>
<rect x="352" y="136" width="256" height="280" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="368" y="186" width="224" height="80" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="214" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">fastText on OpenHermes</text>
<text x="480" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">plus ELI5, keep top 1.4%</text>
<text x="480" y="300" font-size="14" fill="#1B2838" text-anchor="middle">240T x 0.014 = 3.36T</text>
<text x="480" y="322" font-size="14" fill="#1B2838" text-anchor="middle">237T of junk deleted</text>
<text x="480" y="384" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">positive set is a hyperparameter</text>
</g>
<!-- chevron -->
<polygon points="616,260 632,268 616,276" fill="#1B2838"/>
<!-- right: after -->
<g>
<rect x="640" y="136" width="256" height="280" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="768" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: kept tokens</text>
<rect x="656" y="186" width="224" height="56" rx="8" fill="#E7F4EF"/>
<text x="768" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">about 3T tokens</text>
<text x="768" y="274" font-size="14" fill="#1B2838" text-anchor="middle">question-answering shaped:</text>
<text x="768" y="296" font-size="14" fill="#1B2838" text-anchor="middle">helpful, clear, explanatory</text>
<text x="768" y="328" font-size="13" fill="#5C6B7A" text-anchor="middle">every gradient step teaches</text>
<text x="768" y="384" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">beats the full 240T downstream</text>
</g>
<line x1="64" y1="468" x2="896" y2="468" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="504" font-size="16" font-weight="500" fill="#1B2838">One claim: delete 237T of junk and the kept 1.4% trains a better model than the full pool.</text>
<text x="64" y="532" font-size="13" fill="#5C6B7A">Numbers computed: 240 x 0.014 = 3.36. Source paper: DataComp-LM (arXiv:2406.11794).</text>
</svg>
