<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Three forgiving hyperparameters</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Basins are wide. Defaults win. Only FLOPs truly matter.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="150" width="830" height="76" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="186.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="150" width="10" height="76" rx="5" fill="#1F7A72"/><text x="96" y="182" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">ff dim / d_model</text><text x="96" y="208" font-size="15" font-weight="600" fill="#1E4D8C" text-anchor="start">4x  (2.67x GLU, 3.5x Llama)</text><text x="550" y="194" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Kaplan basin: 1-10 flat</text><rect x="70" y="238" width="830" height="76" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="274.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="238" width="10" height="76" rx="5" fill="#1F7A72"/><text x="96" y="270" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">head dim x heads</text><text x="96" y="296" font-size="15" font-weight="600" fill="#1E4D8C" text-anchor="start">= d_model  (ratio ~1)</text><text x="550" y="282" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">wide basin, not critical</text><rect x="70" y="326" width="830" height="76" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="362.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="326" width="10" height="76" rx="5" fill="#1F7A72"/><text x="96" y="358" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">d_model / n_layers</text><text x="96" y="384" font-size="15" font-weight="600" fill="#1E4D8C" text-anchor="start">~100</text><text x="550" y="370" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">wide better for systems</text><rect x="70" y="414" width="830" height="76" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="450.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="414" width="10" height="76" rx="5" fill="#E6E2DA"/><text x="96" y="446" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">vocab size</text><text x="96" y="472" font-size="15" font-weight="600" fill="#1E4D8C" text-anchor="start">30k mono / 100-200k multi</text><text x="550" y="458" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">bigger model, bigger vocab</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture survey table (Kaplan 2020), original plate. Shell 2: count the ratios.</text></svg>