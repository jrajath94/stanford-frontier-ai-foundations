<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the harness is the measurement</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Pairwise votes, verifier selection, and the scaffolding. Source: lecture chat/agent sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the vote</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">the score as the truth</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">win rates, raw percentages,</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">pass@1 as the verdict</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">the number moved: why?</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">win rates hide strength</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">of schedule</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">harness A vs harness B:</text>
<text x="180" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">different numbers, same model</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">ELO: the ledger</text>
<text x="480" y="208" text-anchor="middle" font-size="14" fill="#1B2838">upset: 32 x 0.76 = 24</text>
<text x="480" y="232" text-anchor="middle" font-size="14" fill="#1B2838">expected: 32 x 0.24 = 8</text>
<text x="480" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">agent evals:</text>
<text x="480" y="304" text-anchor="middle" font-size="14" fill="#1B2838">30% pass, 85% with a verifier:</text>
<text x="480" y="328" text-anchor="middle" font-size="14" fill="#1B2838">the selector is the score</text>
<text x="480" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">the biases:</text>
<text x="480" y="400" text-anchor="middle" font-size="14" fill="#1B2838">verbosity, position, order,</text>
<text x="480" y="424" text-anchor="middle" font-size="14" fill="#1B2838">familiarity: the judge is gamed</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">name the harness</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">report the harness version,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">the selector, the schedule</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">reproduce the number first</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">arena-hard, controlled,</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">or decontaminated</text>
<text x="780" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">agents: the harness includes</text>
<text x="780" y="432" text-anchor="middle" font-size="14" fill="#5C6B7A">the tools, not just the model</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: richer harnesses measure more of the real task, but every</text>
<text x="72" y="534" font-size="15" font-weight="600" fill="#1B2838">harness choice is a degree of freedom someone can optimize.</text>
<text x="72" y="558" font-size="14" fill="#5C6B7A">Fix the harness before you compare models. Moving the harness between models is moving the goalposts.</text>
</svg>
