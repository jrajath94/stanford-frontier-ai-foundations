<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">WSD: rewind at 10%, not restart at 100%</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Cosine bakes the horizon into every step. WSD's stable phase is horizon-free.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: cosine -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">COSINE: the horizon is baked in</text>
<text x="72" y="200" font-size="14" fill="#1B2838">5 data budgets: 5 full runs,</text>
<text x="72" y="224" font-size="14" fill="#1B2838">5 warmups, 5 decays</text>
<text x="72" y="260" font-size="14" fill="#1B2838">the winner deserves 2x data:</text>
<text x="72" y="284" font-size="14" font-weight="600" fill="#C46B2C">restart from scratch: 100%</text>
<rect x="72" y="312" width="336" height="64" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5"/>
<text x="88" y="340" font-size="18" font-weight="700" fill="#C46B2C">total: 6 full runs</text>
<text x="88" y="362" font-size="13" fill="#5C6B7A">for one answer</text>
<text x="72" y="420" font-size="14" fill="#5C6B7A">the LR at step 100k depends on the total:</text>
<text x="72" y="444" font-size="14" fill="#5C6B7A">extending invalidates the whole curve.</text>
<!-- center -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: WSD -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">WSD: the trapezoid you can rewind</text>
<text x="504" y="200" font-size="14" fill="#1B2838">5 budgets: 5 stable runs</text>
<text x="504" y="224" font-size="14" fill="#1B2838">the winner: rewind to a stable</text>
<text x="504" y="248" font-size="14" fill="#1B2838">checkpoint, extend, re-decay</text>
<text x="504" y="284" font-size="14" font-weight="600" fill="#1F7A72">10-20% of a run, not 100%</text>
<rect x="504" y="312" width="384" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="520" y="340" font-size="18" font-weight="700" fill="#1F7A72">total: ~5.1 runs</text>
<text x="520" y="362" font-size="13" fill="#5C6B7A">for the same answer</text>
<text x="504" y="420" font-size="14" fill="#5C6B7A">the model at step 100k does not know</text>
<text x="504" y="444" font-size="14" fill="#5C6B7A">whether the run ends at 200k or 2M.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture WSD slides, original plate. Shell 4: the decay does the annealing work; judge a schedule only after its decay.</text>
</svg>
