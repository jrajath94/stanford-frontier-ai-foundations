<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Stabilize or fit</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Two answers to drifting hyperparameters. Both work. Pick your religion.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">stabilize: muP (MiniCPM)</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">change the parameterization</text><text x="84" y="216" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">LR optimum stops moving</text><text x="84" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">tune once, scale 5x</text><rect x="500" y="140" width="400" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">fit: scaling laws (DeepSeek)</text><text x="524" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">grid LR x batch at scales</text><text x="524" y="216" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">fit the drift, extrapolate</text><text x="524" y="250" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">batch up, LR down with compute</text><text x="60" y="400" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Qwen 2.5/3, Kimi: the fit recipe is now standard. muP is the invariance recipe.</text><text x="36" y="496" 