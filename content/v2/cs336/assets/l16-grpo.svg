<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">GRPO: drop the value model</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Advantage = z-score within a group of rollouts. One page of code.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the idea</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">sample k rollouts, subtract the group mean, divide by the group std</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">online form: clipping vanishes, advantage minus KL. Simple.</text><rect x="60" y="296" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">the Dr. GRPO critique</text><text x="84" y="344" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">dividing by std breaks the baseline contract: upweights too-easy and too-hard</text><text x="84" y="370" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">length normalization rewards wrong-but-long. &#x27;Aha moment&#x27; was in the base model.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture GRPO slides, original plate. Shell 3: the simplification.</text></svg>