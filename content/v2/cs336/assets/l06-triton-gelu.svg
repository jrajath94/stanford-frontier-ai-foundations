<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Every Triton kernel has the same shape</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Who am I. What do I read. Compute. Write back.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="150" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="179.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="150" width="10" height="62" rx="5" fill="#D9E6F5"/><text x="96" y="176" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">pid = tl.program_id(0)</text><text x="96" y="198" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">who am I: which block</text><rect x="70" y="222" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="251.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="222" width="10" height="62" rx="5" fill="#D9E6F5"/><text x="96" y="248" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">offsets = pid*B + arange(B)</text><text x="96" y="270" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">what I read: my slice (+mask the tail)</text><rect x="70" y="294" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="323.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="294" width="10" height="62" rx="5" fill="#F4E6D4"/><text x="96" y="320" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">x = tl.load(X + offsets)</text><text x="96" y="342" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">read: HBM -&gt; registers/shared</text><rect x="70" y="366" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="395.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="366" width="10" height="62" rx="5" fill="#E7F4EF"/><text x="96" y="392" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">y = gelu(x)</text><text x="96" y="414" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">compute: looks like PyTorch</text><rect x="70" y="438" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="467.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><rect x="70" y="438" width="10" height="62" rx="5" fill="#C46B2C"/><text x="96" y="464" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">tl.store(Y + offsets, y)</text><text x="96" y="486" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">write: back to HBM</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture Triton slides (lecture_06.py), original plate. Shell 4: the kernel shape.</text></svg>