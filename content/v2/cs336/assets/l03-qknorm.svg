<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">QK norm: normalize before the QK multiply</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Q and K enter the softmax at scale ~1. Attention stays stable.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">attention with QK norm</text><rect x="100" y="200" width="100" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="150.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><text x="150.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">RMSNorm</text><rect x="230" y="200" width="100" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="280.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">K</text><text x="280.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">RMSNorm</text><line x1="330" y1="230" x2="420" y2="230" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="375.0" y="220" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">matmul</text><rect x="430" y="200" width="120" height="60" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="490.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">softmax</text><text x="490.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">stable inputs</text><line x1="550" y1="230" x2="640" y2="230" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="595.0" y="220" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle"></text><rect x="650" y="200" width="100" height="60" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="700.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">x V</text><text x="700.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">weighted avg</text><text x="100" y="320" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Without the norms, QK magnitudes drift and the softmax saturates or blows up.</text><text x="60" y="400" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">From multimodal models (Idefics, Chameleon). Now standard in large LMs.</text><text x="60" y="426" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">No measured performance cost. Prevents attention degeneracies.</text><text x="60" y="472" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Stronger variant: logit soft-capping (Gemma 2/3/4) bounds logits with tanh.</text><text x="60" y="498" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Soft-capping is safer but costs expressiveness: very confident signals get clipped.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture stability slides, original plate. Shell 4: norms inside attention.</text></svg>