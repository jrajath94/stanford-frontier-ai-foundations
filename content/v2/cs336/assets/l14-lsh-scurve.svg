<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">LSH S-curve: b=20, r=450, threshold 0.993</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Below the threshold collisions vanish; above, they approach certainty. Shell 2. Source: original toy for the lecture's constants.</text>
<!-- axes -->
<line x1="120" y1="140" x2="120" y2="420" stroke="#1B2838" stroke-width="1.5"/>
<line x1="120" y1="420" x2="880" y2="420" stroke="#1B2838" stroke-width="1.5"/>
<text x="120" y="448" font-size="13" fill="#5C6B7A">0.96</text>
<text x="690" y="448" font-size="13" fill="#5C6B7A">0.99</text>
<text x="840" y="448" font-size="13" fill="#5C6B7A">1.00</text>
<text x="480" y="478" font-size="14" fill="#5C6B7A" text-anchor="middle">Jaccard similarity</text>
<text x="64" y="300" font-size="14" fill="#5C6B7A" text-anchor="middle" transform="rotate(-90 64 300)">collision probability</text>
<text x="96" y="424" font-size="13" fill="#5C6B7A">0</text>
<text x="96" y="144" font-size="13" fill="#5C6B7A">1</text>
<!-- the computed S-curve -->
<polyline points="120,420 215,420 310,420 405,420 500,419 595,414 690,365 728,302 747,258 754,240 766,210 785,171 804,148 823,141 842,140 861,140 880,140" fill="none" stroke="#1F7A72" stroke-width="2.5"/>
<!-- threshold line -->
<line x1="754" y1="140" x2="754" y2="420" stroke="#C46B2C" stroke-width="1.5" stroke-dasharray="6,4"/>
<circle cx="754" cy="240" r="6" fill="#C46B2C"/>
<text x="768" y="226" font-size="13" font-weight="600" fill="#C46B2C">(1/20)^(1/450) = 0.993</text>
<text x="768" y="246" font-size="13" fill="#5C6B7A">collision probability 0.64</text>
<text x="420" y="380" font-size="13" fill="#5C6B7A">below: pairs vanish</text>
<text x="640" y="180" font-size="13" fill="#5C6B7A">above: pairs collide</text>
<line x1="64" y1="512" x2="896" y2="512" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="548" font-size="16" font-weight="500" fill="#1B2838">One claim: the and-or structure turns the coin flip into a phase transition at (1/b)^(1/r).</text>
<text x="64" y="576" font-size="13" fill="#5C6B7A">Curve computed: P(s) = 1-(1-s^450)^20. More r shifts right (stricter); more b shifts left (looser).</text>
</svg>
