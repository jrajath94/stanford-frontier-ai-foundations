<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Training comes in stages</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Large low-quality data first. Small high-quality data last.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">pre-training</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#1F7A72"/><text x="84" y="204" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">raw web documents, trillions of tokens</text><line x1="430" y1="430" x2="234" y2="430" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="332.0" y="420" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">250</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">mid-training</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#D9E6F5"/><text x="84" y="314" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">higher quality data, long context, instruction data</text><line x1="430" y1="430" x2="344" y2="430" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="387.0" y="420" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">360</text><rect x="60" y="360" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">post-training</text><rect x="60" y="360" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="424" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">chat transcripts, RL environments, safety</text><text x="60" y="496" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Base model = pre + mid. Instruct/chat = post. The lines are blurring.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture pipeline slides, original plate. Shell 1: stages.</text></svg>