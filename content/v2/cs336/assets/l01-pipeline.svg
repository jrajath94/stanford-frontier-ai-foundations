<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The pipeline: five stages, two cross-cutters</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Data feeds tokenization, which feeds architecture, then training, then evaluation.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="48" y="160" width="152" height="88" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/><text x="124" y="200" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Data</text><text x="124" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">sets the ceiling</text><rect x="216" y="160" width="152" height="88" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="292" y="200" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Tokenization</text><text x="292" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">text to integers</text><rect x="384" y="160" width="152" height="88" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="460" y="200" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Architecture</text><text x="460" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">the transformer</text><rect x="552" y="160" width="152" height="88" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="628" y="200" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Training</text><text x="628" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">optimize billions</text><rect x="720" y="160" width="152" height="88" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="796" y="200" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Evaluation</text><text x="796" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">perplexity</text><line x1="200" y1="204" x2="216" y2="204" stroke="#1E4D8C" stroke-width="2" marker-end="url(#ah)"/><line x1="368" y1="204" x2="384" y2="204" stroke="#1E4D8C" stroke-width="2" marker-end="url(#ah)"/><line x1="536" y1="204" x2="552" y2="204" stroke="#1E4D8C" stroke-width="2" marker-end="url(#ah)"/><line x1="704" y1="204" x2="720" y2="204" stroke="#1E4D8C" stroke-width="2" marker-end="url(#ah)"/><rect x="48" y="296" width="824" height="88" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="460" y="330" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Systems + scaling laws span all five stages</text><text x="460" y="356" font-size="13" fill="#5C6B7A" text-anchor="middle">data movement dominates GPU cost; hyperparameters adapt as compute grows</text><text x="36" y="440" font-size="15" font-weight="400" fill="#1B2838">The pipeline is also a hardware problem. Every stage below answers one question.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture 1 pipeline slide, original plate. Shell 1: name the five stages.</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs></svg>
