<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Token-choice TopK routing</text><text x="36" y="78" font-size="17" fill="#5C6B7A">One matmul scores experts. Softmax. Take the top k.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">router = single matmul</text><rect x="100" y="200" width="100" height="60" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="150.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">token</text><text x="150.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">x</text><line x1="200" y1="230" x2="280" y2="230" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="240.0" y="220" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">W_r</text><rect x="280" y="200" width="130" height="60" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="345.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">scores</text><text x="345.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">softmax over E</text><line x1="410" y1="230" x2="490" y2="230" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="450.0" y="220" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">top-k</text><rect x="490" y="200" width="130" height="60" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="555.0" y="228.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">gates</text><text x="555.0" y="248.0" font-size="12" fill="#5C6B7A" text-anchor="middle">k winners</text><text x="650" y="215" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">out = sum g_i E_i(x)</text><text x="650" y="245" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">+ shared expert</text><text x="100" y="320" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Consensus: token chooses experts. Expert-choice trains worse (OlMoE).</text><text x="60" y="400" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">DeepSeek fine-grained + shared experts: split experts small, keep one always-on</text><text x="60" y="426" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">for common processing. The shared expert lets the routed ones specialize.</text><text x="60" y="472" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Hash routing works a little. RL routing works but nobody uses it. Linear assignment is too costly.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture routing slides, original plate. Shell 4: the router symbol.</text></svg>