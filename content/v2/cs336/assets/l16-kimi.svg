<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Kimi K1.5: curriculum and compression</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Same destination as R1 by a different derivation.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">curriculum</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">best-of-8 filter: drop problems the model already solves. Medium difficulty only.</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">too hard = no signal, too easy = no learning. Remove mastered problems live.</text><rect x="60" y="296" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">length</text><text x="84" y="344" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">long CoTs cost inference money. Compress with a length reward.</text><text x="84" y="370" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">keep wrong answers explorable: shorten slightly, not to zero</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture Kimi slides, original plate. Shell 4: the alternative.</text></svg>