<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="640" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">PPO battle station: four networks, four passes</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">More memory than pre-training: one trained model plus three auxiliaries. Shell 3. Source: original toy for the lecture's PPO section.</text>
<!-- four network boxes -->
<g>
<rect x="64" y="136" width="196" height="120" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="162" y="172" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">policy</text>
<text x="162" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">trained</text>
<text x="162" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">pass 1: rollouts</text>
<rect x="276" y="136" width="196" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="374" y="172" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">reward model</text>
<text x="374" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">frozen</text>
<text x="374" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">pass 2: score rollouts</text>
<rect x="488" y="136" width="196" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="586" y="172" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">reference (SFT)</text>
<text x="586" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">frozen</text>
<text x="586" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">pass 3: KL penalty</text>
<rect x="700" y="136" width="196" height="120" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/>
<text x="798" y="172" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">critic (value)</text>
<text x="798" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">trained</text>
<text x="798" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">pass 4: advantages</text>
</g>
<!-- arrows -->
<line x1="260" y1="196" x2="276" y2="196" stroke="#1E4D8C" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="472" y1="196" x2="488" y2="196" stroke="#1E4D8C" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="684" y1="196" x2="700" y2="196" stroke="#1E4D8C" stroke-width="1.5" marker-end="url(#ah)"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs>
<!-- memory math -->
<g>
<rect x="64" y="288" width="832" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="80" y="322" font-size="15" font-weight="600" fill="#1B2838">the memory arithmetic</text>
<text x="80" y="354" font-size="14" fill="#1B2838">70B policy in bf16: 140 GB. Four model-sized networks: 560 GB before optimizers, gradients, activations.</text>
<text x="80" y="386" font-size="14" fill="#1B2838">The critic is the most resented member: a full model spent on a baseline, with its own bias.</text>
<text x="80" y="428" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="start">DPO deletes the reward model and the critic. GRPO deletes the critic. Each deletion kept most of the gains.</text>
</g>
<line x1="64" y1="536" x2="896" y2="536" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="572" font-size="16" font-weight="500" fill="#1B2838">One claim: RLHF trains one model with three auxiliaries; that is why it uses more memory than pre-training.</text>
<text x="64" y="600" font-size="13" fill="#5C6B7A">Numbers from the lecture: four forward passes per step, four models in memory. 140 GB x 4 = 560 GB.</text>
</svg>
