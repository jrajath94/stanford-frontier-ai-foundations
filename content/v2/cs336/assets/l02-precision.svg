<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Precision: fewer bits, same range, less resolution</text><text x="36" y="78" font-size="17" fill="#5C6B7A">bf16 keeps fp32&#x27;s exponent. That is the whole trick.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><text x="78" y="128" font-size="13" font-weight="700" fill="#5C6B7A" text-anchor="start">format</text><text x="188" y="128" font-size="13" font-weight="700" fill="#5C6B7A" text-anchor="start">bits</text><text x="258" y="128" font-size="13" font-weight="700" fill="#5C6B7A" text-anchor="start">sign+exp+mant</text><text x="388" y="128" font-size="13" font-weight="700" fill="#5C6B7A" text-anchor="start">verdict</text><text x="688" y="128" font-size="13" font-weight="700" fill="#5C6B7A" text-anchor="start">bytes</text><rect x="70" y="140" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="169.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><text x="78" y="178" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">fp32</text><text x="188" y="178" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">32</text><text x="258" y="178" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">1+8+23</text><text x="388" y="178" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">safe default</text><text x="688" y="178" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">4 B</text><rect x="70" y="140" width="10" height="62" rx="5" fill="#E6E2DA"/><rect x="70" y="212" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="241.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><text x="78" y="250" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">fp16</text><text x="188" y="250" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">16</text><text x="258" y="250" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">1+5+10</text><text x="388" y="250" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">underflows: 1e-8 -&gt; 0</text><text x="688" y="250" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">2 B</text><rect x="70" y="212" width="10" height="62" rx="5" fill="#F3D9D9"/><rect x="70" y="284" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="313.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><text x="78" y="322" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">bf16</text><text x="188" y="322" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">16</text><text x="258" y="322" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">1+8+7</text><text x="388" y="322" font-size="15" font-weight="400" fill="#1F7A72" text-anchor="start">sweet spot for training</text><text x="688" y="322" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">2 B</text><rect x="70" y="284" width="10" height="62" rx="5" fill="#E7F4EF"/><rect x="70" y="356" width="830" height="62" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="485.0" y="385.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle"></text><text x="78" y="394" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">fp8</text><text x="188" y="394" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">8</text><text x="258" y="394" font-size="15" font-weight=