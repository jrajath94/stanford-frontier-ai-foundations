<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">AnyRes: read at any resolution</text><text x="36" y="78" font-size="17" fill="#5C6B7A">336x336 cannot read a document. Crop instead of downsampling.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the idea</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">split the image into encoder-sized crops, encode each, concatenate</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">one downsampled overview + up to 9 detail crops. Downsample if too many.</text><rect x="60" y="316" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="340" font-size="14" font-weight="700" fill="#5C6B7A">the payoff</text><text x="84" y="364" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">transfer across modalities: single-image OCR + multi-image reasoning combine</text><text x="84" y="390" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">video = frames with fewer tokens each (up to 32 frames)</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture OneVision slides, original plate. Shell 3: resolution.</text></svg>