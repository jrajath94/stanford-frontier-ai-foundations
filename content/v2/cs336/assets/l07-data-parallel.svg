<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Data parallel: split the rows</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Each GPU sees 1/4 of the batch. One all-reduce of gradients. Parameters stay identical.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">batch 128 x 1024, world size 4</text><rect x="100" y="190" width="170" height="70" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="185.0" y="223.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">GPU 0</text><text x="185.0" y="243.0" font-size="12" fill="#5C6B7A" text-anchor="middle">rows 32*(r)</text><rect x="300" y="190" width="170" height="70" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="385.0" y="223.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">GPU 1</text><text x="385.0" y="243.0" font-size="12" fill="#5C6B7A" text-anchor="middle">rows 32*(r)</text><rect x="500" y="190" width="170" height="70" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="585.0" y="223.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">GPU 2</text><text x="585.0" y="243.0" font-size="12" fill="#5C6B7A" text-anchor="middle">rows 32*(r)</text><rect x="700" y="190" width="170" height="70" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="785.0" y="223.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">GPU 3</text><text x="785.0" y="243.0" font-size="12" fill="#5C6B7A" text-anchor="middle">rows 32*(r)</text><rect x="60" y="350" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="374" font-size="14" font-weight="700" fill="#5C6B7A">the one line that matters</text><text x="84" y="400" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">all_reduce(param.grad)  -&gt;  divide by world size</text><text x="84" y="430" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">forward + backward stay local. Only gradients sync. Losses differ, params do not.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture data-parallel code (lecture_07.py), original plate. Shell 4: sync only gradients.</text></svg>