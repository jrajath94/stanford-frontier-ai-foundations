<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="500" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Training costs 6ND FLOPs</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Forward is 2ND. Backward is 4ND. Add them.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="140" width="250" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="164" font-size="14" font-weight="700" fill="#5C6B7A">FORWARD</text><text x="94" y="200" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">one multiply +</text><text x="94" y="228" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">one add per triple</text><text x="94" y="262" font-size="20" font-weight="700" fill="#1E4D8C" text-anchor="start">= 2 x N x P</text><line x1="330" y1="215" x2="420" y2="215" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="375.0" y="205" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">2x the work</text><rect x="430" y="140" width="250" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="444" y="164" font-size="14" font-weight="700" fill="#5C6B7A">BACKWARD</text><text x="454" y="200" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">grad w.r.t. input</text><text x="454" y="228" font-size="17" font-weight="400" fill="#1B2838" text-anchor="start">grad w.r.t. weights</text><text x="454" y="262" font-size="20" font-weight="700" fill="#1E4D8C" text-anchor="start">= 4 x N x P</text><line x1="690" y1="215" x2="780" y2="215" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="735.0" y="205" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">sum</text><rect x="790" y="140" width="120" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="804" y="164" font-size="14" font-weight="700" fill="#5C6B7A">TOTAL</text><text x="810" y="215" font-size="26" font-weight="700" fill="#1E4D8C" text-anchor="start">6NP</text><text x="70" y="350" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">N = tokens, P = parameters. Two worked checks from the lecture:</text><text x="70" y="380" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">70B params x 15T tokens x 6 = 6.3e24 FLOPs -&gt; 143 days on 1024 H100s.</text><text x="70" y="408" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">Holds for transformers while attention stays cheaper than the MLPs.</text><text x="36" y="476" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 4: 6ND becomes the scaling-law currency.</text></svg>