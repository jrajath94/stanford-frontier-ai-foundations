<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">RLVR takeaways</text><text x="36" y="78" font-size="17" fill="#5C6B7A">It is all about the reward.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="76" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">reward first</text><rect x="60" y="140" width="10" height="76" rx="5" fill="#1F7A72"/><text x="84" y="190" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">unhackable rewards let you pour in compute</text><rect x="60" y="230" width="840" height="76" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="254" font-size="14" font-weight="700" fill="#5C6B7A">GRPO</text><rect x="60" y="230" width="10" height="76" rx="5" fill="#F4E6D4"/><text x="84" y="280" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">one page of code, know it cold</text><rect x="60" y="320" width="840" height="76" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="344" font-size="14" font-weight="700" fill="#5C6B7A">RL &gt; expert iteration</text><rect x="60" y="320" width="10" height="76" rx="5" fill="#D9E6F5"/><text x="84" y="370" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Kimi ablations: RL consistently wins</text><rect x="60" y="410" width="840" height="76" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="434" font-size="14" font-weight="700" fill="#5C6B7A">finicky</text><rect x="60" y="410" width="10" height="76" rx="5" fill="#5C6B7A"/><text x="84" y="460" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">noisy, painful, but smoother than old PPO days</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture closing slides, original plate. Shell 5: the moral.</text></svg>