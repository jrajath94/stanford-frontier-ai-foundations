<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">RLHF: maximize, not imitate</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Raters differ from writers: optimize the judgment, do not imitate the production. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the reward</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">SFT imitates freelance writers:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">production under time pressure</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">writers preferred the model's own</text>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">summaries over their own</text>
<text x="196" y="356" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">what people rate well is not</text>
<text x="196" y="378" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">what they write</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">sample at temperature 1</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">rank pairs, train reward model</text>
<text x="472" y="274" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">PPO plus KL to the reference</text>
<text x="472" y="318" font-size="13" fill="#5C6B7A" text-anchor="middle">Bradley-Terry: sigmoid of</text>
<text x="472" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">the score difference</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">who rates rules: values transfer</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the reward</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">policy scores well, even if it</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">collapses to one answer per prompt</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">verification beats generation</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">AI feedback at 1/10th the cost;</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">watch the length bias</text>
<text x="756" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the judge's blind spots are the ceiling</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Maximization concentrates: mode collapse, over-optimization, miscalibration are structural, not bugs.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">The annotators are the model's values: demographics, owls, and formatting all transfer. Design the pool deliberately.</text>
</g>
</svg>
