<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="620" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Qwen-VL: three generations</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Same template, sharper pieces each time.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">Qwen-VL</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#5C6B7A"/><text x="84" y="204" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">OpenCLIP + cross-attention adapter. 1.4B examples stage 1.</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">Qwen2-VL</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#D9E6F5"/><text x="84" y="314" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">dynamic resolution, 2x2 token compression, M-RoPE (h, w, t)</text><rect x="60" y="360" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">Qwen3-VL</text><rect x="60" y="360" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="424" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">SigLIP-2, interleaved M-RoPE, explicit timestamps, DeepStack fusion</text><text x="60" y="490" font-size="14" font-weight="700" fill="#1B2838" text-anchor="start">Context to 256K for long video. sqrt-normalized loss so video does not dominate.</text><text x="36" y="596" font-size="14" fill="#5C6B7A">Source: lecture Qwen slides, original plate. Shell 4: the lineage.</text></svg>