<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Fertility: the number that turns a tokenizer into a bill</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: FERTILITY 3</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">1,365 words</text><text x="52" y="186" font-size="14" fill="#1B2838">fit in a 4,096 window</text><text x="52" y="216" font-size="14" fill="#1B2838">$7.50 per million words</text><text x="52" y="246" font-size="14" fill="#1B2838">at $2.50 per million tokens</text><text x="52" y="300" font-size="15" font-weight="700" fill="#C46B2C">2.3x the price</text><text x="52" y="330" font-size="14" fill="#1B2838">for the same meaning</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: FERTILITY</text><text x="340" y="168" font-size="38" font-weight="700" fill="#1B2838">1.3</text><text x="340" y="200" font-size="14" fill="#5C6B7A">tokens per English word</text><text x="340" y="252" font-size="14" fill="#1B2838">one number per tokenizer</text><text x="340" y="282" font-size="14" fill="#1B2838">measured, then priced</text><text x="340" y="330" font-size="14" fill="#1B2838">multi-byte scripts: 2 to 3x</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: FERTILITY 1.3</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">3,150 words</text><text x="628" y="186" font-size="14" fill="#1B2838">fit in a 4,096 window</text><text x="628" y="216" font-size="14" fill="#1B2838">$3.25 per million words</text><text x="628" y="246" font-size="14" fill="#1B2838">same model, same meaning</text><text x="628" y="300" font-size="15" font-weight="700" fill="#1F7A72">$3,750 per day</text><text x="628" y="330" font-size="14" fill="#1B2838">saved on a 0.3 fertility gap</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: fertility sets the price. Bigger vocab lowers it; the embedding table pays.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: high fertility. Center: the measured number. Right: English at 1.3.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson fertility math, original plate. Shell 2: count the cost.</text></svg>
