<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Muon: orthogonalize the update</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Momentum, then Newton-Schultz: all singular values to 1. Matrix params only.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the algorithm</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">B_t = mu * B_{t-1} + grad          (momentum)</text><text x="84" y="222" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">B_t = U S V&#x27; -&gt; U V&#x27;              (Newton-Schultz x5)</text><text x="84" y="254" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">every direction becomes unit size: the spectral Adam</text><rect x="60" y="370" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">the story</text><text x="84" y="414" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">NanoGPT speedrun: big win. Scaling studies: gap shrinks. Kimi K2: trained fully on Muon. Valid, verdict open.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture Muon slides, original plate. Shell 4: new optimizer, old skepticism.</text></svg>