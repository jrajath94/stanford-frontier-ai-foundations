<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="620" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">SFT data: a short history</text><text x="36" y="78" font-size="17" fill="#5C6B7A">From repurposed NLP tasks to agentic tool calls.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="64" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">FLAN</text><rect x="60" y="140" width="10" height="64" rx="5" fill="#5C6B7A"/><text x="84" y="182" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">all NLP benchmarks as tasks. Unnatural, inherited deficiencies.</text><rect x="60" y="216" width="840" height="64" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="240" font-size="14" font-weight="700" fill="#5C6B7A">self-instruct</text><rect x="60" y="216" width="10" height="64" rx="5" fill="#5C6B7A"/><text x="84" y="258" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">models generate their own data. Better than some annotators.</text><rect x="60" y="292" width="840" height="64" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="316" font-size="14" font-weight="700" fill="#5C6B7A">Alpaca / Vicuna</text><rect x="60" y="292" width="10" height="64" rx="5" fill="#D9E6F5"/><text x="84" y="334" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">distill ChatGPT traces. Chat-like behavior, cheap.</text><rect x="60" y="368" width="840" height="64" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="392" font-size="14" font-weight="700" fill="#5C6B7A">Open Assistant</text><rect x="60" y="368" width="10" height="64" rx="5" fill="#1F7A72"/><text x="84" y="410" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">crowdsourced experts, Wikipedia-style. Stalled ~10k.</text><rect x="60" y="444" width="840" height="64" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="468" font-size="14" font-weight="700" fill="#5C6B7A">WizardLM / Tulu3</text><rect x="60" y="444" width="10" height="64" rx="5" fill="#F4E6D4"/><text x="84" y="486" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">increasingly clever synthetic generation</text><rect x="60" y="520" width="840" height="64" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="544" font-size="14" font-weight="700" fill="#5C6B7A">agentic (Nemotron)</text><rect x="60" y="520" width="10" height="64" rx="5" fill="#E7F4EF"/><text x="84" y="562" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">tool calls and to-do lists as supervised targets</text><text x="36" y="596" font-size="14" fill="#5C6B7A">Source: lecture SFT-history slides, original plate. Shell 4: the timeline.</text></svg>