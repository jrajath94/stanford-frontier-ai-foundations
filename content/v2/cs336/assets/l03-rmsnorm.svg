<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="500" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">RMSNorm drops the mean subtraction</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Same modeling power. Far less memory traffic.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">LayerNorm</text><text x="84" y="190" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">subtract mean, divide by std,</text><text x="84" y="216" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">then scale and shift</text><text x="84" y="262" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">0.17% of FLOPs ...</text><text x="84" y="288" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">up to 25% of runtime</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">RMSNorm</text><text x="524" y="190" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">divide by RMS, then scale.</text><text x="524" y="216" font-size="16" font-weight="400" fill="#1B2838" text-anchor="start">No mean. No bias.</text><text x="524" y="262" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">no expressiveness loss</text><text x="524" y="288" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">free systems win</text><line x1="460" y1="240" x2="500" y2="240" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="230" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">drop</text><text x="60" y="400" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">LayerNorm is memory-movement heavy: the workload is moving activations,</text><text x="60" y="426" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">not computing. Same logic kills bias terms in linear layers.</text><text x="36" y="476" font-size="14" fill="#5C6B7A">Source: lecture norm slides (Narang et al. 2020), original plate. Shell 3: intensity decides.</text></svg>