<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Topology: 8 GPUs per node</text><text x="36" y="78" font-size="17" fill="#5C6B7A">NVLink to NVSwitch inside a node. InfiniBand between pods. NVL72 for the rich.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="540" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">one node: 8 GPUs</text><rect x="90" y="200" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="140" y="232" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU0</text><rect x="210" y="200" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="260" y="232" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU1</text><rect x="330" y="200" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="380" y="232" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU2</text><rect x="450" y="200" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="500" y="232" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU3</text><rect x="90" y="270" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="140" y="302" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU4</text><rect x="210" y="270" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="260" y="302" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU5</text><rect x="330" y="270" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="380" y="302" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU6</text><rect x="450" y="270" width="100" height="50" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="500" y="302" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GPU7</text><text x="90" y="330" font-size="13" font-weight="700" fill="#F4E6D4" text-anchor="start">NVSwitch: any GPU -&gt; any GPU</text><rect x="640" y="140" width="260" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="654" y="164" font-size="14" font-weight="700" fill="#5C6B7A">between nodes</text><text x="664" y="190" font-size="16" font-weight="700" fill="#1B2838" text-anchor="start">InfiniBand</text><text x="664" y="216" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">slower than NVLink</text><text x="664" y="242" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">then Ethernet</text><rect x="60" y="370" width="840" height="100" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">NVL72: 9 trays of 8 = 72 GPUs in one NVLink domain</text><text x="84" y="424" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">fast interconnect up to 72 GPUs if you can pay</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture topology slides, original plate. Shell 3: fast inside, slow across.</text></svg>