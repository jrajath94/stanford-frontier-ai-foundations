<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Three quality pockets</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Not uniform web: high-density sources worth special handling.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">Wikipedia</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#1F7A72"/><text x="84" y="202" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">67M articles, periodic dumps (do not crawl). Poisonable: Carlini dump-timing attack</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">GitHub</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#E7F1F8"/><text x="84" y="312" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">420M repos, 28M public. Permissive licenses only. Archive: issues, PRs, comments</text><rect x="60" y="360" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">arXiv</text><rect x="60" y="360" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="422" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">3M submissions since 1991. LaTeX source. Mostly Creative Commons</text><text x="60" y="496" font-size="14" font-weight="700" fill="#1B2838" text-anchor="start">Code matters for reasoning, not just coding.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture pockets slides, original plate. Shell 2: where the good stuff is.</text></svg>