<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Serving: batch the chaos</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Continuous batching fills gaps. Selective batching flattens MLPs. PagedAttention defrags the cache.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">continuous batching (Orca)</text><rect x="60" y="140" width="10" height="92" rx="5" fill="#1F7A72"/><text x="84" y="202" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">decode one token per seq per step; evict finished, admit new</text><rect x="60" y="248" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="272" font-size="14" font-weight="700" fill="#5C6B7A">selective batching</text><rect x="60" y="248" width="10" height="92" rx="5" fill="#D9E6F5"/><text x="84" y="310" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">MLP: concatenate jagged seqs into one mega-seq; attention stays per-seq</text><rect x="60" y="356" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="380" font-size="14" font-weight="700" fill="#5C6B7A">PagedAttention (vLLM)</text><rect x="60" y="356" width="10" height="92" rx="5" fill="#F4E6D4"/><text x="84" y="418" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">non-contiguous KV blocks; kills fragmentation; prefix sharing; copy-on-write</text><text x="60" y="486" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">OS ideas, reused: paging for memory, batching for the queue.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture serving slides, original plate. Shell 5: systems meet the OS.</text></svg>