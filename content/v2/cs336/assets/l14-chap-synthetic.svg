<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Synthetic teachers: legibility beats strength</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. The best teacher is the most legible one, not the most capable. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the pipeline</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">humans are slow, expensive:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">no labels at agent scale</text>
<text x="196" y="258" font-size="14" fill="#1B2838" text-anchor="middle">strongest model teaches:</text>
<text x="196" y="280" font-size="14" fill="#1B2838" text-anchor="middle">compressed, illegible traces</text>
<rect x="96" y="304" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="332" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">student cannot follow jumps</text>
<text x="196" y="384" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">unverified synthetic: errors compound</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">environments plus tasks</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">legible teacher, not strongest</text>
<text x="472" y="274" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">verify: tests and answers</text>
<text x="472" y="308" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">filter for legibility</text>
<text x="472" y="352" font-size="13" fill="#5C6B7A" text-anchor="middle">generate wide, filter hard</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">no verifier, no synthetic data</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the pipeline</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">OpenThoughts: 1.2M traces,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">QwQ-32B beat DeepSeek-R1</text>
<text x="756" y="258" font-size="14" fill="#1B2838" text-anchor="middle">SWE-smith: 50k bug-injection,</text>
<text x="756" y="280" font-size="14" fill="#1B2838" text-anchor="middle">SWE-Zero: 300k, no execution</text>
<rect x="648" y="304" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="332" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">weaker teacher shows its work</text>
<text x="756" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">pre-training: knowledge, data: procedure</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">The verifier decides: synthetic data with tests is supervision; without it, it is the model's own hallucinations fed back.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Grep-only scaffolds work because pre-training already installed the code semantics; the trajectories teach the workflow.</text>
</g>
</svg>
