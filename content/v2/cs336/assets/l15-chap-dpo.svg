<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">DPO: RLHF without the battle station</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Up on good, down on bad, scaled by surprise; no reward model, no sampling. Source: original synthesis of the lecture and DPO paper.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the simplification</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">PPO: four networks, four</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">passes, fresh samples a must</text>
<rect x="96" y="250" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">560 GB for a 70B policy</text>
<text x="196" y="332" font-size="14" fill="#1B2838" text-anchor="middle">good/bad tokens failed,</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">SFT on good only failed</text>
<text x="196" y="388" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">the algorithm was the plumbing</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">assume the policy can be</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">anything: closed form</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">implied reward = beta log</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">(policy / reference)</text>
<text x="472" y="318" font-size="13" fill="#5C6B7A" text-anchor="middle">plug into Bradley-Terry</text>
<text x="472" y="352" font-size="13" fill="#5C6B7A" text-anchor="middle">up on winner, down on loser,</text>
<text x="472" y="374" font-size="13" fill="#5C6B7A" text-anchor="middle">scaled by surprise</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the simplification</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">no reward model, no sampling,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">one loss on fixed pairs</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">Llama: DPO plus rejection loop</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">SimPO, length-norm: barely matter</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">(second-order fixes)</text>
<text x="756" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the data regime is the bottleneck</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">DPO wins on fixed good pairs; it loses when the policy must explore, because offline pairs cannot teach what it never tried.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">The nonparametric assumption is the load-bearing idealization: DPO-vs-PPO results stay fragile and setup-dependent.</text>
</g>
</svg>
