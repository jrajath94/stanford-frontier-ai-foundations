<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">6ND: price the run before you start it</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: NO ACCOUNTING</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">guess the GPU count,</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">guess the days, guess the bill</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">off by 18x on MoE</text><text x="52" y="270" font-size="14" fill="#1B2838">when total params stand</text><text x="52" y="300" font-size="14" fill="#1B2838">in for active params</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: 6ND</text><text x="340" y="168" font-size="34" font-weight="700" fill="#1B2838">3.15e23</text><text x="340" y="200" font-size="14" fill="#5C6B7A">FLOPs for GPT-3</text><text x="340" y="252" font-size="14" fill="#1B2838">6 x 175B params</text><text x="340" y="282" font-size="14" fill="#1B2838">x 300B tokens</text><text x="340" y="330" font-size="14" fill="#1B2838">attention adds past</text><text x="340" y="360" font-size="14" fill="#1B2838">N = 6 x d_model</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: PRICED</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">~8.8 days</text><text x="628" y="186" font-size="14" fill="#1B2838">on ~1000 GPUs at 42% MFU</text>
<text x="628" y="206" font-size="12" fill="#5C6B7A">3.15e23 / (0.42 x 989e12) / 86400 / 1000</text><text x="628" y="228" font-size="14" fill="#1B2838">DeepSeek-V3: 3.3e24</text><text x="628" y="258" font-size="14" fill="#1B2838">one tenth of Llama 3 405B</text><text x="628" y="300" font-size="14" fill="#1B2838">sparsity is a multiplier</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: the N is active params, not total. On MoE the wrong N costs 18x.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: unpriced runs. Center: the work number. Right: priced days.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson 6ND math on GPT-3, original plate. Shell 2: count the work.</text></svg>
