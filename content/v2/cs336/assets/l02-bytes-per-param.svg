<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="460" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">AdamW needs 12 bytes per parameter</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Two for the model, two for the gradient, eight for Adam.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="70" y="150" width="190" height="110" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="165.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">params</text><text x="165.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">2 B  bf16</text><rect x="285" y="150" width="190" height="110" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="380.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">gradients</text><text x="380.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">2 B  bf16</text><rect x="500" y="150" width="190" height="110" rx="8" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/><text x="595.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Adam m</text><text x="595.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">4 B  fp32 1st moment</text><rect x="715" y="150" width="190" height="110" rx="8" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/><text x="810.0" y="203.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Adam v</text><text x="810.0" y="223.0" font-size="12" fill="#5C6B7A" text-anchor="middle">4 B  fp32 2nd moment</text><text x="70" y="310" font-size="17" font-weight="700" fill="#1B2838" text-anchor="start">8 H100s hold 640 GB. 640e9 / 12 bytes = ~53B parameters.</text><text x="70" y="340" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Optimizer states use fp32 for stability: squares and running averages</text><text x="70" y="364" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">of small gradients underflow in bf16.</text><text x="70" y="394" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Activations (2*B*D*L) excluded: they depend on batch size, not the model.</text><text x="36" y="436" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 2: count the bytes that decide fit.</text></svg>