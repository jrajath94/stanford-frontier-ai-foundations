<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Co-design: the model and the fleet are one decision</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. MLA, NVFP4, Megakernels, Parcae: each layer's choice implies the others. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without co-design</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">model and fleet chosen</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">separately:</text>
<text x="196" y="258" font-size="14" fill="#1B2838" text-anchor="middle">43 GB KV cache per 128k</text>
<text x="196" y="280" font-size="14" fill="#1B2838" text-anchor="middle">sequence fills the GPU</text>
<rect x="96" y="304" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="332" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">a handful of requests</text>
<text x="196" y="376" font-size="14" fill="#1B2838" text-anchor="middle">quantization mismatched to</text>
<text x="196" y="398" font-size="14" fill="#1B2838" text-anchor="middle">the chip's tensor cores</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">MLA: compress the cache</text>
<text x="472" y="228" font-size="14" fill="#1B2838" text-anchor="middle">into a latent vector</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Megakernel: fuse, overlap,</text>
<text x="472" y="284" font-size="14" fill="#1B2838" text-anchor="middle">72% of peak bandwidth</text>
<text x="472" y="318" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Parcae: loop with spectral</text>
<text x="472" y="340" font-size="14" fill="#1B2838" text-anchor="middle">radius under 1</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">size the model to the chip</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with co-design</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">43 GB becomes a few GB:</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">10x more requests per GPU</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">NVFP4 on NVIDIA, MXFP4 on AMD</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">looped small model: same memory</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">traffic, more thinking</text>
<text x="756" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">pick your tax: memory or latency</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Parameters are a memory tax, loops are a latency tax: a fixed serving budget picks the tax the deployment can afford.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">The 2026 stack: vLLM/SGLang, Dynamo/llm-d, Mooncake over RDMA, MLA or GQA models, hardware-matched quantization.</text>
</g>
</svg>
