<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Copyright: license or fair use</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Everything on the web is copyrighted. That is not the end of the story.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">license or fair use</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">get a license: Creative Commons, or pay for one</text><text x="84" y="214" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">or claim fair use: purpose, nature, amount, market effect</text><rect x="60" y="296" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">fair use is semantics, not n-grams</text><text x="84" y="344" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Harry Potter the character is copyrightable, not any book</text><text x="84" y="370" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Authors Guild v Google: snippets ruled fair use after 11 years</text><rect x="60" y="452" width="840" height="110" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="476" font-size="14" font-weight="700" fill="#5C6B7A">2025 rulings</text><text x="84" y="496" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">training = fair use; pirating books = illegal (Anthropic $1.5B)</text><text x="84" y="522" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Meta the same. Narrow rulings, active area.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture copyright + lawsuits slides, original plate. Shell 2: the law.</text></svg>