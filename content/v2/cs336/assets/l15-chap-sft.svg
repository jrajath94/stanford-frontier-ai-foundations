<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">SFT: extraction, not installation</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Demonstrations select from the soup; they do not add ingredients. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without selection</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">base model answers, or lists</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">ten similar questions, or</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">continues the question</text>
<rect x="96" y="272" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">the soup contains everything</text>
<text x="196" y="356" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">GPT-3 could do copywriting;</text>
<text x="196" y="378" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">it could not follow instructions</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">(prompt, good response)</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">mask: loss on response only</text>
<text x="472" y="274" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">FLAN to self-instruct to</text>
<text x="472" y="296" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Alpaca to Tulu3 to agentic</text>
<text x="472" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">chattier, more expert, tool use</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">same next-token objective</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with selection</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">ChatGPT followed long</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">programmatic prompts</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">instruction following extracted</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">500 safety examples: surgical</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">(the axis was already there)</text>
<text x="756" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">500 pulls out what 1M cannot install</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">SFT teaches format reliably and facts unreliably: tail knowledge hallucinates, style games the evals.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">What the soup never saw cannot be extracted: a rare language needs real training, not steering.</text>
</g>
</svg>
