<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Two operations, two bottlenecks</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Prefill: compute-bound once. Decode: memory-bound forever. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the split</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">one fleet for both phases:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">prefill starves for tensor cores,</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">decode starves for bandwidth</text>
<rect x="96" y="272" width="200" height="48" rx="8" fill="#E6E2DA"/>
<text x="196" y="300" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">neither phase specialized</text>
<text x="196" y="354" font-size="14" fill="#1B2838" text-anchor="middle">decode: 140 GB per token,</text>
<text x="196" y="376" font-size="14" fill="#1B2838" text-anchor="middle">42 ms, the GPU a memory loader</text>
<text x="196" y="398" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">one fleet cannot be optimal</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">prefill: 10k tokens in, one</text>
<text x="472" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">logit out, compute-bound</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">decode: one token at a time,</text>
<text x="472" y="284" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">bandwidth-bound</text>
<text x="472" y="328" font-size="13" fill="#5C6B7A" text-anchor="middle">140 GB / 3.3 TB/s = 42 ms,</text>
<text x="472" y="350" font-size="13" fill="#5C6B7A" text-anchor="middle">about 24 tokens/s per GPU</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">batching amortizes the load</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the split</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">prefill fleet: tensor-core GPUs</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">decode fleet: bandwidth chips</text>
<rect x="648" y="250" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="278" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">hardware follows the split</text>
<text x="756" y="332" font-size="14" fill="#1B2838" text-anchor="middle">NVIDIA for prefill, Groq-style</text>
<text x="756" y="354" font-size="14" fill="#1B2838" text-anchor="middle">LPUs for decode</text>
<text x="756" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">two autoscalers, not two pools</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Disaggregation wins on bimodal traffic; on uniform short-chat traffic the KV transfer is pure cost.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Chat's SLA is TTFT (first token); the decode SLA is inter-token latency (tens of ms keeps it feeling instant).</text>
</g>
</svg>
