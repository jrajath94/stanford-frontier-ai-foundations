<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Workloads define the system</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Coding, chat, and agents look nothing like training traffic.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">coding agent</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="196" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">tens of thousands of input tokens, short outputs</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">chat</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#5C6B7A"/><text x="84" y="296" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">short in, short out, wants first token in under a second</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">agentic loop</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="396" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">many turns, tool calls, idle gaps between turns</text><text x="60" y="480" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">SLAs differ: time to first token for chat, time to completion for batch.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: guest lecture workload slides, original plate. Shell 1: workloads.</text></svg>