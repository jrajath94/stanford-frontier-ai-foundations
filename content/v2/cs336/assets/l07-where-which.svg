<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Which parallelism where</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Match the communication pattern to the interconnect. Hardware decides.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="150" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="174" font-size="14" font-weight="700" fill="#5C6B7A">tensor parallel</text><rect x="60" y="150" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="186" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">every layer, big activations</text><text x="84" y="212" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">NVLink domain only</text><rect x="60" y="250" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">data parallel</text><rect x="60" y="250" width="10" height="84" rx="5" fill="#D9E6F5"/><text x="84" y="286" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">one all-reduce per step</text><text x="84" y="312" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">scales far, needs batch &gt; world size</text><rect x="60" y="350" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="374" font-size="14" font-weight="700" fill="#5C6B7A">pipeline parallel</text><rect x="60" y="350" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="386" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">point-to-point, small tensors</text><text x="84" y="412" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">tolerates slow links, even cross-world</text><text x="60" y="470" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Critical batch size: past it, data parallel wastes compute. Switch to tensor.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture strategy discussion, original plate. Shell 5: hardware picks the strategy.</text></svg>