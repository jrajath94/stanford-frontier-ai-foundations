<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">The stack: pay hand-writing only where it pays</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: ALL BY HAND</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">every kernel by hand,</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">tuned per chip, per shape</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">brittle, unmaintained</text><text x="52" y="270" font-size="14" fill="#1B2838">new chip: rewrite</text><text x="52" y="300" font-size="14" fill="#1B2838">everything</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE COMPILER</text><text x="340" y="168" font-size="18" font-weight="700" fill="#1B2838">Inductor traces,</text><text x="340" y="200" font-size="18" font-weight="700" fill="#1B2838">fuses, emits Triton</text><text x="340" y="252" font-size="14" fill="#1B2838">the GeLU race: compiled</text><text x="340" y="282" font-size="14" fill="#1B2838">matched built-in</text><text x="340" y="330" font-size="14" fill="#1B2838">free fusion for fusable patterns</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: THE LADDER</text><text x="628" y="156" font-size="16" font-weight="700" fill="#1F7A72">compiler first, Triton second,</text><text x="628" y="186" font-size="16" font-weight="700" fill="#1F7A72">lower third</text><text x="628" y="236" font-size="14" fill="#1B2838">Triton: cross-block, schedule,</text><text x="628" y="266" font-size="14" fill="#1B2838">hidden hardware features</text><text x="628" y="316" font-size="14" fill="#1B2838">last 10%: ThunderKittens,</text><text x="628" y="346" font-size="14" fill="#1B2838">CUTLASS on new hardware</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: hand-writing is a cost. Pay it only where the compiler leaves real money.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: everything by hand. Center: the compiler. Right: the decision ladder.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson compiler section, original plate. Shell 3: compiler first.</text></svg>
