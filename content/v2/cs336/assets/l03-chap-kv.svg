<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">KV cache: decode is memory bound on reads</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: MHA</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">41 GB</text><text x="52" y="186" font-size="14" fill="#1B2838">KV cache, 80 layers x 32K</text><text x="52" y="216" font-size="14" fill="#1B2838">16 KB per token per layer</text><text x="52" y="268" font-size="14" fill="#1B2838">reread every token,</text><text x="52" y="298" font-size="14" fill="#1B2838">every position, every step</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1F7A72">THE STORED OBJECT: KV BLOCKS</text><rect x="340" y="152" width="96" height="48" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="388" y="182" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">K</text><rect x="444" y="152" width="96" height="48" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="492" y="182" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">V</text><text x="340" y="240" font-size="14" fill="#1B2838">per layer, per position,</text><text x="340" y="270" font-size="14" fill="#1B2838">grows with context length</text><text x="340" y="320" font-size="14" fill="#1B2838">shared heads: fewer blocks</text><text x="340" y="350" font-size="14" fill="#1B2838">MLA: compressed latent</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: SHARING</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">10 GB</text><text x="628" y="186" font-size="14" fill="#1B2838">GQA-8: 4 KB per token per layer</text><text x="628" y="216" font-size="14" fill="#1B2838">MQA: 512 B. MLA: 1.1 KB.</text><text x="628" y="268" font-size="14" fill="#1B2838">quality near MHA,</text><text x="628" y="298" font-size="14" fill="#1B2838">traffic near MQA</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: fewer KV heads = less movement. GQA is the sweet spot; MLA compresses by rank.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: full heads. Center: the cache block. Right: shared and compressed.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson attention economics, original plate. Shell 5: the cache layout.</text></svg>
