<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Three ways to fit the joint law</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Lower envelope, IsoFLOP, parametric fit. IsoFLOP is the robust default.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">1. lower envelope</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#5C6B7A"/><text x="84" y="198" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">best loss per FLOP across runs; scatter model sizes</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">2. IsoFLOP</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="298" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">fix FLOPs, sweep N vs D, take minima, draw the line</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">3. parametric fit</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#C46B2C"/><text x="84" y="398" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">fit the joint functional form; curve fitting is fiddly</text><text x="60" y="470" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Epoch AI refit: method 3 was underfit in the paper. Redone, it agrees with 1 and 2.</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture Chinchilla slides, original plate. Shell 4: robustify the fit.</text></svg>