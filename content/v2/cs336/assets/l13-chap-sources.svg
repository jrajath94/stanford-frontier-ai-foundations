<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Quality pockets: the web is not uniform</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Dense sources, each with its own access pattern and license check. Source: original synthesis of the lecture.</text>
<!-- left: cost without -->
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the pockets</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">one undifferentiated crawl:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">crawl Wikipedia live,</text>
<text x="196" y="248" font-size="14" fill="#1B2838" text-anchor="middle">GPL code mixed in,</text>
<text x="196" y="270" font-size="14" fill="#1B2838" text-anchor="middle">equations as PDF pixels</text>
<text x="196" y="326" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">poisonable, tainted, illegible</text>
</g>
<!-- center: stored object -->
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Wikipedia: dumps, not crawl</text>
<text x="472" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">67M articles, verify the dump</text>
<text x="472" y="262" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">GitHub: permissive only</text>
<text x="472" y="284" font-size="13" fill="#5C6B7A" text-anchor="middle">Archive events as process data</text>
<text x="472" y="318" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">arXiv: LaTeX source</text>
<text x="472" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">3M papers, math as text</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">per-pocket access and license</text>
</g>
<!-- right: cost with -->
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the pockets</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">dump-timing defense:</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">diff dumps, keep stable text</text>
<text x="756" y="258" font-size="14" fill="#1B2838" text-anchor="middle">code trains reasoning:</text>
<text x="756" y="280" font-size="14" fill="#1B2838" text-anchor="middle">math and logic gains too</text>
<rect x="648" y="304" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="332" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">densest signals kept</text>
<text x="756" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">each pocket earns its handling</text>
</g>
<!-- bottom tradeoff -->
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Special handling costs engineering per pocket; undifferentiated crawling pays in poisoned, tainted, or illegible tokens.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Code is overweighted in every frontier mixture: it is the densest reasoning signal in text.</text>
</g>
</svg>
