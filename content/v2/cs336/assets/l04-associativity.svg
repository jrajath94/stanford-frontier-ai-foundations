<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Move the parentheses, kill the quadratic</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Without softmax, (QK^T)V = Q(K^TV). Same math, linear in n.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="380" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">BEFORE: attend first</text><text x="84" y="190" font-size="22" font-weight="700" fill="#1B2838" text-anchor="start">(Q K^T) V</text><text x="84" y="226" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">n x n scores first</text><text x="84" y="252" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">cost: n^2 x d</text><text x="84" y="278" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">n = millions. Bad.</text><rect x="520" y="140" width="380" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="534" y="164" font-size="14" font-weight="700" fill="#5C6B7A">AFTER: accumulate first</text><text x="544" y="190" font-size="22" font-weight="700" fill="#1B2838" text-anchor="start">Q (K^T V)</text><text x="544" y="226" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">d x d summary first</text><text x="544" y="252" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">cost: n x d^2</text><text x="544" y="278" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">d = thousands. Fine.</text><line x1="440" y1="240" x2="520" y2="240" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="230" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">reorder</text><text x="60" y="400" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">This is the one idea behind all linear attention. The catch: it needs</text><text x="60" y="426" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">dropping the softmax, which is lossy. Everything else elaborates on this.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 3: the reorder rule.</text></svg>