<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Same model, two workloads</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Prefill: fat matmuls, compute-bound, sets TTFT. Decode: thin steps, memory-bound, sets latency.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: prefill -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">PREFILL: encode the prompt</text>
<g font-size="14" fill="#1B2838">
<text x="72" y="204">whole prompt at once</text>
<text x="72" y="228">matmul shape: fat (B x S)</text>
<text x="72" y="252">intensity: high</text>
<text x="72" y="276">bound: compute</text>
<text x="72" y="300">batching: already parallel</text>
</g>
<rect x="72" y="328" width="336" height="56" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="88" y="354" font-size="14" font-weight="600" fill="#1F7A72">wants FLOPs: faster chips</text>
<text x="88" y="376" font-size="13" fill="#5C6B7A">sets TTFT</text>
<text x="72" y="428" font-size="14" fill="#5C6B7A">fill the cache once, in parallel.</text>
<!-- center -->
<text x="448" y="320" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">optimizing</text>
<text x="448" y="342" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">one does not</text>
<text x="448" y="364" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">help the other</text>
<!-- right: decode -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">DECODE: generate one token</text>
<g font-size="14" fill="#1B2838">
<text x="504" y="204">one token per step</text>
<text x="504" y="228">matmul shape: thin (B x 1)</text>
<text x="504" y="252">intensity: ~1</text>
<text x="504" y="276">bound: memory</text>
<text x="504" y="300">batching: helps MLP, not attention</text>
</g>
<rect x="504" y="328" width="384" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="520" y="354" font-size="14" font-weight="600" fill="#1E4D8C">wants bytes: faster HBM, smaller cache</text>
<text x="520" y="376" font-size="13" fill="#5C6B7A">sets latency and throughput</text>
<text x="504" y="428" font-size="14" fill="#5C6B7A">append K/V to the cache each step.</text>
<text x="504" y="452" font-size="14" fill="#5C6B7A">disaggregate: prefill and decode fleets.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture prefill/decode slides, original plate. Shell 3: name the metric first, then pick the machine.</text>
</svg>
