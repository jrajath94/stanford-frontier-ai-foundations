<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">Stability: guard both softmaxes</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: NO GUARD</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">log z drifts upward</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">through the long middle</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">loss spikes mid-run</text><text x="52" y="270" font-size="14" fill="#1B2838">attention degenerates:</text><text x="52" y="300" font-size="14" fill="#1B2838">one head takes everything</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: SOFTMAX</text><text x="340" y="168" font-size="26" font-weight="700" fill="#1B2838">p = e^u / z</text><text x="340" y="200" font-size="14" fill="#5C6B7A">in attention and in the loss</text><text x="340" y="252" font-size="14" fill="#1B2838">u grows with dot products,</text><text x="340" y="282" font-size="14" fill="#1B2838">z follows it upward</text><text x="340" y="330" font-size="14" fill="#1B2838">two softmaxes, two guards</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: THE GUARDS</text><text x="628" y="156" font-size="18" font-weight="700" fill="#1F7A72">z-loss: penalize (log z)^2</text><text x="628" y="196" font-size="18" font-weight="700" fill="#1F7A72">QK-norm: inputs at scale 1</text><text x="628" y="246" font-size="14" fill="#1B2838">both cheap, both standard</text><text x="628" y="276" font-size="14" fill="#1B2838">in frontier recipes</text><text x="628" y="326" font-size="14" fill="#1B2838">Gemma 2 adds logit soft-capping</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: one added term, one norm. Cheap insurance against a dead run.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: unguarded drift. Center: the softmax. Right: the two guards.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson stability slides, original plate. Shell 3: guard the softmax.</text></svg>
