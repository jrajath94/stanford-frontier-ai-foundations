<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the scaling approach</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Optimize small, extrapolate with a rule. Source: lecture scaling-law sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: the line</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">tune on the big run</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">10,000 B200s, one month,</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">and hope</text>
<text x="180" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">one failed run costs more</text>
<text x="180" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#C46B2C">than all small sweeps</text>
<text x="180" y="362" text-anchor="middle" font-size="14" fill="#5C6B7A">the naive approach the lecture</text>
<text x="180" y="386" text-anchor="middle" font-size="14" fill="#5C6B7A">opened with</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">log(error) vs log(n)</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">slope = exponent</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">intercept = the constant</text>
<text x="480" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">interventions move intercepts,</text>
<text x="480" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">rarely slopes</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">mixtures, filters, repetition, SGD</text>
<text x="480" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">vs Adam: slopes stay put</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">three small FLOP budgets</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">IsoFLOP sweeps, read minima,</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">fit the line, extrapolate</text>
<text x="780" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#1F7A72">the big run is the receipt</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">B_crit from the sweeps,</text>
<text x="780" y="360" text-anchor="middle" font-size="14" fill="#5C6B7A">batch below it, hyperparams</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#5C6B7A">transferred, not retuned</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: the line promises the regime will not change. Fit across as many orders of magnitude as you can afford.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Broken laws: fit the bends. Distrust any extrapolation more than one order of magnitude past the largest run.</text>
</svg>
