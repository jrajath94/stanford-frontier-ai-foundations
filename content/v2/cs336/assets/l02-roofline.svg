<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">The roofline: intensity decides realized speed</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Low intensity ops never reach the peak FLOP/s.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="80" y="130" width="820" height="410" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><line x1="110" y1="460" x2="810" y2="460" stroke="#1B2838" stroke-width="2"/><line x1="110" y1="460" x2="110" y2="140" stroke="#1B2838" stroke-width="2"/><text x="460.0" y="500" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="middle">arithmetic intensity (FLOPs per byte), log scale</text><text x="48" y="300.0" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="middle" transform="rotate(-90 48 300)">realized FLOP/s</text><line x1="110.0" y1="451.41818181818184" x2="674.7194773422525" y2="172.2909090909091" stroke="#1F7A72" stroke-width="3"/><line x1="110.0" y1="459.9025454545455" x2="674.7194773422525" y2="172.2909090909091" stroke="#1F7A72" stroke-width="3"/><line x1="674.7194773422525" y1="172.2909090909091" x2="810.0" y2="172.2909090909091" stroke="#C46B2C" stroke-width="3"/><text x="321.74486062243614" y="425.0909090909091" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">memory bound</text><text x="735.7962931491862" y="204.0" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">compute bound</text><text x="674.7194773422525" y="140" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">peak 989 TFLOP/s</text><circle cx="174.76541813269156" cy="459.75636363636363" r="7" fill="#1B2838"/><text x="174.76541813269156" y="445.75636363636363" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">ReLU 0.25</text><circle cx="386.51027875512773" cy="455.1272727272727" r="7" fill="#1B2838"/><text x="386.51027875512773" y="441.1272727272727" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">GELU 5</text><circle cx="684.7542436164648" cy="172.2909090909091" r="7" fill="#1B2838"/><text x="684.7542436164648" y="158.2909090909091" font-size="13" font-weight="700" fill="#1B2838" text-anchor="middle">matmul ~340</text><line x1="674.7194773422525" y1="460.0" x2="674.7194773422525" y2="172.2909090909091" stroke="#5C6B7A" stroke-width="1.5" stroke-dasharray="6,5"/><text x="674.7194773422525" y="448.3636363636364" font-size="13" font-weight="700" fill="#5C6B7A" text-anchor="middle">knee = 295</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture roofline slide, original plate. Shell 3: the knee is the accelerator intensity.</text></svg>