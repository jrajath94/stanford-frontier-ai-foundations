<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The pipeline: order is load-bearing</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Chapter plate. Transform, filter, dedupe, mix: a composition, not a checklist. Source: original synthesis of the lecture.</text>
<g>
<rect x="64" y="136" width="264" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">without the order</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">filter HTML before extracting:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">judges tags, not text</text>
<text x="196" y="258" font-size="14" fill="#1B2838" text-anchor="middle">dedupe before filtering:</text>
<text x="196" y="280" font-size="14" fill="#1B2838" text-anchor="middle">wastes budget on junk</text>
<text x="196" y="312" font-size="14" fill="#1B2838" text-anchor="middle">mix before dedupe:</text>
<text x="196" y="334" font-size="14" fill="#1B2838" text-anchor="middle">duplicates silently reweight</text>
<text x="196" y="380" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">each stage corrupts the next</text>
</g>
<g>
<rect x="344" y="136" width="256" height="272" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="472" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the stored object</text>
<text x="472" y="206" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">1. transform: HTML to text</text>
<text x="472" y="240" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">2. filter: keep the target-like</text>
<text x="472" y="274" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">3. dedupe: exact plus near</text>
<text x="472" y="308" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">4. mix: count epochs first</text>
<text x="472" y="352" font-size="13" fill="#5C6B7A" text-anchor="middle">raw crawl is not training data</text>
<text x="472" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">each stage kills one failure</text>
</g>
<g>
<rect x="616" y="136" width="280" height="272" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="756" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">with the order</text>
<text x="756" y="204" font-size="14" fill="#1B2838" text-anchor="middle">Trafilatura extracts,</text>
<text x="756" y="226" font-size="14" fill="#1B2838" text-anchor="middle">fastText keeps single digits,</text>
<text x="756" y="258" font-size="14" fill="#1B2838" text-anchor="middle">MinHash dedupes globally,</text>
<text x="756" y="280" font-size="14" fill="#1B2838" text-anchor="middle">UniMax caps the epochs</text>
<rect x="648" y="304" width="216" height="48" rx="8" fill="#E7F4EF"/>
<text x="756" y="332" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">tokens that earned it</text>
<text x="756" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the pipeline is the data</text>
</g>
<g>
<rect x="64" y="440" width="832" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="80" y="474" font-size="14" font-weight="600" fill="#5C6B7A">tradeoff, one line</text>
<text x="80" y="502" font-size="15" font-weight="500" fill="#1B2838">Each stage costs compute and can corrupt: reorder the stages and every stage's output poisons the next stage's input.</text>
<text x="80" y="526" font-size="13" fill="#5C6B7A">Raw crawl fails three measurable ways: the model learns HTML, memorizes 61,000-copy paragraphs, and the mixture lies.</text>
</g>
</svg>
