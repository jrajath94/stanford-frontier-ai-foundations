<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The evaluation map: five purposes, five benches</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Declare the purpose first. The map is the durable part: purposes, not scores.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<g font-size="15" font-weight="600" fill="#1B2838">
<text x="72" y="160">improve the model</text>
<text x="280" y="160">measure intelligence</text>
<text x="500" y="160">compare assistants</text>
<text x="712" y="160">buy for work</text>
</g>
<g font-size="14" fill="#1B2838">
<text x="72" y="196">perplexity on</text>
<text x="72" y="220">held-out text</text>
<text x="280" y="196">Humanity's Last Exam,</text>
<text x="280" y="220">ARC-AGI</text>
<text x="500" y="196">LMArena: pairwise</text>
<text x="500" y="220">human votes, ELO</text>
<text x="712" y="196">GDPVal, SWE-bench</text>
<text x="712" y="220">Verified</text>
</g>
<g font-size="13" fill="#5C6B7A">
<text x="72" y="256">every lab's inner loop</text>
<text x="72" y="278">white-box, trust-based</text>
<text x="280" y="256">still hard, private</text>
<text x="280" y="278">held-out</text>
<text x="500" y="256">the public scoreboard,</text>
<text x="500" y="278">rater caveats</text>
<text x="712" y="256">ecological validity:</text>
<text x="712" y="278">match the deployment</text>
</g>
<rect x="48" y="320" width="864" height="88" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="356" font-size="15" font-weight="600" fill="#1B2838">ship safely: HarmBench, AIR-Bench, internal red-teaming</text>
<text x="72" y="384" font-size="14" fill="#5C6B7A">the other scoreboard, with veto power</text>
<rect x="48" y="432" width="864" height="64" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="458" font-size="15" font-weight="600" fill="#1B2838">Leaderboard numbers are snapshots: they decay with contamination and saturation.</text>
<text x="72" y="480" font-size="15" font-weight="600" fill="#1B2838">The Mythos figures are illustrative.</text>
<text x="72" y="488" font-size="14" fill="#5C6B7A">Purposes, not scores.</text>
<text x="48" y="548" font-size="13" fill="#5C6B7A">Source: lecture evaluation-map slides, original plate. Shell 5: purpose picks the bench.</text>
</svg>
