<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Data mixing: a distribution over sources</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Vibes, uniform, proportional. All can silently epoch you.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the 50-epoch trap</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">10T low-quality + 10B high-quality, uniform, train 1T tokens</text><text x="84" y="214" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">low: 5% touched once. high: every token 50 times. Overfit.</text><rect x="60" y="316" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="340" font-size="14" font-weight="700" fill="#5C6B7A">fixes</text><text x="84" y="364" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">UniMax: cap epochs per source (e.g. 20), reallocate</text><text x="84" y="390" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">keep diversity: sources are incomparable, not rankable</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture mixing slides, original plate. Shell 3: count your epochs.</text></svg>