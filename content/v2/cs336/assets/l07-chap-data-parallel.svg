<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: data parallel</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Split the rows, sync the gradients. Source: lecture data-parallel sections.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="336" y="124">the stored object: 12 bytes/param</text>
<text x="648" y="124">WITH the rule</text>
</g>
<rect x="48" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">one GPU, the whole batch</text>
<text x="180" y="216" text-anchor="middle" font-size="14" fill="#5C6B7A">batch 128 in sequence</text>
<text x="180" y="240" text-anchor="middle" font-size="14" fill="#5C6B7A">no sync, no scaling</text>
<text x="180" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">wall-clock: 4x the step</text>
<text x="180" y="312" text-anchor="middle" font-size="14" fill="#C46B2C" font-weight="600">or DDP without the divide:</text>
<text x="180" y="336" text-anchor="middle" font-size="14" fill="#C46B2C">summed grads, LR x world size,</text>
<text x="180" y="360" text-anchor="middle" font-size="14" fill="#C46B2C">divergence at scale</text>
<text x="180" y="416" text-anchor="middle" font-size="14" fill="#5C6B7A">the classic DDP bug: instability</text>
<text x="180" y="440" text-anchor="middle" font-size="14" fill="#5C6B7A">that looks like nothing small</text>
<rect x="336" y="140" width="288" height="320" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">12 x P bytes per GPU</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="#1B2838">2 param + 2 grad</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#1B2838">4 master + 4 moments</text>
<text x="480" y="264" text-anchor="middle" font-size="14" fill="#5C6B7A">7B: 84GB. 70B: 840GB.</text>
<text x="480" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">bucketed all-reduce:</text>
<text x="480" y="336" text-anchor="middle" font-size="14" fill="#1B2838">25MB buckets overlap backward</text>
<text x="480" y="360" text-anchor="middle" font-size="14" fill="#1B2838">exposed sync: 0.125ms, not 70ms</text>
<text x="480" y="408" text-anchor="middle" font-size="14" fill="#5C6B7A">the schedule is the optimization</text>
<rect x="648" y="140" width="264" height="320" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="780" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">4 ranks, 32 rows each</text>
<text x="780" y="216" text-anchor="middle" font-size="14" fill="#1B2838">one all-reduce per step</text>
<text x="780" y="240" text-anchor="middle" font-size="14" fill="#1B2838">divide by world size: average</text>
<text x="780" y="264" text-anchor="middle" font-size="14" fill="#1B2838">params identical, forever</text>
<text x="780" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1F7A72">2s compute, 2ms sync</text>
<text x="780" y="336" text-anchor="middle" font-size="14" fill="#5C6B7A">negligible at 400GB/s</text>
<text x="780" y="384" text-anchor="middle" font-size="14" fill="#1B2838">modular: transformers = MLPs</text>
<rect x="48" y="484" width="864" height="80" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="72" y="514" font-size="15" font-weight="600" fill="#1B2838">Tradeoff: batch must exceed world size by a lot. Past the critical batch size, extra examples waste compute.</text>
<text x="72" y="540" font-size="14" fill="#5C6B7A">Data parallel scales far on any link, but it replicates all 12P bytes per GPU: 70B needs 840GB, a B200 holds 192GB.</text>
</svg>
