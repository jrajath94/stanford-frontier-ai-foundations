<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">SFT fits. RLHF maximizes.</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Generative modeling vs reward maximization: different games.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">SFT / pre-training</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">fit a distribution: predict the next token on the data</text><rect x="60" y="296" width="840" height="130" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="320" font-size="14" font-weight="700" fill="#5C6B7A">RLHF</text><text x="84" y="344" font-size="15" font-weight="700" fill="#F4E6D4" text-anchor="start">maximize a reward: the policy may collapse to one answer per prompt</text><text x="60" y="450" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Why RL: raters prefer AI outputs over their own writing. Verification beats generation.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture RLHF-concept slides, original plate. Shell 1: the shift.</text></svg>