<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">MinHash + LSH: near-dup in linear time</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Jaccard via hash collisions, sharpened into a phase transition.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">MinHash</text><text x="84" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">P(collision) = Jaccard. Hash every element, keep the minimum.</text><text x="84" y="212" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">permutation intuition: first row wins, ties broken by min</text><rect x="60" y="286" width="840" height="160" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="310" font-size="14" font-weight="700" fill="#5C6B7A">LSH: b bands of r hashes</text><text x="84" y="334" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">band matches if ALL r agree; pair collides if ANY band matches</text><text x="84" y="360" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">and-or structure sharpens: r right-shifts, b left-shifts the S-curve</text><text x="84" y="386" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">threshold ~ (1/b)^(1/r). At the center, collision probability = 0.64.</text><text x="60" y="470" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Real setting: b=20, r=450. Linear time, no n-squared.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture MinHash/LSH slides, original plate. Shell 3: the algorithm.</text></svg>