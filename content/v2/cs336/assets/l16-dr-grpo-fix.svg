<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans,Inter,'Source Sans 3','IBM Plex Sans',sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Dr. GRPO: drop the normalizations</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Std-0 groups exploded; dropping the division silences them. Shell 3. Source: original toy for the Dr. GRPO critique.</text>
<!-- before -->
<g>
<rect x="64" y="136" width="264" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="196" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: std normalization</text>
<text x="196" y="204" font-size="14" fill="#1B2838" text-anchor="middle">all 8 rollouts correct:</text>
<text x="196" y="226" font-size="14" fill="#1B2838" text-anchor="middle">mean 1, std 0</text>
<text x="196" y="258" font-size="14" fill="#1B2838" text-anchor="middle">all 8 wrong: mean 0, std 0</text>
<rect x="96" y="280" width="200" height="48" rx="8" fill="#F4E6D4"/>
<text x="196" y="308" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">z-score divides by zero</text>
<text x="196" y="360" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">no-signal groups get the</text>
<text x="196" y="382" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">largest gradient step</text>
</g>
<polygon points="336,260 352,268 336,276" fill="#1B2838"/>
<!-- rule -->
<g>
<rect x="360" y="136" width="240" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="376" y="186" width="208" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="214" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">advantage = reward</text>
<text x="480" y="236" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">minus group mean, no division</text>
<text x="480" y="252" font-size="13" fill="#1B2838" text-anchor="middle">stop dividing the loss</text>
<text x="480" y="274" font-size="13" fill="#1B2838" text-anchor="middle">by response length</text>
<text x="480" y="330" font-size="14" fill="#1B2838" text-anchor="middle">a deletion, like GRPO itself:</text>
<text x="480" y="352" font-size="14" fill="#1B2838" text-anchor="middle">remove, do not repair</text>
<text x="480" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">wrong-but-long stops paying</text>
</g>
<polygon points="608,260 624,268 608,276" fill="#1B2838"/>
<!-- after -->
<g>
<rect x="632" y="136" width="264" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="764" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: silence</text>
<text x="764" y="204" font-size="14" fill="#1B2838" text-anchor="middle">all-correct group:</text>
<text x="764" y="226" font-size="14" fill="#1B2838" text-anchor="middle">advantages all 0, no update</text>
<text x="764" y="258" font-size="14" fill="#1B2838" text-anchor="middle">all-wrong group: same, no update</text>
<rect x="664" y="280" width="200" height="48" rx="8" fill="#E7F4EF"/>
<text x="764" y="308" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">nothing to learn: no step</text>
<text x="764" y="360" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">chain of thought caps off;</text>
<text x="764" y="382" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the blabbing dies</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: the normalizations were heuristics with side effects; deleting them keeps the baseline contract.</text>
<text x="64" y="516" font-size="13" fill="#5C6B7A">DAPO operationalized the same fixes: drop degenerate groups, token-level loss, overlong reward shaping.</text>
</svg>
