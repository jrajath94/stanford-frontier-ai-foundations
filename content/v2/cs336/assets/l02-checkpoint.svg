<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="540" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Checkpointing trades memory for recompute</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Store every sqrt(L) layer, recompute the rest.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="80" y="150" width="95" height="70" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="127.5" y="183.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text><text x="127.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">checkpoint</text><rect x="185" y="150" width="95" height="70" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="232.5" y="183.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L2</text><text x="232.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">dropped</text><rect x="290" y="150" width="95" height="70" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="337.5" y="183.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L3</text><text x="337.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">dropped</text><rect x="395" y="150" width="95" height="70" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="442.5" y="183.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L4</text><text x="442.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">checkpoint</text><rect x="500" y="150" width="95" height="70" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="547.5" y="183.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L5</text><text x="547.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">dropped</text><rect x="605" y="150" width="95" height="70" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="652.5" y="183.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L6</text><text x="652.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">dropped</text><rect x="710" y="150" width="95" height="70" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="757.5" y="183.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L7</text><text x="757.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">checkpoint</text><rect x="815" y="150" width="95" height="70" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="862.5" y="183.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L8</text><text x="862.5" y="203.0" font-size="12" fill="#5C6B7A" text-anchor="middle">dropped</text><text x="80" y="140" font-size="14" font-weight="700" fill="#5C6B7A" text-anchor="start">FORWARD: keep 3 of 8 layer activations</text><text x="80" y="250" font-size="14" font-weight="700" fill="#5C6B7A" text-anchor="start">BACKWARD: recompute dropped activations from the last checkpoint</text><rect x="80" y="280" width="95" height="70" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="127.5" y="313.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text><text x="127.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">stored</text><defs><pattern id="h185280" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E6E2DA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6B7A" stroke-width="2" opacity="0.5"/></pattern></defs><rect x="185" y="280" width="95" height="70" rx="8" fill="url(#h185280)" stroke="#1B2838" stroke-width="1.5"/><text x="232.5" y="313.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L2</text><text x="232.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">recomputed</text><defs><pattern id="h290280" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E6E2DA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6B7A" stroke-width="2" opacity="0.5"/></pattern></defs><rect x="290" y="280" width="95" height="70" rx="8" fill="url(#h290280)" stroke="#1B2838" stroke-width="1.5"/><text x="337.5" y="313.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L3</text><text x="337.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">recomputed</text><rect x="395" y="280" width="95" height="70" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="442.5" y="313.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L4</text><text x="442.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">stored</text><defs><pattern id="h500280" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E6E2DA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6B7A" stroke-width="2" opacity="0.5"/></pattern></defs><rect x="500" y="280" width="95" height="70" rx="8" fill="url(#h500280)" stroke="#1B2838" stroke-width="1.5"/><text x="547.5" y="313.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L5</text><text x="547.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">recomputed</text><defs><pattern id="h605280" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E6E2DA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6B7A" stroke-width="2" opacity="0.5"/></pattern></defs><rect x="605" y="280" width="95" height="70" rx="8" fill="url(#h605280)" stroke="#1B2838" stroke-width="1.5"/><text x="652.5" y="313.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L6</text><text x="652.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">recomputed</text><rect x="710" y="280" width="95" height="70" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="757.5" y="313.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L7</text><text x="757.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">stored</text><defs><pattern id="h815280" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E6E2DA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6B7A" stroke-width="2" opacity="0.5"/></pattern></defs><rect x="815" y="280" width="95" height="70" rx="8" fill="url(#h815280)" stroke="#1B2838" stroke-width="1.5"/><text x="862.5" y="313.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">L8</text><text x="862.5" y="333.0" font-size="12" fill="#5C6B7A" text-anchor="middle">recomputed</text><line x1="80" y1="385" x2="900" y2="385" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="490.0" y="375" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">trade</text><text x="80" y="420" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">Extreme: store 0 layers -&gt; memory O(1), recompute O(L^2).</text><text x="80" y="446" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Sweet spot: store sqrt(L) -&gt; memory O(sqrt(L)), recompute O(sqrt(L)).</text><text x="36" y="516" font-size="14" fill="#5C6B7A">Source: lecture board, original plate. Shell 4: the checkpoint symbol returns in parallelism.</text></svg>