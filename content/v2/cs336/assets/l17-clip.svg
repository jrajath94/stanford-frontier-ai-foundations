<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">CLIP: semantics from captions</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Contrastive learning on 400M image-text pairs.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the objective</text><text x="84" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">2N softmax: I1 closer to T1 than to all other texts, and vice versa</text><text x="84" y="214" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">text gives high-level semantics augmentation never could</text><rect x="60" y="306" width="840" height="150" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="330" font-size="14" font-weight="700" fill="#5C6B7A">the machinery</text><text x="84" y="354" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">ViT-L/14: 14x14 patches, positional embeddings, attention pooling</text><text x="84" y="380" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">text: GPT-2 style, EOS activation as the sequence vector</text><text x="60" y="480" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">Zero-shot ImageNet beat a ResNet trained on 1.2M labeled images.</text><text x="36" y="576" font-size="14" fill="#5C6B7A">Source: lecture CLIP slides, original plate. Shell 2: the foundation.</text></svg>