<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="640" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">GQA shares key-value heads across query heads</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Less KV cache to move. Nearly the same quality.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="152" width="280" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="180" font-size="14" font-weight="700" fill="#5C6B7A">MHA: one KV head per query head</text><rect x="52" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="80" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="116" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="144" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="180" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="208" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><text x="244" y="238" font-size="13" font-weight="400" fill="#5C6B7A">... 32</text><rect x="52" y="272" width="56" height="48" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="80" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><rect x="116" y="272" width="56" height="48" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="144" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><rect x="180" y="272" width="56" height="48" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="208" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><text x="244" y="302" font-size="13" font-weight="400" fill="#5C6B7A">... 32</text><text x="52" y="356" font-size="14" font-weight="400" fill="#5C6B7A">32 KV heads</text><text x="52" y="384" font-size="16" font-weight="700" fill="#1B2838">16 KB per token per layer</text><rect x="340" y="152" width="280" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="356" y="180" font-size="14" font-weight="700" fill="#5C6B7A">GQA-8: eight query heads share one</text><rect x="356" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="384" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="420" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="448" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="484" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="512" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><text x="548" y="238" font-size="13" font-weight="400" fill="#5C6B7A">... 32</text><rect x="356" y="272" width="56" height="48" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="384" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><rect x="420" y="272" width="56" height="48" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="448" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><rect x="484" y="272" width="56" height="48" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="512" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><text x="548" y="302" font-size="13" font-weight="400" fill="#5C6B7A">... 8</text><text x="356" y="356" font-size="14" font-weight="400" fill="#5C6B7A">8 KV heads, 4 groups of 8</text><text x="356" y="384" font-size="16" font-weight="700" fill="#1F7A72">4 KB per token per layer</text><rect x="644" y="152" width="280" height="280" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="660" y="180" font-size="14" font-weight="700" fill="#5C6B7A">MQA: one KV head for all queries</text><rect x="660" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="688" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="724" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="752" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><rect x="788" y="208" width="56" height="48" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="816" y="238" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Q</text><text x="852" y="238" font-size="13" font-weight="400" fill="#5C6B7A">... 32</text><rect x="660" y="272" width="56" height="48" rx="8" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="688" y="302" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">KV</text><text x="724" y="302" font-size="13" font-weight="400" fill="#5C6B7A">1 head only</text><text x="660" y="356" font-size="14" font-weight="400" fill="#5C6B7A">1 KV head, quality drops</text><text x="660" y="384" font-size="16" font-weight="700" fill="#1B2838">512 B per token per layer</text><rect x="36" y="456" width="888" height="96" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="60" y="492" font-size="15" font-weight="700" fill="#1B2838">80 layers x 32K context: MHA holds 41 GB of KV cache. GQA-8 holds 10 GB.</text><text x="60" y="522" font-size="15" font-weight="400" fill="#5C6B7A">Decode rereads all of it every token. GQA is the sweet spot: inference cost near MQA, quality near MHA.</text><text x="36" y="588" font-size="15" font-weight="400" fill="#1B2838">Decode is memory bound on KV cache reads. Fewer KV heads = less movement.</text><text x="36" y="616" font-size="14" fill="#5C6B7A">Source: lecture attention slides, original plate. Shell 5: KV cache blocks reuse this layout.</text></svg>
