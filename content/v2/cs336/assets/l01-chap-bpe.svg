<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">BPE: merges buy shorter sequences</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: BYTES ONLY</text><text x="52" y="156" font-size="30" font-weight="700" fill="#C46B2C">fertility 3.7</text><text x="52" y="186" font-size="14" fill="#1B2838">tokens per English word</text><text x="52" y="216" font-size="14" fill="#1B2838">vocab 256: no merges</text><text x="52" y="246" font-size="14" fill="#1B2838">3.7x the inference cost</text><text x="52" y="300" font-size="14" fill="#1B2838">3.7x the attention work</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">THE STORED OBJECT: MERGE TABLE</text><text x="340" y="156" font-size="14" fill="#1B2838">pair (l,o) -&gt; rank 0</text><text x="340" y="186" font-size="14" fill="#1B2838">pair (lo,w) -&gt; rank 1</text><text x="340" y="216" font-size="14" fill="#1B2838">pair (e,r) -&gt; rank 2</text><text x="340" y="246" font-size="14" fill="#1B2838">...</text><text x="340" y="300" font-size="14" fill="#1B2838">rank decides the split,</text><text x="340" y="330" font-size="14" fill="#1B2838">not frequency at inference</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: 50,001 MERGES</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">fertility 1.3</text><text x="628" y="186" font-size="14" fill="#1B2838">vocab 50,257</text><text x="628" y="216" font-size="14" fill="#1B2838">3.7x shorter sequences than bytes</text><text x="628" y="246" font-size="14" fill="#1B2838">3,150 words fit in 4K</text><text x="628" y="300" font-size="14" fill="#1B2838">ranked pairs, frozen</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: merges trade vocab size for sequence length. Bigger vocab, shorter sequences.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: raw bytes. Center: the ranked table the lesson computed. Right: GPT-2 vocab.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson BPE toy and fertility math, original plate. Shell 3: the merge rule.</text></svg>
