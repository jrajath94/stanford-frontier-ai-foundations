<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Contamination: assume the worst</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Models train on the internet. The test set is on the internet. Four defenses.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">detect</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="196" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">question-order preference betrays memorization</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">report</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#D9E6F5"/><text x="84" y="296" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">norms: justify no train-test overlap with every claim</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">fresh evals</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="396" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">LiveCodeBench: scrape past the cutoff</text><rect x="60" y="440" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="464" font-size="14" font-weight="700" fill="#5C6B7A">private evals</text><rect x="60" y="440" width="10" height="84" rx="5" fill="#E7F4EF"/><text x="84" y="496" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">internal code, rejected papers, HLE held-out</text><text x="60" y="556" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">Contamination is subtle: sources, not just the test set, leak in.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture validity slides, original plate. Shell 3: trust, then verify.</text></svg>