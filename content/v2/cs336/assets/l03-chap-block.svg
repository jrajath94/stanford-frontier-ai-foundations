<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">The block: addition is the identity path</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: NO RESIDUAL</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">replace the stream</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">each block, every time</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">gradients die</text><text x="52" y="270" font-size="14" fill="#1B2838">through 96 nonlinearities,</text><text x="52" y="300" font-size="14" fill="#1B2838">96-layer models never train</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1F7A72">THE STORED OBJECT: THE STREAM</text><text x="340" y="168" font-size="30" font-weight="700" fill="#1B2838">x + F(x)</text><text x="340" y="200" font-size="14" fill="#5C6B7A">the residual stream</text><text x="340" y="252" font-size="14" fill="#1B2838">prenorm before each sublayer,</text><text x="340" y="282" font-size="14" fill="#1B2838">add after: the stream stays clean</text><text x="340" y="330" font-size="14" fill="#1B2838">sublayers add deltas,</text><text x="340" y="360" font-size="14" fill="#1B2838">never replacements</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: THE CLEAN PATH</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">96 layers</text><text x="628" y="186" font-size="14" fill="#1B2838">train because the gradient</text><text x="628" y="216" font-size="14" fill="#1B2838">flows straight through</text><text x="628" y="246" font-size="14" fill="#1B2838">the addition untouched</text><text x="628" y="300" font-size="14" fill="#1B2838">every later lesson assumes this</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: the stream is the shared memory. Sublayers propose; addition keeps.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: replacement. Center: the identity path. Right: depth that trains.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson block construction, original plate. Shell 4: the stream symbol.</text></svg>
