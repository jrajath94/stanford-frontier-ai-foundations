<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="600" fill="#F7F4EE"/><text x="36" y="44" font-size="26" font-weight="700" fill="#1B2838">The tricks: every optimization is data movement</text><line x1="36" y1="60" x2="924" y2="60" stroke="#D9D3C7" stroke-width="1"/><rect x="36" y="88" width="264" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="52" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITHOUT: NAIVE</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1B2838">five kernels, five reads,</text><text x="52" y="186" font-size="15" font-weight="400" fill="#1B2838">five writes, one sin^2+cos^2</text><text x="52" y="240" font-size="15" font-weight="700" fill="#C46B2C">120 tiles, 96 idle</text><text x="52" y="270" font-size="14" fill="#1B2838">one extra dimension,</text><text x="52" y="300" font-size="14" fill="#1B2838">one crater in throughput</text><rect x="324" y="88" width="264" height="300" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/><text x="340" y="120" font-size="15" font-weight="700" fill="#1E4D8C">OBJECT: THE ROUND TRIP</text><text x="340" y="168" font-size="18" font-weight="700" fill="#1B2838">HBM -&gt; SRAM -&gt; HBM</text><text x="340" y="200" font-size="14" fill="#5C6B7A">every byte counted</text><text x="340" y="252" font-size="14" fill="#1B2838">coalesce: one burst,</text><text x="340" y="282" font-size="14" fill="#1B2838">not four</text><text x="340" y="330" font-size="14" fill="#1B2838">tiling: N/T reads, not N</text><rect x="612" y="88" width="312" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="628" y="120" font-size="15" font-weight="700" fill="#5C6B7A">COST WITH: FUSED</text><text x="628" y="156" font-size="30" font-weight="700" fill="#1F7A72">1 read, 1 write</text><text x="628" y="186" font-size="14" fill="#1B2838">five kernels become one</text><text x="628" y="216" font-size="14" fill="#1B2838">98 tiles on 108 SMs:</text><text x="628" y="246" font-size="14" fill="#1B2838">one wave, nobody idles</text><text x="628" y="300" font-size="14" fill="#1B2838">mask, never branch</text><rect x="36" y="416" width="888" height="72" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="60" y="460" font-size="16" font-weight="700" fill="#1B2838">Tradeoff: fusion, coalescing, tiling, occupancy, masking. Five names for one move.</text><text x="36" y="536" font-size="15" font-weight="400" fill="#1B2838">Chapter plate. Left: naive passes. Center: the round trip. Right: the fused form.</text><text x="36" y="572" font-size="14" fill="#5C6B7A">Source: lesson GPU tricks, original plate. Shell 3: the reuse rule.</text></svg>
