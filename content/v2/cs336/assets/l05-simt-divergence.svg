<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">A warp executes both branches</text><text x="36" y="78" font-size="17" fill="#5C6B7A">32 threads, one instruction. if/else runs twice with masking.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">warp of 32 threads hits:  if (x &gt; 0)</text><rect x="110" y="210" width="200" height="70" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="210.0" y="243.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">16 threads</text><text x="210.0" y="263.0" font-size="12" fill="#5C6B7A" text-anchor="middle">take IF</text><rect x="350" y="210" width="200" height="70" rx="8" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="450.0" y="243.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">16 threads</text><text x="450.0" y="263.0" font-size="12" fill="#5C6B7A" text-anchor="middle">take ELSE</text><text x="600" y="225" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">both run,</text><text x="600" y="249" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">losers idle</text><rect x="60" y="370" width="840" height="90" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="394" font-size="14" font-weight="700" fill="#5C6B7A">fix: multiply by a mask, not a branch</text><text x="84" y="424" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">ReLU as x * (x &gt; 0)  instead of  if (x &gt; 0) x else 0</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture SIMT slides, original plate. Shell 3: the divergence rule.</text></svg>