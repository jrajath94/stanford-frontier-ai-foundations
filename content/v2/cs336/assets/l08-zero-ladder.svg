<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="620" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">ZeRO: shard more, pay nothing</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Stage 1 and 2 reuse the all-reduce budget. Stage 3 adds one all-gather, hidden by overlap.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">DDP</text><rect x="60" y="140" width="10" height="92" rx="5" fill="#5C6B7A"/><text x="84" y="178" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">replicate all</text><text x="84" y="204" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">comm per step: 2P (all-reduce)</text><rect x="60" y="248" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="272" font-size="14" font-weight="700" fill="#5C6B7A">ZeRO-1</text><rect x="60" y="248" width="10" height="92" rx="5" fill="#1F7A72"/><text x="84" y="286" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">shard optimizer state</text><text x="84" y="312" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">comm per step: 2P (RS + AG)</text><rect x="60" y="356" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="380" font-size="14" font-weight="700" fill="#5C6B7A">ZeRO-2</text><rect x="60" y="356" width="10" height="92" rx="5" fill="#1F7A72"/><text x="84" y="394" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">shard grads too</text><text x="84" y="420" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">comm per step: 2P (incremental)</text><rect x="60" y="464" width="840" height="92" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="488" font-size="14" font-weight="700" fill="#5C6B7A">ZeRO-3 / FSDP</text><rect x="60" y="464" width="10" height="92" rx="5" fill="#C46B2C"/><text x="84" y="502" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">shard params too</text><text x="84" y="528" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">comm per step: 3P (2 AG + 1 RS)</text><text x="60" y="586" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">Stage 2 trick: reduce-scatter grads during the backward sweep, never materialize. Stage 3: all-gather params per layer, free after use.</text><text x="36" y="596" font-size="14" fill="#5C6B7A">Source: lecture ZeRO slides, original plate. Shell 4: free memory is the best memory.</text></svg>