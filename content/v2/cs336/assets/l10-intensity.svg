<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Attention in generation: the bottleneck</text><text x="36" y="78" font-size="17" fill="#5C6B7A">MLP intensity scales with batch. Attention intensity is ~1 forever. Nothing fixes it in a transformer.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="260" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">arithmetic intensity</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">MLP prefill:    B x S      (good)</text><text x="84" y="222" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">MLP generate:   B          (ok if many concurrent users)</text><text x="84" y="254" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">attn prefill:   S / 2      (workable for long prompts)</text><text x="84" y="286" font-size="16" font-weight="700" fill="#C46B2C" text-anchor="start">attn generate:  S/(S+1) ~ 1  (THE BOTTLENECK)</text><rect x="60" y="430" width="840" height="90" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="454" font-size="14" font-weight="700" fill="#5C6B7A">why batching cannot help</text><text x="84" y="480" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">MLP weights are shared: load once, serve B. Each sequence has its own KV cache: B more matvecs.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture intensity slides, original plate. Shell 2: intensity decides everything.</text></svg>