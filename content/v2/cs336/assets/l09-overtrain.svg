<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Overtrain for serving</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Training-optimal is not serving-optimal. Small and capable beats big and bloated.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="120" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">tokens per parameter</text><text x="84" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">GPT-3: 3  (undertrained)   -&gt;   Chinchilla: 20   -&gt;   modern: 100+ (overtrained)</text><rect x="60" y="290" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="314" font-size="14" font-weight="700" fill="#5C6B7A">why</text><text x="84" y="340" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">most compute goes to R&amp;D and serving, not training</text><text x="84" y="366" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">serving wants small models that are capable</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture discussion, original plate. Shell 5: optimize the deployment, not the paper.</text></svg>