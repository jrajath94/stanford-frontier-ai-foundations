<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">muP: one learning rate for all sizes</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Reparameterize so the optimal LR stops drifting with width. MiniCPM: minima all at 1e-2.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="180" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">the recipe</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">scale embeddings output; residuals by 1/sqrt(layers)</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">init matrices by fan-in/fan-out ratio</text><text x="84" y="242" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">per-tensor learning rates; scale the LM head</text><text x="84" y="280" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">result: sweep LR across sizes, every minimum lands at 1e-2</text><rect x="60" y="350" width="840" height="140" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="374" font-size="14" font-weight="700" fill="#5C6B7A">why it matters</text><text x="84" y="400" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">tune once on small models, deploy at 5x scale. No LR grid at the big run.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture MiniCPM slides, original plate. Shell 4: kill the drift.</text></svg>