<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="580" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Agents: evaluate what it does</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Environments with checkable outcomes. The scaffold is half the score.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">SWE-bench</text><rect x="60" y="140" width="10" height="94" rx="5" fill="#1F7A72"/><text x="84" y="180" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">fix the issue, pass the tests</text><text x="84" y="206" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">16% -&gt; 93% (Verified cleaned it)</text><rect x="60" y="250" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="274" font-size="14" font-weight="700" fill="#5C6B7A">Terminal-Bench</text><rect x="60" y="250" width="10" height="94" rx="5" fill="#D9E6F5"/><text x="84" y="290" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">do it in a terminal</text><text x="84" y="316" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">crowdsourced, hours to weeks</text><rect x="60" y="360" width="840" height="94" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="384" font-size="14" font-weight="700" fill="#5C6B7A">CyBench / MLE-bench</text><rect x="60" y="360" width="10" height="94" rx="5" fill="#F4E6D4"/><text x="84" y="400" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">CTF flags, Kaggle scores</text><text x="84" y="426" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">CyBench solved; scaffolds vary widely</text><text x="60" y="496" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">Same model, different scaffold, different score. Audit traces (Docent): empty responses scored 38% on TorchBench.</text><text x="36" y="556" font-size="14" fill="#5C6B7A">Source: lecture agent slides, original plate. Shell 4: the scaffold counts.</text></svg>