<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">IsoFLOP: sweep, take minima, join them</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Fix the FLOP budget, sweep N vs D, take the minima. The line through them is the law.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: U curves -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">SWEEP AT THREE BUDGETS</text>
<g fill="none" stroke-width="2.5">
<path d="M 96 420 Q 200 300 304 400" stroke="#1E4D8C"/>
<path d="M 96 440 Q 200 330 304 430" stroke="#1F7A72"/>
<path d="M 96 460 Q 200 360 304 460" stroke="#C46B2C"/>
</g>
<g fill="#1B2838">
<circle cx="200" cy="342" r="6" fill="#1E4D8C"/>
<circle cx="200" cy="372" r="6" fill="#1F7A72"/>
<circle cx="200" cy="402" r="6" fill="#C46B2C"/>
</g>
<text x="72" y="240" font-size="13" fill="#5C6B7A">loss</text>
<text x="280" y="480" font-size="13" fill="#5C6B7A">model size N &#8594;</text>
<text x="72" y="440" font-size="14" fill="#1B2838">U-shape: tiny models waste compute,</text>
<text x="72" y="462" font-size="14" fill="#1B2838">giants starve for data.</text>
<!-- center rule -->
<rect x="448" y="136" width="64" height="360" rx="12" fill="#F7F4EE"/>
<text x="480" y="280" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">D = C / 6N</text>
<text x="480" y="304" font-size="13" fill="#5C6B7A" text-anchor="middle">per point</text>
<text x="480" y="340" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">take the</text>
<text x="480" y="364" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">minima</text>
<!-- right: the line -->
<rect x="528" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="552" y="168" font-size="14" font-weight="600" fill="#5C6B7A">JOIN THE MINIMA</text>
<line x1="576" y1="440" x2="864" y2="240" stroke="#1F7A72" stroke-width="3"/>
<g fill="#1F7A72">
<circle cx="624" cy="400" r="6"/>
<circle cx="720" cy="320" r="6"/>
<circle cx="816" cy="244" r="6"/>
</g>
<text x="552" y="240" font-size="13" fill="#5C6B7A">log N</text>
<text x="840" y="480" font-size="13" fill="#5C6B7A">log C &#8594;</text>
<rect x="552" y="380" width="336" height="64" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="568" y="406" font-size="14" font-weight="600" fill="#1F7A72">the slope is the exponent</text>
<text x="568" y="428" font-size="13" fill="#5C6B7A">extrapolate to the big budget</text>
<text x="552" y="470" font-size="13" fill="#5C6B7A">Fewest assumptions of the three methods.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture IsoFLOP slides, original plate. Shell 4: fix any budget, sweep any tradeoff.</text>
</svg>
