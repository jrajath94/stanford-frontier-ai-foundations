<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">Split the backward: B now, W in the gaps</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">B is the critical path: the next stage waits. W is a leaf: it can happen anytime.</text>
<line x1="48" y1="112" x2="912" y2="112" stroke="#D9D3C7" stroke-width="1.5"/>
<!-- left: standard -->
<rect x="48" y="136" width="384" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="72" y="168" font-size="14" font-weight="600" fill="#5C6B7A">BEFORE: B then W together</text>
<g font-size="14" fill="#1B2838">
<rect x="72" y="184" width="336" height="48" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="240" y="212" text-anchor="middle" font-weight="600">B: input grads (critical)</text>
<rect x="72" y="240" width="336" height="48" rx="8" fill="#E6E2DA" stroke="#5C6B7A" stroke-width="1.5"/>
<text x="240" y="268" text-anchor="middle" font-weight="600">W: weight grads (leaf)</text>
</g>
<text x="72" y="324" font-size="14" fill="#1B2838">W blocks the next stage's B.</text>
<text x="72" y="348" font-size="14" fill="#1B2838">The backward drain idles the pipe.</text>
<text x="72" y="384" font-size="14" fill="#5C6B7A">p=8, m=32: 1F1B bubble 7/32 = 22%.</text>
<text x="72" y="432" font-size="14" font-weight="600" fill="#C46B2C">The schedule wastes the critical path.</text>
<!-- center arrow -->
<text x="448" y="320" font-size="32" fill="#1F7A72" text-anchor="middle">&#8594;</text>
<!-- right: zero-bubble -->
<rect x="480" y="136" width="432" height="360" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="504" y="168" font-size="14" font-weight="600" fill="#5C6B7A">AFTER: B chains, W fills the gaps</text>
<g font-size="14" fill="#1B2838">
<rect x="504" y="184" width="384" height="48" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="696" y="212" text-anchor="middle" font-weight="600">B chain: continuous down the pipe</text>
<rect x="504" y="240" width="384" height="48" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="696" y="268" text-anchor="middle" font-weight="600">W: deferred into the idle gaps</text>
</g>
<text x="504" y="324" font-size="14" fill="#1B2838">B never waits. The drain vanishes.</text>
<text x="504" y="348" font-size="14" fill="#1B2838">ZB-H1: backward bubble ~0.</text>
<text x="504" y="372" font-size="14" fill="#1B2838">ZB-V: near zero total, 1F1B-like memory.</text>
<text x="504" y="408" font-size="14" fill="#5C6B7A">DualPipe: the same idea, co-designed</text>
<text x="504" y="430" font-size="14" fill="#5C6B7A">with the MoE dispatch chunks.</text>
<text x="504" y="466" font-size="14" font-weight="600" fill="#1F7A72">The bubble is a schedule: redesign it.</text>
<text x="48" y="544" font-size="13" fill="#5C6B7A">Source: lecture zero-bubble slides, original plate. Shell 4: every redesign trades memory for utilization.</text>
</svg>
