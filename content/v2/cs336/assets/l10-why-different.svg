<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Inference cannot parallelize the sequence</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Training sees all tokens at once. Inference generates one at a time. Intensity collapses.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">training</text><text x="84" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">all tokens visible</text><text x="84" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">sequence = a dimension</text><text x="84" y="250" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">big fat matmuls</text><rect x="500" y="140" width="400" height="200" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="514" y="164" font-size="14" font-weight="700" fill="#5C6B7A">inference</text><text x="524" y="190" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">one token at a time</text><text x="524" y="216" font-size="15" font-weight="400" fill="#1B2838" text-anchor="start">autoregressive: no future</text><text x="524" y="250" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">thin matvecs, intensity ~1</text><text x="60" y="390" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Agents removed the human reading limit: tokens are now pure compute spend.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture comparison slides, original plate. Shell 2: the fundamental asymmetry.</text></svg>