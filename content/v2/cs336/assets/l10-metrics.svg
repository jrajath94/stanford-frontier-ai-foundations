<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Three speeds, three questions</text><text x="36" y="78" font-size="17" fill="#5C6B7A">TTFT: wait for the first token. Latency: streaming for one user. Throughput: tokens per second for all.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">TTFT</text><rect x="60" y="140" width="10" height="84" rx="5" fill="#1F7A72"/><text x="84" y="176" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">time to first token</text><text x="84" y="202" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">interactive wait; prefill time</text><rect x="60" y="240" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="264" font-size="14" font-weight="700" fill="#5C6B7A">latency</text><rect x="60" y="240" width="10" height="84" rx="5" fill="#D9E6F5"/><text x="84" y="276" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">seconds per token, one query</text><text x="84" y="302" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">streaming speed per user</text><rect x="60" y="340" width="840" height="84" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="364" font-size="14" font-weight="700" fill="#5C6B7A">throughput</text><rect x="60" y="340" width="10" height="84" rx="5" fill="#F4E6D4"/><text x="84" y="376" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">tokens per second, many queries</text><text x="84" y="402" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">batch jobs; total output</text><text x="60" y="460" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Batch size trades them against each other. No single number is fast.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture metrics slides, original plate. Shell 1: name the metric first.</text></svg>