<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="560" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Keep the residual stream clean</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Move the norm out of the residual path. Everyone agrees on this.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="390" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">POSTNORM (original, 2017)</text><rect x="200" y="170" width="110" height="44" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="255.0" y="190.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">x</text><text x="255.0" y="210.0" font-size="12" fill="#5C6B7A" text-anchor="middle">residual stream</text><text x="90" y="250" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">attn(x) added, THEN norm</text><rect x="200" y="260" width="110" height="44" rx="8" fill="#F3D9D9" stroke="#1B2838" stroke-width="1.5"/><text x="255.0" y="280.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">LayerNorm</text><text x="255.0" y="300.0" font-size="12" fill="#5C6B7A" text-anchor="middle">in the stream</text><text x="90" y="340" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">every block rescales x</text><text x="90" y="364" font-size="14" font-weight="700" fill="#C46B2C" text-anchor="start">gradient norms drift</text><text x="90" y="388" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">needs warmup to converge</text><rect x="510" y="140" width="390" height="300" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="524" y="164" font-size="14" font-weight="700" fill="#5C6B7A">PRENORM (modern)</text><rect x="650" y="170" width="110" height="44" rx="8" fill="#D9E6F5" stroke="#1B2838" stroke-width="1.5"/><text x="705.0" y="190.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">x</text><text x="705.0" y="210.0" font-size="12" fill="#5C6B7A" text-anchor="middle">untouched stream</text><text x="540" y="250" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">norm BEFORE attn / FFN</text><rect x="650" y="260" width="110" height="44" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="705.0" y="280.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">RMSNorm</text><text x="705.0" y="300.0" font-size="12" fill="#5C6B7A" text-anchor="middle">outside stream</text><text x="540" y="340" font-size="14" font-weight="400" fill="#1B2838" text-anchor="start">x flows straight through</text><text x="540" y="364" font-size="14" font-weight="700" fill="#1F7A72" text-anchor="start">gradient size constant</text><text x="540" y="388" font-size="14" font-weight="400" fill="#5C6B7A" text-anchor="start">converges without warmup</text><line x1="458" y1="290" x2="502" y2="290" stroke="#1E4D8C" stroke-width="3" marker-end="url(#ah)"/><text x="480.0" y="280" font-size="14" font-weight="700" fill="#1E4D8C" text-anchor="middle">move</text><text x="60" y="490" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Rule of thumb from practitioners: keep your residual stream clean.</text><text x="36" y="536" font-size="14" fill="#5C6B7A">Source: lecture norm slides, original plate. Shell 4: prenorm is the default in every later lesson.</text></svg>