<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="960" height="520" fill="#F7F4EE"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1E4D8C"/></marker></defs><text x="36" y="48" font-size="30" font-weight="700" fill="#1B2838">Three GeLUs, one winner</text><text x="36" y="78" font-size="17" fill="#5C6B7A">Naive: many kernels, HBM round trips. Fused: one kernel, one trip each way.</text><line x1="36" y1="96" x2="924" y2="96" stroke="#D9D3C7" stroke-width="1"/><rect x="60" y="140" width="260" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="74" y="164" font-size="14" font-weight="700" fill="#5C6B7A">naive PyTorch</text><rect x="90" y="180" width="200" height="36" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="190.0" y="196.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">tanh</text><rect x="90" y="224" width="200" height="36" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="190.0" y="240.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">mul</text><rect x="90" y="268" width="200" height="36" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="190.0" y="284.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">add</text><rect x="90" y="312" width="200" height="36" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/><text x="190.0" y="328.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">mul</text><text x="90" y="380" font-size="15" font-weight="700" fill="#C46B2C" text-anchor="start">3.75 (slowest)</text><rect x="350" y="140" width="260" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="364" y="164" font-size="14" font-weight="700" fill="#5C6B7A">torch.compile</text><rect x="380" y="240" width="200" height="80" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/><text x="480.0" y="278.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1 Triton kernel</text><text x="480.0" y="298.0" font-size="12" fill="#5C6B7A" text-anchor="middle">auto-fused</text><text x="380" y="380" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">fast</text><rect x="640" y="140" width="260" height="220" rx="10" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="654" y="164" font-size="14" font-weight="700" fill="#5C6B7A">built-in</text><rect x="670" y="240" width="200" height="80" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/><text x="770.0" y="278.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1 CUDA kernel</text><text x="770.0" y="298.0" font-size="12" fill="#5C6B7A" text-anchor="middle">hand-written</text><text x="670" y="380" font-size="15" font-weight="700" fill="#1F7A72" text-anchor="start">fastest here</text><text x="60" y="430" font-size="15" font-weight="700" fill="#1B2838" text-anchor="start">Between kernels, data returns to HBM. Fusion deletes the round trips.</text><text x="60" y="456" font-size="15" font-weight="400" fill="#5C6B7A" text-anchor="start">Profiler proof: naive shows many kernels; compiled shows one Triton kernel.</text><text x="36" y="496" font-size="14" fill="#5C6B7A">Source: lecture GeLU slides, original plate. Shell 4: fusion measured.</text></svg>