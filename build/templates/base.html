<!DOCTYPE html>
<html lang="en" data-theme="light" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.remove('no-js');</script>
<title>{{ page_title }} — {{ site_name }}</title>
<meta name="description" content="{{ meta_desc }}">
<link rel="stylesheet" href="{{ root }}assets/vendor/katex.min.css">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
  <a class="brand" href="{{ root }}index.html">{{ site_name }}</a>
  <div class="topbar-search">
    <input id="searchBox" type="search" placeholder="Search lessons, concepts, papers…" autocomplete="off" aria-label="Search">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">◐</button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Course navigation">
    {{ sidebar }}
  </nav>
  <main class="content" id="main">
    <article>
      {{ breadcrumb }}
      <h1>{{ h1 }}</h1>
      {{ meta_line }}
      {{ body }}
      {{ sources_box }}
      {{ pager }}
    </article>
    <footer class="pagefoot">
      <p>Reconstructed from official Stanford course material. Sources are listed above. Content is study material, not affiliated with Stanford University.</p>
    </footer>
  </main>
</div>
<script src="{{ root }}assets/vendor/katex.min.js"></script>
<script src="{{ root }}assets/vendor/mermaid.min.js"></script>
<script>window.SITE_ROOT = "{{ root }}";</script>
<script src="{{ root }}assets/app.js"></script>
</body>
</html>
